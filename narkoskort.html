p>- Tacrolimus (calcineurinhämmare) orsakar preglomerulär vasokonstriktion. GE INTE NSAID TILL PAT. MED TACROLIMUS.</p>", "category": "Praktiskt"}, {"title": "NÄRING PÅ CIVA / NUTRITION PÅ CIVA", "html": "<p><strong>VID STORA RETENTIONER</strong> - Primperan 10 mg x 3 i.v., reducerad dos vid GFR < 60: 5 mg x 3. - (Ges vid ventrikelretention, har ingen effekt på obstipation. Motverkar dopaminets hämmande effekt på motoriken. Sensitiserar tarmen till acetylkolin. Ökar sfinktertonus i cardia. Kontraindicerat vid gastrointestinal obstruktion. Injiceras långsamt >3 min. Försiktighet vid EP, Mb Parkinson, tidigare tardiv dyskinesi, sick sinus syndrome, långt QT-syndrom. <strong>REFEEDING SYNDROME</strong> - P-fosfat faller >0,16 mmol/L, till en nivå under 0,65 mmol/L, OCH det bedöms bero på uppstart av nutritionsbehandling (<72 h). - Åtgärd: Kalorirestriktion (max 500 kcal/d 48h). - Vitamin B1. Ersätt elektrolyter (fosfat, Mg, K). <strong>PROTEINMÅL</strong> - Rekommenderatmål: Progressiv ökning till 1,3 g/kg/d. - Om <1.0 g/kg/d efterenvecka? Extra Glavamin. - Om >2.0 g/kg/d efter en vecka och full EN. Byta till näringslösning utan extra proteininnehåll. Särskilt viktigt om AKI/AKD (redan om >1.5 g/kg/d?). <strong>AVVECKLA INSULININFUSIONEN INNAN AVDELNING</strong> - Om stabil patient: Övergå till sc isulin regim. - 50% av dygnsbehovet som långverkande insulin x 1. - 50% av dygnsbehovet som snabbverkande insulin vb. - P-glukos x 6 på avdelning. - Viktigt med läkemedelsavstämningen. <strong>LÅNGSAM SÄNKNING AV FÖRHÖJT P-GLUKOS.</strong> <strong> - Om P-glukos >12 mmol/L: Starta insilininfusionen på 2-4 E/h. - Om P-glukos >10-12 mmol/L: Starta på 1-2 E/h. - Kontrollera p-glukos om 1 h.         Om p-glukos minskat med 2 (1-3) – Ingen förändring.         Om p-glukos minskat med >3  – Minska infusionen med 1-2 E/h.         Om p-glukos ökat eller minksat med endast 1 – Öka infusionen med 1-2 E/h.   </strong>BEHANDLING HYPOGLYKEMI<strong> - Om p-glukos 4-6: Stoppa insulininfusionen, kontroller att det tillförs glukos/nutrition. Nytt p-glukos inom 30 min. - Om < 4: Stoppa infusionen, ge glukos 300 mg/ml (30%) iv, 30-60 ml. Kontrollera att glukos/nutrition ges. Nytt p-glukos inom 30 min. </strong>BOLUS INSULIN** - Rekommenderas att INTE ge bolusar i.v. pga risk för hypoglykemi. - Om p-glukos >15: Ge 8 IE sc. Om 12-15: Ge 6 IE s.c. Om 10-12: Ge 4 IE s.c.</p>\n<p><em>Källa PM Nutrition på CIVA och NIVA 2014. </em></p>\n<h3>Ordinationsvikt</h3>\n<p>BMI <20: Ordinationsvikt = aktuell vikt.</p>\n<p>BMI 20-30: Ordinationsvikt = idealvikt.</p>\n<p>BMI >30: Ordinationsvikt = idealvikt + 0,3 x (aktuell vikt-idealvikt).</p>\n<h3>Behov</h3>\n<p><em>Max<strong> </strong>kcal/dygn</em> anger max energimängd totalt per dygn och är normalt: 25 kcal/kg/d.</p>\n<p>Vid sedering till burst supression: 20 kcal/kg/d.</p>\n<p><em>Max <strong>nutr</strong>/dygn</em>: Anger max energimängd nutrition per dygn efter avdrag för andra energikällor.</p>\n<h3>Näringsinnehåll i läkemedel</h3>\n<p>Propofol: 1 kcal/ml.</p>\n<p>1000 ml 5% glukos = 200 kcal.</p>\n<p>1000 ml 10% glukos = 400 kcal.</p>\n<p>Nimotop i.v. (kalciumantagonist): 1,2 kcal/ml (pga 20% etanolinnehåll).</p>\n<h3>ENTERAL NUTRITION</h3>\n<p>- Kontrollera att sonden ligger bra.</p>\n<p>- Enteral nutrition startas med 20ml/h under första vårddygnet. Senast vid första rondtillfället: Isosource Protein (1,3 kcal/ml). Minst 30 graders höjd huvudända om ej kontraindcerat.</p>\n<p>- När enteral nutrition trappas upp så tillgodoses vitaminer o mineraler i sondmaten.</p>\n<h3>Kontroll av ventrikelretention</h3>\n<p>- Utförs på alla pat. med ventrikelsond kl 06-12-18-24 och volymerna (tot. mäng och kasserad mängd) dokumenteras.</p>\n<p>- Retentionsvolym < 200 ml, ge tillbaka allt och starta/öka sondmaten med 20 ml/tim. Öka med 20 ml var 6:e h tills pat. uppnått sitt energimål.</p>\n<p>- Retentionsvolym 200-500 ml, ge tillbaka 200 ml och fortsätt med samma inställning.</p>\n<p>- Retentionsvolym > 500 ml, ge tillbaka 200 ml och stäng av sondmaten, avvakta ny retentionskontroll efter 6 h. Spola igenom ventrikelsonden med 20 ml vatten. Vid återstart, börja med 20 ml/h.</p>\n<p>- Auskultera tramljud 1 gång /pass.</p>\n<p>Primperan 10 mg iv x 3 och om samtidig opiatinfusion Naloxonhydroklorid 1-8 mg i sond x 1-4. Ev tillägg av Cilaxoraldroppar 10-15 droppar, supp Dulcolax 1-2 st. Cave för dessa är ileus/bukkirurgi.</p>\n<h3>PARENTERAL NUTRITION</h3>\n<p><strong>Dag </strong>1-4<strong> Glukos, elektrolyter </strong>&<strong> spårämnen.</strong></p>\n<p><strong>Glukos</strong>: Ge 100-150 g glukos per dygn. Använd Glukos 50 eller 100 mg/ml med tillsats av elektrolyter (helst 50 mg/ml för att undvika hyperglykemi). Efterhand när enteral nutrition ökas så kan volymen Glukos minskas.</p>\n<p><strong>B-vitamin:</strong> Vid misstanke om malnutrtion el. etyl. Vit B1 100 mg iv före start.</p>\n<p><strong>Övriga vitaminer och mineraler: </strong>En daglig dos av Soluvit och Tracel (eller Addaven???) tillsätts dagens första glukosdropp om ingen annan nutrition ges. Flaskan skall ljus-skyddas.</p>\n<p><strong>Fosfat:</strong> I normalfallet ordineras Glycophos 20 mmol. (undantag är ex. dialyspat. med känd hyperfosfatemi). S-fosfat kontrolleras dagligen och subsitutueras vb. Blandas med 100 mg NaCl.</p>\n<p><strong>Magnesium</strong>: Kontrolleras dagligen och substitueras v.b. Blandas i 100 ml NaCl.</p>\n<p><strong>Dag 5 </strong>”<strong>full nutrition</strong>”**</p>\n<p>- Parenteral nutrition startas dygn 5 på IVA om inte minst 80% av energibehovet (Max nutr/dygn) tillgodoses med enteral nutrition. Om sondmat inte ges så ordineras total perenteral nutrition.</p>\n<p>- Sandardlösning är Nutriflex Lipid Special, innehållande ca 1,1 kcal/ml.</p>\n<p>- Nutriflex Lipid Special <strong>SVT</strong>: Till varje storpåse Nutriflex Lipid Special (1250 ml), tillsätts 1 ampull <strong>S</strong>oluvit, <strong>V</strong>italipid adult 10 ml, och <strong>T</strong>racel 10 ml.</p>\n<p>- Parenteral nutrition startas dygn 5 om <80% av energibehovet tillgodoses enteralt (max nutr/dygn).</p>\n<p>- Använd Nutriflex Lipid Special (1,1 kcal/ml).</p>\n<p>- Blanda till Nutriflex Lipid Special SVT: Nutriflex Lipid Special 1250 ml + 1 ampull Soluvit + Vitalipid adult 10 ml + Addaven 10 ml. Kontraindikation: Allergi ägg eller sojaprotein. Skall ges centralt pga hyperosmolär lösn. Annars ges normoosmolär påse i pvk.</p>\n<p>- Sondmaten 20ml/h motsvarar parenteral nutrition 24 ml/h. Så om du ökar EN med 20 ml/h så minskar du PN med 24 ml/h.</p>\n<p>- Vid TOTAL patenteral Nutrition: Nutriflex Lipid Special SVT, dygnsmängden i <strong>ml</strong> = Max Energimängd Nutrition per dygn delat med 1,1. (Energiinnehåller är ju 1,1 kcal/ml)</p>\n<p><strong>Aminosyror</strong>: Vid pågående dialysbehandl. ges 500 ml Glavamin (21 ml/h). Orinera från 12.00-11.59. Inget avdrag för kalorierna i Glavaminet görs.</p>\n<h3>BALANSERA PERENTERAL OCH ENTERAL NUTRITION</h3>\n<p>Sondmat 20 ml/h motsvarar parenteral nutrition 24/h (samma kaloriinnehåll).</p>\n<h3>Övrigt</h3>\n<p>- Vätskeordination på IVA löper från 12.00 till 11.50 nästkommande dag.</p>\n<p>- Max infusionshastighet med näring är 2 ml/kg/h.</p>\n<p>Nutriflex Lipid special innehåller: 1250 ml, 72 g aminosyror, 50 g fett, 180 g glukos, 1475 kcal, Na+ 67, mmol, K+ 47 mmol, Mg++ 5,3 mmol, Fosfat 20 mmol, Ca++ 5,3 mmol. Lösningen är hyperosmolär. Tillsätt inga andra tillsatser än SVT i blandningen!</p>\n<h3>ÖVRIGA LÄKEMEDEL</h3>\n<p>- <strong>Ulcusprofylax</strong> mixt. Andapsin 10 ml i sond x 4 alt. inj Nexium 40 mg x 1 iv.</p>\n<p>- <strong>Tarmreglering </strong>Movicol i sond x 1-3.</p>\n<p>- <strong>Ven</strong>trikelretention**, Primperan 10 mg iv x 3 och vid samtidig opiatinfusion Naloxonhydroklorid 1-8 mg i sond x 1-4. Ev. tillägg av Cilaxoraldroppar 10-15 droppar, Suppositorium Dulcolax 1-2 st (kontraindicerat vid ileus eller bukkirurgi).</p>\n<h3>KOKBOK REKOMMENDERAD AV KOLLEGA PÅ HS PÅ FÖRELÄSNING</h3>\n<p>1.  Bedöm nutritionsstatus. 2.  Baslinje PO4 + Mg. 3.  Starta glukos + spårämnen. 4.  Tiamin? Var liberal. Alla som du tror har en dålig nutritionsstatus. 5.  Tror du att pat. inte kommer att ha något oralt intag inom 48h? Sätt en NG-sond. 6.  Start EN 25 ml/h ca. Använd högenergi/högproteinlösning. 7.  Kalorimål 20-25 kcal/kg/d. 8.  70% av målet inom 72h (OBS! Räkna av kalorierna från Propofol). Det finns ingen mening att komma över målet inom 72 h. 9.  Kolla PO4 + Mg. Inom 72 h. Enda sättet att veta om pat. får ett refeeding syndrom är om Fosfat är <0.65 och faller >0.15 under första 72h??? Om så är fallet så ska man minska kaloriintaget. 10.  Refeeding? Kalorirestirktion 5-10 kcal/kg/d + Mg, PO4, Tiamin. 11.  80-100% >72h. 12.  PN efter 5-7 d om EN inte nog.</p>\n<p><strong>Dygnsmäng</strong>d<strong> (ml) för </strong>Enteral<strong> eller Parenteral Nutrition </strong>KVINNOR<strong> (PM KS)</strong></p>\n<table class=\"card-table\">\n<tr><td>Längd</td><td>Idealvikt</td><td>25 kcal/kg/dygn</td><td>Isosource Protein EN</td><td>Nutriflex Lipid Special PN</td></tr>\n<tr><td>155</td><td>48</td><td>1200</td><td>923</td><td>1091</td></tr>\n<tr><td>160</td><td>52</td><td>1300</td><td>1000</td><td>1182</td></tr>\n<tr><td>165</td><td>57</td><td>1425</td><td>1096</td><td>1295</td></tr>\n<tr><td>170</td><td>62</td><td>1550</td><td>1192</td><td>1409</td></tr>\n<tr><td>175</td><td>66</td><td>1650</td><td>1269</td><td>1500</td></tr>\n<tr><td>180</td><td>71</td><td>1775</td><td>1365</td><td>1614</td></tr>\n<tr><td>185</td><td>75</td><td>1875</td><td>1442</td><td>1705</td></tr>\n<tr><td>190</td><td>80</td><td>2000</td><td>1538</td><td>1818</td></tr>\n</table>\n<p>Uträkning idealvikt kvinna: 45,5 + 0,91 x (längd i cm – 152,4)</p>\n<p><strong>Dygnsmäng</strong>d<strong> (ml) för </strong>Enteral<strong> eller Parenteral Nutrition </strong>MÄN<strong> (PM KS)</strong></p>\n<table class=\"card-table\">\n<tr><td>Längd</td><td>Idealvikt</td><td>25 kcal/kg/dygn</td><td>Isosource Protein EN</td><td>Nutriflex Lipid Special PN</td></tr>\n<tr><td>160</td><td>57</td><td>1425</td><td>1096</td><td>1295</td></tr>\n<tr><td>165</td><td>61</td><td>1525</td><td>1173</td><td>1386</td></tr>\n<tr><td>170</td><td>66</td><td>1650</td><td>1269</td><td>1500</td></tr>\n<tr><td>175</td><td>71</td><td>1775</td><td>1365</td><td>1614</td></tr>\n<tr><td>180</td><td>75</td><td>1875</td><td>1442</td><td>1705</td></tr>\n<tr><td>185</td><td>80</td><td>2000</td><td>1538</td><td>1818</td></tr>\n<tr><td>190</td><td>84</td><td>2100</td><td>1615</td><td>1909</td></tr>\n<tr><td>195</td><td>89</td><td>2225</td><td>1711</td><td>2023</td></tr>\n</table>\n<p>Uträkning idealvikt man: 50 + 0,91 x (längd i cm – 152,4)</p>", "category": "Praktiskt"}, {"title": "ANTIKOAGULANTIA OCH OPERATION", "html": "<h3>Plavix</h3>\n<p>Thorax/hkir: Om pat. står på Plavix men hämningen är <40% så är det OK att operera.</p>\n<h3>Brilique</h3>\n<p>Thorax/hkir: Om hämningen är <15% är det OK att operera.</p>", "category": "Praktiskt"}, {"title": "ORDBOK / TERMER", "html": "<p><strong>Liten ordbok på bra ord:</strong> <em>Sugilation<strong> – Typ </strong>hematom<strong> som infiltrerat i vävnaderna. Går inte att </strong>tar</em><em>/suga bort.</em></p>", "category": "Praktiskt"}, {"title": "PACEMAKER OCH ANESTESI", "html": "<h3>PACEMAKER INFÖR ANESTESI</h3>\n<p><strong>Se utdrag ur 2 PM nedan:</strong> <strong>Källa: PM, Tema </strong>hjärtakärl<strong>, Kar2-</strong>15916<strong>, giltigt from 2018-11-28.</strong> - Diatermi kan inhibera PM/ICD under tiden diatermi pågår. Kan även orsaka asynkron stimulering. Vid diatermi i dosans omedelbara närhet eller om diatermikniven kommer i kontakt med dosans hölje kan dosans elektronik skadas. Vid ICD så kan diatermi leda till felaktig defibrillering. Vid operation där diatermi används gäller följande: - EKG-övervakning obligatoriskt. - ICD skall alltid inaktiveras genom placering av magnet ovanpå dosan, pacemakerfunktionerna i dosan fungerar dock fortfarande. - Undvik att använda diatermi i pacemaker/ICD-dosans omedelbarara närhet. - Använd helst diatermi i korta, intermittenta sekvenser, kontrollera EKG under tiden. Bipolär diatermi innebär minskad risk för störning. - Om pacemaker inhiberas av diatermin och pat. saknar egenrytm blir pat. pulslös. - Vid unipolär diatermi placeras indifferent elektrod på låret. - De ska även finnas ett styrdokument som heter: ”Inaktivering av ICD vid operation”. Kolla upp. <strong>Källa: PM, PMI KS Solna, 2017</strong>, Nordström<strong>.</strong> -  Pat. med PM eller ICD behöver i regel ej kontakt med PM-/arytmi-mottagning om de är väl uppföljda. Det finns inte någon obligatorisk kontroll av PM/ICD före, under och efter op. Pat. har dock uppenbarligen någon hjärtsjukdom att ta ställning till. Pat. med ICD har ofta uttalad nedsatt VK-funktion. - Diatermi, Lithotripsi, och MR kan störa PM-funktionen. - Har patienten en ICD kan diatermi leda till felaktigt defibrillering från dosan. ICD funktionen stängs därför rutinmässigt av peroperativt mha ICD magnet, (se ICD nedan). - Bipolär diatermi innebär minskad risk för störning av PM/ICD och bör användas i 1:a hand. - Vid unipolär diatermi placeras diatermiplattan så att strömmen ej passerar PM. - Vid stor risk för perioperativa bradykardier såsom hos patienter med AV-block III, Sicksinussyndrom (SSS) och övriga bradyarytmier i kombination med diatermering i närheten av dosan (t.ex bröstkirurgi på samma sida som PM) bör diskussion föras med kardiolog ifall PM funktionen skall omprogrammeras till asynkron pacing (fixed pacing) (A00/V00/D00). Dvs. sensingen är avstängd och kirurgen kan diatermera i princip fritt. Men oftast räcker det med diatermipauser och magnet i beredskap. - Ultraljudsskalpell/harmonisk skalpell minimerar risken. - PM behöver ej ha magnet perop. Men man ska känna till var magnet finns, för att kunna användas vb. Magnetrespons på vanlig PM (inte ICD) leder till att PM byter funktion till asynkron pacing, dvs AAI(-R) byter till A00, VVI(-R) byter till V00 och DDD(-R) byter till D00 vid en fixed frekvens(beroende på tillverkare och batteristatus). Vanligen 85-99 /min om välfungerande batteri. Men detta leder ofta till sämre funktionssätt hos hjärtat och viss men liten risk för arytmi (pacing på egenrytm). I första hand görs således avbrott i diatermin när inhibering sker och magnet används först vid cirkulationsproblem. -Dom flesta PM har en rate responsive funktion (via mekanisk sensor) som svarar på fysisk aktivitet med ökad pacing frekvens. Den behöver inte stängas av perop, eftersom patienten ligger still.  En del PM har en rate response funktion som svara på minutventilationen och dessa kan ibland ha svårt att monitorera AF vid kontrollerad ventilation. <strong>Preanestesibedömning</strong> – Följande ska ingå:<strong> - Indikation för PM. Typ av arytmi? Svikt? - Om patienten är obligat PM beroende. Dvs. saknar underliggande rytm. - Typ: dvs PM eller ICD - Inställningar. Pacemaker funktion, tex DDD - Var och när patienten kontrollerades senast. - Om ICD - plan för avstängning - magnet eller omprogrammering </strong>ICD<strong> En ICD har alltid både ATP-terapi (antitakypacing) och chock-terapi utöver pacemaker funktion. - ICD: I händelse av peroperativ  VT/VF. 1:a hand: Avlägsna magnet. 2:a hand: Extern deff. - Gällande rutin är att ICD-funktionen (=anti takypacing / chockbehandling) skall inaktiveras under op med ICD magnet. Den underliggande PM funktionen finns ändå kvar. </strong>Position I<strong> </strong>Position II<strong> </strong>Position III<strong> </strong>Position IV<strong> </strong>Stimulerat/<strong>pacat</strong> <strong>hjärtrum</strong> <strong>Avkänt/</strong>sensat<strong>      </strong> <strong>Hjärtrum</strong> <strong>Svar på avkänd </strong> <strong>Händelse</strong> <strong>Frekvensvariabilitet</strong> <strong>A=Atrium</strong> <strong>A=Atrium</strong> <strong>T= </strong>Triggered<strong> </strong>R = Rate <strong>response</strong> <strong>V = Ventrikel</strong> <strong>V = Ventrikel</strong> <strong>I = Inhiberad</strong> <strong>O= Ingen</strong> <strong>D= Dual(A+V)</strong> <strong>D= Dual(A+V)</strong> <strong>D= Dual(T+I)</strong> <strong>O= Ingen </strong> <strong>O= Ingen</strong> <strong>O= Ingen</strong> <strong>S= </strong>Single(<strong>A </strong>el<strong> V)</strong> <strong>S= </strong>Single(<strong>A </strong>el<strong> V)</strong></p>\n<p><strong>PACEMAKER </strong>&<strong> DIATERMI (#Pacemaker / ICD / CRT-D/</strong>P )**</p>\n<p><strong>Gällande Pacemaker </strong>och diatermi<strong>:</strong></p>\n<p>- Användning av bipolär diatermi på patienter med pacemaker innebär en nästan obefintligt risk för att pacemakersystemet skall störas ut, om man inte använder diatermin i nära (<15 cm) anslutning till pacemakern. Unipolär diatermi nedom naveln går bra om neutralplattan sätts på låret. Som alternativ till diatermi kan Harmoic Scalpel användas (ultraljudskniv). - Magnet över pacemaker:  Asynkront D00, alternativ V00 mode (fix programmering) med en frekvens på minst 90 slag/min. - Moderna pacemakrar har avancerade säkerhetssystem inbyggda i sin konstruktion, och problem är ytterst osannolika. Skulle pacemakerfunktionen störas av t ex diatermi går den tillbaka till sin normala funktion igen så fort man stängt av diatermin. - Magnet över vanlig pacemaker behövs endast om pat. är pacemakerberoende och man ser pulsstörningar på artärkatetern, pulsoxymetrin, eller palp. puls.</p>\n<h3>Gällande ICD och diatermi</h3>\n<p>- Vid ICD (implanterbar cardiodefibrillator) bör man alltid kontakta arytmolog eller PM-ssk inför en planerad operation med diatermi, för att inaktivera de algoritmer som ger chockterapi.</p>\n<p>- Jourtid inaktiveras ICDn med ringmagnet om man tänker sig använda diatermi.</p>\n<p>- Ringmagneten sätts över ICD-dosan med en bred tejp. Så länge ringmagneten är applicerad kommer systemet inte att kunna avge aktiv chockterapi (gäller alla ICDs). Handlägg då pat. som vid utan skydd  Defibrillator på salen, plattor anterioposteriort, minst 10 cm från dosan). Pacemakerfunktionen i ICD:n påverkas inte av ringmagneten. När ringmagneten tas bort fungerar ICD:n som vanligt igen. Som alternativ kan man bara ta bort magneten vid arytmi och ICD kommer inom ca 10 sek reagerar och ge en chock.</p>\n<h3>CRT/CRTD och diatermi</h3>\n<p>CRT, Cardiac resynchronization therapy, eller på svenska biventrikulär pacing har en extra elektrod som leder till att båda kamrarna kontraherar sig synkront och används som terapi vid hjärtsvikt. CRT-D har även ICD-funktionalitet och handläggs som en ICD. Vanlig pacemakeraktivitet som finns i CRT-D deaktiveras ej av magnet, d v s den biventrikulära pacingen förändras inte. En CRT utan defibirillatorfunktion (CRT-P) handläggs som en vanlig pacemaker.</p>\n<p><strong>Avstånd från pacemaker:</strong> - Unipolär diatermi får ej  användas så att strömmen passerar pacemakersystemet och den unipolära elektroden får inte användas med mindre än 15 cm avstånd från pacemakersystemet (inkl elektroder). <strong>Efterkontroll ICD: </strong> - Efter ingrepp nära operationsområdet (30 cm) om diatermi använts. - Har patienten defibrillerats eller opererats med användning av unipolär diatermi ovan naveln måste ICD-dosan kontrolleras postoperativt (annan källa). Beredskap för yttre defibrillering skall då kvarstå tills en kardiolog har kontrollerat dess funktion. I övriga fall behöver patienten ingen särskild övervakning och ICD:n kan kontrolleras av arytmolog eller PM-ssk när dessa finns i tjänst. <strong>Tillverkarnas kommentarer:</strong> - St Jude Medical avråder helt från användning av diatermi. - Medtronic avråder från användning av diatermi men ger anvisningar om förfaringssätt om användning av diatermi trots allt anses nödvändigt. Användning av diatermi på patient med kardiell pacemaker sker helt på behandlande läkares ansvar, varför behandlande läkare bör kunna diagnostisera och behandla komplikationer.</p>\n<p><strong>Källor:</strong> Diatermi vid befintlig pacemaker/ICD/CRT-D/P, v5, 2018. Diatermi vid befintlig pacemaker eller ICD – anestesi, v6. Massachusetts, ninth ed. Pino.</p>", "category": "Praktiskt"}, {"title": "PARKINSONS SJUKDOM - ANTESTESI", "html": "<p><em>PM: <strong>Alfresco</strong>, ID 23097, utgåva 2017-08-08, <strong>Nu-sjukvården</strong>, Anestesikliniken.<strong> </strong>Artikel läkartidningen 2010.</em> <strong>Symtom: </strong>Tremor, muskelrigiditet, hypokinesi/bradykinesi, dysfagi, GI-reflux, bortfall posturala reflexer, demens, autonom dysfunktion sent i förloppet. <strong>Behandling: </strong>Levo-dopa, dopaminagonist, enzymhämmare ex MAO-hämmare typ B. L-dopa är mest effektiva mot motoriska symtom, men hög dos medför med tiden dyskinesier och motoriska symtomfluktuationer. L-dopa är en prekursor som i hjärnan blir dopamin. Dopaminagonister har mindre risk för dyskinesier men fler andra biverkningar såsom bla illamående, ortostatism. <strong>POTENTIELLA KOMPLIKATIONER</strong> <strong>CNS:</strong> Rigiditet, postop kognitiv dysfynktion, förlängd dystoni, hallucinationer. <strong>Autonom dysfunktion:</strong> Ortostatism, störd temperaturreglering, avsaknad av hjärtfrekvens-variabilitet, gastropares, blåstömningsbesvär, faryngeal muskeldysfunktion. <strong>Respiratoriskt:</strong> Aspirationspneumoni vanligt (vanligaste dödsorsak hos Parkinsonpat generellt), laryngospasm vid extubation, postoperativ lungdysfunktion, sekretstagnation, fallbeskrivningar om ofrivilliga rörelser vid glottis som tros ha orsakat intermittent luftvägsobstruktion. <strong>Kardiovaskulära:</strong> Hemodynamisk instabilitet, arytmier, ödem, hypovolemi. Gastrointestinala: GI-reglux, påverkade svalgreflexer. <strong>Farmakologiska interaktioner med</strong>: - Centralt verkande antikolinergika (=Atropin, dock inga problem med Robinul), - Metoklopramid (Primperan) & Droperidol (Dridol) & haldol kan förvärra symtomen. - Sedativa ges med försiktighet. - Petidin (Selegilin), Tramadol (Selegilin). - Morfin kan minska effekten av levodopa. Direktverkande dopaminagonister kan orsaka vasodilatation. <strong>ANESTESIBETÄNKLIGHETER</strong> - Viktigt att pat. får sin medicin i hela det perioperativa förloppet för att undvika förvärrade symtom. Under fastan kan T Madopark Mite ges upplöst i lite vatten. - Vid långvarig operaiton skall medicin ges i V-sond (Madopark Quick kan lösas i vatten). - Vid abrupt utsättning av L-dopa och även andra parkinson-LM finns risk för <em>malignt syndrom</em> som har vissa likehter med malignt neuroleptiskasyndrom och malign hypertermi. Är allvarligt potentiellt dödligt om inte behandlas i tid. Karaktäriseras av: Temp>38, påverkat medvetande, ökad muskeltonis, ökat CK (>10 000 IU/L), och autonom instabilitet. Andra utlösande faktorer: dehydrering, infektion, ileus, dålig följsamhet. Behandling: L-dopa och Dantrolen, och intensiv symtomatisk behandling. - Hypotension vanligt, tillse gott vätskestatus, rekommenderat att vätska upp pat innan sövning. - TIVA (eller sevo) - (enligt källor har sevo ökad risk för postop kognitiv dysfunktion, samt verkar på hjärnans dopaminkoncentration). Dexdor verkar även funka som sedering. - Finns rapporter om opioidinducerad rigiditet orsakad av Fentanyl, svarar på muskelrelax. - Ej celo pga risk för hyperkalemi. - Artärnål vid skör pat. eller autonom dysfunktion, då även gärna tempkateter. VASOPRESSOR: Sänkt känslighet för noradrenalin pga interaktion med L-Dopa i perifera vävnader, rekommenderas därför Fenylefrin. PONV: Betapred, Ondansetron. SMÄRTA: NSAID, paracetamol, även Tramadol enl. Alfresco-PM. POSTOP: Minst 6 h vårdtid.</p>", "category": "Praktiskt"}, {"title": "PCA – Morfin-PCA", "html": "<p>Två oberoende kollegor använder samma dosering som utgångspunkt: - 2 mg per tryck, spärrtid 6 minuter. Max 36 mg/4 h. - Kan ju förstås behöva justeras efter individen. - Kolla upp PM från Mölndal VG region om PCA på IVA. Finns väldigt mkt info. https://mellanarkiv-offentlig.vgregion.se/alfresco/s/archive/stream/public/v1/source/available/SOFIA/SU9805-1593997-381/SURROGATE/Intravenös%20patient-kontrollerad%20analgesi%20(IV-PCA)%2c%20IVA%20Mölndal.pdf</p>", "category": "Praktiskt"}, {"title": "PENTOKOMA / PENTOCOMA / Djup pentothalsedering vid refraktär ICP-stegring", "html": "<h3>Indikaiton</h3>\n<p>Refraktär ICP-stegring hos cirkulatoriskt stabila patienter. - Indikation för behandling är kvarstående ICP >20 mmHg som inte svarar på behandling så som hyperton koksalt, feberkontroll, sedering med propofol och/eller midazolam.</p>\n<h3>Kontraindikation</h3>\n<p>Cirkulatorisk instabilitet (dosbegränsande) eller förekomst av så omfattande hjärnskador att den cerebrala metabolismen redan är nedsatt och/eller att den metabola blodflödesregleringen ej fungerar normalt (effekt begränsad).</p>\n<h3>Bakgrund</h3>\n<p>- Refraktär ICP-stegring förekommer hos 10-25% av alla TBI-patienter. Associerat m. hög mortalitet. - De pat. som svarar på behandlingen överlever i högre grad.</p>\n<h3>Biverkningar</h3>\n<p>Blodtryckssänkning, hypokalemi och ökad infektionsrisk. Ofta drabbas lungorna pga utslagen ciliefunktion. Leukocytstegring och feber ses sällan trots infektion. Påverkad lever-och njurfunktion finns rapporterat i en hög frekvens även om det sällan är begränsande i behandlingen.</p>\n<h3>Mekanism</h3>\n<p>Rationale: Minskad metabolism -> Minskat cerebralt blodflöde -> Minskad cerebral blodvolym -> Sänkt ICP.</p>\n<h3>Behandling</h3>\n<p>- Inled med upprepade bolusdoser Pentothal om 50-100 mg, och utvärdera effekter på ICP. - Efter beslut om beh. m. Pento-coma, koppla upp kontinuerligt EEG snarast. - Upprepade bolusdoser till upp till totalt 10 mg/kg över 10-30 min, därefter infusion 2-3 mg/kg/h. Dosökning i steg om 0,5 mg/kg/h. - För att ICP ska ligga <20 mmHg krävs oftast behandling till burstsuppression = EEG visar aktivitet 3-6 ggr/min. Om burstar <3/min abryt infusionen tillfälligt. Vid överdosering finns risk för isoelektriskt EEG och neuronal celldöd. <strong>- </strong>Kalium: <strong>Pentobehandling orsakar sjunkande s-kalium pga intracellulärt skifte. Men tot. K+ i kroppen är oförändrad. Beh. därför endast om s-K < 2,5 mmol/L. (glöm därför inte att ändra målvärden till 2,5-3,2mmol/L). Vid justering s-K till normala serumvärden finna annars risk för svårbehandlad hyperkalemi vid utsättningen av Pento. - Om ICP legat stabilt <20 mmHg i 24 timmar kan man börja minska på sederingen. Minska sederingen gradvis cirka 0.5-1 mg/kg/timme varje dygn för att kunna behålla ICP-kontroll och undvika hyperkalemi. - Tänk på att patientens neurologiska tillstånd inte kan följas med GCS vid djup sedering men att det är av stor vikt att följa pupillerna storlek/ljusreaktion då en plötslig pupilldilatation kan vara enda tecknet på nytillkommen expansiv process. </strong>- <strong>Enteral</strong> nutrition<strong>: </strong>Sänk tillförsel av enteral nutrition. KOLLA NYA PM-et!<strong> </strong></p>", "category": "Praktiskt"}, {"title": "PERIFER NERVBLOCKAD", "html": "<p><strong>NÅGRA PRAKTISKA SAKER</strong> GENERELLT<strong> - När du kartlägger pat., kolla även med färgdoppler efter blodkärl, det är lätt att missa. Ex ibland avgår en artärgren från a. axillaris vid supraclavområdet. - Finns risk för tryckskador om man ex skulle ligga på bedövad kroppsdel, ex hälar efter ischiadicusblockad. - Minskad proprioception och svaghet kan orsaka fallskador vid bedövad nedre extremitet. - Perifera nerver är ofta lite mer hypoekogena proximalt och blir mer och med tydliga likt bikakor lägre ut distalt. - En respons på nervstimulering som är <0,5 mA talar för att nålspetsen är intraneural (=innanför epineuriet) och man bör därmed backa nålen. - Injicering bredvid nerven brukar göra att nerven lyfts upp och syns tydligare. </strong>INFORMATION TILL PATIENTEN<strong> - När blockaden släpper så släpper den fort, så när det börjar pirra/komma smärta så be snabbt om smärtlindring per os. - Plexusblock med Ropivacain sitter i ca 6-8 h. </strong>LOKALANESTESTETIKA<strong> - På handkiurigen använder man Ropivacain 5 mg/ml som standard. 7,5 anses för starkt. Vill man ha snabbt anslag så väljer man Carbocain. Xylocain av starkare variant anses för neurotoxiskt. - Dosering generellt: ”Vetenskaplig dosering” har en riktlinje på 0,2 ml/mm2. Man kan tracea området man ska bedöva och få en area. - Carbocain 15 mg/ml, 20 ml ger ca 4 h blockad. </strong>ADJUNCTS<strong> - Natriumbikarbonat: Minskar tillslagshastigheten. Man kan coata sprutan med NaBic. - Clonidin: Förlänger durationen. - Adrenalin: Förlänger durationen, fördröjer systemisk absorption, underlättar identifiering av intravaskulär injektion. </strong>NÅLAR<strong> Single-shot: Brukar använda 22 G. Längd 8 cm är bra allround. Införsel av smärtkateter: Använder tjockare nålar ex 18G. </strong>SMÄRTKATETER<strong> Ex. på dos: Ropivacain 2 mg/ml. Volym beror på storlek, men 5-10 ml var 3 e h. - Kan sitta i upp till 1 vecka. Infektionsrisk. </strong>BLOCKADVAL ÖVRE EXTREMITET<strong> - Interscalen: Primära blockaden för axelkirurgi. Dock är phrenicusblockad vanlig komplikation även vid låga doser LA. Interscalen ger en pålitlig högre brachialplexusblockad, och cervicalplexusblockad vilket är nödvändigt för axelkirurgi. - Vid kirurgi på armbåge, underarm, och hand så saknas evidens på om någon av axillär, supraclav eller infraclav som är bäst när motsvarande expertis utför varje teknik. - Supraclav och infraclav är användbara när man inte kan abducera armen, supraclav passar bra ex vid humeruskirurgi och infraclav är bra vid smärtkateterinläggning. - Axillarisblockad kan användas till de flesta operationer på underarm, och armbåge. Blockaden är relativt säker även i oerfarna händer. Den tenderar dock att ta något sämre för överarmen och inte sällan så börjar blodtomhetsmanchetten att göra ont mot slutet av op. - Blockad av perifera nerver distalt på armen och underarmen är bra som rescuemetoder under op eller postop smärtlindring med inte lika stor motorisk blockad. </strong>SUPRACLAV<strong> - Området är rätt inkapslat och ej vaskulariserat så på handkirurgen är de inte så oroade för en något högre dosering. Men räkna på dos innan. - Ropivacain 5 mg/ml, 20-30 ml. - För att få en god kirurgisk effekt så gör de multiple injections. Är det bara en postoperativ bevödning så räcker det med någon enstaka injektion i rätt område så diffunderar det. Måste bedöva minst 2 platser: i the ”pocket” under nedre trunc och mellan övre och nedre trunc. - Börja med corner pocket. </strong>INFRACLAV<strong> (</strong>Plexus<strong> betyder fläta på latin).</strong> - Samma indikationer som för supraclav. Armbåge, underarm och hand. - Förstahandsval om du ska lägga smärtakateter då skidan (epuneurium) kommunicerar med alla nerverna. Men i övrigt har man sällan nytta av den. - Till skillnad från axillarisblockad så kan den utföras utan att röra på extremiteten och single injection technique är möjlig. - I detta område ligger alla nerver inom en skida och bara för en postoperativ smärtlindring så räcker det egentligen med att lägga 1 injektion under artären, får man en fin smiley-utbredning av LA så räcker det för att bedöva hela plexat, sedan får man också bedöva musculocutaneus vb.. - Nackdel är att man måste sticka djupare. Nålvinkeln blir brantare och blir därmed svårare att visualisera. - Lägre riskför pneumothroax och phrenicusblockad än supraclav, men man sticker dock nära kärl. - Komplikaterioner: Pneumothorax, hemothorax, chylothoras (om på vä sida), intravaskulär injektion, mer smärtsam pga djupare stick. Kontraindicerad vid antikoagulantia. - Lägre risk för blockad av n. phrenicus. <strong>- </strong>20 - 30 ml Ropivacain 5 mg/ml kan ges som single-shot bakom och runt axillarisartären. Alla nerverna ligger inom en skida och det räcker i princip att du fyller en smiley under artären så sprider den sig. <strong>AXILLARIS</strong> - Fördelaktigt vid blödningsrisk då kärlen är komprimerbara. - Ganska stor anatomisk variation gällande nervernas lokalisation. - Bedövning läggs ofta över tre lokalisationer: Under artären för att bedöva radialnerven; ovan artären för medianus och ulnaris; sedan backa långt och för nålen in i musculofasciaplanet där musculoutaneus finns. <strong>INTERSCALEN</strong> Erfaren SÖS-kollega: Mkt försiktig dosering i interskalenen. Aldrig mer än 10 ml Ropivacain 5 mg/ml, då riskerar man bara biverkningar. Området är litet och den sprider sig gärna uppåt. Håll inte på och hydrodissekera dig fram. Om man vill bedöva ex för axellux så kan man ge Xylo 10 mg/ml 5 ml. <strong>FEMORALISBLOCKAD / FEMORALBLOCKAD</strong>:<strong> - Höftfraktur, femurfraktur, patellarfraktur, knäplastik, atroskopi. Ropivacain 5 mg/ml 10-30 ml eller Ropivacain 7,5 mg/ml 10-20 ml. Anslagstid 10-45 min, duration 3-9 h (Källa narkosguiden 2022-06-10). </strong>POPLITEABLOCKAD<strong> - Blockad av n. ischiadicus där den delar upp sig i knävecket. - Pat. gärna i sidoläge. - Sikta proben genom knät, svep upp så att du hittar platsen där ischiadicus grenar upp sig, vilket brukar vara 4 tvärfingrar från knävecket (ca 10 cm). Följ sedan nervegrenarna ned en bit. Du vill bedöva i nervskidan (epineurium) som innehåller båda nerverna innan de sticker iväg. (alltså typ grenen/”skrevet”  på nerverna). - Stick ovanifrån, ytligt, under första nervgrenen och igenon fascian. Få LA kring båda nerverna. – Klart! Ca 20 ml Ropivacain 5 mg/ml. - För att komplettera mitt på foten lateralsidan så komplettera genom en saphenusblockad, lägg alltså en kvaddel kring v. saphena magna. Den finns vid mediala malleolen. Försök kom runt kärlet med kvaddeln. Ca 2-3 ml Ropi 5 mg/ml. Nu är hela foten bedövad. </strong>FOTRIDÅ<strong> Samtal med kollega: Anteriort och gärna djupt medialt och ridå lateralt. Sedan bakom båda malleolerna. kör nära maxdos Ropo 5. Angående maxdos så kör han maxdos 3 mg/kg. ropi. 2 mg/kg är för defensivt. </strong>RISKER** - Långtidsrisk för långvarig nervskada efter nervblockad är 2,4% per 10,000 och verkar ej ha gått ned sedan ultraljudets intåg. - Munirama’s meta-analysis: Incidens av övergående neurologiska symtom som varar upp till 28 dagar = 9%. (oberoende av ultraljud eller ej).  - Incidens långtids-nervskada är 2,4 % per 10000. Men de flesta skador är övergående och incidensen är i storleken: 2,2% vid 3 månader, 0,8% vid 6 månader, 0,2% vid 12 månader.</p>", "category": "Praktiskt"}, {"title": "PRENAESTESIBEDÖMNING - LÄKEMEDEL OCH OPERATION/ANESTESI", "html": "<p>LÄKEMEDEL ATT TA HÄNSYN TILL INFÖR ANESTESI / OPERATION</p>\n<p><strong>Brilique</strong>: **Om nyligen PCI: Det är ffa de 3 första månaderna efter PCI/stentning som trombocythämmare är viktigt. Man kan ibland få avvakta med kirurgi till efter detta. Därefter så sätter man ut Brilique på opdagen och får Fragmin istället. (Källa: Kollega).</p>\n<p><strong>Calciumantagonister:</strong> Förstärker inhalationsanestesins effekt på hjärtmuskeln.</p>\n<p><strong>SGLT2-hämmare:</strong> Dessa ska sättas ut 2 dagar för operation.</p>\n<p><strong>TCA</strong> - Vid högdos: Ökar katekolaminnivån i sympatiska nervändslut vilket kan sensibilisera för inhalationsanestesins risk för arytmier samt tendens till hypotension då NA-upplagringen är störd.</p>\n<p><strong>Cytostatika</strong>:** Många interaktioner.</p>\n<p><strong>Aminoglykocider</strong>: **</p>\n<p><strong>ACEh</strong>: Sätt ut i regel. Ev inte om indikation hjärtsvikt. Då noggrann monitorering. Kan orskaka NA-resistent BT-fall. Ge då vasopressin istället.</p>\n<p><strong>Betablockare: </strong> Skall ej sättas ut. Kan övervägas att sättas in hos pat. med IHD eller hjärtischemi.Dock ej akut.</p>\n<p><strong>Statiner:</strong> Kan man fortsätta med. Kan övervägas sättas in inför kärlkir. >2 v innan.</p>\n<p><strong>Diuretika</strong>:** Kan överväga dosreduktion hos pat. med risk för hypovolemi, hypovolemi eller elektrolytstörningar.</p>\n<p><strong>Litium: </strong> <strong>- </strong>Det terapeutiska fönstret är litet (0,5 till 0,8 mol/L). Litium behandlas av kroppen som natrium, men har ingen av natriumjonens funktioner, därav ett toxiskt potential. - Kontroll av Litiumkoncentrationen är <strong>obligatorisk.</strong> - Provtagningstidpunkt för rätt värde är 12 h efter senaste dos. Intoxikationssymtom: törst, ataxi, yrsel, trötthet. - Finns det anledning att ta elstatus, ta även Litiumkonc. - Grupp 1: Patienter i långvarig, stabil Li-behandling och välbefinnande/kortvarigt ingrepp ex dagkirurgi: Ingen litiumtablett på operationsmorgonen, ingen speciell provtagning, Ringeracetat perioperativt. - Grupp 2: Patienter i långvarig, stabil Li-behandling och välbefinnande/längre ingrepp, men utan störning av vätskebalans ex större ortopedi: Ingen litiumtablett på operationsmorgonen, ingen speciell provtagning, Ringeracetat perioperativt. - Grupp 3: Patienter i långvarig, stabil Li-behandling, där elektrolytrubbningar kan väntas, ex större bukkirurgi: Ingen litiumtablett på operationsmorgonen, elstatus, S-Li (om S-Li > 1,6 skjut upp operationen, S-Li > 1,2 är gränsvärde), EKG, Ringeracetat perioperativt. - Grupp 4: Patienter där Li-konc. är osäker, misstänkta elektrolytrubbningar, instabil cirkulation, ex: Akuta, blödande patienter och patienter med många njurpåverkande mediciner: Ingen litiumtablett operationsmorgonen, elektrolytstatus och S-Li (S-Li >1,2 gränsvärde S-Li >1,6 uppskjut op.), EKG, Ev. KAD, Ringeracetat perioperativt. Postoperativ vård: Grupp 1 & 2: Startar med mat-, vätske- och litiumintag på kvällen, ingen extra provtagning. Uppmanas kontakta mottagningen, som styr litium-behandlingen, för information om genomgången operation och vidare provtagning. Grupp 3&4: Så länge vanligt vätske- och matintag är begränsat/uteslutet, ska Ringer-Acetat eller NaCl 0,9 % alltid ges, så Na-brist undviks. Elektrolytstatus och S-Li tas postop. morgon och därefter vid behov. Källa Alfresco.</p>\n<p><strong>ASA:</strong> Individuell bedömning som vägs mot ökad risk för blödning men minskad risk för trombiska events som stroke.</p>\n<p><strong>Donepesil</strong> <strong>– </strong>Acetylkolinesterashämmare. Används vid Alzheimers. Förlänger Depolariserande LM-effekt, och minskar effekten av icke depolariserande LM.</p>\n<p><strong>Alfadil</strong>: **Brukar vara helt OK.</p>\n<p><strong>BLEOMYCIN </strong>aka<strong> BEP</strong> - Används oftast vid gyn & testistumörer.  Cytostatika. OBS! Pat. får inte komma över 30% O2! Risk för lungfibros.</p>\n<p><strong>MAO-hämmare:</strong> Kan orsaka hypertensiv kris vid interaktion med NA-frisättande vasopressorer (efedrin, dopamin) och petidin. <strong>KOLLA UPP ANAFRANIL.</strong> Källa: Oxford: MAOA metaboliserar serotonin, noradrenalin , adrenalin, och finns ffa i CNS. MAOB metaboliserar ickepolära aromatiska aminer såsom fenyletylamin och metylhistamin Finns ffa i lever, lungor, och ickeneurala celler. Äldre läkemedel (tranylcypromine, phenelzine, isocarboxazid) binder kovalent till MAO-enzymet oselektivt för MAOA och MAOB. Nybildning av MAO tar 2-3 veckor. Nyare LM är reversibla och selektiva för MAOA (ex Moclobemide). <strong>Tranylcypyromine</strong>, <strong>phenelzyne</strong>, <strong>isocarboxazid</strong> sätts med fördel ut minst 2 veckor före anestesi. Om kortare tid ska man anse att man fortfarande står på MAOI. Man kan få återfall av svåra symtom och utsätting skall göras i samråd med psykiater. <strong>Trombyl</strong>: <strong>Ska endast sättas ut preop hos patienter som ska genomgå neurokirurgi och prostatakirurgi. Ska aldrig sättas ut hos kärlkirurgi-patienterna. Vid </strong>moclobemide<strong> så räcker det att sättas ut 24h före op och kan återinsättas efter op. </strong>Selegiline<strong> är en MAOB hämmare som används vid Parkinsons. Behöver inte sättas ut om doser <10 mg/d. Dock ska man fortsätta att undvika Petidin. </strong>Palexia** – (μ-agonistopioida och därtill noradrenalinåterupptagshämmande egenskaper) – Man behöver bara ta hänsyn till att pat. redan står på en smärtmedicin och kan behöva högre periop och postop doser. Men den noradrenerga återupptagshämningen behöver man inte vara rädd för. (Källa: Okänd)</p>", "category": "Praktiskt"}, {"title": "PREANESTESIBEDÖMNING – LÄKEMEDEL MED BLÖDNINGSRISK & UTSÄTTNING", "html": "<p>Källa: PM KS.</p>\n<h3>OBS glöm inte att fundera på indikationen för preparatet innan du sätter ut.</h3>\n<table class=\"card-table\">\n<tr><th><strong>LM</strong></th><th><strong>Tid</strong> <strong>innan</strong> op.**</th><th><strong>LM</strong></th><th><strong>Tid</strong> <strong>innan</strong> op.**</th></tr>\n<tr><td>Albyl-minor</td><td>3 dygn</td><td>Mobic</td><td>2 v.</td></tr>\n<tr><td>Alganex</td><td>2 v.</td><td>Naprosyn</td><td>5 dygn.</td></tr>\n<tr><td>Alindrin</td><td>24 h</td><td>Naproxen</td><td>5 dygn.</td></tr>\n<tr><td>Alka-Seltzer</td><td>7 dygn (3 d om 1x1)</td><td>Nurofen</td><td>24 h.</td></tr>\n<tr><td>Alpoxen</td><td>5 dygn</td><td>Orudis</td><td>24 h.</td></tr>\n<tr><td>Ardinex</td><td>24 h</td><td>Pedea</td><td>24 h.</td></tr>\n<tr><td>Arthrotec</td><td>24 h</td><td>Piroxicam</td><td>2 v.</td></tr>\n<tr><td>Asasantin</td><td>3 dygn</td><td>Plavix</td><td>5-7 dygn.</td></tr>\n<tr><td>Aspirin</td><td>7 dygn</td><td>Pronaxen</td><td>5 dygn.</td></tr>\n<tr><td>Bamyl</td><td>7 dygn</td><td>Siduro</td><td>24 h.</td></tr>\n<tr><td>Brexidol</td><td>2 v.</td><td>Ticlid</td><td>10 dygn.</td></tr>\n<tr><td>Brufen</td><td>24 h</td><td>Tradil</td><td>24 h.</td></tr>\n<tr><td>Burana</td><td>24 h</td><td>Treo</td><td>7 dygn.</td></tr>\n<tr><td>Clinoril</td><td>7 dygn</td><td>Trombyl</td><td>3 dygn.</td></tr>\n<tr><td>Confortid</td><td>24 h</td><td>Voltaren</td><td>24 h.</td></tr>\n<tr><td>Diclofenac</td><td>24 h</td><td>Waran</td><td>3 dygn.</td></tr>\n<tr><td>Eeze</td><td>24 h</td><td>Xefo</td><td>2 v.</td></tr>\n<tr><td>Eox</td><td>5 dygn</td><td></td><td></td></tr>\n<tr><td>Ibutemin</td><td>24 h</td><td></td><td></td></tr>\n<tr><td>Ibuprofen</td><td>24 h</td><td></td><td></td></tr>\n<tr><td>Indomee</td><td>24 h</td><td></td><td></td></tr>\n<tr><td>Ipren</td><td>24 h</td><td></td><td></td></tr>\n<tr><td>Ketoprofen</td><td>24 h</td><td></td><td></td></tr>\n<tr><td>Magnecyl</td><td>7 dygn</td><td></td><td></td></tr>\n<tr><td>Migpriv</td><td>7 dygn</td><td></td><td></td></tr>\n<tr><td>Meloxicam</td><td>2 v.</td><td></td><td></td></tr>\n</table>", "category": "Praktiskt"}, {"title": "PREMEDICINERING AV OROLIG PATIENT EJ KLAR", "html": "<p>2025-09-09 En gång fick en pat. saft med Ketanest 150 mg + Midazolam 40 mg. Normalviktig. Blev supertrött inom 20 minuter. Reagerade inte på något. Fick infart, sövdes, väcktes sedan ua. Biotillgänglighet p.o. midazolam = Biotillgänglighet p.o ketalar Kan blandas med Coca cola?? Osv.</p>", "category": "Praktiskt"}, {"title": "PREOXYGENERING", "html": "<p>Studie (tror det var friska frivilliga?): Om man preoxygenerats med fiO2 80% var var snitt-tiden till desaturation 300 sek. Om FiO2 100% snitt 400 sek. Med andra ord stor skillnad.</p>", "category": "Praktiskt"}, {"title": "PULE SPRESSURE VARIATION PPV", "html": "<p><strong>Kriterier:</strong> - Tidalvolym 8 ml/kg. - Sinusrytm. - Ej noradrenalin > 0,1. <strong>Mål:</strong> - Man siktar på ett PPV < 12-14%.</p>", "category": "Praktiskt"}, {"title": "PCEA", "html": "<p>PCEA (Patientkontrollerad epidural analgesi)</p>\n<h3>Rutin på öppen-buk-sektionen</h3>\n<p>Blanding: Ropivacain 2 mg/ml + Sufenta 0,5 mikrog/ml.</p>\n<p>Ordination:</p>\n<p>- Klinikerbolus 4-10 ml. Vanligtvis 5 ml, ges på operationsavdelningen, innan väckning.</p>\n<p>- Infusionshastighet: 2-6 ml/tim. Vanligtvis 4 ml/tim.</p>\n<p>- Självadministrerad bolusdos: 2-4 ml (vanligtvis 3 ml).</p>\n<p>- Bolus spärrning: 30 min.</p>\n<p>- Bolusdoser/timme: 2/h.</p>\n<p>Kod på pumpen: 191.</p>\n<p>Ny metod som används på gyn sedan ca 2 år.</p>\n<p>Kontinuerlig infusion med 2-6 ml/h + bolusdos 2-4 ml, max 2 ggr/h.</p>\n<p>När avdelningen ringer, fråga alltid om det är en vanlig EDA-pump eller om pat. har en PCEA.</p>", "category": "Praktiskt"}, {"title": "OSMOLALITET", "html": "<p>Normal serum osmolalitet 275-295 mosm/kg Korrigera ej snabbare än 0.5 mEq/L/h. OBS räkna om till mosm. (Gällande högosmolära vätskor i perifer infart så kan man bortse från det. På neuro sprutar de ju tom rent addex ibland. Så man kan ha glukosinfusion med mycket addex Na+ i en perifer infart utan problem /neurokollega). <strong>Dialys</strong> - Hur snabbt kan man sänka osmolaliteten? - Kollega försöker att undvika att minska osmolaliteten mer än 10% första dygnet. Man kan bli tvungen att lägga till natrium i alla dialysvätskorna för att inte sänka osmolaliteten för snabbt. Men detta är i regel inte ett problem om pat. inte är hjärnskadad. Dock ser man på HD-patienter som kommer 3 ggr/v så har de lite huvudvärk efteråt och man har sett att de fått hjärnödem. - En ökning av Natrium med 2 mmol/L motsvarar en sänkning av urea på 3,9 mmol/L ??? Stämmer? - Erfaren kollega från dialysenheten (HD). Tycker att säkning av osmolaliteten inte är ett problem i regel. Har dock varit med om en negativ händelse med dialysering av metanol (eller någon alkohol iaf), vilket orsakade hjärnskada.</p>", "category": "Praktiskt"}, {"title": "PA-kateter / Swan-Ganz kateter / Svan / Swan", "html": "<p><strong>Katetern</strong> - Var 10:e cm är markerad. Tjocklek 7 Fr (ytterdiameter). - <em>Distalt lumen</em> är beläget i kateterspetsen, används för tryckmätning och mixed venous blood prov. - <em>Proximalt lumen</em> är belägen i höger förmak. Används som CVK samt kyld lösning för termodilutionsmätning. Här kan även CVP mätas. - <em>Ballonglumen</em> – Rymmer 1-1,5 cc. Man brukar lämna kvar en spruta i ballonglumen för att visa att man inte ska injicera saker där. - Termistorlumen – Här går kopparledningen till termisorn belägen 4 cm från kateterspetsen. <strong>Mätning av PCWP (</strong>pulmonary<strong> </strong>capillary<strong> </strong>wedge<strong> </strong>pressure<strong>) </strong>KOLLA UPP<strong> - Efter mätning, låt ballongen tömma sig spontant. </strong>Får ej lämnas uppblåst!<strong> - Diastole: Trycket distalt om kateterspetsen i uppblåst läge är ungefär detsamma i lungvenen, vänster förmak, och vänster kammares tryck. - Systole: Motsvarar fyllnadstryck i vänster förmak. - Generellt gäller att diastoliska pulmonalistrycket (PAPd) ganska väl överensstämmer med PCWPm utom vid förhöjd resistens i lungkretsloppet, s k pulmonell hypertension. Detta definieras som en skillnad i PAPd - PCPWm på > 5 mmHg. Wedge-tryck (pulmonary capillary wedge pressure mean (PCWPm): Referensvärde: 5-12 mmHg. Vid värden på 18-20 mmHg kan ses begynnande stassymtom och vid värden på > 30 mmHg ses fulminant lungödem. </strong>TRYCKKURVORNAS UTSEENDE<strong> </strong>- Höger förmak.<strong> Ser ut som CVP-kurva. Ref medeltryck 1-7 mmHg. </strong>- Höger kammare:<strong> Höga spetsiga utslag som visar höga systoliska och låga diastoliska tryck. Ref 15-25 / 0-8 mmHg. </strong>- <strong>Arteria</strong> <strong>pulmonalis</strong>: <strong>Samma systoliska tryck som i HK, men pulmonalisklaffen hindrar trycksänkning i diastole och diastoliska ref. blir därmed 8-15 mmHg </strong>- PCWP: <strong>Trycket faller till en nivå strax under PAPd ref 6-12 mmHg. - Vid tryckmätning ska pat. ligga i planläge. </strong>INLÄGGNING AV KATETER<strong> 1. Introducer in i v. jug. int dx i första hand, v. subclav sin i andra hand. 2. På med strumpa på katetern. 3. Kort trevägskran kopplas på gul (PA) & på blå (CVP), flusha. 4. Kontrollera ballongen så att den är tät med 1,5 ml luft. Kolla att ballongen tömmer sig och att kolven går tillbaka spont. 5. PA-kanalen koppas till tryckset. Systemet kopplas upp på monitorn och nollas. 6. PAC nedföres via introducern. När nått v. Cava sup och erhållit CVP-kurva, blåses ballongen upp. Om man vill backa katetern av någon anledning MÅSTE BALLONGEN VARA TÖMD. - OBS! Glöm inte att trä på strumpan på katetern innan du för in den! - Kladda helst inte på värmeelementen på katetern, den är känslig. - Katetern har en naturlig krökning som man riktar mot hjärtsidan när man för in den från halsen. Om man fipplar för länge med katetern i kroppen så blir den varm och mjuknar och det blir svårare att komma runt kröken. - Efter att ha erhållit en PA-kurva, matas katetern vidare till PCW-läge. Där släpper man luften ur ballongen och PA-kurvan ska då återkomma. - Ballongen blåses upp med luft. Den får aldrig kvarlämnas uppblåst. Blir då motsvarande en lungemboli och risk för lunginfarkt föreligger. Förvissa dig alltid om att ballongen är tömd om du ska backa katetern. Man rek. att inte aspirera ut luft ur ballongen utan den får spontantömmas, risk för slitage på ballongen annars. </strong>KONTRAINDIKATIONER<strong> - Klaffprotes i högerhjärtat. I övrigt inte så många absoluta kontraindikationer, finns men relativa utgörs av: tricuspidalins- och pulmonalisstenos, endokardit i högerhjärtat, tromb eller tumör i högerhjärtat, cyanotiska hjärtfel, LBBB eller bifascikulärt block (risk för AVbIII), inneliggande pacemakersladdar, genomgången pulmektomi, koagulopati, infektion vid insticksställe. </strong>FELSÖKNING<strong> - OM man blåser upp ballongen för mkt så täcker ballongen lumenet och man får ”over-wedge”. Trycket speglar förmodligen trycket i ballongen. </strong>ÖVRIGT** - Använd inte glukoslösningar i systemet. Det gynnar bakterietillväxt. - Katetern kan glida in i PCWP-läge och man kan behöva backa den. - PEEP har effekter på PCWP då trycket i alveolerna blir så högt att kapillärerna komprimeras. Enligt flera författare går det en gräns vid PEEP > 10 cm H2O. - Förr så spolade man kall NaCl i proximala lumen för att beräkna CO. Nu finns värmeelement proximalt och man kan med Vigilansmonitorn mäta CO kontinuerligt. Källa: Bla. PM KS PMI01423-1, 24-05-31.</p>", "category": "Praktiskt"}, {"title": "PEEP", "html": "<p>PEEP-titrering Det som utvärderas när man titrerar PEEP är saturation, koldioxideliminering och compliance. Vänsterkammaren: Hjälper hjärtat att kontraheras (= Minskat afterload). Men man minskar över VK compliance. <strong>Högerkammaren:</strong> Ökar pulmonell kärlresistens vilket leder till ett ökat motstånd för HK att arbeta emot (=ökat HK afterload). Effeken tilltar ffa vid PEEP över 15 cmH2O. <strong>Venöst återflöde</strong> minskar.</p>", "category": "Praktiskt"}, {"title": "PK(INR) - FÖRHÖJT - REVERSERING", "html": "<p><strong>Reverseing</strong> med plasma**</p>\n<p>- Cirka 20-30 ml/kg plasma behövs för att reversera PK, vilket är mycket.</p>", "category": "Praktiskt"}, {"title": "PONV (POstoperative Nausea and Vomiting)", "html": "<p><em>Källa: PM KS PMI00691-2, giltig från 2023-01-27.</em> Riskbedömning: <strong>Riskfaktor</strong> <strong>Poäng</strong> Kvinligt kön 1 Tidigare PONV / Lättutlöst åksjuka 1 Ickerökare 1 Ålder < 50 år (Ju ynge desto högre risk) 1 Postoperativa opioider och/eller op > 2h. 1-2 Särskilt ingrepp associerad med illamående alternativt farligt att kräkas. Ge utökad profylax (individuell bedömning <strong>Poäng</strong> <strong>Rekommenderad behandling</strong> 1 poäng – låg risk Betapred 2 poäng – medelhög risk Betapred + TIVA el. Betapred + Dridol/Ondansetron 3 poäng – hög risk Betapred + Dridol/Ondansetron + TIVA eller Betapred + Dridol + Ondansetron. ≥4 poäng, - mycket hög risk Betapred + Dridol + Ondansetron, samt helst TIVA särskilt vid >4 p. Överväg premedicinering med Postafen vid >4p. <strong>Bakgrund</strong> - PONV drabbar ca 20-30% efter generell anestesi. Hos högriskgrupper kan förekomsten var runt 80%. - Mest kända score för riskbedömning är Apfel score och Koivuranta score. Båda innehåller kvinnligt kön, tidigare PONV/åksjuka samt icke rökare. Scoren skiljer sig utifrån att Apfel har postoperativa opioider och Koivuranta operationslängd. I en metaanalys av Apfel sågs en tydlig korreleration mellan behov av postop opioider och längre (ofta större) operation, och ett begränsat prediktivt värde av att inkludera bägge som standard i scoringen. <strong>PROFYLAX - DOSERINGAR</strong> <strong>Betapred</strong> – rek dos 4 mg (4-8 mg) i.v. Ges tidigt före eller under anestesin. NNT 5. <strong>Dridol</strong> – rek dos 0,625 mg i.v. (0,625 – 1,25 mg). NNT 5. Ges i slutet av op för bäst effekt. Låga doser har låg risk för biverkningar. Risk för långt QT-syndrom förkommer vid högre doseringar. <strong>Ondansetron</strong> (5-HT3-rec-antagonist): Rek dos 4 mg iv (4-8 mg). NNT 6. Ges i slutet av op. Kontraindicerat vid långt QT syndrom eller i kombo med andra LM i doser som påverkar QT-tiden (men OK i kombo med Dridol i normaldos enl ovan). Ej till gravida i 1a trimestern. Se separata ant. <strong>Postafen</strong> (Antihistamin, H1-antagonist): <strong>Rek dos 25 mg. Kan ges som premedicinering vid uttalad risk för PONV. Har lätt sederande effekt. </strong>Propofolanestesi<strong>: </strong>Minskar risken för PONV jmf m. inhalationsanestesi. <strong>Smärta: </strong>Smärtlindring är viktigt då det kan förstärka illamående. <strong>PÅ POSTOP</strong> - Vid PONV rek. i 1a hand annat LM än det som redan givits. Ondansetron el. Dridol (upp till total dos 1,25 mg rek) kan upprepas efter 6 h från tidigare dosen (tidigare upprepning ger sämre tiläggseffekt). Ytterligare dos Betapred kan övervägas även POD1. - Försök spara på opioider om möjligt. - Clonidin har visat svag effekt mot illamående. - Primperan (Metoklopramid), har viss antiemetisk effekt, dock NNT 16 vid doser >20 mg! Se kontraindikationer separat. - Små doser propofol kan ges som rescue-behandling. Liten dos midazolam och också reducera illamående hos vissa, men påverkar återhämtning utifrån sederande effekt. - Extra syrgas har svar till ingen effekt. - Glöm inte överväga risk för komplikationer såsom mekaniskt hinder. <strong>Fundering (ej PM):  </strong>Centralt illamående behandlas bättre med Dridol, & Primperan bättre om mekaniskt?</p>", "category": "Praktiskt"}, {"title": "POSTOP UTSKRIVNINGSKRITERIER (EJ FÄRDIG)", "html": "<p>POSTOP - UTSKRIVNING</p>\n<p>Max 2 L O2.</p>\n<p>VAS ≤ 3.</p>\n<p>Ska ha adekvat urinproduktion.</p>\n<p>Om morfin i spinal: Postop övervak 12 h. Gyn 8 h om personal på Gynavd.</p>", "category": "Praktiskt"}, {"title": "PORFYRI", "html": "<p>Kontraindicerade läkemedel: Många! Pento är värst!</p>\n<p>Ska inte ha glukosbrist. Glukos 10% med elektrolyter (ca 125 ml/h). Nutrition viktigt.</p>", "category": "Praktiskt"}, {"title": "PUMPAR", "html": "<p>PERFUSOR OCH INFUSOMAT SPACE / SPRUTPUMP</p>", "category": "Praktiskt"}, {"title": "PUMPAR", "html": "<p>PERFUSOR OCH INFUSOMAT SPACE / SPRUTPUMP</p>", "category": "Praktiskt"}, {"title": "PUPILLOMETRI / PUPILLER / PUPILLMÄTNING / NPI", "html": "<p><strong>PUPILLMÄTNING</strong> - Utvärderar främst hjärnstammens funktion (ffa pupillstorlek och reaktivitet). Kan ex vara tecken på hjärnstamsherniering. - (Skada på självs occulumotoriusnerven [alltså ockulumotoriuspares] orsakar inte bara påverkad pupillreflex utan även ögonmotoriken [down and out]). - Egentligen pratar vi om pupill-ljus-reflexen. Det finns ju även en accomodationsreflex (är till för att inte få så mkt ljus i kanterna på linsen där ljuset bryts sämre när man ser på nära håll). - Kan användas för att påvisa akut sjukdom samt för prognosticering. <strong>NPI (NEUROLOGICAL PUPIL IN</strong>D<strong>EX)</strong> - Kan mätas med NeurOptics device. Bygger på en algoritm som inkluderar de variabler som denna device mäter (pupillstorlek, procent konstriktion, latens för konstriktion, konstriktionshastighet, dilatationshastiget). - Ett värde från 0 till 5. Noll = oreaktiv. NIP-värden < 3 anses generellt som onormala då det är utanför normal pupillreaktivitet. Ju lägre värde desto sämre. 5 anses dock vara mer normalt än 3. - Beräknas utifrån flera pupillvariabler: storlek, latens, konstriktions- och dilatationshastighet. <strong>MONITORERING PÅ NIVA</strong> - Ingår i den basala neuromonitoreringen. - Skulle kunna följas tätare/striktare om ex du har en pat. utan annan monitorering och risk för herniering finns. (Ex som hjärtklaffop. pat. som behöver heparin som man just hemikraniektomierat pga. postoperativ malign mediainfarkt). Eller medvetslös pat. med ny TBI som inte hunnit få sin tryckmätning ännu. ANOXISK HJÄRNSKADA EFTER HJÄRTSTOPP - Oddos dubbel-blindade multicenterstudie visarde att NPi values 2 or less at any time from 24 to 72h after cardiac arrest predicted poor neurological outcome at 3 months with a specificity and a positive predictive value of 100%. (450 pat). Färre studier finns för prediktion av icke anoxiska hjärnskador. Källa: <em>Romagnosi, <strong>Oddi</strong> et al. </em><em>Eyeing up the injured brain: automated pupillometry and optic nerve sheath diameter. Crit care 2020.</em></p>", "category": "Praktiskt"}, {"title": "PROCEDURSEDERING BARN", "html": "<p><strong>Brännskadeenheten Uppsalas procedursedering på barn</strong> upp till 4 <strong>åå</strong> vid omläggning av brännskada<strong>:</strong> Inklusionskriterier: - Friska barn. - >8 månader. - Fastande. Prepp: - Alvedon och Ipren innan. - Vid behov tillägg av Oxynorm-mixtur 0,05-0,1 mg/kg. - Föräldrar närvarande. Sedering: - Dexdor nasalt, 1-2 mikrog/kg. - Ketalar rektalt 6 mg/kg 20 minuter efter Dexdor. - Omläggning efter ytterligare 20 minuter. - Denna metod har varit använd i flera år och inga allvarliga händelser hade inträffat.</p>", "category": "Praktiskt"}, {"title": "PRX", "html": "<p>Trots att PRX visar ett optimalt värde så kan det vara så att man använder högre MAP, ex. vid vasospasm vid SAH. Då kanske man ville pressa över autoregulationen för att få perfusion.</p>", "category": "Praktiskt"}, {"title": "RALP - Robotassisterad prostatektomi", "html": "<p><strong>ANESTESI</strong> Mål-MAP: >80 och om hypertoni >85. (I övrigt så har man på bukoperation generellt har man sagt att alla pat. ska ha MAP på minst >65).</p>", "category": "Praktiskt"}, {"title": "REVERSERING AV MUSKELRELAXANTIA", "html": "<p>- Om TOF <70% så kan man reversera pat. - Om TOF 60 till 70% så kan man ge 1/2 dos Robinul/Neostigmin så att man inte får overshoot. (risk att man tröttar ut receptorn). - OM TOF 0 staplar 0%: Kan ej ge robinul/neo utan ge Bridion istället. - Sevo är något muskelrelaxerande. - Om TOF >70% så får man vänta. Dosera helst Robinul-Neostigmin utefter vikt och inte bara standarddos. 30-70 mikrog/kg? Kolla upp. <strong>Felkällor TOF</strong> Falskt låg TOF vid: Hypotermi. <strong>Kontraindikationer/observandum för </strong>Bridion<strong> (Enl. PM från VG-region </strong>SU9805-1593997-2914<strong>).</strong> - Risk för bradykardi. - Kan ge ökad blödningsbenägenhet. - Försiktighet vid kraftigt nedsatt leverfunktion. - Rekommenderas ej vid kraftigt nedsatt njurfunktion eller dialys.</p>", "category": "Praktiskt"}, {"title": "ROTEM / TEG", "html": "<h3>FÖRKORTNINGAR / FÖRKLARINGAR</h3>\n<p><strong>ROTEM</strong> = ROtational ThromboElastoMetry. <strong>TEG</strong>: ThromboElastoGraphy. Samma princip för båda.</p>\n<p><strong>EXTEM</strong> (Extrincic pathtway)</p>\n<p><strong>INTEM</strong> (Intrincic pathway)</p>\n<p><strong>FIBTEM:</strong> Modifiering av EXTEM. Tillägg av cytochalasin D som hämmar effekten av trombocyter. Mäter därmed endast fibrinogenets (Faktor I) komponent.</p>\n<p><strong>APTEM:</strong> Modifiering av EXTEM. Lägger till aprotinin vilket motsvarar effekt av att lägga till Tranexamsyra. Indikerar effekten om man hade lagt till Tranexamsyra.</p>\n<p><strong>HEPTEM:</strong> Modifiering av INTEM där man lägger till heparinas. Vid lång CT på INTEM och normal CT på HEPTEM så beror störningen på Heparin.</p>\n<p><strong>CT</strong> Clotting time: Anger tiden till 2 mm clot.</p>\n<p><strong>A10 </strong>(Amplitude): Amplitud efter 10 min. Är rätt bra predictor för hur kurvan kommer att se ut. Ska vara >40 vid INTEM/EXTEM.</p>\n<p><strong>ML</strong> (Maxiumum Lysis): Lyseringsgrad jmf med maxamplituden? vid 20 min?</p>\n<p><strong>FFP:</strong> Fresh Frozen Plasma.</p>\n<p><strong>PCC:</strong> Protrombin Complex Concentrate (FIX).</p>\n<p><strong>APTT:</strong> Aktivitet för FII, V, VIII, IX, X, XI, XII och fibrinogen. Förlängs av Fragmin, po FXh, Waran, Pradaxa.</p>\n<p><strong>PK:</strong> Mäter samlade aktiviteten av FII, FVII, FX. Vid trauma konsumeras ffa FVII.</p>\n<h3>TOLKNINGSSTRATEGI:</h3>\n<p><strong>1: </strong>ClotingTime**: Är EXTEM förlängd? (ref <80s) Är INTEM förlängd? (ref <240 s) Om förlängda så behöver pat. plasma. Om HEPTEM är normal / CT INTEM > CT HEPTEM: Problemet beror på Heparin. Ge Protamin.</p>\n<p><strong>2: A10:</strong> Är A10 EXTEM låg? (ref >40) Är A10 INTEM låg? (ref >40), Är A10 FIBTEM låg? (ref ≥9). Om EXTEM och INTEM är låg och FIBTEM är normal: Ge TPK. Om samtliga är låga: Ge Fibrinogen.</p>\n<p><strong>3: </strong>ML <strong>Maximal </strong>lysis** vid 25? min?:  Är ML EXTEM >15%, alltså snabb? (ref <15%)  Är ML APTEM normal?  Ge Tranexamsyra om EXTEM är snabb men APTEM är normal (vid APTEM har man provat lägga till TXA).</p>\n<h3>SVAGHETER</h3>\n<p>ROTEM® kan inte detektera vissa trombocythämmare, von Willenbrand-brist eller blödning pga hypotermi. För trombocythämning så får man köra Multiplate eller Plateletworks. Lågmolekylära hepariner går ej heller särskilt bra att mäta. SLE och RA kan orsaka falskt förlängd INTEM pga lupus antikoagulans.</p>\n<p>Källa: Alfresco ROTEM Tolkningsmall, mfl.</p>", "category": "Praktiskt"}, {"title": "SCOLIOS-KIRURGI – ANESTESI EJ KLAR", "html": "<p>Kolla upp PM från barn samt Lefis PM (som ännu inte är publicerat)-. - Vilken scoliostyp? – Kongenital, syndromrelateras, idiopatisk. - Komorbiditeter? Lungrestriktivitet? Förberedelser Cellsaver. På avd: Preopdryck, Targinic, Celebra, Paracetamol, Targiniq. Anestesi Antibiotikaprofylax: Ex Cloxa + Vanco. Betapred högdos (smärtdos). Intubation utan relax, då neurofys ska testa sin MEP/SEP-utrustning innan tvättning. Spiraltub, ”ECT”-bit-block, v-sond. Sätt in bitblocket långt in så att alla molarer är i kontakt med bitblocket. Tub och v-sond ska gå ovan bitblocket. Sedan kan man sätta ett vanligt bitblock ”cigarr” ytterst och tejpa ortopedtejpning. Se till att v-sond och tub inte kortsar, och att tungan inte är i kläm. Obs man ska inte ha endast vanligt bitblock ”cigarr” då man vid MEP biter kraftigt och belastningen hamnar på käkleden. Finns fall med frakturer och skador på leden. - CVK ej måte. Har tillgång till armarna. - Cyklokapron ordineras av kirurg. Inför kirurgen dissektion så ges Esmeron. Finns shema för det, men ca 25 mg vid normalviktig person. Minskar drag i muskulatur och förenklar arbetet. Morfin-spinal ges av kirurg: Ange hur mycket morfin special kirurgen ska spruta. Tumregel är 1 mikrog/kg/timme operationstid. Avlut: Ge ca 4 mg oxynorm iv. Ondansetron. Stäng av Propofolpumpen innan vändning, tar lång tid att vakna annars.</p>", "category": "Praktiskt"}, {"title": "SKLEROSERING #SCLEROSERING", "html": "<p><strong>NÅGRA PRAKTISKA SAKER</strong> - Vid sklerosering önskar man en inflammatorisk reaktion. Så i regel vill dom att man <strong>inte</strong> använder Betapred/kortisonpreparat. - Bleomycin används sällan kanske typ 1 av 50 gånger. Man använder det ex vid lymfatiska förändringar eller när man inte vill ha en så kraftig inflammatorisk reaktion ex sklerosering i munnen. Interventioninsten menar att det brukar kommuniceras någonstans i journalen om man planerar använda bleomycin. - OBS! BLeomycin kan orsaka hudförändringar om man skaver av epidermidis. Så man bör inte använda tejp alls, någonstans på kroppen då en del hud följer med. Likaså försiktighet med EKG-elektroderna. Sätt som ex i axiller. Man kan även informera pat. att den kan dra bort dessa efter några dagar för att vara på säkra sidan. /Källa ssk. - Ibland sövning beroende på lokalisation. Ibland nasal intubation om sclerosering ska ske längre in i munnen. <em>Version 2023-01-16</em></p>", "category": "Praktiskt"}, {"title": "SEDERING PÅ IVA", "html": "<p><strong>SEDERING </strong>&<strong> DOSERING</strong> Gällande morfinbehandling och midazolam-sedering: om man inte behövt ge en bolus på 4 timmar, så kan man många gånger prova att reducera infusionen med 25%, och om det sedan går ytterligare 4 timmar så kan man överväga att reducera dosen ytterligare osv, men däremot om man behöver ge enstaka bolusdoser så kanske man ligger rätt i infusionen, och om man ofta behöver ge bolusdoser så kan man överväga att öka infusionen i proportion till bolusdosbehovet. Tiden 4 timmar är nog rimlig för t.ex. morfin och midaz, men om det gäller propofol eller ultiva så gäller förstås kortare tider. Behovet av att titrera lägsta nödvändiga dos är ju allra viktigast när vi använder långverkande medel, så att vi inte accumulerar så mycket att patienten ligger kvar i resp extra tid (händer alltför ofta). Egentligen tror jag att vi håller våra patienter alltför sederade, med följd att de får mer noradrenalin, vätska och VAP kanske? /Andreas</p>\n<h3>ÖVERGÅNG FRÅN PROPOFOL TILL DEXDOR</h3>\n<p>1. Starta Dexdor på 0,7 mikrog/kg/min. 2. Halvera Propofolinfusionen efter 1 h. 3. Titrera upp Dexdor för önskad RASS-nivå (Effekten tar tid, invänta effekt under 1 h). 4. Stäng av Propofol. <em>Källa</em><em>:</em> Föreläsning på DS. Deras ordinarie rutin?</p>", "category": "Praktiskt"}, {"title": "SECTIO / SNITT / KEJSARSNITT", "html": "<p><strong>Källa:</strong> PM KS, PM SFAI version 2018-03</p>\n<p><strong>Fundera över indikationen</strong> – **Om indikationen är mamman (ovanligare) så fundera en vända till på vilken anestesi som är lämplig. Ex dyspné kan bero på hjärtsvikt eller lungemboli. Finns risk för cirkulatorisk kollaps vid en spinal (hände nyligen i landet).</p>\n<h3>VAKEN MAMMA: </h3>\n<p>Fastande pat. vid elektiva snitt: 6h fast föda, 2 h klara drycker.</p>\n<p>1 eller 2 infarter (vid förlorad infart perioperativt, överväg intraosseös nål).</p>\n<p>Kontrollera att aktuella LM finns på plats/i förberedelsrummet. Nitro, atropin mm.</p>\n<p>Innan spinal anlägg kontrollera att följande är klart: Fenylefrin, start-BT, fungerande infarter, kilkudde (hos alla som opereras från 2a trimestern!), operatörer på plats, checklistan klar. Direkt efter spinalen ges 50 µg fenylefrin.</p>\n<p>Om cavasymtom: Co-load vid spinalen med Ringeracetat.</p>\n<p>Vid hjärtfrekvens <50-60/min ges Robinul 0,2 mg iv (om allvarligt/akut ge artropin & efedrin).</p>\n<p>Vid terapisvikt av vätska och fenylefrin: Efedrin 5-10 mg iv vb.</p>\n<p>Nitroglycerin (1mg/ml) om svårt att få ut barnet: Spädes 1 ml med 9 ml NaCl. Bolus 0,1 - 0,2 mg = 100-200 mikrog.</p>\n<p>Om indikation navelsträngsprolaps; fråga om det är OK att mamman sitter vid spinalen. Kan följas med hjärljudsmätare på barnet. Oxytocin ges när barnet kommit ut. (I Swe ges 5 IE, andra länder 10 IE, ge ej för snabbt, finns dödsfall pga BT-fall med bolus på 10 IE). Så lite som 1IE kan kontrahera ett piggt uterus. 3+3+3 IE kan provas och utvärderas om hjärtsjuk mamma. Ge ej större doser än 9 IE tot, det hjälper ej.</p>\n<p><strong>Spinal-LM:</strong> 12,5 mg hyperbar bupivacain (2,5 ml av 5 mg/ml), 12,5 µg fentanyl (0,25 ml av 50 µg/ml), 0,1 mg morfin special (0,25 ml av 0,4 mg/ml). Vid blandning av Morfin special 2 mg/ml till 0,4 mg/ml: Ta 2 ml Morfin special 2 mg/ml, och lägg till 8 ml NaCl. Då får du 4 mg på en volym av 10 ml vilket blir 0,4 mg/ml. Dra därefter upp 0,25 ml vilket blir 0,1 mg. <strong>Om </strong>spinalen<strong> går ut:</strong> <strong>Kan fylla på med ny spinal. En guru på DS rek. då 10 mg plus Fentanyl).</strong> <strong>Ej PM.</strong></p>\n<p><strong>Om slut på </strong>Fentanyl<strong>: </strong>Istället för Fentanyl ges 3 µg Sufenta (0.6 ml av 5 µg/ml). <strong>ÖVRIGT:</strong> -Fundus innerveras av nerver från Th 6-nivå.</p>", "category": "Praktiskt"}, {"title": "SOVANDE MAMMA SECTIO / OMEDELBART SECTIO / URAKUT SECTIO", "html": "<p><strong>Induktion: </strong>RSI: <strong>Propofol</strong> + <strong>Celo</strong>. Nu ges ofta <strong>Rapifen</strong> oavsett <strong>preekelmpsi</strong> eller ej. <strong>ALLTID </strong>Rapifen<strong> vid PE.</strong> <strong>Efter induktion:</strong> - VKTS, AF 22, sedvanligt tidalvolym och PEEP. - 4-10 andetag: FGF 8 L/min, FiO2 max, Sevofluran 8%. - 8-20 andetag: FGF 4 L/min, N2O 50%, Sevofluran 4 %. - Gradvis justering till sedavnlig anestesi. När barnet är ute (troligen innan ovanstående är klart), N2O 70%, för att minimera Sevofluran och dess uterusrelaxerande effekt. - Töm ventrikeln med V-sond innan väckning, och sölj ut N2O under några minuter med FiO2 100%. - Obs! Gravida hyperventilerar naturligt, och ligger kring 4,3 till 4,5 i pCO2. - Smärtlindring 300 - 400 mikrog fentanyl efter avnavling. - Sedvanligt postoperativt morfin iv samt paracetamol, NSAID om ej atoni. - Ev upp-toppning av befintlig EDA eller TAP-blockad om kompetens finns. VARNINGAR - Omedelbart sectio vid eklampsi är kontraindicerat då mammans och barnet sannolikt är metabolt påverkade. - Vid preeklampsi behandlas hypertoni optimalt innan induktion, labetalol och Mg2+-bolus. Optimalt är spinal, samtliga kontraindikationer till ryggstick förutom patientvägran är relativa vid preeklampsi.</p>\n<table class=\"card-table\">\n<tr><td>Lustgas/O2</td><td>50/50</td></tr>\n<tr><td>Flöde</td><td>8 L/min lustgas + 8 L/min O2 = Maxflöden = 16 L/Min.</td></tr>\n<tr><td>Sevo</td><td>8%</td></tr>\n</table>\n<h3>Efter ca 4 andetag:</h3>\n<table class=\"card-table\">\n<tr><td>Flöde</td><td>4 L/min O2 + 4L/min Lustgas.</td></tr>\n<tr><td>Sevo</td><td>4%</td></tr>\n<tr><td>PEEP</td><td>4</td></tr>\n</table>\n<p>När barnet är ute:</p>\n<table class=\"card-table\">\n<tr><td>Sevo</td><td>0,5%</td><td>Överväg propofol istället om det blöder.</td></tr>\n<tr><td>N2O/O2</td><td>60/40</td></tr>\n</table>\n<p>Lågt sevo när barnet är ute för att inte relaxera uterus. Högt innan för relax.</p>\n<p>Gå sedan in på vanlig MAC. Ca 0,7. Ge ordentligt med fentanyl ca 300.</p>\n<p>Morfin inför väckning.</p>\n<p>Tänk på att habituellt CO2 hos gravida är efter v 12 = 4 kPa och man behöver inte sträva mot att pat. ska ha 5,3 i pCO2.</p>\n<p>Risk för svår luftväg är större hos gravida: Misslyckad intubation 1/200 jmf. m. 1/2000 hos ickegravida.</p>\n<p>De har minskad resudialkapacitet och desaturerar även snabbare.</p>\n<p>Svåra intubationsförhållanden kvarstår post partum, och mallampatiklass är som svårast 30 min. efter partus. Videolaryngoskop skall finnas i närheten av dessa pat.</p>\n<p>Vid misstänkt mkt. svåra förhållanden är fiberintubation indicerat.</p>", "category": "Praktiskt"}, {"title": "SECTIO SÖVA MAMMAN EJ OMEDELBART SNITT", "html": "<p>- Obs klassas som svår luftväg. Uppställning utefter detta. - Innan vi söver ska alla vara klara och incision ska kunna påbörjas direkt mamman är sövd och intuberad. Barnet blir ju sövt av Sevo;t så man får inte dra ut på tiden. - Alltid RSI: Propofol, Celocurin, Rapifen. (Inte fel med Esmeron heller, men ej rutinen). - Man bör i regel inte undvika Rapifen. Det brukar gå bra för barnet ändå. Källa: Avstämt med kollega på Obstetriksektionen.</p>", "category": "Praktiskt"}, {"title": "SECTIO – POSTOPERATIV OMVÅRDNAD (Källa: Pm KS)", "html": "<p><strong>Smärtlindring</strong>:**</p>\n<p>Om ingen EDA: Sårinfiltration med 20-40 ml Marcain 2.5 mg/ml utan adrenalin.</p>\n<p>Iv opiater, paracetamol. Morfin är ok, man kan amma ändå.</p>\n<p>TAPP-blockad, i vissa fall. Ex exter generell anestesi utan spinal/EDA.</p>\n<p>Toradol 15 mg iv om ej atoni. Kan upprepas en gång. Signera i TC. Därefter Diklofenac 50 mg x 3 om ej atoni. Signera i TC. NSAID är kontraindicerat vid hemostasrubbning samt ev. vid preeklampsi.</p>\n<p><strong>Utskrivning</strong>:**</p>\n<p>Kapillärt eller venöst Hb.</p>\n<p>Kolla BT. Om tecken på preeklampsi kontakta operatören.</p>\n<p>God uteruskontraktion och ingen vaginal blödning.</p>\n<p>Tradolan är även ett alternativ. Men det kan också vara uterusrelaxerande.</p>", "category": "Praktiskt"}, {"title": "SMÄRTPUMP / CADSOLIS / CAD SOLIS", "html": "<p>Koden till pumparna är 191. Om du justerar pumpordinationen under jouren, då ska man inte glömma att justera max volym per timme. Annars blir det ingen höjning.</p>", "category": "Praktiskt"}, {"title": "SPINALANESTESI", "html": "<p><strong>Kontraindikationer:  </strong>PK>1,4, APTT >40, TPK < 100, HYPOVOLEMI. Enl PM VG-region: Vid PK-INR mellan 1,5 och 1,8 får en individuell bedömning göras utifrån anamnes, indikationen och övriga koagulationsfaktorer. Vid PK-INR på 1,9 eller högre bör spinal- eller epiduralanestesi inte läggas.</p>\n<p>Även: Aorta-/mitralis-valvstenos, neurologisk sjd, sepsis, antikoagulation.</p>\n<p>Försiktighet vid betablockad. ??</p>\n<p>För LMval och dos, ta hänsyn till: Ålder, längd, duration, mkt fet (dosreducera)</p>\n<h3>Komplikationer</h3>\n<p>Om spinalen tar högt --> Bradykardi --> Ge atropin. Om BT sjunker: Ge efedrin alt. Fenylefrin om hjärsjuk pat. Risk för permanent nervskada av neuroaxional blockad: 4,2 per 100000. Risk för död eller paraplegi 1,8 per 100000. Här står epiduralbedövningar för majoriteten (PMID: 19139027). Risk för PDPH är ca 0,2 %. Transient neurological radiculopathy (TNR): there is complete recovery from the spinal block, followed by dysaesthesia in the back and buttocks, radiating to the thighs. Symptoms last up to 72 hours. It is unclear whether the pain is related to LA toxicity or if it is musculoskeletal or myofascial in origin.</p>\n<h3>UTBREDNING AV SPINAL OCH DESS EFFEKTER</h3>\n<p>Blockad ovan T4 (bröstvårtorna) kan orsaka bradykardi & minskat CO.</p>\n<p>Blockad vid T4 och ned brukar inte påverka andningen. Undantag är pat. Med liten respiratorisk reserv ev KOL, grav övervint där intercostalerna även är viktiga.</p>\n<p>Vid blockad upp till T5 minskas signaleringen till binjurarna och minskar därmed adrenerga responsen på smärta. Insulin och hypofyshormoner påverkas ej.</p>\n<p><strong>Ang. </strong>morfispinal<strong>: </strong>Folk brukar väcka med även morfin i.v typ 0,1/ kg eller ngt lägre. <strong>NAP3-data</strong></p>", "category": "Praktiskt"}, {"title": "SPINALANESTESI – REGIMER PÅ OLIKA SEKTIONER", "html": "<p>OBS SE NÄSTA SIDA FÖR SÖS PM GÄLLANDE OLIKA REGIMER <strong>KÄRL</strong> - Spinalerna med Marcain spinal 15 mg + Sufent 5 mikrog räcker ca 3-4 h tills man får starta upp edan. - Johan lägger ibland 18 mg Marcain spinal och då räcker den jättelänge. Spruta då mkt långsamt. <strong>GYN</strong> <strong>Sectio</strong> / snitt: Källa: PM KS.<strong> Snitt: Marcain tung 10 - 12,5 mg + Morfin spec. 0,1 mg + Fentanyl 12,5 mikrog. =Marc t. 12,5 mg </strong>2,5 ml<strong> + fent. 12.5 mikrog. </strong>0.25 ml<strong> + morfin sp. 0.1 mg </strong>0,25 m<strong>l</strong> <strong>Förlossningsskada/</strong>sfinkterruptur<strong>: </strong>Jag brukar köra på Marcain Spinal Tung 9 mg, funkar bra. <strong>Placentalösning:</strong> Marcain tung 10-12 mg + fentanyl. Måste ta högt! Revbensbåg. <strong>Postpartumblödning:</strong> Samma LM som placentalösn. 10 mg Marc. tung räcker. <strong>BUK</strong> <strong>Robot-hyst / RALH dagkirurgisk </strong>pat<strong>: </strong>Marcain Spinal 7,5 mg + Sufenta 5 mikrog. <em>(Anteckning 2025-01-01).</em> <strong>Robot-hyst / RALH: </strong>Hyst +- sentinel node och pelvina körtlar: Marcain Spinal 10-15 mg + Fentanyl 15 mikrog. Om det är pelvina och paraaortala körtlar: Marcain Spinal + Morfin Special 0,2 mg. <strong>Inläggning </strong>cerklage<strong>: </strong>Flera varianter. Ex Marcain tung 10 mg + 5 mikrog sufenta. <strong>Smärtlindring vid vaginal förlossning: (kolla upp)</strong> <strong>Marc. spinal 5 mg/ml: 2,5 mg (0,5 ml) + Sufenta 5 mikrog/ml: 5 mikrog (1 ml). </strong>Cystektomi<strong>: </strong>Marcain Spinal 10 mg + Morfin Special 0,2 mg . <strong>URO</strong> <strong>Blåsdilatation:</strong> Marcain Spinal Tung 8 mg + Sufenta 5 mikrog! <strong>TURB:</strong> Ex på äldre man: Mar. spin. tung 8 mg + Sufenta 5 mikrog. <strong>RALC: </strong>Marcain Spinal 12- 15 mg + Morfin special 0,2 mg. <strong>Prostatektomi</strong>: <strong>De ska ha spinal fast utan morfin. Så Marcain spinal + Fentanyl 15 mikrog. </strong>Brachy<strong>:</strong> Marcain spinal Tung 15 mg + Sufenta 5 mikrog + om kvinna eller lång behandling Catapressan 15 mikrog (0,1 ml). <strong>J-stent: </strong>Marcain Spinal Tung 7 mg + Sufenta 5 mikrog. <strong>Transuretral</strong> <strong>cystlitektomi</strong>:<strong> 8-10 mg Marcain spinal tung. + 5 mikrog sufenta. </strong>POSTOPERATIV VÅRD EFTER SPINALANESTESI** Tumregel är att pat. får mobiliseras en timme efter att kraften återkommit i benen (Källa: Halldin).</p>", "category": "Praktiskt"}, {"title": "STRUMA – STOR STRUMA - ANESTESI", "html": "<p>Samtal med anekollega på Head and Neck: Finns CT-undersökning? Var stiter struman? Påverkar vilken patologi man får. Sitter högt uppe på halsen eller långt nere? Oftast går det bra att intubera. Kolla de vanliga sakerna; nackrörlighet, gap osv. Gör Pembertons test. <strong>Tål pat. övertrycksventilation?</strong> Halvsitta. Följ artärblodtryck, höj PEEP successivt, upp till nivåer som krävs för att kunna övertrycksventilera pat. Typ 20 cmH2O. Håller sig blodtrycket?</p>", "category": "Praktiskt"}, {"title": "TAVI", "html": "<p><strong>Källa: </strong>PM Thorax, KS Giltig tom 2015. <strong>OBS DET FINNS ETT NYTT PM. KOLLA UPP.</strong></p>\n<h3>PREANESTESIBEDÖMNIGN / PREMEDICERING </h3>\n<p>- På Thoax KS bedöms endast pat. som skall sövas dagen innan. Övriga går man igenom journalen. Ingen premedicinering! - Alla blodtryckssänkande sätts ut inkl. betablockad.</p>\n<h3>ANESTESI</h3>\n<p>- Plavix, Trombyl, och Fragmin ordineras av operatör. - Antibiotikaprofylax inför op ordineras av operatör, antibiotika efter op ordineras av anestsiläk. Ges till alla pat: Inf. Ekvacillin (Cloxacillin) 2 g på angiolav ca 30 min före opstart. Därpå 2 postoperativa doser 4 resp. 8 h efter första dosen. Vid PC-allergi: Dalacin 600 mg iv, samt 2 postopdoser 6 resp. 12 h efter första dosen.</p>\n<p>- 2-3 perifera infarter. Artärnål. Deffplattor.</p>\n<p>- EKO-maskin med EKO-probe skall finnas påslagen inne på angiolabbet.</p>\n<p>- Ringer-Acetat. Noradrenalin kopplat.</p>\n<p>- De flesta sederas inte alls, eller mkt lätt. Förslag: Ultiva i lågdos 10 mikrog/ml; 1/3 av kroppsvikt i ml/h, ex. 90 kg = 30 ml/tim. Spädning: Remifentanil torrampull 2 mg späds i 200 ml NaCl.</p>\n<p>- Vid vissa subclaviaingrepp eller kontraindikation mot sedering ges intubationsnarkos.</p>\n<p>- Mål-BT: MAP >70, SAP >120.</p>\n<p>- Samtliga pat. får temporär transvenös pacemaker av PCI-operatör. Ibland görs rapid-pace med VVI 180 under ballongvidgning av ny klaff. Under tiden komprimeras carotiderna för att minska risk för stroke.</p>\n<h3>POSTOP</h3>\n<p>Minst 2 h postop vård med invasiv blodtryckmätning.</p>\n<p>Ordinationer i Birger och TC.</p>\n<p>Pacemaker ställs in på VVI 40, output 8 V, sense 2 mV som rutin (pga risk för AV-block).</p>\n<p>Telemetri på vårdavdelningen.</p>\n<h3>KOMPLIKATIONER</h3>\n<p>- Access/kärl: Blödning, aortadissektion/perforation, transapikal ruptur, perforation kammarvägg. - Klaffrelaterat: Anulusruptur, AI, Felplacerad klaff, mitralispåverkan. - Stroke. AMI. AKI. - Arytmier: Höggradigt AV-block med pacemakerbehov (3-10%).</p>", "category": "Praktiskt"}, {"title": "TEA carotis – Anestesi", "html": "<p>Läs PM i K-boken. Övriga noteringar: - Ist. för Nitroglycerininfusion som är segt och riskerar overshoot så använd intermittenta injektioner: Späd på samma sätt som prematura snitt. Alltså Nitroglycerin 1 mg/ml, 1 ml + 9 ml NaCL till en konc på 100 mikrog/ml. Spruta först 0,5 ml och se hur pat. reagerar. Sedan kan man fortsätta med 0,5 till 1 ml. Det räcker oftast med ett par doser. Blodtryckmål, kirurgen: - Kirugen brukar ange: Opstart och innan avstängning: MAP <90. (Så MAP 70-90 är rimligt.). Avstängning: MAP >90 men SAP <180. Påsläpp: MAP <90, SAP <150. Reversering Heparin: Vid behov av reversring brukar de vilja ha Protamin 10-20 mg (alltså 1-2 ml Protaminsulfat).</p>", "category": "Praktiskt"}, {"title": "THIVA - UTSKRIVNING", "html": "<p><strong>Ordniationer</strong> i TC*
