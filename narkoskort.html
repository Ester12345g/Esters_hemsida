d: ≥13. OBS: Hos barn 0-15 år används Pediatric PSH scoring reference. </strong>DIAGNOSIS LIKELIHOOD TOOL<strong> (DLT)</strong> 1. Kliniska symtom förekommer samtidigt. 2. Episoderna är paroxysmala. 3. Sympatisk hyperaktivering vid normalt icke-smärtsamt stimulus. 4. Symtom kvarstår ≥ 3 på varandra följande dagar. 5. Symtom kvarstår ≥ 2 veckor efter skada. 6. Symtom kvarstår trots behandling av alternativa differentialdiagnoser. 7. Symtom ≥ 2 episoder dagligen. 8. Behandling insatt för att minska sympaticus-symtom. 9. Avsaknad av parasympatiska kännetecken under episoder. 10. Avsaknad av andra möjliga orsaker till symtombild. 11. Tidigare förvärvad hjärnskada. Poäng: Varje punkt ger 1 poäng och avsaknad ger 0 poäng. Totalpoäng mellan 0 – 11. <strong>Sannolikhet f</strong>ör<strong> diagnos</strong>: <strong>PSH-AM</strong>  = Summa CFS + summa DLT** Osannolik <8 poäng Möjlig 8-16 poäng Trolig ≥17 poäng</p>", "category": "Sjukdomstillstånd"}, {"title": "POSTDURALPUNKTIONSHUVUDVÄRK / HUVUDVÄRK EFTER DURAPUNKA", "html": "<p><strong>Senast redigerad: </strong>2017-12-28. <strong>Källa:</strong> SFAI PM version 2017-03-01</p>\n<p><strong>Definition: </strong>Lägesberoende huvudvärk, inom 5 dygn efter durapunktion, samt går över spontant inom 1v eller inom 48h efter blood-patch. Förenad med nackstelhet, tinnitus, hörselnedsättning, ljuskänlighet och illamående.</p>\n<p><strong>Komplikationer: </strong>Risk för subduralhematom & kranialnervspåverkan pga. drag i strukturer pga intrakraniell hypovolemi.</p>\n<p><strong>Riskfaktorer: </strong>Grov nål, låg ålder, kvinna.</p>\n<p><strong>Risk: </strong>Risk vid<strong> </strong>27 G pencil point spinalnål ca 0 -2 %. Risk efter accidentell punktion med en 16 – 18 G epiduralnål är 45 – 80 %. Incidens av accidentell durapunktion vid förlossningsepiduralanestesi vid är ca 1 %.</p>\n<p><strong>Symtom: </strong>Svår lägesberoende huvudvärk, oftast frontalt, kan sitta i nacken. Förvärras vid upprät position. Debuterar i 90% av fallen inom 3 dygn. Illamående, yrsel, öronsus, hörselpåverkan och ljuskänslighet är relativt vanligt.</p>\n<p><strong>Diffdiagnoser: </strong>Hjärnblödning/tumör, cerebral ventrombos, migrän, infektiös meningit, spänningshuvudvärk, preeklampsi, anemi, Sheehans syndrom, Posterior reversible encephalopathy syndrome.</p>\n<p><strong>Prognos: </strong>Går i de flesta fall över spontant inom 1 v. Kroniska besvär förekommer. Komplikationer i form av kranialnervspåverkan och subduralhematom kan uppstå. I en fallserie var incidensen subduralhematom 0,026 % i osorterad obstetrisk epiduralbedövad population och 1.1% (1 på 87) i gruppen där man konstaterat durapunktion i samband med anläggandet av ryggbedövning</p>\n<h3>BEHANDLING </h3>\n<p>Professionellt stöd, noggrann förklaring, samt uppföljning är vikitgt. Liggande ställning har ej påvisats påverka durationen. Att undvika dehydrering, ge analgetika, triptaner, antiemetika och akupunktur kan lindra symptomen, men ger sällan full besvärsfrihet. Kan provas om blood-patch är kontraindicerat.</p>\n<h3>Blood patch är effektivt:</h3>\n<p>Teoretiskt åstadkoms en momentan volyms- och tryckökning i spinalkanalen  minskat drag i intrakraniella strukturer  snabb lindring. Blodet sprids sedan i epiduralrummet, en clot bildas och tätar hålet. Indicerat vid Invalidiserande, klassisk, lägesbetingad huvudvärk efter genomgången ryggbedövning, där andra differentialdiagnoser är beaktade men uteslutna. Utredning: BT, temp, Hb, LPK och CRP. Kontraindikationer: Sedvanliga för ryggbedövning: koagulationsrubbning, behandling med antikoagulantia, sepsis, infektion vid insticksplats, patientvägran.</p>\n<p><strong>Procedur: </strong>Steril teknik. Lokalisera epiduralrummet med sedvanlig epiduralnål och teknik, gärna ett interstitium kaudalt om tidigare punktion. Assistent utför därefter steril venpunktion och aspirerar minst 20 ml autologt blod från pat. Blodspruta överräcks direkt till narkosläkaren för omedelbar långsam injektion av blod (upp tom 20 ml) in i epiduralrummet. Avbryt injektionen vid ryggsmärta. Sätt förband över insticksstället. Sängläge 1-2 timmar och därefter försiktig mobilisering. Besvärsfrihet från huvudvärk uppnås hos >70 % av PDPH-patienter som behandlas med blood-patch. Om huvudvärk återkommer med typiska symptom, kan blood-patch behandlingen behöva upprepas. Då diagnosen PDPH i första hand är klinisk måste differentialdiagnoser beaktas på vida indikationer. Vid atypiska, kvarstående eller återkommande besvär, förändrad typ av huvudvärk och/eller tillkomst av andra neurologiska besvär, måste utvidgad utredning ske med t.ex. CT/MR.</p>\n<p>Risker/komplikationer vid blood patch: Risk föreligger för ytterligare durapunktion i samband med lokalisering av epiduralrummet. Lättare ryggvärk upp till 5 dagar förekommer. Infektion i spinalkanalen. Om blodet accidentellt injiceras subduralt/ intraduralt kan det orsaka allvarliga komplikationer i form av arachnoidit, cauda equina syndrom och permanenta nervskador.</p>", "category": "Sjukdomstillstånd"}, {"title": "STROKE (ISCHEMISK) - ENDOVASKULÄR BEHANDLING / TROMBEKTOMI", "html": "<p><strong>Patienter som kan vara akutella för endovaskulär behandling</strong> - DT angio - verifierad storkärlsocklusion (ICA-T, M1, M2, Basilaris, ev. A1/P1) - Patienter som inte svarar på enbart trombolys. - Patienter som vaknar med strokesymtom, med oklar insjuknandetid. - Patienter som står på antikoagulantia. - Patienter som uppfyller exklusionskriterier för trombolys. - LVAD –patient. Kontakta THIVA-jour/VAD-koordinatior för samråd i åtgärder. <strong>Kontraindikationer för i.v. </strong>trombolys<strong>behandling</strong> - Intrakraniell blödning; ICH, SAH. - Tidiga tecken på stor hjärninfarkt, mer 1/3 av a. cerebri media försörjt område. - Blodtryck >185/110 eller behov av aggressiv intravenös behandling för att reducera blodtrycket till dessa värden. - Pågående antikoagulantiabehandling. Vid behandling med iv. Heparin eller sc. LMWH i fulldos, om administrerat inom senaste 24 timmarna. Vid behandling med Warfarin om INR > 1,7. - Malign hjärntumör /metastas. - Tidigare spontan intracerebral blödning. - Klar misstanke om septisk embolisering/endokardit. - Pågående allvarlig eller riskabel spontan eller traumatisk blödning (extra eller intrakraniell). - Fullständig lista v.g. se ”Strokeriktlinjer 2019”. <strong>Preop kontroller</strong> - BT, b-glukos (mål b-glukos 4-10, ge ej vätskor med glukos), PK (om antikoagulantiabehandling), luftväg, neurologstatus, pupiller. Eftersträva normotemp. <strong>Förberedelser</strong> - Mistral värmetäcke under pat. - Kanmed värmmadrass 39 grader. - Varm Ringer-Acetat med förläning. - PVK vä arm och fot. - O2-grimma. - Temp-KAD m. timdiures. - NIBP, EKG, Saturation, artärkateter vid sövning eller hjärtsjukdom (får inte fördröja opstart). - Förberedelser för omedelbar protaminbehandling vid blödningskomplikation under trombektomi. Då kan även BT-justering krävas samt intubation.</p>\n<h3>ANESTESI</h3>\n<p>- Lätt sedering eller generell anestesi vid: Illamående/kräkning, ej medgörlig patient (ex basilaristrombos). <strong>Blodtryckskontroll</strong> - Mål SAP 140-185 (MAP >85 enl annan källa), men initialt kan högre BT accepteras. Best outcome har man vid SAP 140-150 är det sagt i review från AHA (Om trombolys har man ev. lägre mål) - Fråga alltid interventionist innan du ger BT-sänkande läkemedel under endovask behandling. - Trandate och/eller Nepresol i samråd med interventionist. (Kontraindikaationer för Trandate är bronkialastma, KOL, obehandlad hjärtsvikt, kardiogen chock, AVb II-III, SSS, Prinzmetals angina). - Noradrenalin-infusion om SAP <140 mmHg. - Efedrin/Fenylefrin intermittent. - Efter lyckad behandling, diskutera BT-mål med interventionist. Ev sänkta mål då för hgt BT kan orsaka blödning. <strong>Lätt sedering</strong> - Fentanyl 25-50 mikrog i.v. - Ondansetron 8 mg i.v. - Undvik helst Propofol. <strong>Generell anestesi</strong> - <strong>S</strong>Ö<strong>VNINGSRUTIN STROKE</strong> - Induktion: Ketamin, Propofol, Esmeron: Alla läkemedel med 1 mg/kg i.v. Om Ketamin är restat: Ketanest 0,5 mg/kg. - Därpå Sevo MAC 0,7 och ställ i ordning pumpar efter sövning med Remifentanil, Noradrenalin. - Innan sövning sätt artär. - Bäst outcome om pat. kan vara vaken. Men sövs om inte kan ligga stilla eller ej håller fri luftväg (vanligast hos de med påverkan på bakre cirkulationen). <strong>Carotisstent</strong> - Görs i lokalanestesi. - Artärkateter. - Glykopyrron (Robinul) 0,2 mg iv. - Atropin redo.</p>\n<h3>POSTOPERATIVT OMHÄNDERTAGANDE</h3>\n<p>- Sängläge med högst 30 grader höjd huvudända ca 12 h efter trombektomi och 8 h efter stent el. enl. ordination. - Pat. får inte böja i höftleden pga. artärpunktion under 4 h. - Vaken pat. till Neuro 1 (B10:11), tfn 76110 (strokeledningssjuksköterska). - Om NIVA-behov, kontakta NIVA-läk i god tid. Jourtid: 71494, dagtid 79191.</p>\n<p><strong>KÄLLA:</strong> PM PMI: Neuroanestesiologiska rutiner vid endovaskulär behandling vid stroke. Giltig tom 22-07-09.</p>\n<h3>SYSTEMISK SKLEROS / SKLERODERMI – ANESTESI</h3>\n<p><em>Version 2024-06-23<strong> – Ej färdigställd.</em> </strong>Sjukdomspanorama<strong> - Är en autoimmun sjukdom som karatäriseras av småkärls-vaskulopati, onormal kollagendeposition med fibros, och auto-antikropps-medierad immundysfunktion i kroppens ytskikt ”the integumentary system”. - Fibros kan förekomma i vicerala organ såsom lungor, hjärta, njurar, GI-kanalen. - Patienterna har en påtaligt ökad morbiditet och mortalitet per se. - Svårihetsgrad kan variera mkt beroende på subtyp. - Lungfibros, förekommer hos en majoritet av patienterna. Vid längre sjukdomsduration är pulmonell arteriell hypertension en vanligare orsak. </strong>Förberedelser / Preanestesibedömning<strong> - Noggrann anamnes kring fysisk funktion/förmåga. - EKG. - Noggrann luftvägsbedömning. - Anamnes kring GI-kanal, dysmotilitet? Reflux? - Leta efter gamla EKOn och spirometrier. </strong>ANESTESIOLOGISKA BETÄNKLIGHETER** Luftvägen: - Kan vara en utmaning. - Risk för liten mun samt risk för minskad gapförmåga pga fibros i temporomandibularleden. - Risk för minskad extensionsförmåga i nacken pga fibros. - Finns tydligen rapporter på att minskad extensionsförmåga i nacken är en indikator för svår maskventilation och behov av behov av ”fuberoptic bronchoscopy assisten intubation”. - GERD förekommer hos 90% av patienterna. GI-dysmotilitetssjukdomar är vanligt. Således möjligen ökad aspirationsrisk. - Kardiomyopati och retledningssjukdomar förekommer. - Interstitiell lungsjudom och PAH förekommer. - Autonom dysfunktion förekommer. Övrigt: - Esofagusstrikturer vanligare. V-sond kan vara svårare att sätta. Undvik TEE pga risk för perforation. - Trombosprofylax är viktigt på dessa pat. - Finns även ökad risk för postoperativ hjärinfarkt. Källor: PMID 32904358.</p>", "category": "Sjukdomstillstånd"}, {"title": "FÖRGIFTNINGAR", "html": "<h3>SALICYLATFÖRGIFTNING</h3>\n<p>Ring giftis.</p>\n<p>Pat. ska dialyseras. Natriumbikarbonat för att få ut salicylaterna från CNS.</p>\n<p>Obs kan dö om du söver. För du kommer inte att kunna matcha den enorma vinutvolym som pat. andas själv för att motverka acidosen.</p>", "category": "Sjukdomstillstånd"}, {"title": "Läkemedel MALL", "html": "<p><strong>INDIKATIONER:</strong>  <strong>KONTRAINDIKATIONER:</strong> <strong>BIVERKAN:</strong> <strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong>  <strong>DOSERING:</strong> <strong>FÖRENKLAD DOSERING:</strong> <strong>MAX INFUSIONSHASTIGHET:</strong> <strong>TILLSLAGSHASTIGHET:</strong> <strong>DURATION:</strong> <strong>BLANDBARHET:</strong> <strong>VERKNINGSMEKANISM:</strong> <strong>METABOLISM:</strong> <strong>INTERAKTIONER:</strong> <strong>GRAVIDITET:</strong> <strong>AMNING:</strong> <strong>KAN GES PERFIERT</strong> JA/NEJ<strong>: </strong> <strong>ÖVRIGT:</strong> <strong>DIALYSERAS BORT </strong>JA/NEJ<strong>: </strong> <strong>KÄLLA:</strong></p>", "category": "Läkemedel"}, {"title": "ADRENALIN", "html": "<p><strong>Indikationer:</strong> **</p>\n<p><strong>Kontraindikationer:</strong> **Svår hjärt-kärlsjukdom, okontrollerad hypothyreos, obehandlad hypokalemi.</p>\n<p><strong>Biverkan:</strong> **Arytmi, oklart hur stort problem.</p>\n<p><strong>Förpackning:</strong> Adrenalin 1:10,000 = 0,01% = 0,1 mg/ml.</p>\n<h3>Tillredning:</h3>\n<p><strong>Dosering:</strong> <strong> Rescue om grav hypotension ex på op: Dra upp 1:10 000 och ge 0,25 ml (0,025 mg) till 0,5 ml (0,05 mg) i taget. Blanda ut om du vill. </strong>Dubbelspädd adrenalin:<strong> Dra upp 1 ml av 1:10 000 tillsammans med 9 ml NaCl. För att få en vettig dos vid ex grav hypotension ge i alla fall </strong>2,5 ml <strong>= 0,025 mg. Vid hjärtstopp: 1 mg bolus i.v. </strong>Infusion:<strong> Lämplig spädning 50 mikrog/ml. Dosering: 0,05-0,1-(0,30) μg/kg/min (narkosguiden). Dosaktivitet: <0,05 μg/kg/min – oftast måttlig effekt på blodtrycket, 0,05-0,1 μg/kg/min β1-effekt, ökad hjärtminutvolym, >0,1 μg/kg/min – α1-effekt. Inhalation: Späd 1 ml adrenalin 1 mg/ml med 1 ml NaCl. Övervaka hjärtfrekvens. </strong>Inhalation: <strong>Utspädda Adrenalin 0,1 mg/ml: 1-2 ml i nebusilator (enl Kollega Dubbelkolla) </strong>Intramuskulärt<strong> – Ex vid anafylaxi</strong> Adrenalin 1 mg/ml: 0,3-0,5 mg intramuskulärt (i lårets utsida). Vid behov kan injektionen upprepas med intervaller om 5-10 minuter tills lättnad erhålls.</p>\n<h3>Duration:</h3>\n<p><strong>Verkningsmekanism:</strong> Vasokonstriktion, ökad hjärtminutvolym, bronkodilatation, pupilldilatation, metabola effekter. Uttalad beta 1+2 effekt i låga doser som övergår i en alfa-medierad kärlkonstruktiv effekt i högre doser.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning: </h3>\n<p><strong>Övrigt:</strong> Låg dos under 30 nanogram/kg/min är främst beta-receptorstimulerande och högre doser över 150 nanogram/kg/min är har en övervägande alfastimulering. - Adrenalin är fantastisk rescue-drog men driver laktat. Det kan därmed vara svårt att veta om ökat laktat beror på om pat är sämre eller om det beror på adrenalinet. Gå så snabbt du kan över till inotropt LM + vasokonstriktor (Källa: Specialistkollega).</p>\n<p><strong>Källa: </strong>PM KS. Samt PM VG-region, vasoaktiva LM inom anestesi & intensivvård.</p>", "category": "Läkemedel"}, {"title": "ALBUMIN", "html": "<h3>Indikationer:</h3>\n<h3>Kontraindikationer:</h3>\n<h3>Biverkan:</h3>\n<p><strong>Förpackning:</strong> \"Stark albimun\":100 ml (200 mg/ml) = 20 g. \"Svag albumin\": 250 ml (50 mg/ml) = 25 g</p>\n<h3>Tillredning:</h3>\n<h3>Dosering:</h3>\n<h3>Duration:</h3>\n<p><strong>Verkningsmekanism:</strong> Den kolloidosmotiska effekten av humant albumin 200 g/l är ungefär fyra gånger större än den av blodplasma (=hyperonkotisk). Onkotiskt tryck =kolloidosmotiskt tryck, den del av det osmotiska trycket som uppkommer via makromolekyler, främst proteiner som har till uppgift att transportera vätska in i blodcirkulationssystemet.</p>\n<h3>Interaktioner: </h3>\n<h3>Graviditet/amning:</h3>\n<p><strong>Övrigt:</strong> Normalt är den totala utbytbara albuminpoolen 4-5 g/kg kroppsvikt, varav 40-45 % finns intravaskulärt och 55-60 % i det extravaskulära rummet. Man bolar inte in stark albumin på nyfödda hur som helst. Barn har så sköra kärl att man kan få hjärnblödning av en kraftig bolus.</p>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "ANTIKOAGULANTIA OCH RYGGBEDÖVNING", "html": "<p><strong>OBS! </strong>Pat. m. sänkt njurfunktion kan behöva längre tider samt kombinationer av AKI ökar blödningsrisken.</p>\n<table class=\"card-table\">\n<tr><th><strong>Antikoagulantium</strong></th><th><strong>Farmaka </strong>  Bedövning/manipulation**</th><th><strong>Bedövning/manipulation </strong> <strong>farmaka</strong></th></tr>\n</table>\n<h3>Fragmin / Klexane</h3>\n<table class=\"card-table\">\n<tr><td>≤2500E x 1 / 20 mg x2</td><td>0 om stark indikation.</td><td>1 h.</td></tr>\n<tr><td>≤5000E / ≤ 40 mg/dag</td><td>10 h (norm njurf.)</td><td>6 rek. (2-4h vanligt)</td></tr>\n<tr><td>2500E x 2</td><td>6 h. Se PM SFAI Obstetrisk ane</td><td></td></tr>\n<tr><td>>5000E / > 40 mg/dag</td><td>24 h</td><td>6 rek. (2-4h vanligt)</td></tr>\n</table>\n<p><strong>Ofraktionerat heparin.</strong> Om ≥5 dgr beh. kontroll TPK pga HIT-II-risk.</p>\n<table class=\"card-table\">\n<tr><td>≤5000E (70E/kg)/dag</td><td>4 h Norm APTT & norm TPK.</td><td>1 h.</td></tr>\n<tr><td>≥5000E (70E/kg)/dag</td><td>Som ovan</td><td>6 h. Ibland 1-2 h.</td></tr>\n<tr><td>≥100E/kg/dag</td><td>Som ovan</td><td>6 h. EDA dagen innan…</td></tr>\n</table>\n<h3>Fondaparinux (Arixtra®)</h3>\n<table class=\"card-table\">\n<tr><td>≤ 2,5 mg/dag (Xa+at)</td><td>36 h</td><td>6 h</td></tr>\n<tr><td><strong>Rivaroxaban (Xarelto®)</strong></td><td>18 h</td><td>6 h</td></tr>\n<tr><td><strong>Waran</strong></td><td>1-4 dgr. INR ≤ 1,4 - 2,2.</td><td>Återinsätt efter borrtagande kat.</td></tr>\n<tr><td><strong>ASA 75 mg</strong> (sekundärprevention)**</td><td>12 h</td><td>Återuppta efter kirurgi.</td></tr>\n<tr><td><strong>ASA Primärprevention</strong></td><td>3 dygn</td><td>Återuppta efter kirurgi.</td></tr>\n<tr><td><strong>ASA analgetiska doser (</strong>><strong>1 g/dygn)</strong></td><td>7 dygn</td><td>Återuppta efter kirugi.</td></tr>\n<tr><td><strong>Dipyridamol (Persantin®)</strong></td><td>Inga begränsningar.</td><td>Inga begränsningar.</td></tr>\n<tr><td><strong>Clopidogrel (Plavix®), (Iscover®)</strong></td><td>5 dgr</td><td>Efter borttagande av kateter.</td></tr>\n<tr><td><strong>Ticlopidin (Ticlide®)</strong></td><td>5 dgr</td><td>Efter borttagande av kateter.</td></tr>\n<tr><td><strong>Pracurgrel (Efient®)</strong></td><td>Sannolikt 5 dagar. Data saknas.</td><td>Efter borttagande av kateter.</td></tr>\n<tr><td><strong>Ibuprofen, diklofenak</strong>, (Voltaren®)**</td><td>12 h</td><td>*</td></tr>\n<tr><td><strong>Indometacin, ketorolak</strong></td><td>24 h</td><td>*</td></tr>\n<tr><td><strong>Naproxen</strong></td><td>48 h</td><td>*</td></tr>\n<tr><td><strong>Lornoxikam</strong></td><td>24 h</td><td>*</td></tr>\n<tr><td><strong>Piroxikam, Tenoxikam</strong></td><td>2 veckor.</td><td>*</td></tr>\n</table>\n<p>*Ickeselektiva NSAID prep. bör undvikas när manipulation av katetern planeras, samt hos äldre pat. med epiduralkateter och samtidig behandling med ex LMWH. Diklofenak, Ibuprofen, ketorolak och naproxen är ickeselektiva? Välj istället cox-2-hämmare. ”Cox-2-inhibitorer: Ingen effekt på trombocytaggregationen” – Alfresco ID 29125.</p>\n<p><strong>Källa ovan:</strong> SFAI 2014. Evidensgrad D på samtliga rekommendationer (=expert opinion). <strong>Källa </strong>till <strong>nedan</strong> PM VG-region (ID 29125):</p>\n<table class=\"card-table\">\n<tr><th><strong>Apixaban (</strong>Eliquis<strong>)</strong></th><th>2 dygn (eGFR ≥50) 3 dygn (eGFR 30-50) 3 dygn (eGFR ≤ 30)</th><th>6 h</th></tr>\n<tr><td><strong>Rivaroxaban (Xarelto)</strong></td><td>2 dygn (eGFR ≥50) 3 dygn (eGFR 30-50) 4 dygn (eGFR <30)</td><td>6 h</td></tr>\n<tr><td><strong>Dabigatranetexilate (Pradaxa)</strong></td><td>2 dygn (eGFR ≥50) 4 dygn (eGFR 30-50) 5 dygn (eGFR ≤30)</td><td>6 h</td></tr>\n</table>", "category": "Läkemedel"}, {"title": "ANTIKOAGULANTIA LÄKEMEDEL", "html": "<table class=\"card-table\">\n<tr><td></td><td>COX-hämmare</td><td>Acetylsalisylsyra</td></tr>\n</table>\n<p>Ticlopidine</p>\n<p>Clopidogrel</p>\n<table class=\"card-table\">\n<tr><td></td><td>ADP-receptorhämmare</td><td>Prasugrel</td></tr>\n<tr><td><strong>TROMBOCYTHÄMMARE</strong></td><td></td><td>Ticagrelor</td></tr>\n</table>\n<p>Cangrelor</p>\n<table class=\"card-table\">\n<tr><td></td><td>Phpsfodiesterashämmare</td><td>Dipyramole</td></tr>\n</table>\n<p>Abciximab</p>\n<table class=\"card-table\">\n<tr><td></td><td>GPIIb/IIIa -hämmare</td><td>Triofiban</td></tr>\n</table>\n<p>Eptifibatide</p>\n<p>Av de nya perorala antikoagulantia är en trombinhämmare, dabigatran (Pradaxa) samt tre faktor Xa-hämmare - rivaroxaban (Xarelto), apixaban (Eliquis) och edoxaban (Lixiana). Dabigatran utmärker sig genom att ha lägre biotillgänglighet och högre andel renal utsöndring.</p>\n<p>OBS! Läs mer på https://www.internetmedicin.se/page.aspx?id=4356</p>", "category": "Läkemedel"}, {"title": "ATENATIV® / Antitrombin III humant EJ KLAR", "html": "<p><strong>Indikationer:</strong> - Förvärvad antitrombinbrist som vid heparinresistens associerad med låga antitrombin-nivåer ex efter hjärtlungmaskin. - Patienter med ärftlig Antitrombinbrist som behöver trombosprofylax. Koagulation brukar inte substituera med Atenativ vid en förvärvad ATIII-brist förrän den är under 0,4. De tänker att man ju sannolikt har brist på både pro- och anti-koagulerande faktorer. Thorax substituerar tidigare, nämligen vid värden <0,8.</p>\n<p><strong>Kontraindikationer:</strong> Överkänslighet mot substansen.</p>\n<h3>Biverkan:</h3>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> Flaskor om 500, 1000, 1500 IE. Pulver blandas med sterilt vatten till 50 IE/ml.</p>\n<p><strong>Dosering:</strong> På thorax brukar man ge antingen 500 IE eller 1000 IE beroende på hur stor brist. Man brukar inte räkna och hålla på. Formel enligt FASS: IE  = kroppsvikt (kg) x (önskad nivå – uppmätt antitrombinaktivitet [%]) x 1. Vanlig startdos vid medfödd brist är 30-50 IE/kg kroppsvikt.</p>\n<h3>Förenklad dosering:</h3>\n<p><strong>Max infusionshastighet:</strong> **Infusionshastigheten hos vuxna bör inte överskrida 300 IE per minut.</p>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Blandbarhet:</strong> Får ej blandas med andra LM.</p>\n<p><strong>Verkningsmekanism:</strong> Antitrombin III. Fysiologiskt antikoagulans. Heparin binder till Antitrombin III som blir ett aktiverat komplex.</p>\n<h3>Metabolism: </h3>\n<h3>Interaktioner:</h3>\n<p><strong>Graviditet/amning:</strong> Försiktighet. Begränsad erfarenhet. Ska vara klar indikation. Antitrombin III förväntas, på grund av den relativt höga molekylvikten, inte passera över i bröstmjölk, varför risken för barnet anses vara låg. Dessutom inaktiveras troligen antitrombin III i barnets mage.</p>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "BETABLOCKAD PÅ IVA, OPERATION, HOS AKUT SJUKA", "html": "<h3>Beta1-blockerare</h3>\n<p>Metoprolol (Seloken) Esmolol (Breviblock?) Atenolol Bisoprolol (mest selektiv).</p>\n<p>Seloken är mer kortverkande än metoprolol? Man kan starta med seloken 25 mg x3 på IVA. OBS! Kombinera ej med Cordarone. Risk för asystoli.</p>", "category": "Läkemedel"}, {"title": "Calcium", "html": "<h3>Indikationer:</h3>\n<h3>Kontraindikationer:</h3>\n<h3>Biverkan:</h3>\n<p><strong>Förpackning:</strong> <strong>Calcium S</strong>ando<strong>z</strong>: 0,226 mmol/ml = 9,2 mg/ml. En 10 ml-ampull innehåller 2,25 mmol. Innehåller kalciumlaktoglukonat. <strong>Kalciumglykonat:</strong> Kalciumklorid är vävnadstoxiskt så ge helst i central infart. Kalciumglukonat är inte vävnadstoxiskt.</p>\n<h3>Tillredning:</h3>\n<h3>Dosering:</h3>\n<h3>Duration:</h3>\n<h3>Verkningsmekanism:</h3>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "CELOCURIN® (SUXAMETASON)", "html": "<p><strong>Indikationer:</strong> Muskelrelax.</p>\n<p><strong>Kontraindikationer:</strong> Hyperkalemier; brännskada, vävnadsskada etc, immobilisering. Duchenne / Beckers sjukdom (egentligen alla muskeldystrofier!). Kan ge intrakraniell tryckstegring. Oklar klin. betydelse vid skalltrauma. Ökar metabolismen kortvarigt, menas olämpligt enl. vissa vid ex. sepsis. Ryggmärgsskada! De har ökad mängd receptorer i muskeländplattan  Massiv kalium-efflux.</p>\n<p><strong>Biverkan:</strong> Trismus???? Kolla upp.</p>\n<p><strong>Förpackning:</strong> 50 mg/ml (färdigtillredd)</p>\n<p><strong>Tillredning:</strong> Dras upp i 2 ml spruta.</p>\n<p><strong>Dosering:</strong> Dos intubering: 1 mg/kg kv. Dos laryngospasm: 0,5-1 ml/kg kv.</p>\n<p><strong>Duration:</strong> Perifert muskelslapp i ca 3-5 min. Återhämtning i ca 10-15 min.</p>\n<p><strong>Verkningsmekanism:</strong> Depolariserande muskelrelaxerande.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<p><strong>Övrigt:</strong> Bryts ned av pseudokolinesteras, precis som Mivakron.</p>\n<p><strong>Källa:</strong> PM KS, Fass.</p>", "category": "Läkemedel"}, {"title": "CEFUROXIM", "html": "<p>Kontraindikationer: Kolla upp.</p>\n<p>Indikationer:</p>\n<p>Dosering:</p>\n<p>Förpackning: Pulver till injektionslösning.</p>\n<p>Tillredning: Kan blandas med NaCl el. glukoslösn. 750 mg flaska blandas med minst 6 ml. 1500mg flaska blandas med minst 15 ml. Ges som blus alternativt via 100 ml infusionspåse.</p>\n<p>Hållbarhet:</p>\n<p>Verkningsmekanism:Andra generationens cefalosporinpreparat.</p>\n<p>Övrigt: Obs! Får ej blandas med aninoglykocidantibiotika.</p>", "category": "Läkemedel"}, {"title": "CORDARONE® (Amiodarone)", "html": "<p><strong>Indikationer:</strong> Allvarliga symtomgivande ventrikulära och supraventrikulära arytmier, även förmaksfladder/flimmer.</p>\n<p><strong>Kontraindikationer:</strong> FASS: Sinusbradykardi, SA-block. SSS, AV-block, bi- eller tri-fascikulära retledningsrubbningar (gäller ej vid pacemaker), hjärtsvikt (kan förvärras), kardiomyopati, respinsuf, störd sköldkörtelfunktion, jod-allergi, kombination med LM som kan orsaka Torsades.</p>\n<p><strong>Biverkan:</strong> <strong>OBS! </strong>Försiktighet med att kombinera med betablockad<strong>. Har förekommit asystolier. </strong> Vanlig: bradykardi, hypotension (vanligen måttlig & övergående), eksem, reaktion vid injektionsstället. Ovanligt: Mikroavlagringar i cornea. Interstitiell pneumonit. Thyreoidit, kan debutera flera veckor efter avslutat behandling.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> blandning<strong>:</strong> <em>Amiodarone 12 mg/ml</em>: Amiodarone 50 mg/ml, 12 ml blandas med 38 ml Glukos 5%. Då får man 600 mg i 50 ml -> Amiodarone 12 mg/ml som kan gå i sprutpump. För en infusion av 300 mg på 30 min är det 50 ml/h i hastighet och för en infusion på ca 1200 mg/dygn så är det 4 ml/h (=1152 mg/dygn).</p>\n<p><strong>Dosering:</strong> HLR: 1a dosen: 300 mg späds med 5% glukos till total volym på 20 ml. Ges som bolus under 10 sek. HLR: 2a dosen: 150 mg späds med 5% glukos till total volym på 10 ml. Ge som bolus under 10 sek. <strong>Förmaksflimmer på IVA Recept som används av mkt erfaren kollega och som presenterats i studie:</strong> a) Bolus 300 mg på ca 30 min. b) 1200 mg första dygnet. c) 900 mg andra dygnet. d) 600 mg /dygn så länge du vill typ. Narkosguiden.se: 5 mg/kg kroppsvikt givet via intravenös infusion under en period av 20 minuter till 2 timmar så långsamt som möjligt beroende på den kliniska bilden. Denna mängd ges som en utspädd lösning i 250 ml glukos 50 mg/ml. Vanligtvis ges 300 mg under 30 minuter, därefter 900-1200 mg ytterligare under 24 timmar, infusionshastigheten regleras på basis av kliniskt svar. Vid resuscitering kan Cordarone ges som en bolusdos, 300 mg i 20 ml glukos. Janne VD: När pulsen går under 70 så halvera infusionen, om under 60 stäng av. Du kan bli påtagligt bradykard. <strong>För injektionspump Sahlgrenska:</strong> 300 mg (2 ampuller a 3 ml) späds i 14 ml 5% glukos till total volym på 20 ml  Amidaron 15 mg/ml. Infusionen ges vanligen under 1-2 h, men kan i brådskande fall ges snabbare ex. 20 minuter. <strong>THORAX KS: </strong>Vissa ger en laddningsdos 300 mg på 30 min. Infusion kan bli nödvändig om ex. förmaksflimret inte konverterar. Byt inte till betablockad. Risk för aystoli. Ev. kan man digitalisera istället. Enligt kollega har en kardiolog sagt att man kan avsluta om man fått en <strong>totaldos på ≥10 g. </strong>Det är då osannolikt att man skulle få någon ytterligare effekt av vidare administrering. Thorax ger max mellan <strong>5 -10 mg</strong>. Beror lite på ”leverfunktion”.</p>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Verkningsmekanism:</strong> Hämmar kaliumkanaler  förlängning av hjärtfiberns aktionspotentiafas 3.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> PM, Sahlgrenska v3, 2017. FASS. Narkosguiden.se</p>", "category": "Läkemedel"}, {"title": "COROTROP® (MILRINON) – INTRAVENÖS BEHANDLING", "html": "<p><strong>Indikationer:</strong> Uttalad hjärtsvikt, kardiogen chock. Hjärthypertrofi (bla med risk för utflödesobstruktion). (Har en snabbare effekt än Simdax. Men Simdax har en lägre effekt och metaboliterna finns kvar under någon vecka. Så vill man ha snabb effekt så starta med Corotrop och man kan saxa över till Simdax om pat. ex ska till avdelning). Det är inte solklart när man ska använda Simdax och Corotrop. Men Corotrop känner man sig trygg med att ge som bolus, det GÅR men helst inte med Simdax.</p>\n<p><strong>Kontraindikationer:</strong> Hypovolemi, obstruktivt aorta- eller pulmonalisklaffel. Vid akut hjärtinfarkt iakttag försiktighet.</p>\n<p><strong>Biverkan:</strong> Hypotension, ökad kardiell syrgaskonsumtion, takykardi, ventrikulära extrasystolier, ventrikeltakykardi.</p>\n<h3>Förpackning:</h3>\n<p><strong>Tillredning:</strong> Konc: Lösning 1 mg/ml. Vanlig styrka 0,2 mg/ml alt 100 µg/ml alt. 150 µg/ml.</p>\n<p><strong>Dosering:</strong> Rudberg brukar hos septisk pat. starta på 0,25 μg/kg/min, sedan titrera upp till 0,5 μg/kg/min. Marginalnyttan att gå upp till 0,75 ”är låg”. När man startar får man möta upp med att öka NA. Narkoguiden? Initialt en långsam (10 minuter) intravenös injektion av 50 µg/kg. Därefter en kontinuerlig infusion om 0,25 μg/kg/min till 0,75 μg/kg/min. Vanlig startdos är 0,5 μg/kg/min, dosen anpassas efter blodtrycket. Hos det övervägande antalet patienter noteras hemodynamisk förbättring inom 5-15 minuter. Dosering i intervallet 0,375-0,50 µg/kg/min tenderar att maximera den initiala förbättringen av hjärtminutvolymen, medan doser i intervallet 0,50-0,75 µg/kg/min tenderar att maximera förbättringen i parametrarna för pre- och afterload såsom PCW-tryck, medelartärtryck och systemiskt kärlmotstånd. Dosaktivitet: <0,375 μg/kg/min – oftast måttlig effekt på cirkulationen, 0,5-0,75 μg/kg/min β1-effekt, blodtrycksstegring, ökad CO och EF. <strong>Bolusdos i.v</strong> - kan ges outspätt 1 mg/ml<strong>:</strong> - Vuxen kvinna: 2 mg, Vuxen man: 3 mg, Sköra individer 1 mg kvinna, 2 mg man. Stor man 4 mg. Så doserar man på thorax. Enl. PM alfresco 50 mikrog/kg. Blir ungefär samma.</p>\n<h3>Förenklad dosering:</h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Verkningsmekanism:</strong> Fosfodiesteras III hämmare. Fysiologiska effekter: SVR↓, CO↑, HR↑, BT+/-. Ger ökad kontraktionskraft och ökad slagvolym. Kärldilaterare. Ibland kan noradrenalin behövas för att möta upp sänkt SVR. Även en lucitrop effekt med förbättrad myokardrelaxation.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> www.narkosguiden.se. PM PMI Inotropa droger och Vasopressorer. Kollega.</p>", "category": "Läkemedel"}, {"title": "COROTROP® (MILRINON) – INHALATION", "html": "<h3>Indikationer:</h3>\n<h3>Kontraindikationer:</h3>\n<h3>Biverkan:</h3>\n<h3>Förpackning:</h3>\n<h3>Tillredning:</h3>\n<h3>Dosering:</h3>\n<h3>Förenklad dosering:</h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Verkningsmekanism:</strong> Corotropinhalation fördelar sig i de alveoler som har gasutbyte vilket är bra. Då får du vasodilatation där. Infusion är främst för att behandla hjärtat och kan ju ge vasodilatation i oluftade delar vilket ger en ökad shunt.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> www.narkosguiden.se. Kollega.</p>", "category": "Läkemedel"}, {"title": "CYKLOKAPRON® (Tranexamsyra) #cyclokapron # cyclocapron", "html": "<p><strong>Indikationer:</strong> Vid kirurgi och blödning på patienter med ökad blödningsbenägenhet. Vid operationer med ökad fibrinolys som operationer i slemhinnor, mammarplastik, thorax- och leverkirurgi och prostatakirurgi. Vid operation av patienter med ökad blödningsrisk som kända trombocytdefekter, von Willebrands sjukdom och hemofili. Kan prövas vid stor blödning i samband med stort trauma. Skall ges inom ca 4 h från blödningsstart.</p>\n<p><strong>Kontraindikationer:</strong> Blödning från urinvägarna. Skall undvikas de första 6 månaderna efter akut trombos. Vid allvarlig stor blödning kan enstaka doser tranexamsyra ges men flera dygns behandling bör undvikas.</p>\n<p><strong>Biverkan:</strong> Risk för Cyklokramper vid totaldos > 7 g. Kan vid DIC och mikrotrombotiska syndrom minska upplösningen av fibrin i mikrocirkulationen och därmed öka risken för organsvikt.</p>\n<p><strong>Förpackning:</strong> Injektionsvätska 100 mg/ml.</p>\n<h3>Tillredning:</h3>\n<p><strong>Dosering:</strong> Ges på 10 min. <strong>På operation:</strong> Vanlig dos är 1 g (10 ml). Ge 1 ml/min. Ny dos när man blött halva blodvolymen (muntlig källa). Dosreducering vid sänkt njurfunktion. <strong>Thorax:</strong> ? Man ger 2 g i bolus, därpå 2-5 ml/h (100 mg/ml). ? Kolla upp. Vid kontinuerlig infusion finns risk för höga doser och biverkningar (Cyklokramper). <strong><em>Post-partumblödning:</strong> <strong>The Woman trial</strong>,<strong> 2017 PMID 28456509: 1 g cyklocap</strong>r<strong>on, + 1 g </strong>till<strong> om blödning for</strong>t<strong>satt efter 30 min eller åter började inom 24 h.</strong> Det var </em><em>även säkert att ge. Skall ges så fort som möjligt.</em></p>\n<h3>Förenklad dosering:</h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Verkningsmekanism:</strong> Fibrinolyshämmare. Hämmar fibrinolysen genom att förhindra plasminogens aktivering till plasmin. Tranexamsyra orsakar inte tromboser men upplösningen av befintliga tromber hämmas.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> FASS. Narkosguiden.</p>", "category": "Läkemedel"}, {"title": "CYANOKIT® (Hydroxykobalamin)", "html": "<p>Vid brand: Patient med medvetnadepåverkan skall anses vara intoxikerad på kolmonoxid oh/eller cyanidförgiftad tills motsatsen är besvisad. <strong>Indikation:</strong> Cyanokit ges vid misstänkt cyanidförgiftning. <strong>Dos: </strong> 5 g till vuxna. Kan upprepas 1 gång vid asystoli. 70 mg/kg till barn. <strong>Övrigt:</strong> **Till skillnad från Natriumtiosulfat så verkar cyanokit även i cellen vilket gör det mer effektivt. Dock färgar cyanokit mkt och påverkar lab-proverna.</p>", "category": "Läkemedel"}, {"title": "DEXDOR® (Dexmedetomidin)", "html": "<p><strong>Indikationer:</strong> Sedering: Kan användas ist. för tyngre sederande droger. Ej till för att söva patienter djupare. Sömn: Till extuberade pat. som inte kan sova kan lågdos Dexdor vara ett alternativ då det ger bevarad REM-sömn. Hyperaktivt delirium: Vid måttlig delirium kan Dexdor vara alternativ till Haldol. Vakenintubation. Obs, luftvägsmässigt så faller luftvägen samman lika mycket för Dexdor som för propofol. Dex har dock en längre halveringstid än propofol. Obs: SPICE-III-studien påvisade ökat mortalitet vid användning av dex. jmf. klassisk beh. med Propofol eller midazolam hos sövda och med mekanisk ventilation.</p>\n<p><strong>Kontraindikationer:</strong> Svår bradyarytmi orsakad av sick sinus syndrome eller AV-block grad II-III, hypotension. Anses även riskera att förvärra cerebral vasospasm och ska undvikas vid detta tillstånd.</p>\n<p><strong>Biverkan:</strong> AV-block, blodtrycksfall, bradykardi, andningssvikt. Hypertermi/feber finns beskrivet. Instänghetskänsla enl kollega. Vid abrupt utsättning av höga doser har symtom i form av hjärtklappning, ångest, nervositet, motorisk oro, samt i enstaka fall blodtryck som överstigit obehandlat tryck iakttagits.</p>\n<p><strong>Förpackning </strong>&<strong> tillredning:</strong> Kärlsektionen: 4 ml dexmedetomidin (100 g/ml) tillsätts till 36 ml 0,9% NaCl  10 g/ml. Thorax: Använder också styrkan 10 mikrog/ml i en 50 ml-spruta.</p>\n<p><strong>Dosering:</strong> Kärlsektionen: Ingen laddningsdos, (stoppa pumpen från att ge bolusen), underhåll; 0,2-0,5 g/kg/h. Förslagsvis inleder man med 0,4 g/kg/h, halvera dosen efter ca 10 min och titrera sedan. Den sederande effekten utefter denna dosering kommer efter ca 20 min. Narkosguiden: Infusionshastigheten justeras stegvis inom dosintervallet 0,2 – 1,4 mikrogram/kg/timme. Laddningsdos av Dexdor rekommenderas inte och är associerat med ökade biverkningar. Patienter som redan är intuberade och sederade kan byta till dexmedetomidin med en initial infusionshastighet på 0,7 mikrogram/kg/timme.</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Full agonist. α2: α1 = 1300:1. T1/2beta 2h. Jmf med Catapressan som är partiell agonist. α2: α1 = 220:1. T1/2beta 9 h. Vissa anser att man inte skall ge Catapressan som infusion med tanke på jämförelse ”orenhet”. Aktivering av alfa2-receptorer i locus coeruleus i hjärnstammen  Minskad frisättning av NA från sympatiska nervändslut  Central sympaticolys.</p>\n<h3>Metabolism: </h3>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<p><strong>Källa:</strong> PM ”Dexmedetomidin för sedering vid kärlkirurgisk ingrepp”. DexdorPM från THIVA KS. Narkosguiden.</p>", "category": "Läkemedel"}, {"title": "DIAMOX® (Acetazolamid)", "html": "<p><strong>Indikationer:</strong> Diuretikum vid alkalos. Ödem av olika genes. Glaucom.</p>\n<p><strong>Kontraindikationer:</strong> Mb Addison, grav lever eller njurfunktionsnedsättning. Överkänslighet mot sulfonamider.</p>\n<p><strong>Biverkan:</strong> Trötthet, yrsel, metabol acidos.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> Torrampull innehållande 500 mg löses med 5 ml sterilt vatten. (Finns även som tablett om 250 mg).</p>\n<p><strong>Dosering:</strong> PM Thorax Sahlgrenska: 500 mg x 1-4 efter behov och syra-bas-status. Enl. kollega från SÖS: 250 mg x 2, i totalt 5 doser som mest (på indikation alkalos).</p>\n<p><strong>Max infusionshastighet: </strong>Ges som långsam iv. injektion. Alkalisk lösning (pH 9) och kan orsaka sveda.</p>\n<p><strong>Tillslagshastighet: </strong>Snabb effekt.</p>\n<p><strong>Duration:</strong> Utsöndras inom 24 h. Halveringstid 4 h.</p>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Sulfonamidderivat utan bakteriostatisk effekt. Karbanhydarshämmare  katalyserar den reversibla reaktionen innefattande hydrering av koldioxid och dehydrering av kolsyra. Effekter: I njuren befrämjar diures med förstärkt utsöndring av Na+, K+, HCO3- och vatten. Den diuretiska effekten är liten till måttlig och försvinner efter några dagar. I ögat sänkts intraokulärt tryck vid glaukom genom minskad sekretionen av kammarvatten och orsakar en sänkning av det intraokulära trycket som används för att behandla glaukom.  I CNS med gynnsam effekt vid hjärnödem och epilepsi.</p>\n<p><strong>Metabolism: </strong>Utsöndras fullständigt via njurarna.</p>\n<p><strong>Interaktioner:</strong> Sulfonamider kan förstärka effekten av folsyraantagonister, diabetesmedel och orala antikoagulantia. Salicylater kan tränga bort acetazolamid från plasmaproteiner samt minska dess renala clearance. Samtidig behandling med acetazolamid och acetylsalicylsyra kan leda till svår toxicitet inklusive ökad toxicitet i det centrala nervsystemet. Svår metabolisk acidos har rapporterats hos patienter med normal njurfunktion vid behandling med acetazolamid och salicylater. Kombinationen bör undvikas. / FASS</p>\n<p><strong>Graviditet/amning:</strong> Diamox bör därför inte användas under graviditet, särskilt inte under den första trimestern. Djurstudier påvisat teratogen effekt. Acetazolamid har påvisats i låga nivåer i bröstmjölk från ammande kvinnor som har tagit Diamox. Även om det är osannolikt att det kan leda till några skadliga effekter på spädbarn bör yttersta försiktighet iakttas när Diamox ges till ammande kvinnor.</p>\n<p><strong>Övrigt:</strong> Färdigblandad lösning håller i 12 h i rumstemp.</p>\n<p><strong>Källa:</strong> Rutin Diamox PM Thoraxintensiven Sahlgrenska 2019. FASS.</p>", "category": "Läkemedel"}, {"title": "DIGITALIS", "html": "<p><em>Sammanfattning baserat på PM från VGR: ”Digoxinbehandling (akut digitalisering) – kardiologi”</em> <em>Dokument-ID: SKAS9709-121726567-43. Giltig till och med 2028.</em> <strong>AKUT DIGITALISERING</strong> <strong>Om digitalis</strong> Har direkta kronotropa effekter och sänker hjärtfrekvensen bl a genom vagusstimulering och förlängning av överledningstiden i AV-knutan. Ökar även hjärtats kontraktionskraft, vilket reducerar pulsen vid hjärtinsufficiens på grund av förbättrad cirkulation. <strong>Indikation</strong> Frekvensreglering vid förmaksflimmer/fladder, särskilt vid samtidig hjärtsvikt och/eller hypotoni. <strong>Kontraindikationer</strong> Relativt kontraindicerat vid hypokalemi, hyperkalcemi, hypomagnesemi, hypoxi – Skall åtgärdas innan  digitalisering. Höggradigt AV-block grad II–III, sinusarrest, uttalad bradykardi, överkänslighet Försiktighetvid : koronar ischemi, svår myokardit, ventrikulär arytmi, WPW Sänkt dos vid nedsatt njurfunktion och hypothyreos <strong>Biverkningar</strong> Taky-/bradyarytmier och överledningsstörningar – risk ökar vid elektrolytrubbning och syrabasstörning <strong>Före administrering</strong> Kontrollera P-Kalium (dagsfärskt) – invänta svar innan start Åtgärda elektrolytrubbningar (hypokalemi, hyperkalcemi, hypomagnesemi) och hypoxi innan behandling påbörjas. <strong>Dosering IV (akut)</strong> Inj. Digoxin 0,25 mg/ml, ges långsamt IV (0,1 mg/min), behöver ej spädas. Startdos: 0,5 mg (2 ml), (3 ml vid hög muskelmassa) → ges under 5 min. Vid otillräcklig effekt: ytterligare 0,25 mg (1 ml) efter 2–3 timmar (läkarordination) Gammal anteckning skriven vid THIVAplacering: ”- Digitalisering på THIVA: 0,5 mg + 0,5 mg. Man väntar 30 till 60 min mellan dos 1 och 2. Ev. kan man ge en dos till efter samma tidsintervall. Nästa dag får man dosera med hänsyn till njurfunktion mm.” <strong>Dosering PO (mindre akut)</strong> Startdos: 3 tabletter á 0,25 mg (4 tabl vid hög muskelmassa) Vid otillräcklig effekt: Ytterligare 2 st tabletter á 0,25 mg var 6:e timme första dygnet. Maxdos dygn 1: 2 mg (= 8 tabl á 0,25 mg) Från dygn 2: underhållsdos enligt FASS <strong>Interaktioner</strong> Verapamil och Amiodaron (Cordarone) kan orsaka ökad digoxinkoncentration.</p>", "category": "Läkemedel"}, {"title": "DOBUTAMIN", "html": "<p><strong>Indikationer:</strong> Behov av inotropi ev. i kombo med NA ex vid septisk chock, hjärtsvikt där man vill öka CO men inte öka perifer resistens, behov av ökat BT/perfusion vid kontraindikation av noradrenalin ex. lambåer. - Dobutamin är även vasodilaterande i hjärnan i motsats till noradrenalin.</p>\n<h3>Kontraindikationer:</h3>\n<p><strong>Biverkan:</strong> Arytmier (ffa vid högre doser), illamående, ibland obstruktiva besvär, urtikaria. Inflammation vid extravasering.</p>\n<p><strong>Tillredning:</strong> Dobutamin: 8 ml (=100 mg) + NaCl 42 ml --> 2 mg/ml (50 ml-spruta) = 2000 mikrog/ml.</p>\n<p><strong>Dosering:</strong> Man börjar i regel på 2 mikrog/kg/min. Vid svårare BT-fall kan det vara motiverat att börja på 5. Får ges i stor perifer ven. På PMI säger vi att man aldrig bör gå över 10 mikrog/kg/min. Soft limit kanske snarare 7,5. FASS gamla rekommendation går högre, men det är för högt.</p>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Blandbarhet: </strong>Ges ej tillsammans med bikarbonat, Heparin, Pentotal, eller liknande alkaliska LM.</p>\n<p><strong>Verkningsmekanism:</strong> <em>Aitkenhead:</em> Primärt B1-agonist, moderat B2 och mild alfa1 aktivitet. Ingen DA-effekt. Ökar CO via ökad kontraktilitet (beta1-effekt). Pulsen ökar även (beta2-effekt). BT kan bli ökat, men perifer vasodilatation kan förekomma ledande till +-0 effekt. Ingen effekt på venös tonus eller renal blodförsörjning. Har mindre effekt på syrgaskonsumtionen i myokardiet än andra katekolaminer.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> Blandat, bla Alfresco PM.</p>", "category": "Läkemedel"}, {"title": "DYNASTAT® (PARECOXIB)", "html": "<p><strong>INDIKATIONER:</strong>  Korttidsbehandling av postoperativ smärta för vuxna. Febernedsättande. Relativt frikostigt på NIVA.</p>\n<p><strong>KONTRAINDIKATIONER:</strong> AKI. Aktivt ulcus. Allergisk reaktion. Förvärrade astmatiska besvär. IBD. Hjärtsvikt. Post CABG. Etablerad ischemisk hjärtsjukdom. (Man syftar till risk för kärlsammandragning). Långvarig behandling ej rek. bla pga risk för tromboemboliska events. - Undvik dynastat om överkänslighet mot sulfa då korsreaktivitet förekommer.</p>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong>  Pulver för injektionsvätska. 40 mg. Spädes med 5 ml NaCl.</p>\n<p><strong>DOSERING:</strong> FASS: Rek. dos 40 mg iv. eller im. följt av 20 mg eller 40 mg var 6:e till var 12:e h, högst 80 mg/dygn. <strong>Äldre pat </strong>&<strong> vikt </strong><<strong> 50 kg</strong>:** Inled med 20 mg, och minska den maximala dygnsdosen till 40 mg.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<p><strong>VERKNINGSMEKANISM:</strong> Prodrug till valdecoxib. Selektiv COX 2-hämmare. Selektiva COX-2-hämmare minskar bildning av systemiskt (och därmed möjligen endotelialt) prostacyklin utan att påverka trombocyt-tromboxan.</p>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<p><strong>GRAVIDITET:</strong> Ge ej! Flertalet risker med NSAID under grav.</p>\n<p><strong>AMNING:</strong> Ej rek. till ammande (FASS). (Men det är en bara 1% som passerar i bröstmjölken.)</p>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "FENTOLAMIN / PHENTOLAMIN / PHENTOLAMINE / REGITIN", "html": "<p>- Fentolamin är en alfa-adrenoceptorantagonist. - För detaljer, se under rubriken EXTRAVASERING & INTRAARTERIELL INJEKTION i kapitlet “Praktiskt”. - Detta läkemedel kan även ges som antidot vid överdosering av adrenergika.</p>", "category": "Läkemedel"}, {"title": "FENYLEFRIN", "html": "<h3>Indikationer:</h3>\n<p><strong>Kontraindikationer:</strong> CAVE: Sen graviditet (kan ge uteruskontraktion), dock bra vid snitt. Försiktighet vid hjärtsvikt (ökar afterload). Ökar diast mer än syst.</p>\n<p><strong>Biverkan:</strong> Bradykardi, hjärtsvikt, lungödem.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> 0,1 mg/ml (späds ej) & 1 mg/ml?</p>\n<p><strong>Dosering:</strong> I.v. injektion: 0,25 - 1 ml = 25 - 100 mikrog. <strong>Fenylefrininfusion</strong> på KS med Pump-program Fenylefrininfusion:** Tillredning:  Fenylefrin 10 mg/ml + 19 ml NaCl 9 mg/ml -> Fenylefrin 500 mikrog/ml. Dosering kontinuerlig infusion: 0,05-0,15 μg/kg/min. Upp till 0,5 μg/kg/min enl. vårt intensivvårdsPM.</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Syntetisk katekolamin. Selektiv α1 effekt  Renodlad vasokonstriktion.</p>\n<h3>Metabolism: </h3>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<p><strong>Övrigt:</strong> Används mkt sällan inom intensivvården. Kan ges perifert.</p>\n<p><strong>Källa:</strong> PM PMI Inotropa droger och Vasopressorer</p>", "category": "Läkemedel"}, {"title": "FLORINEF® (Fludrokortisonacetat)", "html": "<p><strong>INDIKATIONER:</strong> På IVA; cerebral salt wasting. Addisons sjukdom, kongenital binjurebarkhyperplasi.</p>\n<h3>KONTRAINDIKATIONER:</h3>\n<p><strong>BIVERKAN:</strong> Glukokortikoida biverkningar kan förekomma, förväntas dessa inte vid de låga doser. Ökad kalciumutsöndring, kan bli problem på lång sikt iaf. Psykiska kortisonbiverkningar.</p>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong></p>\n<h3>DOSERING:</h3>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<p><strong>DURATION:</strong> För tabletter: T ½ i plasma 3,5 h. Biologisk T1/2 18-36 h. Verkningsduration 1-2 dygn.</p>\n<h3>BLANDBARHET:</h3>\n<p><strong>VERKNINGSMEKANISM:</strong> Fludrokortison är ett hydrokortisonderivat med mycket hög mineralkortikoid effekt och hög glukokortikoid effekt. Effekten av små doser är betydande natriumretention (och medföljande vätskeretention), ökad kalium- och väteutsöndring i urinen samt ökat blodtryck. Mineralkortikoider (såsom aldosteron) binder till aldosteronreceptorn i distala tubuli och uppsamlingsrörer och aktiverar och rekryterar Na/K-kanaler.</p>\n<p><strong>METABOLISM:</strong> Matabolism ffa i lever, men även i njurarna. Utsöndras som inaktiva metaboliter i urinen.</p>\n<h3>INTERAKTIONER:</h3>\n<p><strong>GRAVIDITET:</strong> Kat C. Risk för missbildningar. Ges endast under särskilt övervägande.</p>\n<p><strong>AMNING:</strong> Uppgifter saknas.</p>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "FRAGMIN / INNOHEP", "html": "<h3>INDIKATIONER:</h3>\n<h3>KONTRAINDIKATIONER:</h3>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong></p>\n<p><strong>DOSERING:</strong> <strong>Trombosprofylax</strong> - Innohep s.c. 4500 IE, Fragmin 5000 IE. / Janusinfo (expertgruppen). - Om vikt <50 kg reducerad dos till 2500 IE x 1 subkutant för både Innohep och Fragmin. - Dosreduktion av LMH vid tpk <50. Vid tpk <30 överväg utsättning av LMH. <strong>Lungemboli eller DVT</strong> - Fragmin 200 IE/kg uppdelat på 1 eller 2 doser. På IVA blir det 2 doser. Ex 75 kg -> 7500 x 2. / FASS <strong>Utsättning av Heparin och insättning av Fragmin:</strong> Flera på Thorax brukar stänga av Heparininfusionen, och vänta 2 h innan första Fragmindoosen ges.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "FURIX FUROSEMID", "html": "<p>FURIX</p>\n<p>Biverkningar: Hypokalemi, hypomagnesemi,  vid högdos; temorär dövhet, tinitus, vasokonstriktion vilket kan vara farligt vi angina/hjärtsjuka. Hypernatremi (man förlorar mer vatten ön natrium relativt sett), även metabol alkalos pga hypokloremi (man förlorar mer Cl än Na relativt vilket ökar SID). Förlorar även kalium, kalcium, magnesium. Vasodilatation, ototoxicitet (mkt ovanligt).</p>\n<p>Kontraindikationer: Svår hemolys (furix surgör urinien --> Methemoglobincasts)</p>\n<p>Svår hypokalemi eller hyponatremi, leverkoma, hypovolemi.</p>\n<p>Man brukar uppskatta att p.o. dos motsvarar det dubbla av i.v. dosen.</p>\n<p>Binder till NKCC2-receptorn i tubuli. Bilnder till NKCC1-receptorn i blodkärlen och orsakar vasodilatation. NEJM-artikel om diuretika vid HF PMID 29141174: Furosemid har flera verkningsmekanismer. Vid högdos kan det vara svårt att förutse effekten. Kan leda till ökat RAAS-påslag, eller till vasodilatation. De föreslår försiktighet, men att man i <em>DOSE trial</em> påvisade båttre outcome av högdos. Bolus och kontinuerlig infusion var likvärdigt.</p>\n<p>Dosering: Som infusion ger man i klinisk praxis inte mer än 40 mg/h.</p>", "category": "Läkemedel"}, {"title": "GABAPENTIN", "html": "<p><strong>INDIKATIONER:</strong>  Perifer neuropatisk smärta, tilläggsbehandling/enskild beh. vid partiella EP-anfall.</p>\n<p><strong>KONTRAINDIKATIONER:</strong> Överkänslighet, graviditet, pancreatit, .</p>\n<p><strong>BIVERKAN:</strong> Trötthet, rapporter om andningsdepression/sedering i kombo med opioider vid höga doser. ”Mycket vanliga” (FASS): Somnolens, yrsel, ataxi. Mfl mfl.</p>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong>  Finns som tablett/kapsel.</p>\n<p><strong>DOSERING:</strong> FASS: Behandlingsstart: Titreras upp, start; 300 mg x 1, dag 2; 300 mg x 2, dag 3; 300 mg x 3. Det går även att börja direkt med 300 mg x 3, därefter ökas dosen med 300 mg var 2a till var 3e dag till en dos av högst 3600 mg/dygn. Långsammare upptitrering kan vara lämpligt hos vissa pat. Totala dygnsdosen delas upp på 3 tillfällen, längsta tid mellan doserna är 12 h för att slippa smärtgenombrott. Dosjustering behövs vid sänkt kreatininclearence: <strong>Dosering av Gabapentin till vuxna baserat på njurfunktion</strong> <strong>Kreatininclearence (ml/min)</strong> <strong>Total dygnsdos (mg/dag)</strong> ≥80 900-3600 50-79 600-1800 30-49 300-900 15-29 150-600. Om 150 mg, ge 1 kapsel varannan dag. <15 150-300. 300 om crclearence är 15 och ex 150 om 7,5. Alfresco: Patient som redan står på gabapentin eller pregabalin bör fortsätta med sin ordinarie medicin, en dosökning med 25-50%. <strong>(Alfresco) Premedicinering (”protective premedication”) hos vuxna:</strong> Vikt ≥ 80 kg och ålder ≤ 65 år: Gabapentin 1500 mg (5 kapslar 300 mg) Vikt < 80 kg och ålder ≤ 65 år: Gabapentin 900 mg (3 kapslar 300 mg) Vikt ≤ 50 kg och/ eller ålder > 65 år: Gabapentin 600 mg (2 kapslar 300 mg)</p>\n<p><strong>TILLSLAGSHASTIGHET:</strong> Max plasmakonc efter 2-3 h.</p>\n<p><strong>DURATION:</strong> **Tidsintervall mellan doserna bör inte överstiga 12 h.</p>\n<p><strong>BLANDBARHET:</strong> Kan kombineras med paracetamol, opioider, cox-hämmare, blockader.</p>\n<p><strong>VERKNINGSMEKANISM:</strong> Binder till en subenhet för alfa-2-delta hos spänningsstyrda kalciumkanaler och därmed en minskning av excitatoriska mediatorer i CNS. Passerar snabbt BBB. Binder ej till GABA-receptorer. Distrubitionsvolym ca 60 L.</p>\n<p><strong>METABOLISM:</strong> Fraktionen absorberad dos minskar med ökad dos. (Visst var det så att dosjusteringen bör ske exponentiellt?). Gabapentin utsöndras endast via njurarna, i oförändrad form. Eliminationshalveringstiden för gabapentin är inte dosberoende och är i genomsnitt 5-7 timmar.</p>\n<h3>INTERAKTIONER:</h3>\n<p><strong>GRAVIDITET:</strong> Kat. B:3.</p>\n<p><strong>AMNING:</strong> Kat IVb. Utsöndras i bröstmjölk. Använd endast om fördelar är större än riskerna.</p>\n<h3>ÖVRIGT:</h3>\n<p><strong>KÄLLA:</strong> FASS, Alfresco (Doknr i Barium 25491).</p>", "category": "Läkemedel"}, {"title": "GLYCOPHOS® (Natriumglycerofosfat, hydratiserat)", "html": "<p><strong>Indikationer:</strong> Fosfatbrist, detta drabbar framförallt patienter med CRRT- behandling.</p>\n<p><strong>Kontraindikationer:</strong> Bör ges med försiktighet till patienter med nedsatt njurfunktion.</p>\n<h3>Biverkan:</h3>\n<p><strong>Förpackning </strong>&<strong> tillredning: </strong> - Fosfat (Glycophos) infusionskoncentrat 1 mmol/ml. En injektionsflaska på 20 ml innehåller 20 mmol fosfat samt 40 mmol Natrium. - Skall spädas. Max 1 mmol Glycophos ENSAMT per 10 ml Glucos 5%, 10% och 20%. Så 20 mmol fosfat lämpar sig väl i en 250 ml glukosflaska. Kan även spädas med NaCl.</p>\n<p><strong>Dosering:</strong> Dagligt behov av fosfat till vuxna vid intravenös nutrition är normalt 10-30 mmol. Vanligen kan dock behovet av fosfat täckas med 10-20 ml Glycophos. Ca 10 – 20 mmol / dygn.</p>\n<h3>Förenklad dosering: </h3>\n<p><strong>Max infusionshastighet: </strong>Infusion<strong> </strong>i regel på minst 8 h.</p>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Blandbarhet:</strong> Skall ej blandas.</p>\n<p><strong>Verkningsmekanism:</strong> Fosfat är en salt som vanligtvis återfinns i proteinrika livsmedel såsom mjölk, ost och kött. Fosfat som tillsats är därför nödvändig för patienter som får intravenös nutrition. Fosfatbrist ger framför allt symptom från centrala nervsystemet och muskulaturen men brist kan även leda till urkalkning av skelettet och försämra njurfunktionen. Fosfat är också viktig för syra- basbalansen. Hypofosfatemi kan ses vid malabsoption, kräkningar och vid högkonsumtion av alkohol. Fosfatbrist kan drabba patienter med CRRT-behandling.</p>\n<h3>Metabolism: </h3>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> Alfresco, Fosfat (GLycophos), Thorax, 2018.</p>", "category": "Läkemedel"}, {"title": "HEMINEURIN EJ KLAR", "html": "<h3>INDIKATIONER:</h3>\n<h3>KONTRAINDIKATIONER:</h3>\n<p><strong>BIVERKAN:</strong> Kollegor tycker att pat. får ökad slembildning i lungorna.</p>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong></p>\n<h3>DOSERING:</h3>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "HEPARIN", "html": "<p><strong>INDIKATIONER:</strong> Behandling vid eller profylax mot venös tromboembolism.</p>\n<p><strong>KONTRAINDIKATIONER:</strong> Ex. pågående hjärnblödning. Överväg CT innan om osäkerhet.</p>\n<p><strong>BIVERKAN:</strong> - Ickeimmunologisk trombocytopeni, ofta efter ca 4 dgr. TPK normaliseras spontant utan utsättning av Heparin. - HIT: immunmedierad, kommer efter ca 5 dgr, kan dock gå snabbare om tidigare heparinexponering. IgG som binder till heparin-PF4-komplexet och binder vidare till och aktiverar TPK  Tromber och trombocytopeni. Risk för LE, extremitetischemier, stroke. Vid misstanke, stoppa heparininfusionen och skicka blodprov för HIT-screening. Alternativ antikoagulantia får sättas in. - Hypotension efter snabb och större bolus. - Alopeci.</p>\n<p><strong>FÖRPACKNING OCH TILLREDNING PÅ IVA KS:</strong> <strong>50 ml spruta: </strong>49 ml NaCl + 1 ml Heparin 5000 E/ml -> 100 E/ml. (Kan även spädas med glukos 50 mg/ml) <strong>100 ml flaska</strong>: 98 ml NaCl + 2 ml Heparin 5000 E/ml -> 100 E/ml.</p>\n<p><strong>DOSERING:</strong> OBS! Vid behandling på IVA KS, se nästa sida!<strong> </strong>Se uppdaterat pm<strong>: </strong>https://janusinfo.se/download/18.6081a39c160e9b3873135ee/1535626544673/heparininfusion-vid-venos-tromboembolism-hos-vuxna-170425.pdf <strong>Innan start: </strong>Tillse att det finns blodguppering och bastest. <strong>Ordinationer: </strong>Ska ordineras och talas i termer om <strong>enheter</strong> / timme ej ml/h. <strong>Provtagning APTT:</strong> Var 6:e timme eller var 4:e timme efter start eller ändringar i dos. Effekten utvärderas med APTT (till skillnad från Fragmin där man analyserar aFXa). APTT bör ligga 1,5-3 ggr referensvärde, dvs. 60 - 120 sekunder (vid ökad blödningsrisk 50 - 80 sek). (aFXa kan vara som ett stöd om svårt att få upp APTT och man anar oråd, ej rutinmässigt dock) <strong>Antitrombin:</strong> För att få en bra heparineffekt så krävs ett antitrombin på > 0.8. <strong>Dosjustering: </strong>Vid justering är förändringar i storleken 100-200 E/h ofta lämpliga. Vid APTT betydligt högre än målnivån kan ett behandlingsuppehåll på 60 min tillämpas innan behandlingen återstartas med en lägre dos. <strong>Utsättning av Heparin och insättning av Fragmin: </strong> - APTT inom och/eller under målvärde: Stoppa droppet, ge LMH i fulldos omgående. - APTT över målvärde: Stoppa droppet, ge LMH i fulldos efter 1-2 timmar. - Flera på Thorax brukar hos postop pat. stänga av Heparininfusionen, och vänta 2 h innan första Fragmindoosen ges. <strong>Ideal kroppsvikt? </strong>Dosering verkar var enl. faktiskt vikt, men det finns studier på lean body weight. <strong>1. Bolusdos: (internetmedicin)</strong> - Djup ventrombos < 85 kg: 5 000 E (1 ml av Heparin 5000 E/ml) i.v. och ≥ 85 kg: 7 500 E (1,5 ml) i.v. - Lungemboli: 7 500 E (1,5 ml) i.v. - Massiv DVT/lungemboli: större bolus (100 E/kg). - Ökad blödningsrisk: 2 500 E i.v. (undantag massiv lungemboli/DVT). - Vid misstänkt lungemboli ges bolus och infusion startas i väntan på att diagnosen fastställs. <strong>2. Intravenös infusion: (internetmedicin)</strong> Normal startinfusion Heparin är en dygnsdos 500 E/kg/24 tim = 20.8 E/kg/h. Reducerad startinfusion Heparin dygnsdos 400 E/kg/24 tim = 16.7 E/kg/h.</p>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet: </h3>\n<p><strong>Duration:</strong> T1/2 30-150 min, dosberoende.</p>\n<p><strong>Blandbarhet: </strong>Innehåller konserveringsmedlet bensylalkohol. Heparin kan spädas med NaCl el. glukos.</p>\n<p><strong>Verkningsmekanism:</strong> Binder och potentierar antitrombin III tusenfalt. Aktiverat antitrombin III hämmar trombin och andra serinproteaser som verkar för koagulation.</p>\n<h3>Metabolism: </h3>\n<p><strong>Interaktioner:</strong> Kollega på thorax: F 8 är en akutfasreaktant så APTT kan påverkas. Det kan därför vara smartare att mäta aFXa vid heparininfusion hos en svårt inflammatorisk patient ex vid ECMO. (ECMOcentrum mäter dock APTT).</p>\n<h3>Graviditet/amning:</h3>\n<p><strong>Källa:</strong> PM KS Kar2-13970. Internetmedicin.</p>", "category": "Läkemedel"}, {"title": "HEPARIN PÅ IVA SOLNA", "html": "<p><strong>SAMMANFATTNING AV PM – ”HEPARINBEHANDLING PÅ IVA SOLNA”</strong>, dokument PMI00647-2<strong>. </strong> <strong>För mer allmän sammanfattning om Heparin, se föregående sida.</strong> - Behandlingsmål avseende APTT varierar beroende på sjukdomstillstånd.  - Effekten av Heparin är ofta svår att förutsäga och kan variera under sjukdomsförloppet. - Heparinbehandlings-PM från andra avdelningar på KS sak inte användas pga doseringsutmaningarna! <strong>TIllredning</strong> Heparin späds i Natriumklorid 9 mg/ml till 100 E/ml (1 ml Heparin 5000 E/ml späds i 49 ml NaCl 9 mg/ml). <strong>Förutsättningar </strong>och <strong>riktlinjer</strong> <strong>för att Heparinbehandling ska vara aktuell på IVA KS. </strong> 1. Vid ökad intrakraniell blödningsrisk (aktuellt skalltrauma/stroke etc) ska CT-hjärna utföras för att värdera risken för blödningskomplikation. 2. Blodgruppering och giltigt bastest ska alltid finnas under behandling med heparininfusion. 3. Individuellt anpassat behandlingsmål avseende APTT dokumenteras som en del av läkemedelsordinationen i Clinisoft och i dagens mål. 4. Tidsintervall för kontroll av APTT ska ordineras av ansvarig intensivvårdsläkare.      a. Intervallet ska aldrig vara längre än 8 h.      b. Vid behandlingsstart och efter dosjustering bör intervallet vara 4 h. 6. Dosering av heparin ska dokumenteras, ordineras och omtalas i termer av enheter per timme (E/h). Observera att detta skiljer sig från rutinen på Karolinska i övrigt, vilket måste uppmärksammas vid överflyttning av patient från eller till annan enhet. 7. Samtliga bolusdoser (även eventuell bolus vid behandlingsstart) ges via infusionspumpen med 100 E/ml. Pga risk för feldosering ges inte starkare heparinlösning även om den svagare lösningen innebär större volymer. 8. Om behandlingen startas med bolusdos är reducerad sådan ofta rimlig, dvs 2500 E, då våra patienter har ökad blödningsrisk, ofta är äldre och har påverkad njurfunktion. 9. Det är svårt att rekommendera specifik startdos men 500-1000 E/h kan vara rimligt att inleda behandlingen med, lite beroende på patientstorlek och APTT-mål. 10. Vid justering av heparindosen är förändringar i storleken 100-200 E/h (eller 10-20% av aktuell dos) ofta lämpliga. Vid APTT betydligt högre än målnivån kan ett behandlingsuppehåll på 60 min tillämpas innan behandlingen återstartas med en lägre dosering. Förslag på tidsintervall för provtagning av APTT: Om stabilt värde 8h, om nära övre eller undre APTT-målet eller utanför målet, provtagning efter 4 h. Dosjustering utefter svar.</p>", "category": "Läkemedel"}, {"title": "HUMALOG", "html": "<h3>INDIKATIONER:</h3>\n<h3>KONTRAINDIKATIONER:</h3>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong></p>\n<h3>DOSERING:</h3>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<p><strong>VERKNINGSMEKANISM:</strong> Humalog är en Human insulinanalog med mycket snabbt insättande effekt och kort duration</p>\n<h3>METABOLISM:</h3>\n<p><strong>INTERAKTIONER:</strong> Det finns patienter som har utvecklat antikroppar mot vissa typer av insulin även Humalog. Det brukar då även finnas korsreaktivitet med Novorapid. Vid misstanke om detta vid ex. ett behov av mkt höga doser så kan man prova en normal dos Lantus. Kanske 20 IE s.c.</p>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "INDERAL® (Propranolol)", "html": "<h3>INDIKATIONER:</h3>\n<h3>KONTRAINDIKATIONER:</h3>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong></p>\n<p><strong>DOSERING:</strong> - Stressad pat. som ligger på NIVA. Vissa pat. har sympatisk hyperaktivering (PSH). Vanligt ffa hos unga män. Pat. ter sig mkt stressad. Kan kan sätta in Inderal 20 mg x 2 och sedan höja till 40 mg x 2 även upp till x 3. Om det inte funkar så kan man gå in med Gabapentin. Finns stöd av detta från Cochrane. (Vanligaste orsak till att patienter slutar med Keppra i öppenvården är ångest/oro. Så sätt ut Keppra om det inte behövs).</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "Ilomedin® (Iloprost) - INHALATION", "html": "<p><strong>Indikationer: </strong>Svår pulmonell hypertension. Primär pulmonell hypertension. Terappirefraktär hypoxi vid ARDS (för att förbättra ventilation/perfusion mismatch).</p>\n<p><strong>Kontraindikationer:</strong> Tillstånd där effekterna av iloprost på trombocyter skulle kunna öka risken för blödning.</p>\n<p><strong>Biverkan:</strong> Hypotension, vasodilatation, hosta och huvudvärk samt ansiktsrodnad.</p>\n<p><strong>Förpackning </strong>&<strong> tillredning: </strong> Spädningsförslag: 1 ml Ilomedin (20 mikrog/ml) späds med 4 ml NaCl. Vilket ger en färdig blandning på 4 mikrog/ml. Alternativt synonympreparatet Ventavis, lösning för nebulisator 10 mikrog/ml.</p>\n<p><strong>Dosering:</strong> PM Alfreasco: 5 (-10) mikrogram x 6-8 inhalation. <strong>Ilomedininhalation: </strong>Man kan inhalera 10 mikrogram Ilomedin var 3e till 4e timma ungefär / Kollega från thorax.</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet: </h3>\n<p><strong>Duration:</strong> Är mer långverkande än Flolan (prostacyklin) och kan därför ges intermittent.</p>\n<h3>Blandbarhet: </h3>\n<p><strong>Verkningsmekanism:</strong> <strong>Är en</strong> **syntetisk prostacyklinanalog. Orsakar hämning av aggregering, adhesion och frisättningsreaktion hos trombocyter. Dilatation av arterioler och venuli. De farmakologiska effekterna efter inhalation av Ventavis är: Omedelbar vasodilatation av den pulmonella artärbädden med en åtföljande avsevärd förbättring av lungartärtrycket, lungkärlmotståndet, cardiac output och Sv02. Den vasodilaterande effekten i lungorna efter inhalerat iloprost har en duration av 1-2 timmar.</p>\n<h3>Metabolism: </h3>\n<h3>Interaktioner:</h3>\n<p><strong>Graviditet/amning:</strong> Gravida ska undvika att exponeras för Ilomedin. Gäller även vårdpersonal!</p>\n<p><strong>Övrigt:</strong> Använd handskar, riskmunskydd och skyddsglasögon/visir vid risk för stänk. Anses som allergen.</p>\n<p><strong>Källa:</strong> Alfresco Ilomedin – Iloprost Doknr 17454, 2019-05-24. Alfresco – Ventavis doknr 33829, 2019-12-09.</p>", "category": "Läkemedel"}, {"title": "INTEGRELIN® (eptifibatid)", "html": "<p><strong>INDIKATIONER:</strong>  I.v trombocythämmare användbar vid stentning. Har ersatt Reopro pga mer gynnsam säkerhetsprofil och kortare halveringstid. Är avsett att användas tillsammans med acetylsalicylsyra och ofraktionerat heparin. Används ex efter stentning av intrakraniell artär. Brukar då ges under 16-24 h, om ingen blödning så byter man till Efient. Kan ges vid tidig hjärtininfarkt eller instabil angina.</p>\n<p><strong>KONTRAINDIKATIONER:</strong> Kreaclearence < 30 ml/min (FASS). FASS med fokus på behandling av hjärtat: Genomgången stroke senaste 30 dagar eller tid. hemorragisk stroke. Intrakraniella sjukdomar med risk för blödning mm mm Allt som gör att pat. kan blöda.</p>\n<p><strong>BIVERKAN:</strong> Blödning, flebit AV-block, förmaksflimmer, maligna arytmier. Trombocytopeni? Alfresco: Om TPK sjunker till <100x109/L eller om akut svår trombocytopeni observeras, bör utsättning ske. Om TPK minskar med 50% från behandlingsstart betraktas det som akut svår trombocytopeni.</p>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong>  1 flaska på 100 ml med löning av koncentration på  0,75 mg/ml.</p>\n<p><strong>DOSERING:</strong> Efter stentning av intrakraniell artär: 180 mikrog/kg på angiolab, därpå infusion på 2 mikrog/kg/min. Vid krea-clearence 30 - 50 ml/min ges samma bolusdos men infusion på 1,0 mikrog/kg/min (FASS). <strong>Egen beräkning gällande boslusdos</strong>: Koncentration på Integrelin = 0,75 mg/ml = 750 mikrogram/ml. Bolus i <strong>ml</strong> med Integrelin 0,75 mg/ml = (Viktkg <em> 180) / 750 Gäller dosering efter vikt eller idealvikt? Alfresco hjärtintervention: Effekt mäts med ACT målvärde 200-250 sekunder. <strong>Vikt</strong> (kg)<strong> </strong>Dos (<strong>mikrog/min</strong>)<strong> </strong>infusionshastighet <strong>med LM-</strong>konc. <strong>0,75 mg/ml</strong> <strong>Total mängd 24 h</strong> 50 100 8,0 ml/h 192 55 110 8,8 ml/h 211 60 120 9,6 ml/h 230 65 130 10,4 ml/h 250 70 140 11,2 ml/h 269 75 150 12,0 ml/h 288 80 160 12,8 ml/h 307 85 170 13,6 ml/h 326 90 180 14,4 ml/h 346 95 190 15,2 ml/h 365 100 200 16,0 ml/h 384 <strong>PM Alfresco</strong> formel kontrollräkning infusion<strong>:</strong> <strong> (vikt</em>dos<em>60min) / konc    Ex: (70 kg </em> 2 mikrog <em> 60 min) / (1000</em>0,75) = 11 ml/h </strong>Dosjustering: **På NIVA brukar de göra dosjusteringar om 10%.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<p><strong>BLANDBARHET:</strong> Eptifibatid är EJ blandbart med Furosemid.</p>\n<p><strong>VERKNINGSMEKANISM:</strong> Trombocythämmare användbar vid stentning. Reversibel hämning genom att hämma bindning av fibrinogen och vWF till GPIIb/IIIa-receptorer.</p>\n<p><strong>METABOLISM:</strong> Effekten är helt reverserad vid 4 h efter avstängs infusion.</p>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<p><strong>KÄLLA:</strong> PM KS Neurointervention”Trombocythämning vid akut stentning av cervikala eller intrakraniella artärer”.</p>", "category": "Läkemedel"}, {"title": "ISOPRENALIN", "html": "<p>ISOPRENALIN</p>\n<p><strong>Indikationer:</strong> **Extrem bradykari, AV-block II-III, inför ev. pacemakerinläggning, AV-block och hjärtsvikt till följd av överdosering av vissa LM.</p>\n<p><strong>Kontraindikationer:</strong> **Försiktighet vid ventrikulära arytmier, hypertoni, ischemisk hjärtsjukdom, diabetes, hyperthyreos.</p>\n<p><strong>Biverkan:</strong> **Ventrikulära takyarytmier, blodtrycksfall. Innehåller sulfit, kan ge överkänslighetsreaktion.</p>\n<h3>Förpackning:</h3>\n<p><strong>Dosering:</strong> <strong> </strong>THORAX / TEMA HJÄRTA-KÄRL<strong> </strong>Doseringsschema för infusionspump:<strong> Injektionskoncentrat 0,2 mg/ml. 1 ampull innehåller 1 mg (5 ml). Spädning: 5 ml injektionskoncentrat (1 mg) tillsätts till 245 ml Glukos 50 mg/ml. Lösningens koncentration = 4 mikrog/ml. </strong>Startdos<strong> </strong>0,01 mikrog/kg/min (ev. högre startdos vb). <strong>Doseringsintervall </strong>0,01 – 0,15 mikrog/kg/min. Dosjustering efter HF och ev. arytmier. Ges i stor ven. Inotrop och kronotrop effekt. Perifer vasodilatation (BT-fall), bronkodilatation. Arytmogent (ventrikulära arytmier). Doseringstabell:<strong> </strong>Färdigberedd lösning isoprenalin 4 μg/ml. Infusionshastighet ml/timme <strong>Kroppsvikt</strong> 41-50 kg 51-60 kg 61-70 kg 71-80 kg 81-90 kg 91-100 kg 101-110  kg 111-120 kg 121-130 kg 0,01 μg/kg/min 7 8 10 11 13 14 16 17 19 0,02 μg/kg/min 14 17 20 23 26 29 32 34 38 0,05 μg/kg/min 34 41 49 56 64 71 79 86 94 0,10 μg/kg/min 68 83 98 113 128 142 158 173 188 0,15 μg/kg/min 101 124 146 169 191 214 236 259 281</p>\n<h3>Duration:</h3>\n<p><strong>Verkningsmekanism:</strong> Syntetisk katekolamin med i det närmaste enbart beta-stimulerande effekt. Positivt kronotrop och inotrop effekt samt minskar perifer resistens.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning: </h3>\n<p><strong>Övrigt:</strong> Ex hållbarhet mm.</p>\n<p><strong>Källa: </strong>PM från tema hjärta kärl, samt PM IMA/MIMA.</p>", "category": "Läkemedel"}, {"title": "KALIUM", "html": "<h3>Perifer infart</h3>\n<p>Kalium är mkt kärlretande och måste spädas innan det ges i perifer ven. Max K+ koncentration 60 mmol/liter infusionsvätska. Ge maximalt 10-15 mmol K/h (240-360 mmol K/dygn) /PM NIVA. Ofta används bärare glukos som påminnelse att inte ge allt som bolus, dock orsakar glukosinfusionen att K+ går intracellulärt.</p>\n<h3>CVK</h3>\n<p>Om kalium ges i CVK kan man ge outspädd Addex-Kaliumklorid 2 mmol/ml. Ges alltid med motorspruta eller infusionspump.</p>\n<p>Ge maximalt 10-15 mmol K/h (240-360 mmol K/dygn) /PM NIVA.</p>\n<p>Om extrem livshotande hypokalemi föreligger, lägre än 2 mmol/L, kan upp till 40 mmol K/h ges under kort tid och med kontinuerlig EKG-övervakning och frekventa kaliumprover (ex 1 ggr/h).</p>\n<p>Källa: PM KS, NIVA, <em>Addex-Kaliuminfusion.</em></p>", "category": "Läkemedel"}, {"title": "Kengrexal® (Kangrelor)", "html": "<h3>INDIKATIONER:</h3>\n<h3>KONTRAINDIKATIONER:</h3>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong></p>\n<p><strong>DOSERING:</strong> Se narkoskortet ”<em>Trombocythämning efter stentning på neuro</em>” På NIVA dosjusterar man infusionen med ändringar om 10%. Det har inte framgått om de doserar enligt idealvikt eller ej.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<p><strong>ÖVRIGT:</strong> Enl. neuroangiointervention så behöver Kengrexal hjälp av ASA för tillräcklig trombocythämning efter stentning. Det behöver inte integrelin.</p>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "KEPPRA® (Levetiracetam)", "html": "<p><strong>Indikationer:</strong> <em>Monoterapi</em> vid partiella anfall med eller utan sekundär generalisering från 16 åå. <em>Tilläggsbehandling </em>dito ovan men från 4 åå. Myokloniska anfall vid juvenil myoklonisk EP från 12åå. Primärt generaliserade tonisk-kloniska anfall från 12 åå vid idiopatisk generaliserad EP.</p>\n<p><strong>Kontraindikationer:</strong> Allergi mot substansen eller hjälpämnen.</p>\n<p><strong>Biverkan:</strong> Nasofaryngit, somnolens, huvudvärk, utmattning, yrsel.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> Lösning 100 mg/ml. Kan blandas med ca 100 ml NaCl 9mg/ml.</p>\n<p><strong>Dosering:</strong> <strong>På IVA:</strong> 500 mg x 2 är profylaxdos. Krampande patient ex SAH: Ge 2 g direkt. Sätt sedan in på 1 g x 2 (behandlingsdos). Obs på att dos kan behöva reduceras vid sänkt GFR, se FASS. FASS: Samtliga indikationer, vuxna och ungdomar 12-17 år >50 kg: 500 mg x 2. Kan ökas upp till 1500 mg x 2 beroende på respons och tolerabilitet. Dosökning var 4e vecka. Vid utsättning så trappas dosen ut var 4e vecka. Övergång från p.o. behandling till i.v. eller tvärt om kan göras direkt utan titrering. Samma dos och administreringsfrekvens.</p>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet: </h3>\n<p><strong>Duration:</strong> T1/2: 7 h (+-1). Huvudsaklig utsöndring via urin (95%). Nedsatt leverfunktion påverkar ej.</p>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Inte helt kartlagd. Påverkar cellernas basala egenskaper och neurotransmission.</p>\n<p><strong>Metabolism: </strong>Upptaget av tabletter är fullständig och p.o. dos motsvarar i.v. dos.</p>\n<p><strong>Interaktioner:</strong> **Minskar eliminationen av Probenecid, Metotrexat.</p>\n<p><strong>Graviditet/amning:</strong> Grav B:3. Amning Grupp III. Utsöndras i bröstmjölken och amning rek. ej.</p>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> FASS. Kollega.</p>", "category": "Läkemedel"}, {"title": "KETOGAN", "html": "<p>Kan men måste ej spädas til 1 mg/ml. Ospädd: Dra upp 3 ampuller (15 mg=3ml) i en 5 ml spruta.</p>", "category": "Läkemedel"}, {"title": "KORTISONPREPARAT / KORTISON / GLUKOKORTIKOIDER   - EFFEKT", "html": "<p><em>Källa: Internetmedicin, hämtad 2025-01-29.</em> Notera att den antiinflammatoriska effekten av 100 mg Solu-Cortef (hydrokortison) motsvarar 3 mg Betapred (Betametason). Men du får dock ingen mineralkortikoid effect om du ist ger Betapred.</p>", "category": "Läkemedel"}, {"title": "LORAZEPAM / ATIVAN® / TEMESTA® (tabl)", "html": "<p><strong>Indikationer:</strong> Sedering på IVA om andra medel är slut. Status EP (alternativ till Diazepam). Bensabstinens.</p>\n<p><strong>Kontraindikationer:</strong> Sömnapné, andningsinsuf, myastenia gravis, svår leverinsuf.</p>\n<p><strong>Biverkan:</strong> Ackumulation av propylenglykol är en känd potentiell biverkan av lorazepam, i synnerhet vid högre doser under lång tid. Infusionsdoser >4-6 mg/h har föreslagits öka risken men monitorering av S-osmolalitet och observans på ökande anjon-gap, laktat- och kreastegring (akut tub. nekr.)  är sannolikt att rekommendera redan vid lägre dosnivåer. Vanliga: Förvirring, depression, sedering, sömnighet, ataxi, yrsel, muskelsvaghet, asteni.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> Lorazepam 4 mg/ml. Tablett: 1 mg.</p>\n<p><strong>Dosering:</strong> IVA-sedering: 0,01 - 0,1 mg/kg/h. Status EP: 4 mg iv (2 mg om kroppsvikt < 40 kg). Injektionstid ca 2 min. Insomni eller enstaka siutaionsstress: En daglig engångsdos på 1-2 mg. Vanligen vid sänggående. Ångest: 2-3 mg uppdelat på flera doser. 1 mg Lorazepam motsvarar: 10 mg Diazepam, 1 mg Flunitrazepam.</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<p><strong>Tillslagshastighet: </strong>Oralt:<strong> </strong>Absorberas snabbt och nästan fullständigt. Högst plasmakoncentration uppnås inom cirka 2h efter intag.</p>\n<p><strong>Duration:</strong> Halveringstid 10-20 h.</p>\n<h3>Blandbarhet:</h3>\n<h3>Verkningsmekanism:</h3>\n<p><strong>Metabolism: </strong>Konjugeras med glukoronsyrai levern till inaktiv glukoronid. Inga aktiva metaboliter. Clearance av lorazepam rapporterades inte vara förändrad hos patienter med lindrigt till måttligt nedsatt leverfunktion (hepatit, alkoholinducerad cirros).</p>\n<p><strong>Interaktioner:</strong> Additativa effekter med andra centraldepressiva medel, ex alkohol, barbiturater etc.</p>\n<p><strong>Graviditet/amning:</strong> Graviditet: Kategori C. Bör inte anvndas under graviditet. Ffa inte under 1a och sista trimestern. Passerar placernta. Amning: Grupp III. Lorazepam har uppmäts i bröstmjölk och effekt har setts hos barn. Ska inte ges till ammande mammor.</p>\n<p><strong>Övrigt:</strong> Stor beroenderisk: Snabbt tillslag, och hög potens.</p>\n<p><strong>Källa:</strong> Chef på PMI. Fass.</p>", "category": "Läkemedel"}, {"title": "MAGNESIUM", "html": "<p><strong>Indikationer:</strong> Hypomagnesemi, Torsades de pointes, Digoxinförgiftning.</p>\n<p><strong>Kontraindikationer:</strong> Myastenia gravis, ev. även andra muskelsjukdomar: Kan utlösa muskelsvaghet.</p>\n<h3>Biverkan:</h3>\n<h3>Förpackning:</h3>\n<h3>Tillredning:</h3>\n<p><strong>Dosering:</strong> 20-30 mmol Mg++ i 100 ml NaCl, långsam infusion på ca 6 h.</p>\n<h3>Duration:</h3>\n<h3>Ve
