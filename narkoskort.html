<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Narkoskort</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap');

:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2333; --border:#30363d;
  --p:#58a6ff; --s:#f78166; --l:#56d364; --b:#d2a8ff;
  --text:#e6edf3; --muted:#8b949e; --dim:#484f58;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(13,17,23,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 14px}
.header-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:-0.5px;flex-shrink:0}
.logo span{color:var(--p)}
.search-wrap{flex:1;position:relative}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 11px 6px 32px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
#search:focus{border-color:var(--p)}
#search::placeholder{color:var(--dim)}
.badge{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);flex-shrink:0}
.filters{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fb{flex-shrink:0;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.fb.active,.fb:hover{color:var(--bg)}
.fb[data-cat="all"].active,.fb[data-cat="all"]:hover{background:var(--text);border-color:var(--text)}
.fb[data-cat="Praktiskt"].active,.fb[data-cat="Praktiskt"]:hover{background:var(--p);border-color:var(--p)}
.fb[data-cat="Sjukdomstillstånd"].active,.fb[data-cat="Sjukdomstillstånd"]:hover{background:var(--s);border-color:var(--s)}
.fb[data-cat="Läkemedel"].active,.fb[data-cat="Läkemedel"]:hover{background:var(--l);border-color:var(--l)}
.fb[data-cat="Barn"].active,.fb[data-cat="Barn"]:hover{background:var(--b);border-color:var(--b)}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 93px)}

/* SIDEBAR */
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.ci{padding:9px 13px;border-bottom:1px solid rgba(48,54,61,0.4);cursor:pointer;transition:background .1s;display:flex;align-items:flex-start;gap:7px}
.ci:hover{background:var(--surface)}
.ci.active{background:rgba(88,166,255,0.1);border-left:2px solid var(--p);padding-left:11px}
.ci.active[data-cat="Sjukdomstillstånd"]{background:rgba(247,129,102,0.1);border-left-color:var(--s)}
.ci.active[data-cat="Läkemedel"]{background:rgba(86,211,100,0.1);border-left-color:var(--l)}
.ci.active[data-cat="Barn"]{background:rgba(210,168,255,0.1);border-left-color:var(--b)}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dot.Praktiskt{background:var(--p)}.dot.Sjukdomstillstånd{background:var(--s)}.dot.Läkemedel{background:var(--l)}.dot.Barn{background:var(--b)}
.ct{font-size:12px;font-weight:500;color:var(--text);line-height:1.35}
.no-res{padding:20px;text-align:center;color:var(--dim);font-family:'DM Mono',monospace;font-size:11px;display:none}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:22px 26px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim);text-align:center}
.placeholder .ico{font-size:44px;margin-bottom:14px;opacity:.3}
.placeholder p{font-family:'DM Mono',monospace;font-size:11px}

/* CARD HEADER */
.card-header{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.cat-badge{font-family:'DM Mono',monospace;font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:8px;display:inline-block}
.cat-badge.Praktiskt{background:rgba(88,166,255,.15);color:var(--p)}
.cat-badge.Sjukdomstillstånd{background:rgba(247,129,102,.15);color:var(--s)}
.cat-badge.Läkemedel{background:rgba(86,211,100,.15);color:var(--l)}
.cat-badge.Barn{background:rgba(210,168,255,.15);color:var(--b)}
.card-title-main{font-family:'Syne',sans-serif;font-weight:700;font-size:19px;line-height:1.2}

/* CARD BODY */
.card-body p{margin-bottom:9px;font-size:13.5px;line-height:1.7;color:var(--text)}
.card-body h3{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.card-body ul{margin:6px 0 10px 18px}
.card-body li{margin-bottom:4px;font-size:13.5px;line-height:1.6}
.card-body strong{font-weight:600;color:var(--text)}
.card-body em{color:var(--muted);font-style:italic}
.card-body a{color:var(--p);text-decoration:none}
.card-body a:hover{text-decoration:underline}
.card-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px;border-radius:var(--r);overflow:hidden}
.card-table th,.card-table td{padding:7px 11px;text-align:left;border:1px solid var(--border);vertical-align:top;line-height:1.5}
.card-table th{background:var(--surface2);color:var(--muted);font-weight:500;font-family:'DM Mono',monospace;font-size:11px}
.card-table tr:nth-child(even) td{background:rgba(28,35,51,.35)}
.card-table tr:hover td{background:var(--surface)}

/* MOBILE */
@media(max-width:600px){
  .layout{flex-direction:column;height:auto}
  .sidebar{width:100%;height:220px;border-right:none;border-bottom:1px solid var(--border)}
  .content{flex:none;min-height:65vh;padding:14px}
  .logo{font-size:15px}
}
.back-btn{display:none;align-items:center;gap:5px;background:none;border:none;color:var(--p);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;padding:0 0 10px 0}
@media(max-width:600px){.back-btn{display:flex}}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="logo">Narkos<span>kort</span></div>
    <div class="search-wrap">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Sök i alla kort..." autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <span class="badge" id="badge"></span>
  </div>
  <div class="filters">
    <button class="fb active" data-cat="all">Alla</button>
    <button class="fb" data-cat="Praktiskt">Praktiskt</button>
    <button class="fb" data-cat="Sjukdomstillstånd">Sjukdomstillstånd</button>
    <button class="fb" data-cat="Läkemedel">Läkemedel</button>
    <button class="fb" data-cat="Barn">Barn</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="no-res" id="no-res">Inga träffar</div>
  </aside>
  <main class="content" id="content">
    <div class="placeholder" id="placeholder">
      <div class="ico">📋</div>
      <p>Välj ett kort i listan</p>
    </div>
    <div id="card-view" style="display:none">
      <button class="back-btn" id="back-btn" onclick="showSidebar()">← Tillbaka</button>
      <div class="card-header">
        <span class="cat-badge" id="card-cat"></span>
        <h1 class="card-title-main" id="card-title"></h1>
      </div>
      <div class="card-body" id="card-body"></div>
    </div>
  </main>
</div>

<script>
const CARDS=[{"title": "ALLMÄNT PRAKTISKT PÅ HUSET (NKS)", "html": "<p>Kod jourdörrar: 1113 ska funka för alla jourdörrar. Kod primärjoursrummet: 3412.</p>", "category": "Praktiskt"}, {"title": "AMNING EFTER ANESTESI", "html": "<p><strong>Källa:</strong> Medicinsk rutin, ANELÄK Amning efter anestesi, Jämtlands landsting, 2016. Även <em>Anestesi och amning nr 3<strong>(SÖSAB-S-</strong>2438345<strong>).</strong> Se även Läkartidningen: Skall ammande mödrar slänga <strong>mölken</strong> efter narkos?</em> <strong><em>Bakgrund: </strong></em>Amning är bra för moder och barn och bör uppräthållas om möjligt. Det är endast den ej proteinbundna fraktionen av läkemedel i plasma som går över i modersmjölken. Överföringen är en jämviktsfunktion mellan plasma och modersmjölk vilket innebär att när läkemedel elimineras från plasma elimineras det också ur modersmjölken. Således kan mammor när de är vakna och alerta amma friska normalburna barn. Enligt artikeln i läkartidningen anges: ”Eftersom läkemedel redistribueras från möjlken och tillbaka till mammans plasma när koncentrationen i plasma sjunker, är det generellt sett inte nödvändigt att pumpa ur och slänga fösta portionen mjölk” Nedan nämns läkemedel och lämplighet, och avser engångstillfälle och inte långtidsbehandling. Vid sjuka eller prematura barn bör man diskutera med neonatolog innan.</p>\n<p><strong>Riskmedel:</strong> Ge ej diazepam, petidin, oxycodone, Tramadol. Ge inte upprepade doser av bensodiazepiner eller opioider, ffa kodein, Palladon® (hydromorfon).</p>\n<p><strong>Stesolid</strong>®<strong> (</strong>Diazepam<strong>):</strong> Lång T1/2, Undvik /SÖS. (Jämtland:  använd m. försiktighet, engångsdos OK).</p>\n<p><strong>Midazolam</strong>:<strong> </strong>Kort T1/2, efter 4 h finns inget kvar i mjölken. OK.</p>\n<p><strong>Fentanyl</strong>:** Liten grad över till mjölken, kort T1/2, OK att använda om singeldos.</p>\n<p><strong>Morfin</strong>:** T1/2 i bröstmjölk 3 h. En dos ok, vid långtidsbruk/upprepning finns risk för ansamling av metaboliten morfin-6-glukoronid som har aktiv effekt och T1/2 hos nyfödda är 6-7 ggr längre än hos vuxna. Undvik upprepade doser.</p>\n<p><strong>Palladon® (</strong>Hydromorfon<strong>):</strong> Ansamlas i bröstmjölk! Lång T1/2. Bör därför undvikas till ammande mammor, ffa upprepade doser!</p>\n<p><strong>Petidin</strong>:<strong> </strong>Kort T1/2 men aktiv metabolit och längre T1/2 hos barn, risk för ackumulering. Undvik!</p>\n<p><strong>Kodein:</strong> Blir morfin, 2-10% av befolkningen är snabba metaboliserare av kodein till morfin= mer morfin i blodet. Undvik / SÖS Undvik mer än enkeldos /Jämtland.</p>\n<p><strong>Rapifen</strong>® (<strong>Alfentanil</strong>):** Konc i mjölk högre än för fentanyl men enstaka doser ok.</p>\n<p><strong>Ultiva</strong>® (<strong>Remifentanil</strong>):** Enl FASS rekommenderas 24 timmars amningsuppehåll, pga avsaknad av data. Sannolikt inga problem pga endast 10 min context sensitive half life, anses därför säkert.</p>\n<p><strong>OxyNorm</strong>® <strong>(</strong>Oxycodone<strong>)</strong>:** Ger CNS depression hos ca 20% av spädbarnen, dessutom aktiv metabolit som är 14 ggr per potent än oxycodonet. Undvik!</p>\n<p><strong>Propofol</strong>:** fettlösligt, lagras således i fettväv, T1/2 3-12h pga redistribuering. Låga nivåer i mjölk, som högst efter 2-4 timmar, efter 24 timmar 6 % kvar. Propofol oralt leder till nedbrytning i magtarm kanalen, mycket lite når barnets blod.  OK att amma när mamman vaknat.</p>\n<p><strong>Tiopenthal</strong>:** kort T1/2, låga nivåer i mjölk, engångsdos = OK, infusion ger risk för ackumulering.</p>\n<p><strong>Gas:</strong> Studier endast på halotan som återfanns i mjölk. Konsensus dock att det är ok att amma när mamman är vaken och alert.</p>\n<p><strong>Ketamin:</strong> Inga studier på bröstmjölk, relativt kort T1/2, bör vara ok att amma om endast enstaka doser är givna.</p>\n<p><strong>Muskelrelax:</strong> Passerar biologiska membran dåligt, teoretiskt minimal passage till mjölk och barnets absorbtion från mag tarm kanalen anses som försumbar.</p>\n<p><strong>Celocurin</strong>® (<strong>Succinylkolin</strong>)**: Kort T1/2, OK.</p>\n<p><strong>Neostigmin</strong>:** Nyare studier med mer känslig teknik visar att det passerar över till mjölken. Oklart om det påverkar barnet.</p>\n<p><strong>Primperan</strong>, <strong>Ondansetron</strong>, <strong>Betapred</strong>:** OK/Jämtland. SÖS: Är Klass 2 LM, ge om tydlig indikaiton finns.</p>\n<p><strong>Bupivacain</strong>, <strong>ropivacain</strong>, <strong>lidocain</strong>:<strong> OK. </strong>Farmakokinetik:<em>* </em> Överföring från mammans blod till bröstmjölken är en jämnviktsfunktion vilket innebär att koncentrationen i mjölken speglar koncentrationen i mammans blod. <em> Fettlösliga ämnen kommer att koncentreras i bröstmjölken pga högre fettinnehåll jmf blod. </em> Pga lägre pH i mjölken har svaga baser lättare att ta sig över till mjölken. Svaga syror och laddade ämnen har svårare att passera. <em> Mjölk/plasma-kvot finns för en del LM och man kan därmed räkna ut barnets relativa dygnsdos. </em> Risk för ackumulering vid lång T1/2 eller vid LM som har aktiva metaboliter. <em>Kollega: </em>Den första mjölken är väldigt lite så då behöver man inte vara rädd efter ett sovsnitt.</p>", "category": "Praktiskt"}, {"title": "AnaConDa", "html": "<h3>INHALATIONER</h3>\n<p>Man kan inhalera det mesta alltså atrovent, ventolin, corotrop, ilomedin? Men INTE acetylcystein.</p>\n<h3>PATIENTEN BEHÖVER BEFUKTNING</h3>\n<p>Det finns 3 val om pat. får torra luftvägar under AnaConDa-behandling: 1. Ta bort AnaConDan och kör aktiv befuktning som vanligt. 2. Nebusilera koksalt. Nebusilatorn sätts mellan AnaConDan och ETT. 3. Koppla AnaConDan på inandningsskänkeln precis innan respiratorn. Då är AnaConDan endast en förgasare och ej reflektor. Man kan då ha aktiv befuktning? KOLLA UPP. Man får även mindre dead space. Men det går åt ca 4-5 ggr mer gas. Mät då ej gas-konc. vid AnaConDan utan vid tuben såsom man skulle mätt etCO2.</p>", "category": "Praktiskt"}, {"title": "ARTÄRKATETER / ARTÄRNÅL / ARTÄR", "html": "<p><strong>Artärkateter för a. </strong>brachialis**</p>\n<p>Vygon 115.090: Arterial leadercath 3 Fr, length 8 cm, ytterdiameter 0,9 mm, innerdiameter 0,6 mm.</p>\n<p><strong>Artärkateter</strong> för a. femoralis**</p>\n<p>Teleflex Arrow arterial catheterization set: 18 Ga, 23 cm lång.</p>", "category": "Praktiskt"}, {"title": "AVKLIPPT KUFF TILL ENDOTRACHEALTUBEN", "html": "<p>Stoppa in blå venflon och backa ut nålen. Koppla enligt nedan. Håller jättebra. <em>Version 2024-09-03.</em></p>", "category": "Praktiskt"}, {"title": "BARN / NYFÖDDA – LITE BLANDADE ANTECKNINGAR", "html": "<p>-Diafragmabråck: Dessa får inte ventileras, om man blåser upp magen så fylls hela thorax, ska intuberas direkt.</p>", "category": "Praktiskt"}, {"title": "BARN", "html": "<p><strong>INFÖR OMHÄNDERTAGANDE AV </strong>SVÅRT <strong>SJUKT BARN</strong></p>\n<p><strong>WETFLAG</strong> W: Weight. Estimated Weight = (Age+4) x 2 E: Electricity for defibrillation. Generally Defibrillation = 4 joules/kg T: Tube Size. Beyond 1 year: Use the APLS tube formula: Tube = (Age / 4 + 4) F: Fluid dosing. Boluses are 20ml/Kg of Normal saline L: Lorazepam/Midazolam dosing. A: Adrenaline dosing. G: Glucose dosing. Dose is 2-2.5ml/kg of 10% Glucose</p>", "category": "Praktiskt"}, {"title": "BLOCKADER / NERVBLOCKAD / PLEXUS", "html": "<p><strong>LÄKEMEDEL</strong> <strong>Ropivacain</strong> 5 mg/ml<strong>: Används som standard till samtliga blockader hos handkirurgen. </strong>Natrium-Bikarbonat 50 mg/ml<strong>: Används som adjuvant hos individer med mycket långsamt tillslag. Ytterst lite behövs. På handkirurgen tog man och aspirerade och coatade en 20-ml-spruta och lämnade kvar en minimal mäng i toppen innan man aspirerade Ropivacainet. Man sa att max använda 0,1-0,15 ml i en 20 ml spruta. </strong>Nålar<strong> Single-shot: Brukar använda 22 G. Införsel av smärtkateter: Använder tjockare nålar ex 18G. Blockadkatetrar ska inte ligga längre än 2 dagar. Därefter är i princip alla infekterade. </strong>ANATOMI OCH <strong>ULTRALJUD</strong> - Perifera nerver är ofta lite mer hypoekogena proximalt och blir mer och med tydliga likt bikakor lägre ut distalt. - En respons på nervstimulering som är <0,5 mA talar för att nålspetsen är intraneural (=innanför epineuriet) och man bör därmed backa nålen. - Injicering bredvid nerven brukar göra att nerven lyfts upp och syns tydligare. - Brachialplexat: Består av nervrötter från C5-C8 and ventrala T1 rami. Plexat delas upp i sektioner: Rötter, Trunks (superior C5-C6, middle C7, inferior C8 T1. Grenar: Medianus, ulnaris, radioalis, musklocutaneus.  <strong>OMRÅDE SOM SKA BEVÖDVAS</strong> <strong>Axelkirurgi</strong>: <strong>Interskalen. </strong>Arm nedom axel: <strong>- </strong>Någon av axillär, supraclav eller infraclav. - Det finns ingen evidens som talar för att någon blockad är bättre än den andra när motsvarande expertis utför varje teknik. - Supraclav och infraclav är användbara när man inte kan abducera armen. - Supraclav passar bra ex vid humeruskirurgi. - Infraclav är bra vid smärtkateterinläggning så katetern inte ruckas lika lätt. <strong>OLIKA BLOCKADER OCH DOSER</strong> <strong>Interscalen</strong>:<strong> Primära blockaden för </strong>axelkirurgi<strong>. Dock är phrenicusblockad vanlig komplikation även vid låga doser LA. Interscalen ger en pålitlig högre brachialplexusblockad, och cervicalplexusblockad vilket är nödvändigt för axelkirurgi. </strong>Supraklav<strong> - Ropivacain 5 mg/ml: 20-30 ml. På SÖS handkiurigen använder man Ropivacain 5 mg/ml. 7,5 anses för starkt. Man ger mellan 20 – 30 ml i supraclav-plexus. Detta kompartment är inte så vaskulariserat så man är inte så rädd för överdos. (Men räkna på dos innan du lägger så att du vet vad du ger förstås). - Kommentarer: Pocket hole viktig för att få radialistäckning. Ibland rider en nerv över nyckelbenet så man behöver komma nära. </strong>Infraklav<strong> - Ropivacain 5 mg/ml. 20 ml, beror på kroppsvikt. - Kommentarer: Man kan leta upp pleura och redan rikta om så att man vet att man riktar i ofarlig ritkning. </strong>Axillarisblockad<strong> - Ropivacain 5 mg/ml. Ca 20 ml, beror på kroppvikt. - Axillarisblockad kan användas till de flesta operationer på underarm, och armbåge. Blockaden är relativt säker även i oerfarna händer. - Kommentarer: </strong>Nervblockader på perifera nerver i armen<strong> - Är bra rescuemetoder. - Ex. medianusblockad där man lägger en kvaddel invid artären i armvecket. </strong>POSTOPERATIV VÅRD<strong> - Finns risk för tryckskador om man ex skulle ligga på bedövad kroppsdel, ex hälar efter ischiadicusblockad. </strong>RISKER** - Munirama’s meta-analysis: Incidens av övergående neurologiska symtom som varar upp till 28 dagar = 9%. (oberoende av ultraljud eller ej).  - Men de flesta skador är övergående och incidensen nervskador är i storleken: 2,2% vid 3 månader, 0,8% vid 6 månader, 0,2% vid 12 månader.</p>", "category": "Praktiskt"}, {"title": "BLANDA LÄKEMEDEL / BLANDBARHET", "html": "<p><strong>Källa: </strong><a href=\"https://janusinfo.se/nyheter/nyheter/2020/blandbarhetstabellerforlakemedelvidcovid19.5.1236f2d817139f5ea7f1edf2.html\" target=\"_blank\">https://janusinfo.se/nyheter/nyheter/2020/blandbarhetstabellerforlakemedelvidcovid19.5.1236f2d817139f5ea7f1edf2.html</a></p>", "category": "Praktiskt"}, {"title": "BLODODLING", "html": "<p><strong>Nya nationella riktlinjer för blododlingar</strong> (2022)** Fortsatt gäller att vid blododling hos patienter med t.ex. centrala infarter ska det odlas från flera lokaler, se nedan! - Blododling ska alltid tas innan insättande av intravenös antibiotikaterapi. - Alla flaskor (normalt 2 flaskpar, dvs 4 flaskor) ska fyllas vid samma tidpunkt från samma perifera stick. - Innan provtagning till blododlingsflaskor bör de första 3-5 mL blod tas i ett annat rör, vilket kan användas till kemi-analyser eller kasseras. Genom att avlägsna den första portionen blod minskas risken för kontamination med hudbakterier - I de fall där patienten har en central infart (till exempel CVK, PAC eller piccline) ska blododling liksom tidigare tas både perifert och från den centrala infarten för bättre diagnostik av kateterrelaterad infektion.</p>", "category": "Praktiskt"}, {"title": "BLOD OCH TRANSFUSION", "html": "<p><strong>Blodgruppering</strong> - Räcker för plasma och trombocyter. Behövs inte någon förenlighetsprövning. <strong>Förenlighetsprövning</strong> - Kan utföras genom BAS-test, eller MG-test. <strong>BAS-test (blodgrupps- och antikroppsscreening-test)</strong> - Giltig 5 dygn. <strong>MG-test (mottagar</strong>e<strong>-givar</strong>e<strong>-test)</strong> - Testar varje ekoncpåse mot patientens plasma för att se om det blir en reaktion. - Görs om BAS-testet har fallit ut positivt. BAS-testet screenar för de 3 vanligast erytrocytantikropparna. - Patienter som behöver blod akut kan få nollnegativt blod men det finns risk att pat. reagerar mot det. Akut-plasma bör inte vara ett problem. Källa: Transfusionskonsulten som va lite osäker på sin sak. - MG-testning av påsar tar ca 45-60 min,</p>", "category": "Praktiskt"}, {"title": "BOLT / MIKRODIALYS / MICRODIALYS / PBTO2", "html": "<p><strong>NORMALVÄRDEN</strong> <strong>VÄRDEN</strong> <strong>Normalintervall</strong> - trender och förändringar är oftast viktigare än absolutvärden<strong> Laktat i CNS: 0,6 - 3,8 mmol/L. Pyruvat i CNS: 80 - 213 mikromol/L (median 120, värden kring 100 ses ofta vid ischemi. Laktat/Pyruvat kvot: 16 - 27. >25 ischemi-misstanke, Över 40 betecknas metabol kris. Glycerol i CNS: 50 - 100 mikromol/L. Glukos i CNS: 0,9 - 2,6 (median 2,0). Glutamat 10-15 mikromol/L, höga värden 20-50, mycket höga 100-200, extremt höga 200-500) </strong>- <strong>Tolkning av SAH i riskområden är ofta med rättfram än tolkning vid TBI där patofysiologin är mer heterogen. </strong>Observera<strong> Glukos ↓ </strong>och<strong> Laktat ↓ Pyruvat ↓ = Nedsatt cirkulation. Glukos ↓ </strong>och <strong>Laktat ↑ Pyruvat ↑ = Ökad metabolism. Laktat/Pyruvat kvot ↑ = anaerob metabolism. Glycerol ↑ = Cellmembransönderfall. </strong>Om tecken till brist på nutritionstillförsel eller syrgastillförsel på Bolt, kan <strong>testa </strong>bla<strong> med:</strong> - Minska metabolism med tempkontroll 36 grader eller öka sedering. - Öka CPP. - Släpp upp koldioxid för att få en vasodilatiation. - Kolla ev TCD och kolla om det är ordentliga flöden. - Öka FiO2 något. - Eventuellt öka glukostillförseln. <strong>TOLKNING</strong> - Trend viktigt. Förändringar triggar genomgång av pat. - Lakt/pyruvatkvot upp tolkas i första han som anaerob metabolism men måste vägas ihop med andra parametrar och klinik. Sjunkande glukos stöder att det finns en lokal flödesproblematik. Fallande PBtO2 tillsammans med dessa trender talar starkt för anaerob metabolism och hotande ischemi. - Andra tolkningar av stigande lakt/pyr kvot finns: Mitokondriell störning, syrgasdiffusionsstörning. Generellt tros dessa vara av mer långvarig karaktär. - Nytillkommen glutamatstegrin ihop med ökad L/P-kvot kan stärka misstaken om sann obalans mellan syrgastillförsel och energibehov (det vi slarvigt brukar kalla ischemi) – kan vara ischemi men kan också vara en ökad metabolism (t.ex. EP). Vår egen erfarenhet av glutamat på slutet av 90-talet är att det jämfört med glycerol har större informationsvärde. - Glycerol finns i mätpaketet men informationsinnehållet är omdiskuterat. Snabbt stigande värden till göra nivåer (300-3000) kan signalera EP eller meningit. Baslinjen ökar ofta under vårdtiden och generellt långsamt stigande värden är vanliga och av oklar betydelse. <strong>BLANDAD INFO</strong> BOLT = bult. Bulten har 2 sladdar/kanaler: En mikrodialysslang som har en guldplättering vilket syns på DT. Den andra som egentligen är själva BOlten har i sin spets tryck och PBtO2-mätning. Båda dessa sladdar ligger rätt nära varandra. BOLT-mätningen visas på en dosa som kan länkas till Philipsskåpet. Dosan är överst i rang och efter bortkoppling ska båda enheterna kalibreras. Kolla så att värderna är rimliga och representerar rätt mätning. <strong>PBtO2</strong> - Att jaga ett högt pO2 om du har sjunkande pbtO2 är kansek inte till hjälp, se till att saturationen är bra. - Evidens finns för att ett värde under 10 under >25 min är associerat med sämre utfall och ökad mortalitet. Många har som mål att ha 15-20 som behandlingsmål. / Oxford textbook pf crit care. <strong>MIKRODIALYS</strong> <strong>Syfte</strong> - Följa ämnesomsättningen i hjärnvävnaden hos pat. m. skallskada och därmed en tidig kemisk indikation på t.ex. ischemi och cellsönderfall. <strong>Praktiskt</strong> - Kateter i hjärnan heter B (brain) - kateter. Om det finns en i buken så heter den C-katetern. - Provrören ”Vialerna” byts varje timme och analuseras på NIVA i microdyalisapparaten.</p>", "category": "Praktiskt"}, {"title": "BOWMAN FLÖDESMÄTARE - NEUROINTENSIVVÅRD", "html": "<p>Bowman Perfusion Monitor® (BPM). Mäter/kvantifierar hjärnvävnadens blodflöde (perfusion) i realtid. Enheten är ml/100g/min. Värden <20 är mkt oroväckande. Normalt hos frisk är typ 60-100. Behandlingsmål brukar vara 20-50. Är inte MR-kompatibel. Har lägre evidens än pbtO2 och mikrodialys. Tekniskt: - PPA ska ligga på 0-2. Om >4 så är det för högt. Det är ett pulsatilt index och om högt så är katetern för nära ett blodkärl. - K 4,8 -5,9 är OK. Det har att något att göra med hur nära grå? substans tror jag. - Katetern värmer vävnaden 2 grader  celcius i distala änden och mäter temperaturförändringen proximalt på katetern. Därför kan den ej mäta vid hög feber vid temp typ 39,5 då man inte vill skada hjärnvävnad.</p>", "category": "Praktiskt"}, {"title": "BUFFRING VID ACIDOS", "html": "<p>För- och nackdelar jämte indikationer för olika buffertlösningar <em>Källa: Intensivvård, Rupertsson, 2016.</em></p>\n<table class=\"card-table\">\n<tr><th></th><th><strong>TRIS (THAM)</strong></th><th><strong>NATRIUMBIKARBONAT</strong></th><th><strong>TRIBONAT</strong></th></tr>\n<tr><td><strong>Nackdelar</strong></td><td>Ej bruksfärdig (addex) Utsöndras via njurarna Måste ges i central infart</td><td>Ökar PaCO2 temporärt. Buffrar ej intracellulärt. Tenderar att ge iatrogen alkalos. Genererar höga S-Na+. Dålig hållbarhet vid förvaring.</td><td>Tris utsöndras via njurarna. (Tribonat innehåller 2/3 Tris och 1/3 natriumbikarbonat).</td></tr>\n<tr><td><strong>Fördelar</strong></td><td>Sänker PaCO2 även intracellulärt</td><td>Kan ges i perifer ven.</td><td>Ger <strong>stabilt PaCO2.</strong> Buffrar även intracellulärt. Mindre Na+ innehåll och mindre osmotisk belastning. Bruksfärdig. Kan ges i perifer infart.</td></tr>\n<tr><td><strong>Indikationer</strong></td><td><strong>Då akut sänkning av PaCO2 önskas.</strong> Ofta måste denna terapi kombineras med respiratorterapi.</td><td>Metabol acidos med lågt S-Na+.</td><td>Metabol acidos då endast perifer venväg finns. Hjärtstopp, cirkulationssvikt, status asthmaticus, diabetisk ketoacidos, förgiftningar.</td></tr>\n</table>\n<p>FÖR DOSERING OCH ANVÄNDNING AV RESPEKTIVE LÄKEMEDEL, SLÅ UPP SEPARAT ENLIGT LÄKEMEDELSNAMNEN.</p>", "category": "Praktiskt"}, {"title": "BRONKBLOCKARE / Arndt endobronkialt blockeringsset", "html": "<p><strong>Användning av Arndt </strong>endobronkialt<strong> </strong>blockeringsset<strong> </strong>SE NÄSTA SIDA FÖR STEG FÖR STEG-INSTRUKTION AV ARNDT-<strong>settet</strong>.<strong> Se även: <a href=\"https://www.cookmedical.com/products/cc_aebs_webds/\" target=\"_blank\">https://www.cookmedical.com/products/cc_aebs_webds/</a> </strong>KOMPONENTER<strong> - Multiadapter som kan kopplas mellan ETT, respirator och där man kan föra igenom bronkoskop och blockerare. - Styrögleenhet som inmonteras genom lumen på den endobronkiala blockeraren och stricker ut ur den distala änden för att forma en lite justerbar styrögla. Ögglans storlek kan justeras genom att föra den djupare eller grundare in via den proximala lumen. - Sugadapter: Följer med för att kunna tömma en lunga vb. Anslutes endast till Luer-lås-anslutningen. </strong>NOTERINGAR<strong> - Ett bronkoskop med liten diameter förs fram genom styröglan för att koppla ihop bronkoskopet och och bronkblockaren. - Styröglan kan avlägsnas efter att blockeraren är på plats. OBS GÅR INTE ALLTID ATT FÅ TILLBAKA! Men hos 9 Fr -blockaren kan styröglan föras tillbaka vid behov av omplacering. - Styröglan kan behöva avlägsnas när man ex ska suga ut luft för att tömma lunga inför kirurgi eller om luft ska passera ut passivt. - Det går även att lägga cpap in i den blockade lungan. </strong>STORLEKAR** 5 Fr: Avsedd för barn 1 år eller äldre. Övriga storlekar är endast för vuxna. Minsta storlek på ETT vid Fr 9,0 är 7,5 mm, Fr 7,0 är 6,0 mm, och Fr 5,0 är 4,5 mm. När Fr 7,0 används vid ETT 6,0 mm kan högre luftvägstryck uppstå/minskad minutventilation. Källa: Förpackningsinfon Cook Medical samt info online på cookmedical.com</p>", "category": "Praktiskt"}, {"title": "BRONKOSKOPI PÅ IVA", "html": "<p><strong>Förberedelser</strong>:**</p>\n<p>* Gå över till tryckkontroll på respen. 70-80% FiO2.</p>\n<p>* Stäng V-drän om pat. har ett sådant.</p>\n<p>* Ge propofolbolus / öka propofolinfusion</p>\n<p>* Ge Rapifen.</p>\n<p>* Ev. Esmeron (olika åsikter om detta). Vissa tycker det är bättre om pat. hostar till för då kommer slem upp som man kan suga.</p>\n<p>* Man kan ex låta pat. inhalera Xyocain men det påverkar borstodlingen.</p>\n<h3>Utrustning</h3>\n<p>* Immskydd.</p>\n<p>* Glidmedel (parafin).</p>\n<p>* Skyddad borste vid behov om odling. Man kan skölja med lite koksalt innan borsten tas.</p>\n<p><strong>SKYDDAD BORSTE / BORSTPROV</strong> – Egenhändig rutin**</p>\n<p>1. Startläge. Innerhylsa inne och vaxplugg på. 2. Vaxplugg skjuts ut och innerhylsan åker ut genom ytterhylsan. 3. Borsten förs ut. 4. Därpå kan man dra in borsten igen med motsatt manöver enl. punkt 3. Sedan dras hela grejen ut från bronkoskåpet. Vissa är noga och vill minska risk för kontamination genom att exempelvis dra in borsten lite längre, ev. sprita av hylsan och sedan sterilt klippa av yttersta delen på ytter/innerhylsan innan man för ut borsten för att klippas ned till odlingsröret.</p>", "category": "Praktiskt"}, {"title": "CABG – POSTOP VÅRD", "html": "<h3>SMÄRTLINDRING</h3>\n<p>Målet är multimodal behandling. OBS! Man ger ej selektiva cox-2-hämmare!</p>\n<p>NSAID är bra om det är lämpligt, är opioidaparande. Naproxen 500 mg x 2 alt 250 mg x 2 från och med postop dag 1 till patienter som inte är allergiska mot NSAID, inte har diabetes, inte har hjärtsvikt NYHA III  el IV, inte tid. NSAID-utlöst ulcus, som har ett normalt postoperativt förlopp på THIVA, och har CystC eGFR >60. - Toradol iv. kan man även ge (muntlig källa).</p>\n<h3>ANTIKOAGULANTIA</h3>\n<p><strong>Trombyl</strong> 160 mg x 1 dagen efter operation. Lägre dos 75 mg x1 vid: samtidig Waranbehandling, hos pat < 60 kg, och vid ökad risk för GI-blödning. <strong>Fragmin</strong> <strong>Inj. s.c. en dos enl. nedan från kvällen dagen efter op. tills mobilisering är genomförd. Fragmin efter koronarkirurgi: (OBS dosjustering vid GFR <30). <60 kg: 2500 IE x1. 60-100 kg: 5000 IE x 1. >100 kg 7500 kg x1. </strong>Plavix<strong> </strong>75 mg x 1 sätts in på vårdavdelning hos pat. som op. för AKS när ingen ökad blödningsrisk bedöms föreligga. Dubbel trombocythämning ges t.o.m. 12 mån. efter AKS. <strong>Brilique</strong> <strong>Pat. som stått på Brilique före operation återinsätts på Brilique 90 mg x 2. OBS! Brilique ska </strong>inte** sättas in på THIVA och startas först efter Fragmin satts ut, vanligen vid utskrivning från vårdavdelning.</p>\n<p><strong>BLÖDNING</strong> Blödning som överskrider följande bör föranleda reop: 500 ml/h under 1 h. 400 ml/h under 2 h. 300 ml/h under 3 h. 200 ml/h under 4 h. <strong>Etiologi:</strong> Kvarvarande heparineffekt, trombocytdysfunktion, brist på koagulationsfaktorer, kirurgisk orsak, hypotermi, postop hypertension, fibrinolys. <strong>Alla blödningar bedöms avseende: </strong> Förekomst av preoperativa koagulationsdefekter, preoperativ antikoagulantia/trombocythämmare, ingreppets längd och sort, riskfaktorer för mediastinit.</p>\n<p><strong>RESPIRATORISK SVIKT</strong> Alla hjärt-op-pat. uppvisar viss repiratorisk insuf. efter CPB beroende på: Atelektaser, LKP och TPK fastnar i lungan, mikroembolisering, protaminreaktion, interstitiellt ödem pga capillary leak, komplementaktivering, pleuravätska särskilt vid användande av art. mammaria interna, haemodynamisk påverkan på oxygenereing.</p>\n<p><strong>EXTUBATION</strong> Urträning kan påbörjas vid: Kontaktbar pat., ingen pågående blödning, haemodynamiskt stabil, temp >36 grader, OK blodgaser, PEEP 5 cmH2O. Urträning avbryts vid: Motoriskt orolig, BT-stegring, takykardi. Extubationskriterier: Bra kontakt, lyfter huvudet från kudden, kraft i alla extremiteter, FiO2 <0.45.</p>\n<h3>HEMODYNAMIK</h3>\n<p><strong>Hypertoni</strong> Pat. med god VK kräver ofta vasodilator: Nipride el. Nitroglycerin eller båda. <strong>Kontraktilitet</strong> Inotropt stöd behövs ibland de första 8-12 h för att sedan kunna avvecklas. <strong>Förmaksflimmer</strong> Förekommer hos ca 30%, ofta 2a – 3e postop dygnet. Behandlas med LM eller elkonvertering. <strong>EKG-förändringar</strong> Tecken till ischemi kan vara: spasm i kranskärl eller graft, ofullständig revaskularisering, dålig myokardiell protektion, akut graftocklusion. Oavsett etiologi så bör nitroglycerin i.v. övervägas, särskilt om spasm misstänks. Akut angio kan i vissa fall vara indicerat. <strong>Perioperativ</strong> infarkt<strong> Diagnos: förhöjda enzymer & regionala förändringar i väggrörlighet på EKO. Handläggning: Arytmiövervak, hemodynamiskt stöd vb. Ventrikulära arytmier förorsakas av: Hypotermi, hemodynamisk instabilitet, elektrolytrubbningar, endotrakealtub, PA-kateter., ischemi bör alltid övervägas som orsak. </strong>Vätskebalans** Kapillary-leak-syndromet kan påverka pat. alltifrån ett par. h. upp till 24 h beroende på hur  lång ECC-tiden var. Pat. efter CBP är generellt övervätskade, trots detta kan pat. ha en intravasal hypovolemi, vilken kan döljas av ökad perifer resistens. Balansera fyllnad, inotropi, och vasokonstriktion.</p>\n<h3>POSTOPERATIV HJÄRTINFARKT - DEFINITION</h3>\n<p>Troponin-T-ökning > 10 x baseline + EKG-förändringar? – Kolla upp. – Amerikansk definition. I europa kör man klassiska definition med CKMB.</p>", "category": "Praktiskt"}, {"title": "CHARCOT MARIE TOOTH - ANESTESI", "html": "<p><strong>BAKGRUND</strong> Är en <em>hereditär perifer <strong>neuropati</em>. Ingår i gruppen inherited </strong>or<strong> acuired polyneuropatier. Är en rätt bred grupp av olika typer av mutationer. Primärt karaktäriserad av nedsatt perifer sensorik, perifer muskelsvaghet och autonom dysfunktion. Dysfunktion av centrala nervsystemet och vissa organ är vanligare vid vissa mutationer. Historiskt har man klassat de olika sjukdomarna primärt baserat på klinisk manifestation såsom Charcot-Marie-Tooth eller Riley-Day syndrome. Numera baseras diagnoserna även på elektrofysiologi och genetik. Modern indelning: <em>Predominately</strong> motor <strong>involvement</strong>, <strong>predominately</strong> <strong>sensory</strong> or <strong>autonomous</strong> <strong>involvement</strong>, or <strong>neither</strong>. </em>Däri finns subtyper. Vidare subtyper går att läsa om i källan som anges nedan. <strong>Hereditary Primary Motor Sensory Neuropathies HMSN 1 </strong>&<strong> 2 </strong>( Charcot<strong>-Marie-Tooth type 1 </strong>&<strong> 2)</strong> - Ingen specific behandling finns. Symtomatisk behandling för korrektin av leder, ex för scolios och pes cavus (fotdeformitet). <strong>HMSN typ 1</strong> - 5 subtyper. - Demyeliniserande sjd. Distal svaghet. Debut vid 0 – 20 åå. Långsam progress. <em>Onion<strong> bulbs </em>i histologiska snitt. - Autosomalt dominant. Skadade myelingener. Ingen specifik behandling finns. </strong>HMSN typ 2<strong> - Neuroaxonal (ej demyeliniserande), distal svaghet, långsam progress. Autosomalt dominant. Skadade myelingener. Ingen specifik behandling finns. </strong>ANESTESIOLOGISKA BETÄNKLIGHETER<strong> </strong>typ 1 <strong>&</strong> typ 2<strong> (Obs man kan även läsa rek från SFAI)</strong> <strong>Preop</strong> bedömning<strong>:</strong> - Bedöm motorfunktion. - Vid skolios förekommer restriktiv lungfrunktionsnedsättning & diafragmasvaghet. I vissa fall krävs planering inför extubation och ev. postop respirationsstöd. - Sömnapné förekommer. - De kan gå med ”hjärtavvikelser” och man bör ta ett preop EKG. - Vid graviditeten kan symtomen förvärras. - Finns rapporter om malign hypertoni i denna population. Man har dock använt MH-triggande LM utan att något hänt. Men kan bör därmed undvika succinylcolin och anestesigaser om möjligt. <strong>Anestesi</strong> - Sammantaget så är anestesi av pat. med HMSN oftast okopmlicerad. - Företrädesvis TIVA. Propofol och opioider går bra. - Ökad känslighet för Tiopental anges. Bör även undvikas med tanke på oro för malign hypertermi. - Neuroaxial blockad har gått bra. Dock försiktighet med hög blockad hos pat. som redan har påverkad lungfunktion. <strong>Muskelrelax</strong> - Succinylkolin tros även riskera hyperkalemi utöver oro för halign hypertermi. - Ickedepolariserande muskelrelax har använts utan problem. Det finns dock en rapport om förlängd relaxationstid av vecuronium. - Atrofiska denerverade distala muskler kan vara svåra monitorera med NMT och mätvärdena kan vara opålitliga. Vissa menar därför att man bör undvika relax helt och ex söva med Propofol + Remi när möjligt. <strong>KÄLLA</strong>:** Anesthesia and Uncommon Diseases 5th ed.</p>", "category": "Praktiskt"}, {"title": "CEREBROSPINALVÄTSKA / CSF / CELLER på NIVA", "html": "<h3>BEDÖMNING</h3>\n<p>Referensen för konc. av leukocyter lpk-tot bedöms i relation till mängden blod (ery). Dela csf-ery på 1000. Då får du den ett värde för vad lpk maximalt får vara. Om du drar provet från en slang såsom v-drän så kan du lägga till 100 i den uträknade gränsen. Detta är riktmärken och inte en absolut sanning. Ex. Csv-Ery = 17000. -> 17000/1000 = 17. Provet draget ur v-drän + 100 -> 117. Jämför mot lpk tot.</p>", "category": "Praktiskt"}, {"title": "CVK", "html": "<p><strong>CVK - </strong>Koagulationsprover<strong> vid rutinmässig anläggning: </strong> <em> Tpk >50. </em> APTT <=1,3xövre refvärdet = 36 (ny analysmetod på KS) (utan misstänk koagstörning), <em> PK <=1,8. </em> Gräns för hemostaspåverkan vid anemi brukar anges till <100. Ej känt vid CVK. * GFR<30 är associerat med blödning pga tpkdysfunktion. Desmopresin eller cyklokapron kan användas. Tpktransfusion ej effektiv. - Vid ökad blödningsrisk rek. Erfaren operatör.</p>\n<p><strong>LÄNGD OCH STORLEK PÅ CVK</strong> (ej verifierad källa)**</p>\n<table class=\"card-table\">\n<tr><th><strong>Plats</strong></th><th><strong>Formula (cm)</strong></th><th><strong>In SVC (%)</strong></th><th><strong>In RA (%)</strong></th></tr>\n<tr><td>Höger subclavia</td><td>(längd/10) - 2</td><td>96</td><td>4</td></tr>\n<tr><td>Vänster subclavia</td><td>(Längd/10) + 2</td><td>97</td><td>2</td></tr>\n<tr><td>Höger jugularis interna</td><td>Längd / 10</td><td>90</td><td>10</td></tr>\n<tr><td>Vänster jugularis interna</td><td>(Längd/10) + 4</td><td>94</td><td>5</td></tr>\n</table>\n<p><em> Man kan även ta hänsyn till hur nära hjärtat man sticker, ex långt ned på halsen. <strong>Barn och storlek:</strong> <strong>Riktlinje; man kan occupera 1/3 av kärlet. Om man mäter diametern på kärlet så blir det = French på CVKn. (3 French = 1 mm i ytterdiameter per definition). </strong>KONTROLL AV LÄGE<strong> - Egen kontroll av läge på slätröntgen: Säker zon är från carina och 2 kotkroppr ned. - Kontrollera även hur cvk löper så att den går rakt och att spetsen ligger i bra vinkel. </strong>STOPP / <strong>TROMBOTISERING AV CVK el. Port-A-</strong>Cath<strong>: </strong>Det man kan göra är att spola alternativt lägg i Actilyse. <strong>BLÖDER FRÅN INSTICKSSTÄLLET / YTLIG BLÖDNING</strong> Kan prova följande: - Komprimera en stund. - Komprimera och lägg på en tuss indränkt i Cyklokapron. - Om blöder ytligt, kan injicera lokalbedövning med adrenalin i området. <strong>Actilyse</strong> i Port-A-<strong>Cath</strong> eller CVK <strong>(Källa: Läkemedelsboken) Actilyse (rt-PA, alteplas), spätt till 1 mg/ml. Fyll kakteterlumen och verka under 20-30 min. Prova därpå att aspirera. Om ej går att aspirera Actilyse: Det är OK att prova att spola inåt också. Det är aldrig mer än 1 ml Actilyse och halveringstiden är kort (Källa: Öberg). </strong>CVK-dragning</em>* CVKdragning - görs gärna under utandning med sänkt huvudända. Använd lufttätt förband minst 24 h. Om spetsodling ska göras så tvättar man insticksstället med klorhexidinspr. Innan dragning. Blödningskomplikation är ovanligt. Komplikationer: luftemboli, katererfragmentemboki, fibrinstrumpeemboli, tromb. Blödning hemothorax. SFAI rekommenderar suturering av hud om kateter grövre än 7 Fr, vid blödning från insticksstället, eller om katetern suttit > 3 v.</p>", "category": "Praktiskt"}, {"title": "CVK – TUNNELERAD / TUNNELERAD CVK", "html": "<p>OBS LÄS PÅ DET PM SOM FINNS. FÖR KLART DETTA PM.</p>\n<p><strong>FÖRBEREDELSER</strong> TPK: Vid tunnelerad CVK vill man ligga lite högre i TPK för att undvika hematom som ska orsaka infektion. Om TPK <50 ge 2 påsar TPK. Om kring 50 ge 1 påse. - Kolla upp gamla röntgenbilder, finns det mkt körtlar på halsen? <strong>ORBIT – LÄGG UPP OPERATION</strong> - Logga in som operatör. - Skapa ny. För att ange åtgärd, klicka på förstorningsglaset, klicka ur rutan ”Filtrera på operationstillfällets enhet”, Sedan kan du söka på och hitta tunnellerad CVK. - Fyll i diagnos: Lymfom eller Leukemi, finns en lapp på tablan, en är C859. - Vårdande enhet brukar vara G9. - Fyll i övrig info, skriv info till salsteam, ex ”bestämmer sida på halsen efter undersökning med ultraljud på sal”. <strong>PROCEDUR</strong> <em> Stick och lägg in ledaren i kärlet som vanligt. </em> Bedöva ordentligt längs hela tunneleringsområdet. <em> 2 snitt, ett lateralt ut från sticket och 1 under clavikeln. </em> Öppna upp vävnaden under snitten med peang samt en bit längs med tunnelleringen. <em> Koppla på CVKn ordentligt på metalledaren. </em> För igenom ledaren och CVKn längs tunneleringen. Dra igenom CVKn så att vävnadstussarna som ska växa fast kommer in ca 1 cm från snittet. <em> Mät upp rätt längd med mätpappret och klipp CVKn. </em> Stoppa in introducern. Ta bort pinnen och stoppa in CVKn. <em> Börja peala bort introducerna. Använd peang intermittent för att mata in CVKn så att den ligger tajt och inte glider ut under pealingen. </em> Sy ihop snitten och sy fast CVKn på bröstet. <em> Genomlys för att verifiera läge. </em> Postop lungröntgenkontroll. ÖVRIGT - Om slangen går ut ex i armen. Backa slangen ut på halsen en bit, stoppa in en Terumoledare (uretärledare), den är mkt mjuk och kan följa hela CVKn. Hoppas på att den går ut i v. cava. Och mata in CVKn. Genomlys.</p>", "category": "Praktiskt"}, {"title": "DYSTROFIA MYOTONIKA TYP 1 & 2 - ANESTESI", "html": "<p><em>Källa och vidare läsning: Se dokumentet från SFAI. </em> <strong>CAVE: </strong>Celocurin<strong>.</strong> Kan bla utlöa maseterspam, rhabdomyolys. <strong>Magnesium</strong>. Övriga anestesiläkemedel är OK. <strong>BAKGRUND</strong> - Autosomalt dominant. Påv. Både muskulatur och flera andra organsystem. Förväxla ej med Myotonia kongenita. DM1: Vanligaste och allvarligaste formen. <strong>PREOP UTREDNING</strong> - Kardiologisk bedömning rekommenderas. - EKO inom 2 år om inget karidologiskt avvikande och normalt NTproBNP. - Långtids-EKG inom 2 år om inget avvikande. - EKG (AVB?, PQ <220, QRS <120). - Lab: <strong>NTproBNP</strong>, Hb, Na, K, Cl, Mg, Kreatining. CK & myo kan va bra då >80% har preop förhöjt CK om man skulle vilka ha att jämföra postoperativt vid misstanke om rhabdomyolys. <strong>ANESTESI</strong> - Då GI-manifestationer är vanligt med bla försenad ventrikeltömning rek. Intubation. Liberalt med antacida. - Rekommenderat är TIVA Propofol + Remi. - Emeron. - Ej TOF-mätning för ofta då man kan få .... TOF ej lika tillförlitligt, därför reversering med Bridion oavsett. <strong>Komplikationer</strong> - Litteraturen beskriver förekomst på 4 – 50%. 80% av komplikationerna sker postoperativt och är av respiratorisk natur. - Hjärtkomplikationer: Brady-, takyarytmier. - Vidare förekommer arytmier mm. .... Underhåll Rekommenderat: - Vid intellekttuell funktionsnedsättning, oro, sjukhusrädla: Infart i stort kärl, armveck, xylo innan Propofol.</p>", "category": "Praktiskt"}, {"title": "ECMO – ej klar", "html": "<h3>ECMO GENERELLT</h3>\n<h3>RUTINER</h3>\n<p>• ECMO-slangarna är märkta. Blå markering/linje = venöst blod från patient. Röd markering/linje = arteriellt blod till patient. • Kontrollera att saturationsklämman på den venösa slangen är stängd. • Kontrollera att flödesklämman på artärslangen är stängd. • ECMO-slangarna skall vara väl fixerade vid huden.  • Kanyleringsställen skall vara synliga och får inte övertäckas.. • Nätkontakt skall vara ansluten.Kontrollera att lysdioden ”batteri” lyser vid uppladdning. Den slocknar när batteriet är fulladdat. • Värmeväxlarens vattennivå skall ligga mellan de blå strecken. Värmeväxlaren fylls med renat vatten (fylls varsamt). • Extra oxygentub skall finnas på ECMO-vagnen. • Två stora platta peanger skall finnas på ECMO-vagnen. • Inför byte av ECMO-system förbereds 4 stycken 50 ml Luerlock-sprutor fyllda med natriumklorid 9 mg/ml. Dessa används för att eliminera luft i de avklippta slangarna innan de kopplas ihop. Detta utförs av perfusionist. • Rengöring av maskinen sker med fuktad trasa. Undvik alkoholbaserade lösningar när ECMO-maskinen är i drift. • Oxygenatorn är godkänd för 30 dagars behandling.</p>\n<h3>Antikoagulation</h3>\n<p>Vanligen antikoaguleras patienten med heparininfusion (vanlig startdos är 5–7 E/kg/tim). • Lab morgonprover: Blod- och blödningsstatus inklusive fibrinogen, INR, TPK, APTT, Antitrombin III. • Fritt plasma-Hb 1 g/dygn (analyseras på THIVA). Värden över 0,5 g/L indikerar ogynnsam hemolys. • APTT följs vid heparininfusion var 6:e timme eller var 4:e timme efter ändringar i dos. Målvärde individuellt men vanligen 35–60 sekunder. • Antitrombin III skall tas tre gånger per dygn eller efter ordination. Antitrombin III (Atenativ) ges vid behov och på ordination. Riktvärde >0,8 kIE/L, >1,0 vid heparinfri körning. • AntiF Xa tas på ordination för kontroll av heparineffekt. • Vid Fragminbehandling tas APTT enligt ordination. • Riktvärden: Hb >100. TPK >100, om transfusionskrävande blödning >150. • ACT tas på ordination.</p>\n<h3>PARAMETRAR</h3>\n<p><strong>Tryck </strong>venkanylen<strong>: </strong> - Höga negativa tryck på venkanylen kan orsaka hemolys. - Kan orskakas av bla knickad slang, hypovolemi/fastsugning. <strong>Varvtal </strong> Genererar blodflöde. RPM (Revolutions Per Minute) <strong>Tecken på </strong>volymsbehov** - Sjunkande ventryck (mer negativt ventryck, ”sugtryck”), lägre venös saturation (SvO2) och lägre LPM utan att man sänkt RPM kan vara tecken på hypovolemi. Venkanylen kan suga fast mot kärlväggen, vilket resulterar i sjunkande LPM och att apparatlarm ljuder.</p>\n<h3>LARM</h3>\n<p>Venkanylen suger fast mot kärlväggen: Fast rött larm ljuder.</p>\n<h3>HÄNDELSER</h3>\n<p><strong>Venkanylen</strong> suger fast<strong>: Kontrollera kanylläge. Kontrollera att slangar ej är knickade. Man kan tillfälligt sänka RPM tills kanyl släpper från kärlvägg. Kan även sänka huvudändan och ge volym. </strong>Dipp i flöden, ScO2, rSO2 (INVOS)<strong> • Kontrollera flödesmätare på artärslang, saturationsklämma på venslang och INVOS–plattor (fixering). Vad mer? </strong>Backflöde<strong> • ”Förhindrande av återflöde” aktiveras efter 6 sek med felaktig flödesriktining, dvs om flödet går baklänges från patient via artärslang till och genom Cardiohelpen (pumpen stannar). 0 l/min lyser då med röd lampa. • Kan uppstå exempelvis vid weaning då ECMO-flödet sänkts till <1.5 liter och MAP kraftigt ökar (ökat afterload). • För att komma ur detta läge trycks ”knappen” 0 l/min in. Säkerställ att varvtalet (RPM) ligger på en rimlig nivå, ca 1500 RPM, före återstart. MAP/RPM måste därefter optimeras/ korrigeras. Detta utförs av läkare </strong>Clot<strong> i </strong>oxygenatorn** När oxygenatorn clotar igen så drar d-dimer iväg över 35.</p>\n<h3>VENOVENÖS ECMO</h3>\n<p>- Hb-mål >110 till 120 för att ha bra med syrebärare. - Man brukar tolerera en saturation ned till 80. - Vid höga flöden finns risk för rundgång/recirkulation mellan ven- och artärkanyl. - Vid mycket höga flöden finns risk att det blir en skitning saturerat blod och venöst blod från respektive kanyl och blodet kan gå i skikt. Det saturerade skiktet kan riskera att recirkullera. - CVP kan vara till hjälp för att bedöma volymbehov. - Behövs 60-80 ml/kg på vuxna. - Vid venovenös ECMO (VV ECMO) på grund av respiratorisk svikt kanyleras v. jugularis interna och v. femoralis, alt läggs en dubbellumenkanyl (bi-caval dual lumen i-Caval Dual Lumen) via v. jugularis interna. Dessa patienter kanyleras av ECMO Centrum men kan vårdas på THIVA.</p>\n<h3>VENOARTERIELL ECMO</h3>\n<p>Vid femoral kanylering mynnar artärkanylen vid a. iliaca bifurkationen och venkanylen i höger förmak. Vid central kanylering ansluts venkanylen till höger förmak och artärkanylen till aorta ascendens, vilket ger en mer fysiologisk flödesrikting på det återförda blodet (inget nord-syd-problem?). - VA ECMO avlastar inte utan belastar vänster kammare då ECMO-flödet är riktat mot aortaklaffen. - INVOS används, 4 kanaler.</p>\n<p>THIVA använder CardioHelp (Maquet).</p>", "category": "Praktiskt"}, {"title": "EEG", "html": "<p><strong>Djup sedering på NIVA, när finns risk för </strong>isoelektriskt<strong> EEG och du vill koppla på ett </strong>cEEG<strong>?</strong> - Erfaren ÖL: När du kommer upp i Midazolamdos kring 20 mg/h så är det dags. Vid 10 behövs ej.</p>", "category": "Praktiskt"}, {"title": "EKO / HJÄRTEKO / EKOKARDIOGRAFI", "html": "<h3>NORMALVÄRDEN</h3>\n<p>MAPSE: >10 mm (medel). Görs i mediala och laterala VK-väggen.</p>\n<p>TAPSE: >17 mm. Om <8 signifikant HK-svikt.</p>\n<p>Vävnadsdopper: S´är normalt  > 10 cm/s. (Pulsad vävnadsdoppler i laterala VK-väggen i 4Ch.</p>\n<p>VK-diameter</p>\n<p>HK tjocklek: Hypertrof om >5 mm.</p>\n<p>Septumtjocklek</p>\n<p>VK vägg tjocklek:</p>\n<p>Vänster förmaksarea</p>\n<p>Vena cava:</p>\n<p>HK storlek: A4C: Ratio mellan HK och VK ska vara ungefär 0,6. HKs mäts främst i A4C och PLAX.</p>\n<p>Bernouillis förenklade ekvation: Deltatrycket är hastigheten i kvadrat x 4. Sedan är sPAP deltatryck minus CVP.</p>\n<p><strong>Aortastenos: </strong>Mät maxhastigheten: CW.Vmax >3m/s måttlig ellet tät AS. Mät gärna i flera vyer. (OBS, men för att presetera höga hastigheter så måste man ha en fungerande VK). Klafföppning: Mmode i PLAX: >15 mm är OK. Under 8 mm kan tala för tät aortastenos. Men det kan vara svårt att få in.</p>", "category": "Praktiskt"}, {"title": "EPIDURAL", "html": "<p>EDA</p>\n<p>Kod Gemstar Hospira-pumpen: 13000. Braun: 1991 <strong>Kontraindikationer: </strong>Bla; högt ICP (fyller på epiduralutrymmet). <strong>Efter kateterinläggning</strong> Pat. bör monitoreras kontinuerligt och övervakas enligt schema minst 1 gång / h under 6 h. Minst var 30 min de första 2 h. Skall ligga på postop eller IVA När pat. är stabil i cirk, andning, är vaken och har fungerande smärtlindring kan pat. skrivas ut till avd. Där skall pat. kollas var 4e h gällande sedationsgrad, AF, puls, BT, motorik! Ordination för handling vid smärtgenombrått bör finnas, ex bolus. Benens motorik Bromage kollas under minst 4 h efter dragen kateter.</p>\n<p>EDA – PCEA eller kontinuerlig infusion - Så gott som alla pat. på buksektionen har PCEA, om man inte har avvikande kroppsstorlek eller svårt att hantera knappen.</p>\n<p>EDA - SMÄRTGENOMBROTT</p>\n<p>1. Smärtanalys: Lokalisation, intensitet, duration. Betänk kir. komplik. OBS! Kan vara ngt annat! Ex uterusruptur. Kontinuerlig smärta? Testa med kyla. 2. Kontroll av: Pumpinställning och läkemedelsbhållare, bakterie- filteranslutning, insticksställe, kateterläge, markering. 3. Kontroll av: Utbredning, bromage. 4. Kontroll av: BT och puls. 5. Överväg bolus. Ex 3 ml. Upp till 14 ml/h Narop/sufenta svag lösn behöver man inte vara orolig. Maxdos Ropivacain kan man räkna på.</p>\n<p>EDA - AVVECKLING</p>\n<p>Generellt bör icke-tunnelerad EDA ej sitta >7 dgr. Glöm ej ta ställning till tid från trombosprofylax.</p>\n<p>Avveckling av EDA planerad 1 dag i förväg. Ersättningsterapi ordineras av avdelningsläkaren. EDA-infusionen stängs av på morgonen. Efter ca 4 h  utvärdering. Under tiden skall motorik och blåsfunktion övvakas! Om tillfredsställande smärtlindring och normal motorik kan EDAn dras. KAD/cystofix kan avlägsnas samtidigt.</p>\n<p><strong>EDA </strong>&<strong> KOAGULATIONSRUBBNINGAR Källa: PM KS</strong></p>\n<table class=\"card-table\">\n<tr><td>APC-resistens</td><td>Ta bara hänsyn till fragminbehandlingen. / Henrik</td></tr>\n<tr><td>Intrauterin fosterdöd</td><td>Koagulationspåverkan kan utvecklas. Koagprover inom 6 h från ryggstick.</td></tr>\n<tr><td>ITP</td><td>Samma regler som för preeklampsi/eklampsi.</td></tr>\n<tr><td>von Willebrands</td><td>I många fall kontraindicerat med ryggbedövning.</td></tr>\n<tr><td>Hemofili A & B:</td><td>Ryggbedövning kan användas om nivåerna för FVIII och FIX är > 0,70 KIE/L & APTT, PK, TPK och kapillär blödningstid är normala. Analyserna görs i 3e trimestern (v32) & behöver inte upprepas rutinmässsigt.</td></tr>\n<tr><td>Antifosfolipidsyndrom, SLE:</td><td>Om normalt PK, TPK men förlängt APTT som kan förklaras av förekomst av lupus-antikroppar behövs ingen ytterligare utredning göras. Men skall utredas om antikropparna ej finns. Om förlängt APTT skall alltid samråd med koagulationsläkare ske innan ryggbedövning. Det ska heller inte finnas ngn blödningsanamnes.</td></tr>\n<tr><td>Eklampsi/Preeklampsi:</td><td>OK om TPK > 100. Färska prover.</td></tr>\n<tr><td>Hepatos (Kolestas)</td><td>Koagulationspåverkan kan utvecklas, dock långsamt. Hemostasprover behöver kontrolleras inför ryggbedövning enl. SFAI. (Av erfaren kollegas erfarenhet så kan det ibland vara någon annan diagnos som lurar tex HELP. Diagnosen är inte alltid så säker m.a.o. Så koagprover även av den anledningen.</td></tr>\n</table>", "category": "Praktiskt"}, {"title": "EPIDURAL", "html": "<p>EDA - PÅFYLLNING INFÖR SECTIO / TOP-UP / TOPUP Källa: PM KS.</p>\n<p>1. Hinner vi en EDA? Är spinal mer aktuellt? Tid ca 20 min från testdos. Fördel EDA är mindre BT-fall än spinal. (Annan källa: Dra inte EDAn, läggs spinal nedan EDAn ändå med pencil-point). 2. Gör klart så att ssk eller du håller koll på blodtrycket under titreringen! 3. Två 10ml sprutor: a) 8 ml Ropivacain 7,5 mg/ml + 2 ml Fentanyl 50 mikrog/ml. (Om slut på Fentanyl, blanda istället 10 µg sufenta (dvs 2 ml av sufenta 5µg/ml). b) 10 ml Ropivacain 7,5 mg/ml. 4. Överväg/börja med testdos på 3 ml. Om intratekalt anslag så ses motorisk blockad inom 5 min. 5. Titrera upp EDAn; ex doser på 5-7 ml var 3-5 min. (Vid mkt bråttom så ger vissa 5 + 10 ml direkt) (Normal krävs mellan 15-18 ml för tillräcklig anestesi) (Tid för titrering brukar vara ca 20 minuter från testdos). (Anligt DS-kollega: Sakrala anslaget är viktigtast testa anslag, bra att halvsitta). Det finns ingen skillnad i effekt av EDA eller spinal. Men BT-fallet är mindre vid EDA. Kir. bör ej testa smärtan innan 20 min gått då man bara oroar pat. <strong>OBS! Om </strong>EDAn<strong> ej tar och du lägger spinal istället:</strong> **Duran kan vara komprimerad av EDA-vätskan och spinalen kan ta högt! Sänk dosen på spinalen! (Smärtgenombrått vid sectio beror oftast på undermåligt sakralt anslag).</p>\n<p><strong>TOP-UP vid bristning: </strong>Använd samma blandning som ovan. Låt pat. sitta en stund när du sprutar, el höjd huvudända.</p>\n<h3>EPIDURALT MORFIN POST SECTIO</h3>\n<p>Indikation: Efter sectio i TopUp-EDA (eller omedelbart sectio i GA med befintlig EDA). Sammanfattningsvis: 1. Mot slutet av operationen administreras i EDAn en blandning av 5 ml 0.4 mg/ml morfin (Morfin special eller Epiduralt Morfin - alltså morfin utan konserveringsmedel) och 5 ml 0.9% NaCl. Det ger 10 ml volym med totalt 2 mg morfin. 2. Dokumentera i TakeCare läkemedelsmodul. 3. Ingen skillnad i postop-vård eller utskrivningskriterier. 4. Övervakning enligt SFAIs riktlinjer sker efter utskrivning från postop på BB/förlossningen under försorg obstetriken. PMI är ej involverad i detta (men svarar givetvis på frågor och/eller hjälper till när så efterfrågas). Källa: O-boken.</p>\n<p><strong>EDA </strong>–<strong> </strong>UPPSTART <strong>&</strong> <strong>BOLUSDOS PÅ OPERATION (ej inför </strong>sectio<strong>)</strong></p>\n<p><strong>Testdosen:</strong> Carbocain 20 mg/ml + adrenalin 5 mikrog/ml, 3 ml. (Om restat så kan man ta Marcain 5 mg/ml, 3 ml, eller Ropivacain 7,5 mg/ml för den delen, 3 ml, det blir ungefär ekvipotent. Vi använder ju Ropivacain vid sectio. <strong>Infusion: </strong>Narop 5 mg/ml, 5 ml/h. Ej högre doser, ffa inte hos äldre. Om tillräcklig effekt så får man lägga till Ultiva intravenöst. Innan knivstart bör det ha gått in minst 5 ml utöver testdosen, om stort snitt lämpligen 8-10 ml. <strong>Inför postoperativ vård:</strong> **Byt EDA-pump ca 45 min innan opslut. Gynpat: PCEA. Övriga: Vanlig pumpinfusion. Narop 2 mg/ml + Sufenta 5 mikrog/ml. Carbocain 20 mg/ml + adrenalin. Dos: 3-6 ml. Anslagstid till full effekt ca 15-20 min. (muntlig källa)</p>\n<p><strong>EDA - Kontinuerlig infusion ex efter </strong>op**</p>\n<p>Narop (Ropivakain) 2 mg/ml + Sufenta 0,5 mikrog/ml (är den enda kontinuerliga EDA-infusionen vi använder)</p>\n<p>Dos: 6-10 ml/h.  (Upp till 14 ml/h kan man vara lugn gällande maxdos)</p>\n<p>Kan även öka styrkan av Narop till 3 mg/ml.</p>\n<h3>EDA INSTICKSNIVÅ</h3>\n<p>(Källa SFAI Riktlinjer för postoperative smärtbehandling 2010)</p>\n<p>Thorakotomi Th 6-7 (3-8)</p>\n<p>Hög laparatomi Th 7-8 (7-10)</p>\n<p>Stor laparatomi Th 10-11 (8-12)</p>\n<p>Låg laparatomi Th 10-12</p>\n<p>Höft- /knäop. L1-L2.</p>\n<p>EDA - VAL AV LOKALANESTETIKUM OCH OPIOID FÖR EPIDURALT BRUK</p>\n<p>(Källa SFAI Riktlinjer för postoperativ smärtbehandling 2010) <strong>Lokalanestetika</strong> Bupivacain (Marcain) 1-2,5 mg/ml. Ropivacain (Narop) 2 mg/ml. <strong>Opioid</strong> Morfin 0,03-0,05 mg/ml Fentanyl 2 mikrog/ml Sufentanil 0,25-1 mikrog/ml. <strong>Breiviks blandning</strong> Bupivacain (Marcain) 1 mg/ml. Fentanyl 2 mikrog/ml. Adrenalin 2 mikrog/ml.</p>\n<p>KONVERTERING TILL ÖPPEN OPERATION – EDA? EDA PÅ SOVANDE PATIENT</p>\n<p>Mycket kompetent och kunnig kollega (LL) är inte heller bekväm att lägga EDA på sövd patient vid konvertering till öppen op. Om det ska göras så bör patienten ha informerats och godkänt detta innan. LL lägger istället en lätt spinal Marcain spinal 2,5 mg + Morfin special eller Sufenta. Sedan kan man starta upp PCA på postop eller att man lägger en vaken EDA. Ibland vid stor op kan man lägga 5 mg Marcain spinal, men i regel 2,5 mg inför postop.</p>", "category": "Praktiskt"}, {"title": "EPIDURAL", "html": "<p>EDA – FAKTORER SOM PÅVERKAR UTBREDNINGEN</p>\n<p>Faktorer som påverkar epiduralbedövningens nivå: - Volym lokalanestetika. - Ålder. (Reducera med 50% hos äldre & nyfödda)  - Graviditet. Är känsligare. - Injektionshastighet (snabb inj är ej bra). - Position. Viss effekt. Ottawa anger en max volym lokalanestetika på 1,6 ml per segment. Högre doser/volymer kan användas vid utspädda lösningar.</p>", "category": "Praktiskt"}, {"title": "ENDOTRACHEALTUBER / ETT", "html": "<p><strong>TUBEGENSKAPER</strong> Flexitip - Hakar inte lika ofta vid stämbanden när man för över med ledare. Murphys eye – Kan passera luft via detta hål om det ex kommer slempropp i huvudlumen eller om tuben ligger mot tracheavägg. <strong>NASALTUBER</strong> Portex – Ljusblå tub. Är lite längre. Saknar flexitip. Den har vi slutat köpa in. Parker – Transparent. Kortare än Portex. Har flexitip och murphys eye. Använder i regel storlek 7,0 till män och 6,0 till kvinnor (kolla så att detta stämmer). Sedan får man ta MLT vid behov av annan storlek. Ej helt säker på detta. <strong>MLT-tuber</strong> (<strong>MicroLaryngeal</strong> <strong>Tube</strong>)** - Är Längre. (Har svart text jmf m. grå text av det vanliga märket vi använder, Parker?). - Kan användas både till oral och nasal intubation. Är aldrig för kort. - Kan ha den i värmeskop innan intubation så att den mjuknar. - Det finns nu en Parker MLT-tub med flexitip. - Använd alltid MLT-tub vid vakenfiberintubation då den aldrig är för kort.</p>", "category": "Praktiskt"}, {"title": "EXTERN PACING", "html": "<p>EXTERN PACING</p>\n<p><strong>Indikationer: </strong>Symtomatisk<strong> </strong>bradykardi eller AV-block som ger otillfredsställande hjärtrytm trots medicinsk behandling. Tillfällig nödlösning (smärtsamt och ångestframkallande) till temporär pacemaker kan anläggas.</p>\n<h3>Åtgärder:</h3>\n<p>1. Koppla upp def-plattor samt 3 ekg-elektroder. <strong>Plattor sätts med fördel </strong>anterioposteriort<strong>.</strong></p>\n<p>2. Sätt på pacing på deffen.</p>\n<p>3. Ställ in önskat BPM.</p>\n<p>3. På vissa apparater höjer man strömstyrka (current) till man får capture.</p>\n<p>4. Utvärdera pat.’s hemodynamik. Utvärera tolerans; smärtlindring/sedering vb.</p>\n<h3>Övrigt:</h3>\n<p>Pat. är inte strömförande.</p>\n<p>Demand mode: Tar hänsyn till egna hjärtslag. Är bättre än fixed mode (pacear utan hänsyn till pats. rytm).</p>", "category": "Praktiskt"}, {"title": "EXTRAVASERING & INTRAARTERIELL INJEKTION", "html": "<p><strong>INTRAARTERIELL INJEKTION AV LÄKEMEDEL MED RISK FÖR SKADA</strong>: Källa <strong>FRCA EDA-böckerna.</strong></p>\n<p><strong>SYMTOM</strong> Smärta vid injektion, blek hud, cyanos distalt. <strong>RISKER</strong> Risk för trombos, svår vasospasm, nekros i fingrar. <strong>ÅTGÄRDER</strong> <em> Behåll infarten. </em> Späd ut injicerat läkemedel med NaCl 0.9%. <em> Vasodilatera artären med Papaverin 40-80 mg (avregistrerat läkemedel). </em> Heparin 1000 IE mot trombos. Man kan även blanda heparin i NaCl-infusionen. <em> Xylocain (Lidocain) 1%, 10 ml vid smärta.  </em> Överväg perifer nervblockad ex. axillarisblockad vilket är dels smärtlindrande och dels vasodilaterande (FRCA-boken). <em> Antikoagulantia i 10 – 14 dagar (FRCA-boken). <strong>LÄKEMEDEL FARLIGA ATT INJICERA INTRAARTERIELLT</strong> #extravasering #extravasera #subcutant<strong> Källa: </em>Ex</strong>travasation injuries and <strong>accide</strong>tal<strong> intra-arterial injection. Lake, Beecroft. Continuing Education in Anaesthesia, Critical Care </strong>&<strong> Pain. </strong>Vol<strong> 10. </strong>Number<strong> 4. 2010.* </strong>Subcutan<strong> extravasering av noradrenalin</strong>/<strong>adrenergika</strong> - <strong>Fentolamin</strong> Phentolamin/Fentolamin – Finns på von Scheeles apotek. Måste stava rätt för att hitta. Risk för lokal ischemi, blåsbildning, sår och nekros. <strong>Handläggning enligt PM Sahlgrenska PM ”Noradrenalin” Dokument-ID: SU9772-1276147733-8.</strong> - Vid extravasal infusion ska infusionen avbrytas direkt. - Lägg på varma kompresser, och smörj in hudområdet med nitroglycerininehållande salva/kräm (t.ex. apotekstillverkade Glycerylnitrat i Essex kräm eller Rectogesic®). - Användning av Fentolamin (Rigitin), som är en alfa-antagonist och motverkar noradrenalinets vasokonstriktion, kan övervägas. - Fentolamin 10 mg/ml, 1 ml blandas med 9 ml NaCl 9 mg/ml vilket ger koncentrationen 1 mg/ml. Efter aspiration injiceras 1 ml fentolamin i PVKn. Låt PVKn sitta kvar initialt. Resterande mängd fentolamin injiceras som subkutana kvaddlar á 0,5 ml runt extravaseringen. Maxdos 0,1 mg/kg eller 10 mg. Fentolamin kan tas upp systemiskt och orsaka hypotension. Patienten skall noggrant övervakas avseende blodtryck minst 1 timme efter infiltration.</p>", "category": "Praktiskt"}, {"title": "FEOKROMOCYTOM", "html": "<p><em>- Källa Riktlinjer för anestesi vid <strong>feokromocytom</strong>, PMI00806-2, giltig från 2024-09-20.<strong> Och lite övriga kunskaper.</em> </strong>BAKGRUND<strong> - Incidens 2-8 fall/milj invånare. Utgår från kromaffina celler lokaliserade till binjuremärgen (90%) eller paraganglier (10%). 10-15% maligna. Producerar varierande mängd noradrenalin och adrenalin, ibland ytterligare vasoaktiva peptider. </strong>UTREDNING <strong> - DT/MR, och vb MIBG-skint, PET. - Peptidscreening inkl katekolaminer i plasma och urin. Mest specifikt är metanefriner i plasma, dvs metaboliterna metoxiadrenalin (ref <0,6 nmol/L), och metoxiadrenalin (ref <0,3 nmol/L). (När söver binjureincidentalom, se till att alltid ta eller kolla upp p-katekolaminer så att du inte missar ett feo.) / Kollega. </strong>SYMTOM<strong> - >50% har manifest högt blodtryck. Klassiska symtom: Huvudvärk (80%), svettningar (70%), palpitationer (70%). 10% är asymtomatiska med normalt blodtryck. </strong>BEHANDLING<strong> - Kurativ behandling är kirurgi. - Veckan innan operation: Inneliggande upptitrering med alfa1-blockad med doxaosin (Alfadil®). Vb tillägg calciumhämmare och betablockad. Viss ortostatism bör accepteras. Kollega: Man ska inte börja med betablockad före alfablockad vid upptäckt Feo. Man minskar då inotropin och har kvar mkt hög SVR. </strong>PREANESTESIBEDÖMNING <strong>(ska hanläggas i samråd med specialist). - RISKGRUPP 1: Inga symtom (5-10%). - RISKGRUPP 2: Normalt viloblodtryck, men attacker av högt BT, palpitationer, flush, etc. (25%). - RISKGRUPP 3: Hypertoni enligt gängse definition, med eller utan attacker (<50%). - RISKGRUPP 4: Signifikant kardiell sjukdom, med eller utan relation till hypertoni/FEO. OBS att feoinducerad karidomyopati är en signifikant riskfaktor! Alla rikgrupper genomgår 24 BT-mätning, EKG, rtg pulm, grundläggande klinisk bedömning. Grupp 3&4: EKO med riktad frågeställning. EKO för grupp 1&2 bedöms individuellt. Grupp 4: Individualiserad utredning med kardiologisk status, ec skint, stress-eko, koronarangio, efter samråd med kardiolog. - Informera pat. om konverteringsrisk och EDA innan väckning vb! - Kolla EKG. AV-block kan ju vara olämpligt vid AVb. </strong>ANESTESI<strong> </strong>Anestesiologiska problem: <strong>Hypertensiv kris, takutsubo, arytmi. </strong>Riskmoment: <strong> Största risken för katekolaminutsvämning är vid intubation, vid CO2-insufflation, & vid tumörmanipulation. Efter ligeringa av njurven och därefter finns risk för svår hypotension. </strong>Premedicinering: <strong>Bensodiazepin vb. Frikostig med komplettering på sal, tex Midazolam. </strong>Generellt:<strong> - Undvik stress och smärta pga risk för katekolaminfrisättning. - De flesta anestesiformer är användbara men histaminfrisättande LM för undvikas, liksom indirekta sympatikomimetika tex </strong>Efedrin som kan ge farlig BT-stegring<strong>. - Artärnål före induktion, CVK, 1 lumen vasopressor mm, 1 lumen adenosin, 1 ev för CVP. TEE vb. Grov infart för blödning. Slavskärm till kir. - Oftast ensidig laparoskopi. Vid öppen op EDA Th7-10. Om konvertering ev. EDA innan väckning om pat. informerad. - Mätning av CVP kan vara mkt användbart för att få känsla för hur stort volymbehov som finns. Kan annars vara klurigt att bedöma resusiteringsbehov. – Annan källa. </strong>Induktion<strong>  - Infuionspumpar med adenosin och noradrenalin kopplade till perifer infart, bärardropp glukos 25-50 mg/ml: 0,5-2 ml/kg/h, initialt 250 ml/h för slippa latens vid dosändringar. Alla BT-reglerande LM flyttas direkt när CVK finns på plats. Ytterligare infart för volym, ev, Albumin kopplad. - Induktion med Propofol, remifentanil, rocuronium, Robinul vb. - Kollega: Söv mjukt så att du hinner med med vasopressorer men se till att pat. är djupt sövd/smärtlindrad innan intubation. NA brukar man få starta direkt. Fenylefrin får man ge upprepat, de tål mkt, är ju alfablockade. Vissa kan behöva trappa upp NA snabbt ex upp till 0,3 efter sövning. - Videolaryngoskop från start för minimera trauma. </strong>Underhåll<strong> - Sevo, remi, ev EDA aktiveras försiktigt alt. när tumören är ute. - Viktigast under op, för att undvika BT-stegringar, är bra kommunikation med kirurgerna! - När operationen drar igång brukar man behöva starta Adenosin. - Be dem avvakta med tumörmanipulation om BT stiger. Kommunicera när venerna ligeras för att parera BT-fall. - Adensoin verkar snabbare så det kan vara lättare att ha kvar en del NA och styra trycket med adenosin istället för att justera NA upp och ned utan Adenosin. / Kollega. </strong>Ligering<strong> av </strong>binjureven<strong> och efter </strong> - Kan bli hypotona och behöva ordentliga doser NA. I ovanliga fall behövs tillägg med adrenalin och vasopressin. <strong>Postop</strong> - Nattis postop eller CIVA. Ev. kvarvarande NA-infusion trappas försiktigt ut, ev med stöd av kolloid för MAP >70. Följ b-glukos för att undvika <strong>hypoglykemi</strong> när den adrenerga stimuleringen är borta. - Postoperativ hypotoni: - Kvarvarande alfablockad. - Nedregelrade receptorer. - Förlust av höga hormonnivåer. - Insulinresistensen kan minska betydligt postop, ha koll på läkemedel i TC, kan bli hypoglykema om de får ordinarie LM. <strong>KIRURGISKA </strong>KOMPLIKATIONER<strong> - Vid op höger sida retroperitoneal teknik: Risk för skada på v. cava. Kan blöda och även risk för luftembolier. - Vid op på vänster sida risk för skada på aorta. Kan bli enorm blödning. Här kan man behöva stänga av aorta genom subcostalt snitt, man måste alltså lägga pat. på sidan. Oftast är det mjälten som blöder mkt på vä sida. Kan även vara på a. renalis. - Vid större blödning kan man behöva lägga pat. på sidan och göra ett större subcostalt snitt. - Binjuren har flera små arteriella försörjningar. Ursprung njurartären, mjältartären på vä sida. Njurartären på vä sida. En sprucken binjure måste tas bort, det går inte att coila. </strong>LÄKEMEDEL<strong> ADENOSIN Potent vasodilaterande, ffa på resistanskärl, hämmar NA-frisättning och effekten av NA/A på hjärtat, samt hämmar överledning i AV-nod. Genom en extremt kort halveringstid (10 sekunder) utgör adenosin </strong>hörnstenen i vår <strong>perioperativa</strong> behandling av <strong>hypertensiv</strong> kris<strong>. Normal infusionshastighet 50-100-500-(1000) μg/kg/min. (kollega brukar starta på 50). Adenosin 5mg/ml dras upp outspätt i 50ml-spruta för infusionspump. Ger även bronkokonstriktion men det ses inte på feo-operationerna då de har så mkt cirkulerande katekolaminer. Bryts ned av ospecifika esteraser och det är inte så stor individuell variation. MAGNESIUM Co-enzym i regleringen av bl.a. kalciumkanaler; har en </strong>antiarrytmisk<strong> effekt genom att hämma frisättning av </strong>katekolaminer<strong>, samt </strong>vasodilaterande<strong> alfa-blockad på resistanskärl</strong>. Används alltmer som <strong>tillägg till </strong>adenosin<strong>, och är </strong>särskilt effektivt vid <strong>arrytmier</strong> eller adrenalinproducerande tumörer<strong>. Normal dosering 5-10 mmol iv bolus, därefter 5-10 mmol/h. 1g Magnesiumsulfat = 4 mmol. Ampullen är 10 ml, 1 mmol/ml. Vid uttalad vasoplegi efter Mg-infusion när preparatet är ute kan calciumglukonat (Ca-Sandoz®) ges. Brevibloc® (esmolol) Snabb- och kortverkande selektiv beta-1-blockare, halveringstid 2-9 minuter beroende på enstaka eller upprepad dosering. Används </strong>vid <strong>tachykardi</strong>/<strong>tachyarytmi</strong> <strong>pga</strong> adrenalinproducerande tumör<strong>. Initialdos förslagsvis 2 mg bolus (späd till 1 mg/ml i 10 ml spruta), mer behövs ofta. Kan också ges i infusion, då outspädd. Tillägg av Metoprolol (Seloken) kan vara lämpligt för att minska dosbehovet av Esmolol, beakta dock längre halveringstid, 3-5 timmar efter iv injektion. NIPRIDE® (nitroprussid) Som nitroglycerin men med </strong>effekten <strong>ffa</strong> på kapacitanskärl,<strong> och därför ett bättre alternativ än nitroglycerin till dessa patienter. Kan med fördel </strong>användas som tillägg till <strong>adenosin</strong> om det blir höga doser<strong> (många centra använder bara nitroprussid). Halveringstid ett par minuter. Ljuskänsligt, ska blandas i speciell spruta. NITROGLYCERIN Kan, liksom nitroprussid, användas i tillägg till Adenosin för blodtryckskontroll om det blir höga doser. Halveringstid 1-4 minuter. NORADRENALIN OCH/ELLER ADRENALIN </strong>Efter induktion blir patienten stressfri och ofta (inte alltid) ser man då en period med höga doser noradrenalin**, i vissa fall även adrenalin, för att ersätta patientens egenproduktion som då avtar kraftigt. Under kirurgi med tumörmanipulation blir situationen den omvända, men så snart tumörens venösa avflöde ligerats kan dosbehovet av vasopressor ånyo bli stort, ibland extremt, vi har haft noradrenalin upp till 0,6 mikrog/kg/min, och även adrenalininfusion. Brukar emellertid kunna trappas ut på postop, ofta samma kväll. Bild ovan: Koppling till perifer infart. Efter CVK på plats, adenosin separat, resterande eget lumen.</p>", "category": "Praktiskt"}, {"title": "EVAR / FEVAR / GREVAR", "html": "<p><em>Version 2023-03-28</em> <strong>PREOP UTREDNING</strong> EKO hos alla som ska sövas. Ej nödvändigt vid standard-EVAR i LA om: MET>4, ASA1-2, ingrepp helt i regionalanestesi eller LA. <strong>ANESTESI</strong> - Metod: Allt från LA till SPA/GA är möjligt. Vid EVAR är LA/sedering (gärna dex) rutin. Hos de sjukare patienterna är det lämpligare med vaken operation, men å andra sidan kan det vara svårare att medverka, ligga stilla, hålla andan. Vid FEVAR/GREVAR är operationerna långa och GA är därmed standard. - Spinaldrän kan vara aktuellt vid GrEVAR, ej alltid. Det är inte lika vanligt att de vill ha spinaldrän nu för tiden. Man tryckhöjer istället. - INVOS kan vara aktuellt. <strong>Föreberedelser</strong> - Artärkateter obliga. Sätt innan sövning. I regel på höger arm och ev. den andra tvättad. Men det kan hända att de ist. vill ha dx arm tvättad. - 2 till 3 PVK-er med förlängare. - Förbered med noradrenalin. <strong>Induktion</strong> - Patienterna har aneurysm, undvik tryckstegringar! - Gärna stöddig dos Fentanyl, gärna även extra dos Rapifen innan tubning då effekten av Fentanyl inte alltid är tillräcklig. Propofol, Esmeron. Noradrenalin. - MAP enligt bedömning ofta >70 och högre >80 efter att man stängt aneurysmet. - De får mkt kontrast så ge ½ till 1 L Ringer i början. - Antibiotika var 4e h. - Närvara när man stänger aneurysmet. <strong>Övrigt</strong> - Följ blodgaser. Ett ökat laktat kan bla. bero på påverkad cirkulation i benet om trånga kärl och stora introducers. Stäm av med pat. <strong>Förkortningar</strong> PTA: perkutan transluminal angioplastik; EVAR: endovascular aortic repair; FEVAR: Fenestrerad EVAR; GrEVAR: Grenad EVAR.</p>", "category": "Praktiskt"}, {"title": "HYPOFOSFATEMI", "html": "<p><strong>HYPOFOSFATEMI (S-fosfat </strong><<strong> 0</strong>,8 <strong>mmol</strong>/L)**</p>\n<h3>Orsaker</h3>\n<p>Finns till största del intracellulärt. Deltar i glykolysen och ATP-produktionen. Vanligt hos kritiskt sjuka och kan bero på intracellulärt skifte (vanligast), ökad renal utsöndring, eller minskad GI-absorption. <strong>Glukosbehandling</strong> är vanligaste orsaken till hypofosfatemi på sjukhus och förekommer typiskt hos etyliker, undernärda eller försvagade. Risken för hypofosfatemi är en orsak till att man bör gradvis trappa upp parenteral nutrition. Vid <strong>Hyperglykemi </strong>under längre tid med osmotisk diures så får man även renala fosfatförluster. Hypofosfatemin manifesteras dock inte förrän man börjar med <strong>insulinbehandlingen</strong> som får fosfat att gå intracellulärt <strong>Respiratorisk </strong>alkalos<strong> </strong>ökar intracellulärt pH och ökar glykolysen. Den ökade glukosnedbrytningen medierar ett ökat cellulärt upptag av glukos och fosfat. <strong>Betareceptoragonister</strong> <strong>orsakar ett fosfatskifte in i cellerna. </strong>Systemisk inflammation <strong>orsakar även hypofosfatemi orsakat av ökad konsumtion samt intracellulärt skifte av inte helt kartlagd anledning. </strong>Fosfatbindare **såsom aluminiuminnehållande ämnen såsom sucralfat kan minska GI-upptaget.</p>\n<h3>Symtom</h3>\n<p>Är oftast obemärkt kliniskt, även vid mycket låga koncentrationer.</p>\n<h3>Potentiella risker</h3>\n<p>Störd energimetabolism: <em> Minskad hjärtkontraktilitet. </em> ATP-brist i erytrocyter kan störa deras möjlighet att deformeras vilket kan leda till hemolys. <em> Minskad syreleverens pga minskade nivåer av 2,3-difosfoglycerat. </em> Minskad energitillgänglighet i cellerna pga sänkta nivåer av ATP. * Muskelsvaghet, bla i andningsmuskulaturen.</p>\n<h3>Behandling</h3>\n<p><em> Rekommenderas hos alla med mycket låg nivå av S-fosfat < 0,3 mmol/L. </em> Hos pat. med hypofosfatemi och hjärtsvikt, respsvikt, muskelsvaghet, eller stört vävnadsoxygenering. * På KS ger vi Glykophos 20-40 mmol i 100 ml NaCl /dygn.</p>\n<p><strong>Källa: </strong>The ICU Book 4th ed, Marino.</p>", "category": "Praktiskt"}, {"title": "HYSTEREKTOMI (ROBOT) / GYNCANCER (ROBOT) – Anestesi", "html": "<p>- Vissa pat. är dagkirurgiska och andra sover över. - Dagkirurgiska patienter är de som genomgår minimalinvasiv kirurgi eller mindre vulvaingrepp utan lgll. Vidare så bör de 1) Vara yngre än 75 år, undantag helt friska äldre kvinnor med performance status ECOG 0-1. 2) Utan svårare komorbitidet. 3) Planeras först på operationsprogrammet (undantag radikal hysterektomi med lgll). Kolla i Orbit <em>Info till salsteam </em>om pat. är dagkirurgisk. <strong>ANESTESI AV DAGKIRURGISKA PATIENTER</strong> - Artär, v-sond, Pinkpad, kort värmetäcke, inbäddning armar, dropp med förlängningar. Premedicinering: Paracemtamol. Anestesi: - Om dagkirurgisk patient: Spinal Marcain Spinal 7,5 mg + Sufenta 5 mikrogram. - GA. - Smärtlindring vid väckning om inte kontraindikati
