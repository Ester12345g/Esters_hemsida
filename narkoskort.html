ad). Men vid hjärnstamspåverkan eller vid hydrocefalusutveckling brukar man operera. - Optimera koagulationen. Överväg Cyklokapron. Reversera antikoagulantia. Ev. kan man ge halvdos protamin och sedan ta multiplate istället för att vänta på ett eventuellt förhöjt aFXa vid misstänkt Fragminbehandling. - Pneumoatiska kompressionsstrumor eller antikoagulantia efter > 1 dygn sedan blödning. Stäm av med neurokirurg. <strong>MONITORERING</strong> - ICP-mätning bör övervägas hos medvetlösa, stor masseffekt, intraventrikulärt blod, eller hydrocephalus. - V-drän mäter tryck och dränerar bort blod vid ventrikelgenombrott. Obs, tillse att v-dränet hålls öppet och att det dränerar bort eventuellt blod. Justera mottrycket om det inte kommer något (kontakta NK). <strong>ÖVRIGT</strong> - LP har ingen plats och är kontraindicerat. <strong>KÄLLOR</strong> Oxford Texbook of Critical care.</p>", "category": "Sjukdomstillstånd"}, {"title": "INTRAUTERIN FOSTERDÖD", "html": "<h3>EJ KLAR. ENDAST PÅBÖRJAD:</h3>\n<h3>ORSAKER</h3>\n<p>Bland annat: Antifosfolipidsyndrom, avlossning.</p>\n<h3>ÅTGÄRDER</h3>\n<p>Men tanke på att diffidiagnosen avlossning: <strong>Ta koagulationsprover och bastest</strong> då koagfaktoer kan konsumeras snabbt. Kolla särskilt APTT. Köp inte diagnosen APS hur som hest.</p>", "category": "Sjukdomstillstånd"}, {"title": "KOAGULATIONSSTÖRNING - GRAVID", "html": "<p><strong>Labanalys</strong> Sjukdom APTT PK (INR) TPK Antitrombin Fibrinogen D-dimer Preeklampsi =↑ =↑ ↓↓ ↓↓ ↑↑ ↑ DIC ↑↓ ↑ ↓↓ ↓↓ ↓↓ ↑↑ TTP = = ↓ = = = Följ utvecklingen på en serie av prover. <em>(ARG-rapport Preeklampsi, SFOG 2014, uppdaterade riktlinjer 2019)</em></p>", "category": "Sjukdomstillstånd"}, {"title": "KLÅDA", "html": "<p>Vid klåda av sufenta: Man kan börja med Tavegyl 2 mg i.v. Sedan kan man prova 0,02-0,04 mg Naloxon kan funka bra. (Tips från kollegor) Oxford Anesthesia: Kan prova Naloxon, Ondansetron, Propofol.</p>", "category": "Sjukdomstillstånd"}, {"title": "KONTRASTINDUCERAD ENCEFALOPATI (CONTRAST INDUCED ENCEPHALOPATHY)", "html": "<p><em>Version 2025-03-03</em> - Ovanligt, finn inga riktiga guidelines. - Se reviewartikel för detaljer: Clinical management of contrast-induced neurotoxicity: a systematic review. PMID 38329641. Kolla ifall nya guidelines har kommit nästa gång du läser detta kort! <strong>Diagnos</strong> - Neurologiska deficit efter kontrast i hjärnan, radiologiska fynd med kontrastläckage. <strong>Patofysiologi</strong> Man tror att det är en BBB-skada. En hypotes är att den orsakas av osmolära skiften ex från hyperosmolära kontrast som får cellerna i BBB att krympa och tight junctions påverkas. Dock är kontrast nu för tiden inte så hyperosmolär. En annan hypotes är att höga tryckpulsar från att man sprutar kontast skadar barriären. Att man ska vara försiktig med att ha katetrarna för långt in i hjärnan när man sprutar. Ovanpå detta kan det finnas etablerad BBB-skada efter ex ichemisk stroke eller svår hypertension. Således risk för svullnad och neurologiska symtom. Ex cotikal blindhet, medvetandepåverkan. Beskrivna symtom i litteraturen: A range of neurological symptoms that typically mimics ischaemic stroke, including sensory and motor deficit, aphasia, cortical blindness, and reduced consciousness. <strong>Handäggning</strong> (efter diskussion med erfaren neurointensivist)** - Hantera som en global svullnad pga inflammation och BBB-skada. - Optimera osmolalritet. - Betapred ex 8 mg x 2. - De flesta viker på 2-3 dygn. - Kan vara vettigt att mäta lumbalt tryck och om högt, dränera till ICP 15 mmHg (20 cmH2O). - Om ingen ICP-mätning sätt lite högre MAP-mål, ex MAP >80 kardiell dome (är ju ca 11-13 mmHg i skillnad mot huvudet). Så om ICP 15 så blir det CPP 50.</p>", "category": "Sjukdomstillstånd"}, {"title": "LEVERPÅVERKAN PÅ IVA (ej klar)", "html": "<p>Kollega: Det är väldigt vanligt att leverproverna stiger på IVA. Om bili inte är högt så kan man ta det lugnt innan ASAT eller ALAT gått över 5. Många LM främst ab kan påverka levern.</p>", "category": "Sjukdomstillstånd"}, {"title": "LIMB-GIRDLE SYNDROM (LIMB-GIRDLE MUSCULAR DYSTROPHY LGMB)", "html": "<p><strong>OBS LÄS</strong>:<strong> </strong>https://sfai.se/wp-content/uploads/2022/06/B4-LimbGirdle-muskeldystrofi-2022.pdf<strong> </strong>I korthet<strong> </strong>Anestesibetänkligheter<strong> - Regionalanestesi är ett mycket bra val när det är möjligt. - Rigid spine, skolios och kontrakturer kan i vissa fall försvåra intubation. - Hypertrofi av tungan kan förekomma men oklart om det påverkar intubation. </strong>Monitorering<strong> - Central tempereaturmonitorering. - Normovolemi, normotermi. </strong>Anestesi<strong> Induktion: Propofol. Valfri opioid, Esmeron (kan vara lite längre tillslagstid, och duration). Underhåll: Remi, Propofol. GE INTE: Celo, Sevoflurane, Desflurane, Isoflurane. OK ATT GE: Lustgas. Avslut: Reversera med Bridion oavsett tycker författarna till länken ovan. TOF är inte säkert tillförlitlig. Bedöm muskelfunktion efter reversering både med TOF och med en klinisk bedömning. </strong>BAKGRUND** - Limb-Girdle (Skulder-bäcken-muskeldystrofi) Ingår i gruppen hereditära myopati, och subgruppen muskeldystrofier. ICD-10-kod  G71.0W. - Sjukdomen finns i många olika former och svårighetsgraden varierar. - Skulder och höftnära muskler drabbas. - Hos en del påverkas hjärtfunktionen och hos några få även andningsmusklerna. - Mutationen påverkar muskelfibrernas cellmembran -> de sammandragande proteinerna förankras inte väl med membranet. Detta sliter och skadar muskelfibrerna. - Förekommer hos 4 till 6 per 100 000 invånare. - I Sverige är de vanligaste formerna LGMD 1B, 1C, 2A, 2B, 2D, 2I och 2L. - Muskelfibrerna långsamt bryts ned och ersätts av bindväv och fett. Vilket leder till muskelförsvagning. - De första symtomen brukar komma någon gång mellan 10 och 30 års ålder. En del insjuknar senare i livet. Musklerna blir svaga, först i bäckenet, sedan i låren, skuldrorna och överarmarna. Muskelsvagheten ökar med tiden och gör att många med sjukdomen använder rullstol eller andra hjälpmedel för att förflytta sig. Vadmuskulaturen kan samtidigt se kraftig ut eftersom sjukdomen gör att muskelfibrer omvandlas till bindväv och fett. - Hjärtat kontrolleras regelbundet hos personer med vissa former av sjukdomen. Källor: Socialstyrelsen och SFAIs rekommendation.</p>", "category": "Sjukdomstillstånd"}, {"title": "LOKALANESTETIKA - INTOX #förgiftning lokalanestetika #LAST", "html": "<p><em>Senast reviderad: 2018-02-10. Källa: Ottawa Anesthesia Primer, Internetmedicin.</em></p>\n<h3>Läkemedel som kan orsaka toxicitet</h3>\n<p>Låg toxicitet: Carbocain, Xylocain, Citanest.</p>\n<p>Medelhög toxicitet: Narop, Chirocaine.</p>\n<p>Hög toxicitet: Marcain.</p>\n<h3>Absorption beroende på blockad</h3>\n<p>Högst (fallande ordning): Interkostalblock., kaudalblock., epiduralblock., plexusblock., femoralisblock.</p>\n<h3>Orsaker</h3>\n<p>Ofrivillig intravaskulär injektion. Överdosering. Ovanligt snabb absorption från rikt vaskulariserad vävnad (Ex, näsa, munhåla, även huvud/hals-regionen).</p>\n<h3>Diffdiagnoser</h3>\n<p>Allergisk reaktion mot lokalanestetika: Extremt sällsynt. Reaktion på bärare/tillsats förekommer.</p>\n<p>Vasovagal reaktion: Pulsfall, BT-fall, ffa hos unga nervös individer, smärtsam injektion.</p>\n<p>Prilokainintox (Citanest, Emla)  Methhemoglobinemi  Minskad syretransport  Gråblek cyanotisk pat. m. chokladbrunt blod. Om >25% methhemoglobin = livshotande. Behandling: Metylenblått (1-2 mg/kg iv).</p>\n<p>Systemtoxiska symtom upptråder ofta inom minuter efter en överdos.</p>\n<h3>Symtom:</h3>\n<p>Lokalanestetika i Swe har i hög dos likanande CNS-symtom, men de kardiovaskulära skiljer sig.</p>\n<p>Uppträder ofta i följande ordning: Dåsighet, parestesier i tunga och mun  sluddrigt tal, tinnitus, muskelkramper, kramper, koma, andningsstillestånd, hjärtstillestånd.</p>\n<p>CNS-symtomen varslar om att en kardiovaskulär reaktion är nära förestående.</p>\n<p>Ytterligare CNS-symtom; berusning, anestesi kring tänder, tunga, mun, hörselhallucinationer, tinnitus, synstörning, svårighet att artikulera, långsamt sluddrigt tal, muskelryckningar, svårt att fästa blicken, tremor, gerneraliserade kramper, medvetslöshet.</p>\n<p>En kardiovaskulär reaktion börjar ofta med takykardi, därpå BT-fall, olika arytmier, breddökade QRS, bradykardi, upprepade korta asystolier, hjärtstillestånd. Förloppet kan vara hastigt.</p>\n<p>För dosering hos barn: Se internetmedicin.</p>\n<h3>SE NÄSTA SIDA FÖR BEHANDLING</h3>\n<h3>INTOX LOKALANESTETIKA</h3>\n<h3>Behandling</h3>\n<p><strong>* </strong>Primärt symtomatisk behandling</p>\n<p>Vanligen är symtomen är de toxiska symtomen snabbt övergående inom ett par minuter.</p>\n<p>Oftast räcker det med att ge syrgas och ev. kramplösande (ex Propofol eller Stesolid).</p>\n<p>Säkerhetsställ vitala funktioner.</p>\n<p>Avbryt tillförsel av lokalanestetika.</p>\n<p>Ryggläge, lätt höjd huvudända.</p>\n<p>Ge syrgas (alltid).</p>\n<p>Noggrann övervakning av vakenhetsgrad.</p>\n<p>Understöd andning och cirkulation, undvik hypoxi och hyperkapné.</p>\n<p>Vid behov: assisterad ventilation, maskventilation eller intubation.</p>\n<p><strong>Om kramper inte upphör spontant inom 15-20 sekunder</strong>:** Stesolid 5-10 mg. Propofol kan även användas för snabbare tillslag men obs. risk för BT-fall (Propofol 10-60 mg långsamt iv.).</p>\n<p><strong> Svårt att ventilera pat:</strong> Injektion av muskelrelax ex Celocurin 0,5 mg/kg.</p>\n<p><strong> BT-fall / bradykardi:</strong> Vasopressor, t ex efedrin 5-10 mg i.v. (kan upprepas efter 2-3 minuter) eller adrenalin 0,05-0,1 mg i.v. (upprepade doser 0,1 mg/ml). Även fenylefrin 0,1-0,2 mg iv kan prövas.</p>\n<p><strong>Bradykardi: </strong>Atropin 0,5-1 mg i.v.</p>\n<p><strong>Acidos:</strong> Natriumbikarbonat (50-100 ml, 60-120 mmol) på liberal indikation. Eftersträva positivt BE.</p>\n<p>Sätt en artärnål och kontrollera blodgaser.</p>\n<p><strong>Breddökade QRS:</strong> Hyperton koksaltlösning bör ges (200 mmol Natrium hastigt i.v)</p>\n<p><strong>Cirkulationsstillestånd:</strong> HLR, Intralipid; Bolus Intralipid 20 %, 1,5 ml/kg i.v. alt <strong>100 ml </strong>snabbt intravenöst**. – Starta en infusion med en lipidemulsion 0,25 ml/kg/min i 10 min, alt. 100 ml intravenöst.– Bolusdoser kan upprepas var 5:e minut, 2-3 ggr vb, 1,5 ml/kg Intralipid.– Mer än 12 ml/kg lipidemulsion bör ej ges totalt (840 ml till 70 kg:spatient). Avbryt infusionen efter stabiliserad cirkulation.</p>\n<p><strong>Svåra arytmier</strong>: Amiodaron (Cordarone).</p>\n<p><strong>Om ej svar på behandling: </strong>ECMO.</p>\n<p>Långdragen hjärt-lungräddning kan behövas vid toxisk reaktion av Marcain.</p>\n<h3>Övrigt:</h3>\n<p>Lokalanestetika metaboliseras huvudsakligen i levern.</p>\n<p>Användning av ILE på andraförgiftningar med cirkulationskollaps mer motsägelsefulla och ILE bör användasmed försiktighet. ILE kan ge olika biverkningar såsom utveckling av ARDS ochakut pankreatit. Om terapin används bör triglyceridnivån i plasma kontrollerasefter 24 timmar liksom s-amylas.</p>\n<p>PVK skall alltid finnas vid administerering av lokalanestetika i större doser (>20 ml).</p>", "category": "Sjukdomstillstånd"}, {"title": "LITIUMINTOXIKATION", "html": "<p>- Har väldigt smalt terapeutiskt fönster. - Njuren har svårt att skilja på natrium och litium, så vid hyponatremi kan njuren börja reabsorbera litium istället och man kan å höga värden. - Om man inte står på Litium och tar en överdos så hinner man kissa ut litiumet inann det blir höga värden i hjärnan. Men om man står på litum och tar en överdos så finns risk för skadliga nivåer och man måste dialyseras.</p>", "category": "Sjukdomstillstånd"}, {"title": "LUFTEMBOLI / Iatrogen arteriell gasembolisering", "html": "<p><em>Uppdaterad 2025-09-10</em> <strong>Riskingrepp</strong> Följande situationer utgör risk för att luft ska få tillträde till kärlsystemet: - Ingrepp där kärl exponeras för luft: t.ex. thoraxkirurgi, CVK-hantering (särskilt vid dragning), lungbiopsier, pleuratappning. - Snabba tryckförändringar: dykning, barotrauma, eller kraftigt thoraxtrauma. <strong>Möjliga rutter till artärsidan:</strong> - Höger–vänster-shunt: Via persisterande foramen ovale (PFO), särskilt vid tillfälligt ökat högerförmakstryck (krystning, hosta). - Passage genom lungcirkulationen: Vid mycket stora luftvolymer, eller mindre volymer som passerar genom t.ex. arteriovenösa shuntar. - Direkt artärinjektion: Vid invasiva ingrepp (angiografi, hjärtkirurgi, intraarteriell injektion). - Lungbiopsi: Punktion av lungven i kombination med kontakt med luftförande strukturer kan tillåta luftemboli direkt till vänstersidan. <strong>Patofysiologi</strong> Luftbubblor i kärlsystemet orsakar: - Ischemi genom obstruktion av perfusion. - Inflammation och ödem, vilket förvärrar vävnadsskadan. - Gaslock i hjärtat eller lungcirkulationen kan försämra hemodynamiken. <strong>Symtom</strong> Cerebrala embolie vanligt p.g.a. hjärnans höga blodflöde (15–20% av CO): - Plötslig huvudvärk - Konfusion - Fokala neurologiska symtom (t.ex. hemianopsi, pareser) - Synbortfall - Kramper - Medvetandepåverkan → koma Hög mortalitet och morbiditet. Koronarembolier - Arytmier - Ischemitecken: dynamiska ST-förändringar över flera avledningar - Snabbt växlande EKG-bild och arytmityp  Viscerala/perifera embolier - Ofta diskreta eller ospecifika symtom <strong>Åtgärder</strong> - Understödjande behandling. - 100% syrgas – minskar bubblans storlek via kvävgasutdrivning - Sänkning av huvudända till ca 15° Trendelenburg – traditionell rekommendation, effekt osäker - Hyperbar syrgasbehandling så snart som möjligt:   - Minskar bubblans volym (till ca 1/3)   - Påskyndar kvävegasutlösning   - Ökar syretillförsel   - Dämpar inflammation och ödem <strong>Transport</strong> - Trycksatt kabin (motsvarande marknivå) - Alternativt flygning på låg höjd med helicopter. <strong>Källor: </strong> Läkartidningen ”Iatrogen cerebral arteriell gasemboli efter lungemboli” 2017.</p>", "category": "Sjukdomstillstånd"}, {"title": "LUNGEMBOLI – ANESTESI MED MERA", "html": "<p><strong>TROMBOLYS HOS </strong>HEMODYNAMISKT INSTABIL PATIENT<strong> Källa: Kompendium ”Akut internmedicin, behandlingsprogram 2021”. Överväg vid chock, som förslag anges SAP <90, eller BT-fall >40 mmHg under minst 15 min. Vid submassiv lungemboli: Beror på klinisk bild. - Trombolys kan ges även under pågående LMH/UFH. - Starta heparininfusion ca 1 hnefter avslutad trombolys förutsatt att APT-tiden är <80 s. - Om APT-tiden är >80 s startas heparininfusionen 2 h efter avslutad trombolys. - OBS! Om LMH givits innan trombolys påbörjas inte heparininfusion. </strong>Kontraindikationer för trombolys: <strong> </strong>- <strong>NOAK-behandling, eller Waranbeh med PK >1,7. - Aktivt ulcus eller tarmblödning inom 4-12 veckor. - Intrakraniell blödning. - Lumbalpunktion. - Punktion av icke kopmprimerbart kärl. - Förlossning eller HLR inom 1 vecka. - Operation eller signifikant blödning inom 4 veckor. - Stroke inom 3 mån med kvarstående bortfall. - CNS-operation eller CNS-blödning inom 1 år. </strong>Relativa kontraindikationer: <strong> - Hemostasrubbningar, graviditet, CNS-malignitet (ej meningiom), pågående bakteriell endokardit, eller perikardit, avancead tumörsjukdom, leversjukdom med PK>1,4, svår hypertoni. </strong>Trombolysbehandling:<strong> - Injektion alteplase (Actilyse) 10 mg iv under två minuter följt av 90 mg under 2 timmar vid vikt ≥65 kg. - Vid vikt <65 kg ska totaldosen 1,5 mg/kg ej överskridas. - Vid mycket kritiskt läge kan inf alteplase 0,6 mg/kg (max 50 mg), iv ges under 10 min följt av alteplase 50 mg på 60 minuter. - Eventuellt heparininfusion stängs av under trombolysen. </strong>Söva pat. med lungemboli** Diskussion på Thorax: Deras erfarenhet är att det främst inte är luftvägstryck och PEEP som är farligt utan ffa hemodynamik och BT-fall. Krashar man så går det åt skogen. Kollegan sövde just en överviktig pat. med sadelemboli. Använde 200 mg Ketalar (drygt 2 mg/kg) och högdos Esmeron, hade efter induktion 10 i PEEP för att undvika atelektaser. Gick mkt bra.</p>", "category": "Sjukdomstillstånd"}, {"title": "LUNGKONTUSION / LUNGCONTUSION", "html": "<p>- Lungkontusioner är vanligt vid trauma. - När lungkontusionsvolymen på en CT går över 20% så börjar skadan bli kliniskt relevant/signifikant. - Ingen specifik behandling per se mer än allmänn lungprotektiv vård: Undvik övervätskning, försiktig ventilering i respiratorn hos sövda.</p>", "category": "Sjukdomstillstånd"}, {"title": "MULTIPEL SKLEROS / MS", "html": "<p><strong>PATOGENES</strong> - Tillhör gruppen <em>demyelinerande <strong>sjukdomar</em> där den är den vanligast förekommande. - Vanligaste handikappande sjukdomen hos unga vuxna. Vanligare hos kvinnor 20-40 år. - Många subtyper. Autoimmun sjukdom med genetiska faktorer och triggning av bla vissa virus och bakterier. - Angrepp på CNS-myelin-protein (kan angripa även andra protein) - Symtom i form av sensorikstörningar, övre motorneurondysfunktion (spasticitet, ökade djupa reflexer, muskelspasmer, pos. Babinski, svaghet), autonom dysfunktion (inkontinens pga hyperaktiv detrusormuskel, sexuell dysfunktion, tarmmotilitetsstörning), opticusneurit, cerebellär ataxi, talpåverkan, intentinstremor, nystagmus. </strong>ANESTESIOLOGISKA UTMANINGAR<strong> - Aitkenhead: Det är inte sällan de får värre symtom efter kirurgi. Men går inte att påverka anestesiologiskt och ingen särskild anestesi är rekommenderad. Ibland anges att man ska undvika epidural och spinal (pga risk för skov av lokalbedövning enligt rykten typ) om inte en starkare indikation ex sectio. - Stress, stor kirurgi, infektion/feber, hypertermi kan utlösa skov. - Om stor motordefekt/immobilisering så finns risk för kaliumfrisätning. Undvik därför Celo. - Risk för oförmåga att skydda luftvägen vid bulbära och pseudobulbär svikt. - Baklofen verkar via GABA-receptor och potentierar hypontiska effekten av Propofol, Sevo. - Ökad risk för postop aspiration. - Ibland anges MS som relativ kontraindikation till spinalanestesi exempelvis men är kontroversiellt (Narkosguiden). </strong>PREANESTESIBEDÖMNING / PREMEDICINERING<strong> - Fråga efter symtom, sväljsvårigheter, behandling. </strong>POSTOP<strong> - NIV kan vara aktuellt. </strong>KÄLLOR: **Rätt få böcker skriver om MS men: Aitkenhead, Goljan Pathology, Föreläsning Niklas J.</p>", "category": "Sjukdomstillstånd"}, {"title": "MYASTENIA GRAVIS - ANESTESI", "html": "<h3>PATOGENES</h3>\n<p>Autoimmun sjukdom med antireceptorantikroppar  förlust av postsynaptiska acetylkolinreceptorer vid neuromuskulära junction. Vanligast hos unga vuxna kvinnor. Presenterar sig oftast som gradvis ökande svaghet i pharynx och occulärt ex ptos, skelning. Typiskt är en svaghet som accentueras av ansträngning. Behandling utgörs av antikolinesteras; Pyridostigmin eller Neostigmin var 6e, tillsammans med ett vagolytiskt läkemedel för att minska muskarinerga biverkningar; atropin eller propantheline. Vidare behandling är kortison, immunosuppresion och VATS thymektomi.</p>\n<h3>ANESTESIOLOGISKA UTMANINGAR</h3>\n<p>Dessa pat. kan ha svag andningsmuskulatur, svårt att hosta, och kan ha ökad sekretion pga antikolinerg behandling. Anestesi och kirurgi kan förvärra den underliggande sjukdomen. Patienter som behandlas med plasmaferes har minskade nivåer av plasmaesteraser och en förlängd effekt av Remifentanil och mivacurium kan ses.</p>\n<h3>PREANESTESIBEDÖMNING / PREMEDICINERING</h3>\n<p><em> Antikolinesterasbehandling (Pyridostigmin eller Neostigmin) skall <strong>INTE</strong> sättas ut och skall återupptas så fort som möjligt efter operationen. </em> <strong>Fråga pat. om vad som hänt när hen glömt att ta sin medicin!</strong> <em> Undvik sederande premedicinering. </em> Dessa pat. skall ej vara dagkirurgiska! <em> Bedöm sjukdomsgraden, pat. som länge endast haft okulära symtom har sannolikt ej en progredierande sjukdom. </em> Någon som helst grad av bulbär svaghet är prediktiv för behov av postoperativ luftvägsskydd (typ näskantarell eller?). * Regionalanetesi (inkl. spinal el. epidural) bör väljas före generell anestesi. Man bör dock sikta på lägre doser pga neuromuskulärt blockande effekt. Vid neuroaxial anestesi kan uttalad diafragmasvaghet presentera sig. Följ respirationen.</p>\n<h3>GENERELL ANESTESI</h3>\n<p><em> Söv med små doser och undvik muskelrelax om möjligt. Använd kort till mellanlångverkande icke-depolariserande relax ex mivacrurium, atracrurium eller rocuronium och ge i <strong>reducerad dos</strong> ca 10-20% av normal dos<strong>. Celokurin ska undvikas (om Celo är måste  så öka dosen x 2,6 oklar källa ej bekräftat). </strong>Det verkar vara fördelaktigt att använda Esmeron och reversera med <strong>Bridion</strong>.<strong> </strong>Malin nämnde att ca 20% normaldos kan vara lämplig för RSI. </em> Överväg spraya <strong>Xylocain på </strong>stämbanden<em>*. </em> Vid tecken på infektion i luftvägarna skall elektiv kirurgi skjutas upp. <em> S-Kalium skall hållas inom normalintervallet då hypokalemi potentierar myasteni. </em> Om reversering nödvändig, använd normala doser. Men undvik reversering om möjligt då risk finns för överdosering av antikolinesteraser och därmed kolinerg kris. Förslag (Oxford): Börja med 2,5-5 mg neostigmin, och öka bolusen med 1 mg varje 2-3 min till ex maximum av ekvivalent peroral dos. Neostigmin 0,5 mg iv. motsvarar 15 mg Neostigmin eller 60 mg Pyridostigmin peroralt. * Efter väckning så kan man ge Neostigmin 1-2 mg + Atropin 0,6-1,2 mg vid extrem muskelsvaghet. Försiktighet med Neostigmin så att man inte hamnar i kolinerg kris med salivering, svettning och pupillkonstriktion. Måste kombineras med antimuskarinergika! Ex Atropin.</p>\n<h3>POSTOP</h3>\n<p>Blodgaser och pulsoxymetri kan vara normalt fram till en relativt abrupt respiratorisk svikt. PEF bör vara > 40 % av normalvärdet och VC (bör vara > 1,8 L) innan patienten kan flyttas från övervakningen (internetmedicin). Cave hypokalemi.</p>\n<p><strong>KÄLLOR: </strong>Aitkenhead, Massachusets, Oxford handbook of anaesthesia.</p>", "category": "Sjukdomstillstånd"}, {"title": "MYASTENIA GRAVIS – INTENSIVVÅRD / KRIS EJ KLAR", "html": "<p><strong>PATOFYSIOLOGI</strong> - Autoantikroppar mot postsynaptisk acetylkolinreceptorn i neuromuskulära junktion. - Subgrupper finns. Tenderar till att drabba unga kvinnor eller äldre män. - Thymus verkar ha en roll i antikroppsproduktionen.</p>\n<p><strong>KLINISKA FYND</strong> - Uttröttbar muskelstyrka. Ockulär svaghet och ptos är vanligaste symtomen. Proximala muskler drabbas mer än distala. - Bulbära symtom är vanligt och orsakar dysfagi, dysartri, och svårt att tugga. Kommer ofta hand i hand med respiratorisk svaghet.</p>\n<p><strong>NORMAL BEHANDLING</strong> - MG-patienter erhåller ofta långverkan antikolinesteraser (ex pyridostigmine) och immunosupprimerare såsom korikosteroider och steroidsparande LM såsom azathioprine. - Vid försämring/exacerbation kan de erhålla plasmaferes eller ivIG. Många auktoriteter anser att plasmaferes är bättre men kan vara kontraindicerat ev vid cirkulatorisk svikt eller graviditet.</p>\n<p><strong>DIFFDIAGNOSER</strong> - Kolinerg kris från överdosering av antikolinergika. Är ovanligt. - Guillan-Barré syndrom, botulism, polymyosit.</p>\n<p><strong>UTLÖSANDE FAKTORER</strong> - Ofta infektion. Läkemedelsutlöst orsak förekommer (ex interferron alfa). - Intiering av kortikosteroidterapi.</p>\n<h3>HANDLÄGGNING</h3>\n<p><strong>Intubation</strong> - Skall baseras på kliniska fynd och inte blodgas. - Var inte för sent ute. - ”Forcerad vitalkapacitet på <20 mL/kg” talar för intubation. - Non-invasiv ventilation är ej att rekommendera då de flesta har bulbära symtom och riskerar att aspirera. - Efter intubation brukar man ofta pausa antikolinesterasbehandlingen, även LM nedan ska undvikas. <strong>Läkemedel </strong>som kan försämra den neuromuskulära funktionen<strong> - Neuromuskulär blockad. - Antibakteriella LM: Aminoglykocider, polymixiner, ciprofloxacin. - Chloroquine. - Betablockare, Kalciumkanalblockare. - Magnesium. - Hur är det med Natriumcitrat? </strong>Behandling<strong> - Prednisolon 1 mg/kg/dag. - Plasmaferes. </strong>Extubation** - Endast när man har kontroll över eventuell infektion. - Ca 30% behöver reintuberas. - BiPAP efter extubation kan vara till hjälp.</p>\n<p><strong>PROGNOS</strong> - Myasten kris förekommer hos ca 20% hos de med early-onset myastenia gravis. De responderar ofta snabbt på behandling och får sällan återkommande kriser. Hos late-onset är det ofta det motsatta.</p>\n<p><strong>KÄLLOR: </strong>Oxford Textbook of Critical care</p>", "category": "Sjukdomstillstånd"}, {"title": "PNEUMONI PÅ IVA – Några takes.", "html": "<p><strong>KRITERIER FÖR SVÅR SAMHÄLLSFÖRVÄRVAD PNEUMONI</strong> - Debut < 48 h sedan sjukhusinläggning. - Infiltrat på rtg eller CT. - Några av följande symtom: Hosta, purulent sputa, bröstsmärta, dyspné. - Något av följande ventilationsstöd: NIV / Intuberad med PEEP ≥5, högflödesgrimma med FiO2 >50%, och PFI ≤27, när O2 > 5L via oxymask/reseroirmask mask krävs. <strong>STEROIDBEHANDLING VID </strong>SVÅR SAMHÄLLSFÖRVÄRVAD PNEUMONI<strong> – enl PM PMI 011118-1.</strong> ** - Rekommenderas att få 200 mg hydrokortison/dygn antingen som kontinuerlig infusion eller 50 mg x 4 i.v. under 8 till 14 dagar beroende på förlopp. - Behandlingsdurationen utvärderas dag 4 av behandlingen: Om pat. bedöms kunna skrivas ut inom 14 dagar från IVA, eller har samma eller minskad organsvikt sedan ankomst, så behandlingar man i tot 8 dagar. Annard blir det 14 dagar. - De som ej ska ha steroidbehandling: Stark misstanke om influensapneumoni, tuberculos elelr svampinfektion, aktiv virushepatit eller hepresinfektion, gravida kvinnor. - De som uppfyller kriterier för måttlig/svår ARDS gäller högre steroiddos med Dexametason (separat PM). (Text skriven 240726).</p>", "category": "Sjukdomstillstånd"}, {"title": "PREEKLAMPSI - MAGNESIUMBEHANDLING", "html": "<p><strong>INDIKATION:</strong> **Svår preeklampsi eller eklampsi; terapeutiskt och profylaktiskt (ffa vid CNS-symtom). (OBS: Diazepam/stesolid är INTE indicerat vid eklamptiska kramper.)</p>\n<p><strong>BEHANDLINGSREGIM</strong> Behandlingen initieras med bolusdos och därpå följer vanligen infusion till 24 efter senaste krampen, eller (vid profylax) 24 h efter partus.</p>\n<p><strong>BEREDNING</strong> Addex-Magnesium<strong> (</strong>Magnesiumsulfat/MgSO4)<strong> </strong>ges i.v. Levereras i ampuller om 10 ml. Koncentrationen kan väcka förvirring då man ibland anger olika enheter, men följande gäller: 1 ampull Addex®-Magnesium = 10 ml volym = 10 mmol MgSO4 = 2.46 g MgSO4.</p>\n<p><strong>BLANDNING </strong>&<strong> ADMINISTRERING</strong></p>\n<p><strong>Bolusdos</strong> <em> 2 Ampuller Addex-Magnesium (=20 ml = 20 mmol = 4.92 g) späds med 20 ml 0.9% NaCl. </em> Detta ger 40 ml totalvolym, konc MgSO4 = 0.5 mmol/ml (123 mg/ml). * 35 ml (17.5 mmol = 4.4 g) av blandningen ges långsamt iv. under 5-10 min.</p>\n<h3>Infusion</h3>\n<p><em> 5 ampuller Addex-Magnesium (=50 ml = 50 mmol = 12.3 g) tillsätts 450 ml 0.9% NaCl. </em> Detta ger 500 ml totalvolym med MgSO4-konc på 0.1 mmol/ml (=24.6 mg/ml). * Infusionshastighet 40 ml/h (= 4 mmol/h = 984 mg/h).</p>\n<p><strong>ÖVERVAKNING </strong>&<strong> KONTROLLER</strong> * Tecken på överdosering: Illamående, dubbelseende, muskelsvaghet, förlust av patellarreglex, nedsatt urinproduktion, andningsdepression. Vid ovan nämnd bolusdos och infusionsdos behöver plasma-Mg ej mätas utan dosjusteringar sker efter klinik och kontroller: - Ny kramp: Höjning av infusion till 80 ml/h (=8mmol/h = 1968 mg/h). - Andningsfrekvens < 12/min, avsaknad av patellarreflex (tänk på att EDA kan omöjliggöra bedömning), eller diures < 100 ml/4h: Stäng av infusionen och utvärdera. (Magnesium utsöndras via njurarna och njursvikt samt låg diures ökar således risken för överdosering). Vid manifest överdosering (ffa avseende andningsdepression) ges antidot: Calcium-Sandoz (Kalciumglubionat) 9 mg/ml, 10 ml (skall finnas omedelbart tillgängligt; ges under 3-5 min).</p>\n<p><strong>KÄLLA: </strong>PM, KS, <em>Magnesiumsulfat – anestesiologiska aspekterI, </em>Jörnvall, 2019.</p>", "category": "Sjukdomstillstånd"}, {"title": "PREEKLAMPSI OCH ANESTESI", "html": "<p>PREEKLAMPSI OCH ANESTESI</p>\n<p><strong>Senast redigerad: </strong>2017-12-27<strong> Källa: </strong>PM SFAI från 2013. Kollega på obstetriksektionen.</p>\n<p>Dessa pat. kan kan vara abnormt känsliga för vasokonstriktorer. Börja med låga doser.</p>\n<h3>Regional anestesi</h3>\n<p>Blodtrycket bör om möjligt vara reglerat innan sectio. Mål: ≤150/105 – 140/90.</p>\n<p>Regional anestesi är förstahandsalternativ vid sectio. Spinal, epidural, speda är likvärdigt. Samma doser. Försiktighet med vätsketerapi, ev. lite co-load, men sedan restriktivitet.</p>\n<p>Desmopressin ges endast på indikation trombocyt-dysfunktion. Observera att desmopressin har antidiuretisk effekt och risk finns för vattenintoxikation, lung- och hjärnödem.</p>\n<p>Vasoaktiva läkemedel såsom oxytocin skall ges med stor försiktighet. Oxytocin bör titreras i små doser (motsvarande 0,5 E= 0,83 ug/min)</p>\n<p>Metylergometrin kan utlösa hypertensiv kris och är <strong>kontraindicerat</strong> vid hypertoni. Även misoprostol kan öka blodtrycket</p>\n<p>Källa Johan: Trandate och Nepresolinfusion bör halveras precis innan du lägger spinalen.</p>\n<p><strong>Generell anestesi</strong> (OBS! Ge opioider!)**</p>\n<p>Indikationer: Uttalad koagulationspåverkan, lungödem el. påv. medvetandegrad. Ej eklamplsi.</p>\n<p>Noggrann luftvägsbedömning. Luftvägsstatus kan försämras under pågående förlossning. Larynxödem som försvårar eller omöjliggör intubation finns väl beskrivet vid preeklampsi. Vid förväntad svår intubation görs ”riskbenefit”-övervägande gentemot regionalanestesi. Om generell anestesi bedöms indicerad rekommenderas i dessa fall vaken fiberoptisk intubation.</p>\n<p>Före sövning bör blodtrycket vara reglerat (≤150/105 – 140/90) med labetalol, nifedipin och /eller hydralazin. Överväg artärnål.</p>\n<p><strong>Intubation kan förorsaka kraftig blodtrycksstegring med risk för hjärnblödning el. lungödem.</strong> Specifika åtgärder krävs för att dämpa blodtrycksreaktionen. Även vid extubation kan blodtrycksreglering behövas. Som tillägg till RSI med tiopental/propofol och muskelrelax. följande LM användas enskilt eller i kombo vid intubation: Addex®-Magnesium 1 mmol/ml, 10 mmol = 2,46g), 45 mg/ kg om magnesium ej tidigare administrerats, 30 mg/kg om pågående infusion. Interaktioner att beakta är potentiering av ickedepolariserande muskelrelaxantia samt blodtrycksfall vid samtidig kalciumblockerande behandling. Remifentanil (1 μg/kg), Alfentanil (10 μg/kg), Xylocain (1,5 mg/kg), Nitroglycerin (100 – 300 μg). Beakta risk för andningsdepression hos barnet vid använd. av opioider.</p>\n<p>Johan: Du kan ge upp till 2 mg Rapifen om stressad mamma vid omedelbart snitt. Det är mkt allvarligt att inte ge opioid till preeklampsimamma vid sövning.</p>\n<h3>POSTOP</h3>\n<p>Icke steroida antiinflammatoriska (NSAID) preparat skall undvikas till PE patienter och alternativa smärtlindrande preparat skall användas postpartum</p>\n<p>Oklar källa: Postop och högt BT: Adalat eller seloken. Förlossningen brukar ej ge trandate efter att de är förlösta. Kan börja med 50 mg seloken p.o.</p>\n<h3>ÖVRIGT</h3>\n<p>Magnesium minskar frisättning av katekoaminer från binjuren. Är membranstabiliserande så att det inte sprakar så mkt i CNS. Även bronkodilaterande, samt lite sederande.</p>", "category": "Sjukdomstillstånd"}, {"title": "EKLAMPSI", "html": "<p>EKLAMPSI</p>\n<p>Senast redigerad: 2017-12-27 Källa: PM SFAI från 2013.</p>\n<p><strong>Förekomst:</strong> Drabbar ca 1% av PE-patienterna. Majoriteten har symtom av svår PE, men 10-15% har sparsamma eller inga symtom innan första krampanfallet.</p>\n<p><strong>Riskfaktorer:</strong> Ålder < 20 år, 0-para, flerbörd, hypertoni, njursjukdom, tidigare PE/eklampsi</p>\n<p><strong>Komplikationer:</strong> Cerebrovaskulär blödning, aspiration, lungödem, hjärtstillestånd, ablatio placentae samt perinatal död.</p>\n<h3>Åtgärder:</h3>\n<p>Eklampsi är ej indikation för omedelbart sectio! Stabilisera först vitala funktioner + EKG.</p>\n<p>Läkemedel: Magnesiumsulfat MgSO4, bolus 4 g därpå infusion 1 g/h</p>\n<p>BT-sänkande behandling med Labetalol, hydralazin.</p>\n<p>Vid upprepad kramp under pågående magnesiumbehandling ges ny MgSO4 bolusdos 2–4 g.</p>\n<p>(Magnesium interagerar och kan öka risk för BT-fall vid beh. med calciumblockerare).</p>\n<p>Efter genomgången eklampsi bör mamman förlösas efter stabilisering. Vaginal förlossning är att föredra om möjligt.</p>\n<p>Preanestetiska omhändertagandet är detsamma som vid PE. En vaken och krampfri patient har sannolikt inte ett ökat ICP, varför regional anestesi rekommenderas vid eventuellt sectio. Komatös patient och/eller patient med fokalneurologi kan indicera intrakraniell patologi. I dessa fall ges generell anestesi enligt neuroanestesiologiska principer. Vätsketerapi, blodtryckskontroll, laboratorieundersökningar samt monitorering tillämpas som vid svår PE.</p>\n<p><strong>Eklampsi är ej indikation för omedelbart sectio! Regional anestesi vid akut sectio ger morbiditets-/mortalitetsvinst i förhållande till generell anestesi för modern.</strong> Individuell bedömning är dock av största vikt. Faktorer att beakta är: Svår luftväg, blödningsbenägenhet, blodtrycksreglering samt risk för lungödem, hjärnödem och cerebrovaskulär blödning.</p>\n<p>Magnesiumbehandling skall fortlöpande övervakas avseende patellarreflexer, hjärtfrekvens, andningsfrekvens och urinproduktion och behandling anpassas efter klinik. Vid tecken på överdosering minskas infusionstakten. Vid minskad urinproduktion föreligger risk för överdosering av magnesium och infusionstakten bör minskas. Serumhalten magnesium kan i dessa fall kontrolleras. Tecken på toxiska doser av magnesium är muskelsvaghet, andningsdepression och bortfall av patellarreflexer. Allvarlig toxicitet kan ge andningsstillestånd och symtomgivande bradyarytmi. Kalciumglukonat 1 g är antidot och skall finnas direkt tillgängligt vid patienten</p>\n<p>Johan: Mamman ska stabiliseras vid eklampsi!! CTGt kommer bli dåligt när mamman krampar. Där ska man säga stop; Man ska inte söva utan att få koll på mammans blodtryck först.</p>", "category": "Sjukdomstillstånd"}, {"title": "PULMONELL HYPERTENSION", "html": "<p><strong>PÅBÖRJAD EJ KLAR PÅ NÅGOT SÄTT.</strong> Pulmonell hypertension kan förekomma vid: 1. Lungemboli 2. Svår mitralisstenos 3. Svår kronisk lungsjukdom 4. Acidos + sänkt arteriell syrgasmättnad 5. Posttraumatiskt, ARDS</p>", "category": "Sjukdomstillstånd"}, {"title": "PREVERTEBRALT MJUKDELSHEMATOM", "html": "<h3>Samtal med kollegor som sövt många halsryggar:</h3>\n<p>- Om stort prevertebralt mjukdelshematom, så brukar kollegan be pat. dra ett snabbt djupt andetag, om det inte är stridor, och det finns rörlighet anteriort i larynx så är det ok. - Om det finns rörlighet/är mjukt anteriort så går det att lyfta larynx vid laryngoskopin och intubera. - Det är inte nödvändigtvis lättare att vakenfiberintubera patienterna, de kan få panik och det blir totalstopp.</p>", "category": "Sjukdomstillstånd"}, {"title": "RYGGMÄRGSSKADA – TRAUMA #spinal skada", "html": "<p><strong>KOMPLIKATIONER</strong> <strong>Respiration</strong> - Respiratorisk komplikationer är den främsta orsaken till sjukdom och död. - Respiratorisk svikt är vanligt vid skador ovan C5 och ca 75% av patienterna ehöver intuberas. - Ca 20-60% av cervikala skadorna behöver trach. Nästan alla med kompletta skador ovan C5 behöver trach. - Lufthunger är vanligt. Stora tidalvolymer kan hjälpa mot detta, likaså risk för sekretstagnation enligt vissa studier. Man kan då behöva öka dead space. Vid ryggmärsskada brukar de expiratoriska musklerna påverkas mest och den expiratoriska reserven minskar men residualvolymen ökar.  - Pga svaghet kan diafragma falla ned om pat. sitter upp. För att hålla en vettig ventilation så kan pat. behöva ligga ned eller med lätt sänkt huvudända för att få hjälp av bukens tryck så att diafragma kan röra sig mer fram och tillbaka. Vid sittande position kan ett typ av bälte/gördel hjälpa. Likaså kan höga PEEP minska tidalvolymerna. - Ohämmad parasympaticusaktivitet kan orsaka bronkokonstriktion och ökad sekretion i luftvägarna hos vissa individer. Behandlas symtomatiskt med bronkodilaterare, befuktning, sugning. <strong>Autoregulation</strong> - Komponent av spinal chock förekommer initialt. Autonom dysreflexi kan uppstå vid skador ovan T6 & debuterar efter att den spinala chocken lägger sig. Detta kan man bli varse om när reflexer såsom bulbocavernosusreflexen börjar komma tillbaka. Vid detta skede kommer även muskelspasticiteten och beror på frånvaro av inhiberande signaler till reflexbågarna. Autonom dysreflexi med mkt högt BT med risk för hjärnblödning och hjärtinfark. Se separat rubrik gällande Autonom dysreflexi. <strong>Tromboembolism</strong> - Venös tromboembolism är mycket vanligt hos pat. med ryggmärgsskada och trombosprofylax är nödvändigt och sätts in så tidigt som möjligt, gärna tillägg med anti-embolism-strumpor. <strong>GI och nutrition</strong> - Neurogen tarmfunktionsstörning kan uppstå pga brist på sympaticustonus med bla ökad tonus i colon med risk för förstoppning. Även ökad saltsyrasekretion. - Magsäcksdilatation, paralytiskt ileus, och förstoppning är vanligt. - Basala energibehovet anges vara lägre än för andra patienter. <strong>Smärta</strong> - Pat. kan ha påtaglig neuropatisk smärta. <strong>Prognosticering / gradering</strong> - För gradering och prognostisering används ASIA-score (American Spinal Injury Association). Det är det bästa score som finns i nuläget. <strong>TERMER</strong> - Neurological level och injury (NLOI): Det mest caudala ryggmärgssegmentet med normal motrisk och sensorisk funktion bilateralt. Kan skilja sig från skelettnivå eller radiologisk nivå. - Komplett spinal cord injury: Frånvaro av motorisk och sensorisk funktion i de lägsta sacrala segmenten (mao ingen anal tonus eller sensorik). - Zone of partial presetvation: Vid inkompletta skador är detta zonen nedan NLOI som har någon form av motorisk eller sensorisk funktion. - Spinal chock: Slapp pares och areflexi efter spinal skada. Vara från 48 h till veckor och slutar med att reflexer återkommer ex bulbocavernosusreflexen. - Neurogen chock: Distrubitiv chock pga förlust av sympaticustonus i perifera kärl. Vid höga skador kan även sympaticus till hjärtat vara utslaget. <strong>MÅLVÄRDEN</strong> MAP > 85 mmHg de första 7 dagarna, dock svag evidens (Oxford textbook of Crit care). På neuro siktar man på MAP >80? <strong>BEHANDLING</strong> - Protonpumpshämmare. - Trombosprofylax. - Behandling mot förstoppning. - Baklofen (alternativt tizanidine) kan användas mot muskelspasticitet (Oxford). - Mot neuropatisk smärta finns alternativ såsom: carbamazepine, gabapentin, pregabalin, även nortriptyline, amitriptyline. <strong>ÖVRIGT</strong> - Plötslig utsättning av Baklofen kan orsaka kramper, svår spasticitet, hypertermi, rabdomyolys, multiorgansvikt, död. <strong>KÄLLOR</strong> Oxford textbook of critical care.</p>", "category": "Sjukdomstillstånd"}, {"title": "SEPSIS", "html": "<p>Vid septisk chock: Vissa tycker man ska följa antitrombin III och substituera om lågt, i alla fall få upp över 0,5. Om TPK lågt, substituera för att förhindra blödning. Om påverkat INR överväg använd plasma som volymsexpander. Monitorera koagulationen tajt.</p>", "category": "Sjukdomstillstånd"}, {"title": "SHIVERING", "html": "<p>Källa: Oklar. Petidin 20-25 mg iv. Clonidin 75 mikrog iv. Temp för extubation: Vuxna: >36 °C, Barn >37 °C</p>", "category": "Sjukdomstillstånd"}, {"title": "STÄMBANDSPARES", "html": "<p><strong>BILATERAL STÄMBANDSPARES</strong> - Det brukar gå bra att ventilera och intubera dessa pat. / Ullman. - Stämbanden står paramediant så det måste inte bli komplett luftvägshinder. Dock efter operation ex av thyroidea så kan det vara svullet kring stämbanden dels pga operationen och dels pga intubationen. I dessa fall kan det bli komplett hinder. - På avdelning kan slem lägga sig ivägen och hindra pat. från att andas.</p>", "category": "Sjukdomstillstånd"}, {"title": "SUBARACH på NIVA / SUBARACHNOIDALBLÖDNING", "html": "<h3>ORSAKER</h3>\n<p>Rupturerat aneurysm (80%), AVM, AV-fistlar, kavernom, ingen påvisad blödningssälla (15%).</p>\n<p><strong>KOMPLIKATIONER</strong> (förekomst)**</p>\n<p>Reblödning, symtomgivande vasospasm (25%), kronisk hydrocephalus (15%), behandlingskomplikationer, neuropsykologiska störningar. Aspiration vanligt vid insjuknande. Stressinducerad kardiomyopati, EKG-förändringar, neurogent lungödem, pneumoni, meningit, cerebral salt wasting, SIADH (mindre vanligt), diabetes incipidus (ses sällan).</p>\n<h3>SYMTOM</h3>\n<p>Akut huvudvärk ”åskknallshuvudvärk”, illamående, kräkningar. Huvudvärk inte nödvändigtvis ihållande. Nackstelhet. Medvetslöshet. (Medvetslöshet, huvudvärk och kräkning kan vara tecken på ökat ICP).</p>\n<h3>DIAGNOSTIK</h3>\n<p>DT-hjärna förstahandsdiagnostik. Blod kan vara svårt att påvisa om >24 h från debut eller små blödning. Vid behov komplettering med LP (likvoranalys inkl spektrofotometri). LP tidigast 12 h efter insjuknande för att inte blandas ihop med stickblödning. DT-angiografi för utredning av aneurysm. Vid osäkerhet; konventionell kateterangio (DSA).</p>\n<h3>GRADERING</h3>\n<p>Hunt&Hess, WFNS, Fischers skala.</p>\n<p><strong>BEHANDLING</strong> / ÅTGÄRDER**</p>\n<p>- <strong>Tranexamsyra (Cyklokapron)</strong> kan ges till pat. med DT- eller LP-verifierad SAB om ej >1v har gått. Ges ffa när vi inte kan säkra/åtgärda blödningskällan inom 48h eller vid reblödning tidigt. <strong>EJ om endovaskulär behandling är planerad inom 6 h</strong>. 1g ges i 100 ml NaCl iv. Sedan 1 g efter 3 h, och därpå 1g var 6e h ofta i 24 - 72 h. Behandling avslutas efter åtgärd.  <strong>- Blodtryck</strong>. Tills aneurysmet är säkrat ska BT hållas <140-160. Balansgång mellan perfusion och risk för reblödning. För BT-sänkning: Trandate 5-20 mg i första hand, Nepresol 3,125 - 6,25 i andra hand. Hypotensio beh. i 1a hand med volym.  <strong>- Smärtlindring: </strong>Paracertamol. Morfin. Meningitretningen är ofta smärtsam.  - <strong>Mot illamånede: </strong>Ondansetron eller Dridol.  - <strong>Nimotop:</strong> Se Narkoskort; Läkemedel Nimotop för detaljer. Samtliga ska ha Nimotop p.o. 60 mg x 6. Eller Infusion 0,2 mg/ml, 10 ml/h, trappas upp från 2,5 till 5 ml/h. Biverkningar; hypotension, desaturation pga lungshunt. Biverkan mindre vid p.o. beh. Nimotopbehandling i 3 v från senast blödning därpå utsättning med halverad dos under 2 dgr. Vid övergång från infusion till p.o. kan full tablettdos påbörjas direkt efter att i.v. Nimotopflaskan tömts.  <strong>Keppra: </strong>Om pat har krampat, ge Keppra 2 g i 100 ml NaCL akut, sedan regelbundet, 500 mg x 2?  <strong>Magnesium</strong>:<strong> Ska upp till >1,0. Men ska inte upp så längt mer än då.  - </strong>Volym<strong>: </strong>Många behöver volymssubsitution i första hand Ringer + 40 mmol Na. Eftersträva normovolemi.  - <strong>12-avlednings-EKG: </strong>Ska tas.  - <strong>Provtagning: </strong> Tnt, Mg2+, fosfat, Ca2+. Multiplate vid osäkerhet om tpk-funktion. S100B x 2.  - <strong>CVK: </strong>Så snart som möjligt efter åtgärd hos vaken pat. Om medvetslös ev tidigare. Lokalbevdöva ordentligt, ev. Midazolam 1-2 mg.  - <strong>Lungor: </strong>Alla pat. ska lungröntgas och ev. luftvägsodlas inom 2 dygn från ankomst.  <strong>- Trombosprofylax: </strong>Ges ej innan åtgärd, men gärna kompressionsstrumpor / pneumatiska strumpor. Efter åtgärd är det Fragmin <strong>2500 IE </strong>som gäller till stamliga (enligt N-boken).  <strong>Ulcusprofylax: </strong>Ska ges Omeprazol 40 mg x 1.  <strong>- V-drän: </strong>I de fall pat. påvisar kliniska eller radiologiska tecken till ökat ICP alt. högt tryck vid op.  <strong>Monitorering:</strong> TCD dagligen, ev. ytterligare monitorering (microdialys, PbtO2). Sövd pat. kan behöva utvidgad monitorering ex microdialys.  <strong>Målvärden på IVA</strong>: Normokapné, Na 140-150. Mg2+ >1 mmol/L (potent cerebral vasodilatator), Glukos 5-10. Sat >95% & pO2 >12. Hb >100.  <strong>Mobilisering:</strong> Så fort aneurysmet är säkrat så pat. mobiliseras. Viktigt. Individberoende men: Fritt i sängen första dygnet, sängkant och stående från dygn 2. Sängläge vid neurologi. Ej vid vasospasm: Då kanske man t.o.m. ska sänka huvudändan ngt för bra CPP.  <strong>Vasopressor:</strong> Upp till 0,1 i NA är ok. Högre doser brukar man försöka undvika på NIVA. Dobutamin nästa steg. Milrinone OK prova.</p>\n<h3>SJUNKANDE MEDVETANDE</h3>\n<p>Ev. ny blödning, eller utveckling av hydrocephalus (vanligt). Ny DT. Ev. V-drän eller annan åtgärd. V-drän generellt till pat. m. sänkt medvetande. Vid plötslig medvetandesänkning hos pat. m. V-drän: Överväg stänga v-drän för att inte sänka mottrycket till rubturen för snabbt. OBS sövd pat. väcks ej efter V-dränläggning om aneurysmet inte är åtgärdat utan man väntar på åtgärd eller beslut om ej åtgärd innan väckning.</p>\n<h3>CEREBRAL VASOSPASM</h3>\n<p>- Uppkommer ffa dag 4-15 post blödningsdebut, ev. ännu senare (ovanligt).  - Klinisk värdering av vaken pat. är känsligaste metoden för att upptäcka ischemi. DT-ai med perfusion vid misstanke. Tätare provtagning S100B.  - <strong>Tecken: </strong>Tilltagande oro, förvirring, diskret dysfasi, pares, tilltagande huvudvärk, oförklarlig feber. <strong>Beroende på försörjning</strong>sområde<strong>!</strong>  <strong>- </strong>Behandling:<strong> I samråd med neurokirurg.  Optimering alternativ (PM Kar2-17738):  - Börja med åtgärder som inte riskerar vidare vasokonstriktion.  - Optimera fyllnad med normovlolemi som mål.  - Öka Hb till >100.  - Minska syrgasbehovet genom sänkt temp och ökad sedering.  - Öka syrgasleverens via ökad cardiac output, kontraktiliter och cerebral vasodilatation: Dobutamin för ökad HF (80-90) och ökad kontraktilitet. Propofol och Dubtamin för dilatation av cerebrala kärl. Milrinon kan vara ett alternativ vid svikttecken då viss evidens finns att den kanske även kan påverka kärlspasm.  - Tryckhöjning, som styrs utifrån CPP. Steg 1  CPP 80-100, steg 2 100-120.  </strong>Om svårighet att få upp CPP<strong>:</strong>  - Kan man som första steg öka CPP med ca 25% från aktuellt tryck då spasm uppdagades. Om ingen intrakraniell monitorering tryckhöjs MAP från 100-130 i hjärthöjd.  - Man kan sänka huvudändan för att öka CPP utan behöva öka BT, MAP stiger i hjärnhöjd men inte nödvändigt att ICP stiger. Kan provas hos utvalda pat. som inte har svullnad eller ICP-problem.  - Diskutera med NK om ev. sänkning av dräneringshöjd för att sänka ICP.  - Vaken pat. minsta höjning som normaliserar neurologi.  - Överväg interventionell readiologisk behandling. (Men radiologisk intervention är förenat med komplikationer ex infarkt, så man bör prova med ex tryckhöjning först någon/några timmar). Spasmen kan finnas i flera dagar och kräva upprepade åtgärder.  CPPmål: Mild höjning 80-90, måttlig 90-100, 100-120 tuff, >120 mycket tuff.</p>\n<h3>HJÄRNSVULLNAD</h3>\n<p>- Hjärnsvullnad kan uppstå efter kraftig SAH. Kan bli besvärlig då spasmbehandling och ödembehandling delvis kan motverka varandra. Optimera Na+ (>145). - Barbituratsedering kan bli nödvändig. - Ev. Stötdos m. högdos steroider (disk. med neurokirurg)</p>\n<h3>Cirkulatorisk svikt</h3>\n<p>Stressinducerad kardiomyopati förekommer m. bla. regional dysfunktion ofta i områden som ej representeras av coronarkärl. Magnitud av tnt-släpp kan bli vägledande vid differentialdiagnostik mot hjärtinfarkt där stressinducerad hjärtdysfunktion ofta har 1/10 tnt-släpp jmf med motsvarande MI. Svarar ev dåligt på NA, dobutamin kan behövas.</p>\n<p><strong>TCD</strong> (Middle cerebral artery)**</p>\n<p>- Normal <80-120 cm/s & Li < 3.  - Mild vasospasm: 120-160 cm/s & Li >3 <4.  - Måttlig vasospasm: 160-200 cm/s & Li >3 <5.  - Kritisk vasospasm >200 cm/s & Li >5.  Värden  vid måttlig vasospasm bör verifieras med DT AI + DT perfusion.  - TCD kan ha svårt att spegla bakre och frontal ischemi.  - Andra möjliga orsaker till ökade hastigheter är hyperermi tex av meningit (då rimligtvis bilat hastighetsökning), även ex om en buktande hjärna från ex kraniotomi får sträckning i kärlen. Men man får utesluta spasm först.</p>", "category": "Sjukdomstillstånd"}, {"title": "SUBARACHNOIDALBLÖDNING (aneurysm) på OPERATION", "html": "<h3>MÅL MED ANESTESIN</h3>\n<p>- Minimera risken för reblödning genom att minimera transmurala tryckförändringar över aneurysmväggen.  - Uppräthåll cerebral perfusion.  - Beakta eventuella koagulaitonsstörningar.</p>\n<p><strong>RISKFAKTORER </strong>&<strong> ORSAKER</strong></p>\n<p>Ärftlig komponent (1a gradsläktingar), hypertension, centralstimulerande droger, starka känsloutbrott, rökning, koagulationsrubbningar. Vissa kollagensjukdomar som Ehler-Danlos och polycystiska njurar. 1/3 har multipla aneurysm.</p>\n<h3>LOKALISATION</h3>\n<p>De Kärl i skallbasen som formar Circulus Willisi: Aa cerebri media dx/sin, Aa cerebri anterior dx/sin, A.communicans anterior (ACom), Aa communicans posterior dx/sin (PCom), Aa cerebri posterior dx/sin, A.basilaris</p>\n<h3>KOMPLIKATIONER</h3>\n<p>Reblödning, kärlspasm, hydrocephalus.</p>\n<h3>SYMTOM</h3>\n<p>Åskknallshuvudvärk, illamående, kräkningar. EKG-förändringar, hjärtpåverkan (Takotsubo-bild).</p>\n<h3>UTREDNING</h3>\n<p>Se under rubriken ”Subarach på NIVA”.</p>\n<h3>BEHANDLING</h3>\n<p>- Öppen kirurgi med clipsning eller endovaskulär coiling. - Alt. v-drän innan senare botande behandling.</p>\n<p><strong>ÅTGÄRDER</strong> INNAN OP**</p>\n<p><strong>Koagulation</strong>  - Tranexamsyra (Cyklokapron®) till alla med verifierad SAB, om ej > 1 vecka sedan blödning: 1gx3 iv fram tills ocklusion av aneurysmet alternativt under max 72h. Inför möjlighet till akut <strong>endo</strong>vaskulär åtgärd (<12h från ankomst) bör Cyklokapron endast ges i en dos (1g) vid ankomst för att inte öka risken för tromboemboliska komplikationer.  - Medfödda eller läkemedelsbetingade koagulationsrubbningar handläggs i samråd med operatören och v.b. koagulationskonsult.  <strong>BT: </strong>Innan åtgärd: SAP <160 mmHg. Balans mellan risk för reblödning och perfusionstryck. Trandate 5-10 mg iv vb. Om stort intracerebralt hematom/akut hydrocephalus med tecken ökat ICP och hjärnstamsinklämning måste ett högre arteriellt tryck accepteras för att garantera den cerebrala perfusionen. I dessa situationer ska såväl Addex-Na/Mannitol® som hyperventilation övervägas i dialog med mottagande neurokirurg. OBS att KAD måste sättas när Mannitol® ges.  <strong>KAD:</strong> Nödvändig ex vid mannitolbehandling.  <strong>Smärta:</strong> I vissa fall hos vaken pat. Pracetamol, morfin, ondansetron. Smärtlindra sövd pat.  <strong>Relax: </strong>Se till att tubade pat. är relaxerade vid förflyttning för att undvika hosta.  <strong>Hjärnans volym: </strong>Det är av stor vikt att minimera hjärnretraktionen vid operation. Addex-Na 80 mmol, ev Mannitol®, hyperventilation och intraoperativ likvordränering är rutinmetoder för att underlätta åtkomst.  <strong>Penicillin:</strong> Preoperativ antibiotikabehandling ges med början innan incisionen till samtliga fall:. Cefuroxim® 1,5g iv (upprepas perioperativt var 4e timme) eller vid PC-allergi ges istället Dalacin® 600mg iv (upprepas perioperativt var 8e timme)  <strong>Kramper:</strong> <strong>Om pat. har krampat, ge Keppra 2 g i 100 ml NaCl.</strong> <strong>  </strong>ENDOVASKULÄR BEHANDLING<strong>  Följ interventionistens ordinationer: Brukar var innan stent ASA 500 mg, och därpå infusion Integrilin i viktrelaterad dos. Om risk för öppen operation ges istället Kangrexal som har kortare halveringstid och op kan utföras 60 min efter avständ infusion.   </strong>TROMBOSPROFYLAX**  ”Samtliga patienter som kommer till behandling för brustet aneurysm får trombosprofylax. Peroperativ trombosprofylax med lågmolekylärt heparin (Fragmin® 2500E sc) används med början före operation. När aneurysmet är säkrat, med clips eller embolisering, får samtliga patienter generell trombosprofylax med Fragmin 2500E x 1 sc tills de är fullt mobiliserade. Perioperativt används även pneumatiska kompressionsstrumpor.”</p>\n<h3>Anestesiologiskt handläggande</h3>\n<p><strong>Premedicinering:</strong> T.Oxascand® 10mg och/eller T.Catapresan ca 2ug/kg, för att minska preoperativ stress. Undvik om patienten redan är medvetandepåverkan. Alltid Paracetamol® 1g.  <strong>Monitorering:</strong> Pulsoxymetri (SpO2), invasiv BT-mätning (rikligt med lokalanestetika när artärkateter sätts pga vasospasm-risk), EKG, frekventa blodgaser.  <strong>Infarter:</strong> PVK i stor ven för induktion. Ytterligare 2 grova infarter, CVK kan sättas efter induktion, gärna i v.subclavia.  <strong>Induktion:</strong> Läkemedel och dos väljs efter hemodynamiska förutsättningar. Propofol ca 2 mg/kg iv. Ketamin® rekommenderas vid cirkulatorisk instabilitet. Noradrenalin® kopplat via synlig PVK eller CVK. Se till att alla kranar är vridna till öppet och att PVK är välfungerande innan sövning.  <strong>Analgesi:</strong> Remifentanil® företrädesvis, starta med 0,3 ug/kg/min iv alt TCI. Innan laryngoskopi påbörjas se att pulsen börjar gå ner som tecken på effekt. Given mängd bör vara > 1,5ug/kg (idealvikt) alternativt plasma target koncentration (Cpt) > 4,5 ng/ml. Inför Mayfield-fixation ökas infusionen till 0,4 ug/kg/min under några minuter innan. Noggrann kontroll av puls och BT vid Mayfield-fixeringen.   <strong>Muskelrelaxering:</strong> Rocuronium (Esmeron®) 1-1,2mg/kg iv förstahandsval. Suxameton (Celocurin®) 1,5mg/kg iv kan vara OK.  <strong>Vasopressor:</strong> Infusion av vasopressor Noradrenalin alternativt Fenylefrin (perifert med bärardropp, som går utan pump) är att föredra framför bolusinjektioner av fenylefrin/Efedrin/Noradrenalin för att undvika snabba blodtrycksförändringar. Om bolusinjektioner ges försiktighet och vänta ut effekten och se till inte upprepa för snabbt innan effekt.  <strong>Anestesiunderhåll:</strong> Remifentanil 0,2-0,4 ug/kg/min + Sevofluran 0,8 MAC, alternativt Propofolinfusion.  <strong>Blodtrycksmål:</strong> För en normotensiv patient utan medvetandepåverkan gäller MAP >65 mmHg. För patient med hypertension eller medvetandeåverkan måste det beaktas att sänkning av MAP kan sänka CPP till den grad att risk för cerebral ischemi föreligger. För de allra flesta gäller dock att SAP < 160 mmHg eftersträvas. För patienter som har ICP-monitorering gäller uppsatta CPP-mål.  (”Är det ett aneurysm som har blött så får man sikta på 140 i SAP för att hålla marginal så att det inte blir för höga BT-toppar.” Eller ett MAP >80). Om det inte är ett aneurysm små kan man sikta SAP < 200, men gärna SAP 160 för att inte bli hypoperfunderad (när ökat ICP).  <strong>Ventilation:</strong> Normoventilation fram till öppning av duran därefter måttlig hyperventilation (pCO2 4,0-4,5) för att minska behov av mekanisk kraft för att skapa insyn/möjlighet att ligera. Inför clipsning permanent eller temporärt ökas FiO2 till 0,8.  <strong>Osmolär terapi:</strong> Gradvis höjning a S-Na är önskvärt under hela det akuta sjukdomsförloppet. I samband med duraöppning önskas ytterligare höjning för att förbättra de kirurgiska förutsättningarna (brain-relaxation). 80 mmol Addex-Na i 100 ml NaCl ges strax innan duraöppning. (förstahands-alternativ). Mannitol® 150mg/ml 200-300ml iv kan annars ges i samma tidsperiod (KAD!). Beakta att åtgärderna kan öka TMP genom att sänka ICP.   <strong>Åtgärder vid temporära clips:</strong>  - FiO2 0,8.  - Penthotal® 50-100mg iv på neurokirurgisk ordination innan clips.  - Esmeron ca 20mg iv så att pat. ej hostar, kontrollera effekten med TOF-mätning.  - Indocyaningrön (ICG eller Verdye®) önskas ofta ges efter clipsning för att kontrollera cerebralt flöde och clipsplacering. Ett pulver som blandas med 5ml sterilt vatten. På neurokirurgens kommando ges 4 ml iv snabbt och så centralt som möjligt.   <strong>Uppläggning:</strong> Extern flektion eller rotation av halsen kan försämra det venösa avflödet från hjärnan och därmed öka ICP och hjärnsvullnad. Mayfield-fixeringen är mycket smärtsam varför remifentanildosen ökas inför detta. Lokalanestesi med Ropivacain® 5mg/ml ca 4-5ml kring respektive ¨pigg¨ rekommenderas. 15-30 graders höjd huvudända.   <strong>Ventrikeldränage:</strong> I de fall patienten har en befintlig dränering av CSF kan man efter önskemål från operatören dränera max 20-30 ml i samband med duraöppningen och därefter hålla dränaget öppet – detta också för att förbättra de kirurgiska förutsättningarna. Vid väckning och extubering, samt vid förflyttningar ska dränaget vara avstängt. Vid lägesändringar se till att tryckdomen ändras.   <strong>Perioperativ aneurysmruptur. Mycket sällsynt och dramatiskt tillstånd:</strong> <strong>  - Hämta de 2 E-konc i blodkylen som finns beställda.  - Öka FiO2 till 1,0.  -Bolusinjektion av Adenosin® 5mg/ml 0,3 mg/kg oblandad (Max 20 mg). Injektionen ges i en så central ven som möjligt med efterföljande NaCl-flush. Läkemedlet inducerar asystoli i ca 45 sekunder och sedan hypotension i ytterligare ca 45 sekunder. Detta skapar förutsättningar för blodstillning/temporär ligering av tillförande kärl. OBS: Patienter med pågående förmaksflimmer/fladder som har underliggande tillstånd med pre-excitation av kammaren, så som WPW-syndrom kan slå över till ventrikelflimmer. En defibrillator ska därför finnas nära till hands.                               </strong>Väckning och extubation:** Om patienten var medvetandepåverkan innan sövning eller om komplicerad operation tas patienten till NIVA för delayed extubation. I de fall kirurgin varit okomplicerad och patienten var i det närmaste opåverkad innan sövning, väcks och extuberas patienten på operationssalen. Notera tiden när remifentanil stängs av. Stäng av Sevofluran® och vädra ut. När 5 min förflutit efter remifentanil stängts av ska patienten inte manipuleras med alls. När ca 10 min förflutit och Sevofluran® är 0,3 MAC eller mindre, samt när puls och BT börjar stiga blir det aktuellt att kunna väcka och extubera patienten. Bibehåll kontrollerad ventilation genom hela väckningen. O2-näsgrimma sätts på 5 min innan väckning med 2-3l/min O2. När patienten tittar upp på tilltal dras ET-tuben snabbt för att förhindra hostning.             Kontrollera pupiller och neurologi efter väckningen.</p>", "category": "Sjukdomstillstånd"}, {"title": "SYRA-BAS-RUBBNING", "html": "<p><strong>Hyperklorem acidos</strong>  <strong>Vid brickerdeviation / urindeviation</strong>: **Hyperklorem acidos är vanlig komplikation pga mucosan i blåsan resorberar klor, ammonium, och utsöndrar bikarbonat. Man kan därför få svår hyperklorem acidos med grav respiratorisk kompensation. Dessa pat. ska inte resusciteras med NaCl!!! De sätts regelmässigt in på Na-bic-kapslar efter kirurgi. Läs mer på uptodate: Kidney and metabolic complications following urinary diversion.</p>", "category": "Sjukdomstillstånd"}, {"title": "THYREOTOXISK KRIS / THYROID STORM /THYROID STORM / TYREOTOXISK", "html": "<h3>FYND</h3>\n<p>Uppstår i regel inom 6-24 h efter efter kirurgi med feber (>40 °C), svettningar, sinustakykardi (>140), koma, illamående, kräkningar, diarré.</p>\n<h3>ÅTGÄRDER</h3>\n<p><strong>1. Rehydrera</strong> vid dehydrering med i.v. vätska. Obs pat. kan dock få hjärtsvikt av snabb puls. <strong>2. </strong>N<strong>edkylning:</strong> Behandla hypertermi med Paracetamol samt blöt ned huden. Ge <strong>INTE </strong>NSAID<strong> </strong>då de binder till bärande proteiner i plasma och istället frigör thyroideahormon. <strong>3</strong>.<strong> </strong>Betablockare: <strong>Tabl propranolol, vanligen 60–80 mg x 4–6. (Propranolol iv. finns ej i Swe). Alternativt inj esmolol med laddningsdos på 250–500 µg/kg, sedan inf 50–100 µg/kg/min. Inj metoprolol är mindre attraktivt men kan ges 1 mg/ml, 5+5(+5) ml iv beroende på kliniskt svar. Eftersträva pulssänkning till ca 90/min. Betablockare ges tills patienten är eutyroid. Tabl diltiazem 120–240 mg x 1 är ett alternativ om betablockad inte kan ges. </strong>4. <strong>Kortison:</strong> Ge hydrokortison 200 mg iv (för att behandla binjurebarksinsuf, samt minska frisättning av T4 och konversion till T3). <strong>5. </strong>Tyreostatika:<strong> Tabl. propylthiouracil 200 mg x 6 (hämmar hormonsyntesen och minskar konverteringen av T4 till T3). Alternativt tabl tiamazole 20 mg x 4–6 po. </strong>6. Jodlösning/Lugols lösning<strong> kan övervägas (ordination av endokrinolog). </strong>7. Plasmaferes<strong> kan prövas vid kraftig cirkulationspåverkan. </strong>8. <strong>Elektrolyter: </strong>Följ och korrigera elektrolytstatus.</p>\n<h3>DIFFDIAGNOSER</h3>\n<p>Malign hypertermi: Vid thyreotoxisk kris får man inte mixad metabol och resp. acidos och inte ökat CK. Feochromocytom: Vid feo så får man inte feber. Infektion/Sepsis:</p>\n<p><strong>Källor: </strong>Oxford Handbood of anesthesia, Janusinfo,</p>", "category": "Sjukdomstillstånd"}, {"title": "TBI – TRAUMA/NIVA", "html": "<h3>TRAUMAOMHÄNDERTAGANDE</h3>\n<p>- Vid TBI & pågående blödning, högre MAP-mål: MAP > 80. Vissa anger SAP-mål iställer som ska vara >100. - Cyklokapron 1 g initialt. Därpå 1 g som infusion eller som ny bolus 1 g till när pat. lämnar traumaenheten. Stöd från Crash-3-studen. - Hypoxi och hypotension är dåligt.</p>\n<h3>NIVA</h3>\n<p>- Koagulopatin efter TBI vara ca 1 dygn. Därefter går det över till en hyperkoagulation och man behöver trombosprofylax istället. - Ta multiplate när pat. kommer till NIVA eller åker till op. Om multiplate under referensintervall, ge 1 TPK-påse. Om inte vill vänta på att TPK anländer så kan man ge Octostim 0,3 mikrog/kg. Obs på risk för hyponatremi pga vätskeretention. Följ isf Na+ med blodgaser. - Trombocyter kan man ge empiriskt 1 påse. Likaså om man ex ser en reblödning vid förlopps-DT. <strong>Läkemedel</strong> - Trombosprofylax inom 72 h. (När på NIVA?) - Nutrition: Full EN ska vara uppnådd efter 7 dagar. (TBI-pat är hypermetabola) <strong>Målvärder</strong> - Glukos 6-10 mmol/L. Hyperglykemi är dåligt, likaså hypoglykemi. - CPP i regel 60-70.</p>\n<h3>TBI generellt</h3>\n<p>- Unga har enorm möjlighet att återhämta sig. - Man kan använda impact calculator för prognossättning: Ex Glascow Outcome Scale. Finns även extended version. Återhämtning sker under lång tid, ofta 6 måndader. De flesta som lämnar NIVA blir bättre, de som blir sämre brukar avlida, då har det ofta tillkommit något. - Motoriken säger mkt om outcome. Motorrespons 1 i GCS är ofta beroende på metabola orsaker. Men ser du en sträckreflex så har du en uppfattningen och info kommer till hjärnstamsnivå, men ej vidare = dåligt. <strong>Skador</strong> - Subduralhematom är ofta förenat med kontusioner. Det finns fler skador under jmf med epiduralhematom. Åtgärdar man epiduralhematom så har man i princip tagit bort patologin. - Traumatisk subarach är mkt dålgit. Det är något i patofysiologin som drar igång. Nimotopbehandling har ej en lika tydlig intikation om subarachen är traumatisk. <strong>ICPmätning</strong> - Indikationer för ICP-mätning vid TBI: GCS < 9 med en onormal CT-bild. - Vid förhöjt ICP – Varje gång du ska gå in i ICP-trappan så ställ dig frågan: <em>Har det hänt något som kräver neurokirurgisk åtgärd?</em> – Behandla inte ett värde och missa orsaken! - ICP ska vara under 20. Så kort tid som möjligt över 20. - Generellt är det svårt att skatta ett hög intrakranielt tryck med CT även om man försöker. Först tillse: - Huvud riktat frammåt. - 30 grader höjd huvudända. - Normokapni pCO2 45,-5 kPa. - God oxygenering PaO2 >13 kPa. - Normotermi. - Euvolemi. - Adekvat sedering. ICP-trappan Sedering Osorterat: Sedering,  osmoler, autoregulation, temperatur, ventilation, metabolism-pento, metabolism-temperatur, hemikraniektomi, (Glöm ej kolla förbandet över hemikraniektomi så att den inte är för tajt), Hemikraniektomi kan ev. egentligen ligga före pentokoma, kan vara bättre för pat. Solu-medrol-bolus är ett alternativ (1g). Sedering: Sedera inte om sederingen inte är ett terapeutikum. Det är dåligt med sedering om det inte är ett terapeutikum. <strong>Orsaker till sekundär skada</strong> <strong>Intrakraniella</strong> <strong>Systemiska</strong> Cerebralt ödem Hypotension Hematom Hypoxi Hydrocephalus Hypokapni (<4) Eftersträva normokapni 4,5-5,0 kPa. Epilepsi Hyperkapni (>6) Infektion Hypertension Metabol störning Anemi (<10g/dL) Hyperglykemi >10 mmol/L Hyponatremi Hypertermi (Temp >37,5) Syrabas-störning (acidos/alkalos) <strong>EPILEPSI OCH TBI</strong> - Definieras som EP inom 7 dgr från skadan. - Riskfaktorer: GCS <10, Kortikal kontusion, Depressed skull frakture, Subduralt, epiduralt, eller intracerebralt hematom. Penetrerande skallskada, Kramper inom 24 efter insult. - Vid penetrerande skador är EP-incidensen 50% och hos övriga högriskpat 4-25%. <strong>ÖVRIGT</strong> - SAFE-TBI-studien påvisade ökad dödlighet hos pat. som randomiserades till Albumin jmf NaCl. De hade även högre ICP. Så man kanske bör undvika albumin hos denna population. Finns teorier kring skadad blöd-hjärn-barrirär etc.</p>", "category": "Sjukdomstillstånd"}, {"title": "UREMI", "html": "<p>Stigande urea på CIVA hos AKI-patient har tre geneser: Otillräcklig dialysdos, muskelsönderfall, nutritionsbehandlingen.</p>", "category": "Sjukdomstillstånd"}, {"title": "THYREOTOXISK KRIS / THYREOTOXIKOS", "html": "<h3>PATOGENES</h3>\n<p>T3 binder till receptorer i cellkärnan och påverkar genuttrycket -> Ökad syntes av: Beta-adrenerga receptorer, Na/K-ATPas. Orsakar: Ökat CO, ökad puls, kärldilatation, ökad metabolism, ökad termogenes.</p>\n<h3>UTLÖSANDE ORSAKER</h3>\n<p>Svår stress t.ex. kirurgi hos otillräckligt behandlad eller obehandlad tyreotoxikos.</p>\n<h3>ORSAKER TYREOTOXIKOS</h3>\n<h3>Stimulering av tyroidea</h3>\n<table class=\"card-table\">\n<tr><td>TSH-receptor-antikroppar</td><td>Grave’s sjukdom (vanligast 60-70%)</td></tr>\n<tr><td>Ökad utsöndring av TSH</td><td>Hypofysadenom</td></tr>\n<tr><td>Ökad hCG-utsöndring</td><td>Trofoblastiska tumörer.</td></tr>\n<tr><td><strong>Hyperaktiv tyroidea</strong></td><td>Adenom, multinodulär struma (30-40%).</td></tr>\n</table>\n<h3>Inflammatorisk frisättning av T3/T4</h3>\n<table class=\"card-table\">\n<tr><td>Autoimmun destruktion.</td><td>Tyroidit</td></tr>\n<tr><td>Viral (?) infektion</td><td>De Quervain</td></tr>\n<tr><td>Läkemedelsinducerad</td><td>Amiodarone, litium, interferon alfa.</td></tr>\n<tr><td>Bakteriell/svamp-infektion</td><td>Akut suppurativ tyroidit</td></tr>\n</table>\n<p>Strålning</p>\n<h3>Annat</h3>\n<table class=\"card-table\">\n<tr><td>Överdosering T3/T4</td><td>Iatrogent</td></tr>\n<tr><td>Ektopisk hypertyroidism</td><td>Struma ovarii</td></tr>\n<tr><td>Jod-exponering</td><td>Jod-Basedow effekt (t.ex. i amiodarone finns 37% jod)</td></tr>\n</table>\n<h3>KLINISK BILD</h3>\n<p>Tremor, delirium, koma. Takykardi, förmaksflimmer, hjärtsvikt, angina, hypotension/chock. Temp >38,5 (ofta >40). Buksmärta, illamående, kräkning, diarré. Struma? Exoftalmus?</p>\n<h3>PROVTAGNING</h3>\n<p>TSH, Fritt T3 & Fritt T4 (nivåer korrelerar inte alltid med kliniska symtom), TRAK (Graves), TPO-ak (kron lymfocytär tyreoidit, postpartumtyreoidit, Grave’s). Leverprover (sekundär leversvikt förekommer), anemi, leukocytos, hyperkalcemi förekommer.</p>\n<h3>BEHANDLING</h3>\n<table class=\"card-table\">\n<tr><td>Betablockad</td><td>T. Propranolol 60-80 mg x 4 till x6. ELLER Esmolol iv.: Laddningsdos 250-500 mikrog/kg därefter 50-100 mikrog/kg/min. ELLER Inj. Metoprolol 5 mg iv x 2-3. ELLER T. dilitazem 120-240 mg x 1 om kontraindikation mot betablockad.</td></tr>\n<tr><td>Tyreostatika</td><td>T. propylthiouracil (Tiotil) 200 mg x 6 (ELLER tiamazole 20 mg x 4-6). (Hämmar T3/T4-syntes och konvertering av T4 till T3.</td></tr>\n<tr><td>Steroider</td><td>Infusion hydrokotison (Solu-Cortef) 300 mg/d. Hämmar frisät. och konvert. T4 -> T3.</td></tr>\n<tr><td>Anjonbytare</td><td>Kolestyramin 4 g x 4. Hindrar återupptag av thyroideahormon via tarm.</td></tr>\n<tr><td>Jod</td><td>Kaliumjodid (Lugols lösning) ges 1 h efter tyreostatika (i samråd med endokrinolog). Minskar frisättning av T4/T3).</td></tr>\n<tr><td>Övrigt</td><td>Överväg plasmaferes vid uttalad cirkulationspåverkan. Högt kaloriintag. Paracetamol mot feber (CAVE ASA – ökar fT4). Operation när tillståndet stabiliserats.</td></tr>\n</table>\n<p>Källa: Föreläsning J. Mårtensson.</p>\n<p>VQ mismatch / SHUNT / DIFF</p>\n<p>Vid VQ-mismatch blir det en ”diff” oavsett om det är en shunt eller alveolärt dead space. Dock brukar ”diffen” bli större vid en shunt. Det går att rita upp…</p>", "category": "Sjukdomstillstånd"}, {"title": "VASOSPASM PÅ NIVA", "html": "<p>- Finns även anteckning kring endovaskulär behandling, se nästa sida. <strong>LÄKEMEDEL ATT UNDVIKA VID CEREBRAL VASOSPASM:</strong> - Catapressan anses riskera att förvärra vasospasm. <strong>TRYCKHÖJNING – CPP-MÅL</strong> Mild höjning CPP 80-90. Måttlig 90-100. Tuff 100-120. Mycket tuff >120.</p>", "category": "Sjukdomstillstånd"}, {"title": "VASOSPASM - ENDOVASKULÄR BEHANDLING", "html": "<p>- Vasospasm är en komplikation till subarach. Kan orsaka permanenta bortfall, ev livshotande. - Risk för spasm är störst 4-10 dgr efter blödning och kvarstår därefter i ytterligare 1- 2 veckor. <strong>2 typer av diagnos:</strong> a) Angiografiskt visualiserad reduktion av diameter av cerebrala blodkärl. b) Symtomatisk spasm med kliniska fynd av cerebral ischemi. <strong>Nimodipin (Nimotop)</strong> - Selektiv kalciumantagonist som skyddar neuron, glia och endotelceller från ischemikonsekvenserna. - Kalcium är en viktig mediator för flera destruktiva intracellulära kaskadreaktioner. - Behandlingstid tre veckor. - Intravenös infusion 0,2 mg/ml, 5-10 ml/h i.v. Fulldos 2mg/h (= 10ml/h). Startas på IVA. - Peroralt 60 mg × 6 - Kan ges lokalt av neurointerventionist i spastiska cerebrala kärl. - Nimodipin iv. Infusionen fortsätter som vanligt på angio, men kan halveras eller stängs av vid ankomst till angio om cirkulatorisk instabilitet. <strong>Preop förberedelse</strong> - Läkemedelsinfusioner förlängs med spiralaggregat på 4 m. - Läkemedel som är ej nödvändiga ska pausas och tas bort. - Värme under pat, och värmetäcke. - Tejpa fast v-drän mot huvudet. Se till att det inte är drag. - Sätt in bitblock. - Timdiures; intravenös kontrastmedel är kraftig diuretiskt och det tillförs oftast stora doser under behandlingen. <strong>Anestesi</strong> - Ringeracetat (ev extra natrium). - Remifentanil - vanligtvis 0,1 mikrogram/kg/min. - Noradrenalin - infusion startas eller dosen höjs innan spasmbehandlingen för att motverka en blodtryckssänkning - Stäng ev av Propofol-infusionen. Propofol har en kontraherande effekt på cerebrala arterioli. Underhåll av anestesi med gas Sevoflurane  MAC 0,7-0,8.  MAC >1 har en kärldilaterande effekt och CBF bibehålls. - ICP: Enligt IVA. CPP: >55. - Normoventilation, ej hyperventilation vilket ger omedelbar kärlkonstriktion och minskat CBF (cerebralt blodflöde) - Syresättning PaO2 12-18 kPa samt Saturation > 95%. PEEP 5 som standard. Högre PEEP risk för stas. - Manifest klinisk vasospasm behandlas med hypertoni. - Vätskor: Ringer Acetat ofta med tillsatt Addex-Natrium 40-80 mmol/l. Albumin 50 g/l vid behov. <strong>Postoperativt</strong> - Stäng av anestesigasen, Sevoflurane, och starta Propofol-infusionen - Om sänkt Nimodipin perioperativt öka ånyo Nimodipin-infusionen till tidigare inställd dos Ingen smärtlindring behövs <strong>Källa: </strong>PM PMI, Endovaskulär behandling av vasospasm, utgåva 1 2020-07-09.</p>", "category": "Sjukdomstillstånd"}, {"title": "VT / VENTRIKELTAKYKARDI", "html": "<h3>DEFINITION</h3>\n<p>Breda QRS, regelbunden, hastighet >100 slag/min, abrupt tillkomst. Kan vara monomorft eller polymorft.</p>\n<h3>DIFFDIAGNOS</h3>\n<p>SVT med grenblock kan ibland misstas för VT. 2 fynd som stärker VT-diagnosen: - AV-dissociation (P-vågor utan koppling till de breda QRSen) - Fusionsslag (kombination av supraventrikulärt slag och VT-slag). - Hos pat. med underliggande hjärtsjukdom så är 95% av alla breda QRS-takykardier är VT.</p>\n<h3>FÖREKOMST</h3>\n<p>Förekommer sällan i frånvaro av strukturell hjärtsjukdom. Kan vara livshotande om persisterande > 30 sek.</p>\n<p><strong>BEHANDLING</strong> VID PERSISTERANDE<strong> </strong>MONOMORFT<strong> VT</strong></p>\n<p><strong>Cirkulatorisk påverkan</strong> Synkroniserad elkonvertering / defibrillering vid cirkulatorisk påverkan. <strong>Om säker</strong>/sannolik<strong> VT</strong> <strong> Cordarone 50 mg/ml, 6 ml (=300 mg) spädes med 14 ml Glukos 50 mg/ml och ges iv under 2 min. Ej vid bradykardiinducerad VT eller torsades de pointes. Därpå startas infusion. Man kan lägga till ytterligare 150 mg bolusar vb (enl. ICU book). Lidokain är andrahandsalternativ vid VT. (Giftis rek bolus 1 mg/kg följt av infusion 2-4 mg/min under 6-12 h. vid VT i samband med intox av lite olika saker). - Korrigering av magnesium och kalium. </strong>Om ej säker VT (Enlig The ICU book)** - Intravenös Adenosinbolus 6 mg iv. (adenosin terminerar de flesta paroxysmala SVTer men ej VT) - Om ingen respons på 2 min, ge 12 mg Adenosinbolus iv. - Om ingen respons på 2 min, ge ytterligare 12 mg. - Om ingen respons. Går gå till rubriken ovan med Cordaronebolus.</p>\n<p>Källor: Blandad från ICU-book, intensivvårdsboken, Giftis, Janusinfo.</p>\n<p>TORSADE DE POINTES</p>\n<p>- Persisterande torsade kräver icke-synkroniserad defibrillering. - Bolus Addex <strong>magnesium</strong> iv 10 mmol på några minuter. Därefter 6 mmol/h under 6-12 h, försiktighet med infusion vid tid AV-block eller njurinsuf. - Korrigera elektrolytstörningar och sluta med risk-läkemedel. - Vid polymorft VT med normal QT-tid så kan Cordarone eller betablockad (vid ischemi) förebygga ny arytmi. 1 ampull Addex®-Magnesium = 10 ml volym = 10 mmol MgSO4 = 2.46 g MgSO4.</p>", "category": "Sjukdomstillstånd"}, {"title": "VENTRIKELARYTMI VID FÖRGIFTNING", "html": "<h3>BAKGRUND</h3>\n<p>Mekanismerna bakom arytmi i samband med intoxikation skiljer sig från de vid ischemi, varför också behandlingen skiljer sig från vanligt VT-behandling. Vid intoxikation föreligger en mer generell påverkan av alla hjärtmyocyter, varför t ex polymorf VT (TdP) är betydligt vanligare jämfört med vid akut hjärtinfakt. Intoxikerade personer har vanligen en normal hjärtfunktion som endast är vulnerabel under en begränsad tidsperiod.</p>\n<h3>BEHANDLING</h3>\n<p>Behandlingsstrategi vid VT (dock <strong>inte</strong> torsade de pointes) eller upprepade VF. Elkonvertering/defibrillering utförs endast på vitalindikation dvs vid VF eller pulslös VT (risk för terapiresistent asystoli). -<strong> Korrigera</strong> ev asfyxi, acidos eller elektrolytrubbning. - <strong>Digoxin intox</strong> - ge antidot. - <strong>Teofyllin eller koffein</strong> - ge betablockad. - <strong>Membranstabiliserande</strong> tex TCA, thioridazin, karbamazepin, klorokin, orfenadrin, eller anti­arytmika- ge natriumbikarbonat. <strong>Q</strong>Tc förlängande<strong> riskpreparat (tex Sotalol, disopyramid, klorokin, kinin, metadon, citalopram) (TdP före VF) - ge magnesium samt ev. isoprenalin. </strong>B<strong>upivakain</strong> - ge lipidterapi Förstahands-antiarytmika i <strong>övriga fall</strong> är lidokain eller magnesiumsulfat. Amiodaron kan prövas vid terapiresistens (dock aldrig vid sotalolintox eller hypokalemi pga risk för TdP eller asystoli). Dokumentationen är närmast obefintlig för amiodaronanvändning i samband med akuta förgiftningar. Vissa kliniker har inte Xylocard längre. Det går då lika bra att använda lokalanestesimedlet Xylocain injektionsvätska 10 mg/ml eller 20 mg/ ml. Obs! Utan adrenalintillsats. Dosering, lidokain, vuxna: Iv. Bolus om 1 mg/kg följd av infusion 2-4 mg/minut under 6-12 timmar. Dosering, magnesiumsulfat, vuxna: Iv. Bolus om 10 mmol (=10ml Addex-Magnesium) under några minuter. Därefter 6 mmol/timme under 6-12 timmar. OBS. Försiktighet vid njurinsufficiens eller tidigare AV-block.</p>\n<p>Källa: PM Giftis. Behandling av ventrikulära arytmier vid akut förgiftning.</p>\n<p>FRÅN ARTIKEL I LÄKARTIDNIGNEN GÄLLANDE LÄKEMEDEL <strong>SOM FÖRLÄNGER QT-tiden!</strong> FAKTA 2. <strong>AKUT BEHANDLING AV TORSADE DE POINTES I SAMBAND MED TABLETT­INTOXIKATION</strong> <strong> - </strong>Om patienten blir medvetslös<strong> och inte har palpabla pulsar, defibrillera. - </strong>Om grundrytmen<strong> (mellan torsade de pointes-arytmierna) är långsammare än 60/min, ge atropin 1 mg iv och påbörja isoprenalininfusion, 0,05 µg/kg/min, med successiv doshöjning tills grundpulsen överstiger 80 slag/min. - </strong>Ge 10–15 mmol Addex-Magnesium<strong> långsamt iv (under 2 min) och därefter en infusion om 6 mmol magnesium/tim under 12 timmar. S-Mg kontrolleras var sjätte timme och bör inte överstiga 2 mmol/l. </strong>Ge kalium iv<strong> (max 20 mmol/tim) tills S-K är 4,5–5 mmol/l. Om snabb och god effekt inte uppnås med ovanstående – sätt </strong>transvenös pacemaker** (overdrive).</p>", "category": "Sjukdomstillstånd"}, {"title": "PAROXYSMAL SYNPATISK HYPERAKTIVITET (PSH) – NEUROINTENSIVVÅRD", "html": "<p><strong>Senast redigerad: </strong>2022-04-16. <strong>Källa:</strong> Läkartidningen, ABC om Paroxysmal sympatisk hyperaktivitet (reviewer till artikeln var Nelson). <strong>BAKGRUND</strong> - Tillstånd som främst beskrivits efter TBI. Även känt som ”autonom storm” eller ”dysautonomi”. - Drabbar ca 10% av TBI-patienter. Förekommer även efter anoxisk hjärnskada, stroke, tumörer eller infektioner. Vanligare hos unga vuxna, och män. - Uppkommer inom 1 vecka från skadetillfället och förekomsten minskar allt eftersom pat. återhämtar sig. Brukar vara borta inom ett par veckor, men kan i svåra fall flera år efter skadan. - Patofysiologi: Kortikala strukturer, hypothalamus och periaqueductal gray reglerar balansen mellan inhiberande och excitatoriska signaler där ofarlig sensoriskt inflöde ska leda till nedåtgående inhibering. Enligt denna modell kan en undermålig hämning av bla. spinala reflexbågar med överreaktion av sympatiskt utflöde och motorrespons från ryggmärgen. <strong>DIFFDIAGNOSER </strong>(viktigt att utesluta andra orsaker!)<strong> - Sepsis, abstinens, lungemboli. </strong>SYMTOM<strong> - 6 huvudsymtom: Takykardi, takypné, hypertension, hypertermi, hyperhidros, ökad muskeltonus. Bilden ofta komplex, och individuella skillander föreligger. Dock verkar takykardi förekomma hos majoriteten. -  Episoder kan vara mellan få minuter upp till 2 h. Finns beksrivet att uppkomma kring 6 ggr/dag. </strong>DIAGNOS<strong> PSH-AM (Assessment Meassure): Kliniskt graderingsverktyg. Består av komponenten Clinical feature scale (CSF) som uppskattar allvarlighetsgraden (0-3). Och komponenten DLT (diagnosis likelyhood scale). SE NÄSTA SIDA. </strong>BEHANDLING<strong> Miljöanpassning: Rumstemperatur, mängd stimulus. Övrigt: Dessa pat. kan ha ett föröhjt kaloribehov. Svettningar: Vätskeersättning. Hypertermi: Kylande terapi. Morfin/opioider: Modulerar centrala signalvägar och är det mest effektiva LM för att lindra episoder såsom hypertension, takykardi, allodyni. Propofol: Kan användas mot de flesta symtomen. Betablockad: Propranolol I stort på NIVA används endast betablockad, alfablockad, gabapentin. Övriga LM används ej. </strong>CLINICAL FEATURE SCALE (CFS)<strong> – Skattar allvarlighetsgra</strong>d <strong> 0 1 2 3 Hjärtfrekvens <100 100-119 120-139 ≥140 Andningsfrekvens <18 18-23 24-29 ≥30 Systoliskt BT <140 140-159 160-179 ≥180 Temperatur <37 37-37,9 38-38,9 ≥39 Svettningar Nil Lindrig Måttlig Svår Ökad muskeltonus Nil Lindrig Måttlig Svår Svettningar: Lindrig – fuktig eller blänkande hud; måttlig – svettdroppar; svår – ymnig. Ökad muskeltonus: Lindrig – Går att övervinna; måttlig – svår att övervinna; svår – ofrånkomlig tonusökning. </strong>GRADERING: <strong>NIL: 0 poäng. Mild grad: 1-6 poäng. Måttlig grad: 7-12 poäng. Svår gra
