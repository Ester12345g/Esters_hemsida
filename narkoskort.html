*</p>\n<p>- Vi ordinerar i TC. Sätt nytt ställningstagande till dagen därpå.</p>\n<p>- Alvedon, oxycontin, oxynorm vb.</p>\n<p>- Movikol.</p>\n<p>- Antikoagulantia! – Se PM.</p>\n<h3>Övrigt</h3>\n<p>- CVK ut om okomplicerat förlopp. - Pacemakersladdarna kvar. Testa alltid pacemaker och tröskelvärden. - KAD kvar. - Skriv ut pat. från Birger. - Sätt ut alla läkemedel i Clinisoft.</p>\n<h3>Utanteckning</h3>\n<p>- Skriv upp pacemakerinställningarna. - Ställningstagande till telemetri. På avdelningen så har man rutinmässig telemetri på alla mekaniska klaffar. Annars är det på ordination i TC.</p>\n<h3>Rapportering</h3>\n<p>- Brukar ej göras. De får läsa i anteckningarna och ring vid frågor.</p>", "category": "Praktiskt"}, {"title": "TCD", "html": "<p><strong>PRAKTISKT</strong> - Carotis interna försörjer ett system med längre reisistens (hjärnan) än externan. Så jämför man hastigheterna i carotis så är det diastoliska hastigheten lägre i externan. -</p>", "category": "Praktiskt"}, {"title": "TCI – Target Controlled Infusion", "html": "<h3>Källa: OKLAR/muntlig.</h3>\n<h3>FÖRKORTNINGAR</h3>\n<p><strong>Cpt</strong> = Conentration plasma target = Önskad koncentration i plasma.</p>\n<p><strong>Cet</strong> = Önskad concentration på effektställe.</p>\n<p><strong>Cp</strong> = Concentration plasma = beräknad concentration i plasma.</p>\n<p><strong>Ce</strong> = Concentration effective site (hjärnan) = beräknad konc. i CNS<em>.</em></p>\n<h3>INSTÄLLNINGAR</h3>\n<h3>Farmakokinetiska program</h3>\n<p><strong>Propofol</strong>:** Välj Marsh.</p>\n<p><strong>Ultiva</strong>:** Välj Minto.</p>\n<p>Vid TCI - Använd modifierad idealvikt. Annars risk för en hög induktionsdos mm.</p>\n<p>Idealvikt = Längd - 100</p>\n<p>Modifierad Idealvikt om BMI > 30: Idealvikten + (Faktisk vikt - Idealvikt)/2</p>\n<p><strong>Display</strong>:**</p>\n<p>Ställ in ”textdisplay” på pumpen. Vid väckning stäng inte av pumpen utan ställ Propofol på ”0”. Då kan man se i displayen när förväntat uppvaknande blir.  Notera Ce-värdet på Propofol och Remifentanil då patienten somnar. Det är ett riktmärke för när pat. vankar.</p>\n<p><strong>Lathund </strong>för <strong>thyroideakirurgi</strong> <strong>på</strong> PMI<strong>. O</strong>klart vem som gjort. ** Många startar Ultiva först, men folk gör olika. Man kan teoretiskt sänka induktionsdosen Propofol med 25%. Det minskar även smärtan från Propofolet.</p>\n<table class=\"card-table\">\n<tr><td>Läkemedel <strong>Cpt</strong></td><td>Induktion</td><td>Efter intubation</td><td>Operationsstart</td><td>Underhåll</td><td>När prep. är uttaget</td><td>Suturering av buk</td><td>Väckning (sutur hud)</td></tr>\n<tr><td><strong>Propofol</strong>  Marsh  <em>Plasmatarget</em></td><td>6 (Ce 3-4)</td><td>3</td><td>3</td><td>2,5</td><td>2,5</td><td>0</td><td>0</td></tr>\n<tr><td><strong>Ultiva</strong> Minto <em>P</em><em>lasmatarget</em></td><td>6 (Ce 4-5)</td><td>3</td><td>7-14</td><td>10-14</td><td>4</td><td>4</td><td>2</td></tr>\n</table>\n<p>Vid start med Ce så bolas det kraftigare vid induktion. Använd ej.  Väck med Remifentanil på 2 ng/ml i Cpt/Ce. När pat. tittar upp dras tuben omedelbart, vänta inte att pat. återfår spontanandning.  <strong>Sedationsdoser</strong> pre-induktion:<strong> Målkoncentrationen (Cpt) för propofol ställs in på 0,5 – 1 µg/ml  Målkoncentrationen (Cpt) för remifentanil ställs in på 0,5 – 1 ng/ml.  </strong>Doser:** Propofol Cpt 8 mikrog/ml ger initialt en bolus motsvarande 2 mg/kg.</p>\n<h3>ÖVRIGT</h3>\n<p><strong>Marsh:</strong> Var först med TCI. Tar bara hänsyn till vikt. Beräknat på 18 unga friska. Använder främst Cpt. Obs tar ej hänsyn till ålder, pumpen larmar bara om man ställer in ålder <16 för vilka man ej får använda Marsh.</p>\n<p><strong>Schneider:</strong> Kom senare och tar hänsyn till fler variabler. Var först med effekt target. Har ett mindre beräknat compartment. Är mjukare och långsammare. Man märker inte så stor skillnad mellan Marsh och Schneider, men man vaknar snabbare vid Schneider. Använder främst Cet.</p>\n<p><strong>Mintu</strong>:** Är enda beräkningen för Ultiva. På CANE kör vi med plasma target för den är lite långsammare än effect target.</p>\n<p>De flesta modeller är enligt en 3-kompartment-modell. V1 = centrala compartment ofta motsvarande plasma, V2 = Organ med hög genomblödning ex hjärta lungor etc, V3 = Organ med låg genomblödning ex fettväv. Muskler ligger lite mitt immellan V2 och V3 med övervikt mot V2. Vid hög distributionsvolym så dras LM från V1 till övriga compartment fram till steady state. = Compartmentellt clearence. Context sensitive halftime: Tiden för en plasmakoncentration att halveras, vilket beror på hur länge man laddads upp med ett läkemedel och hur det normalt fördelas etc.</p>\n<h3>OM MAN ISTÄLLET KÖR VANLIG TIVA:</h3>\n<p>Propofolinfusion: 4-8 (-12) mg/kg/h.</p>\n<p>Remifentanilinfusion: 0,2-0,4 (-0,6) mikrog/kg/min.</p>\n<p><strong>BRISTOL MODELLEN</strong> – Källa lifeinthefastlane.com**</p>\n<p>En typ fattigmans-TCI. Utgår från en 3-kompartmentmodell. Förutsätter? att man premedicinerar med temazepam, ger Fentanyl 3 mikrog/kg vid induktion, och att man inhalerar N2O ?? Målet är att man ska landa på en Cp på 3. <strong>Propofolinfusion</strong>: **Bolus vid induktion 1 mg/kg. Därpå infusion 10 mg/kg/h under 10 minuter, 8 mg/kg/h under 10 minuter, därpå 6 mg/kg/h.</p>\n<h3>MARSH vs SCNEIDER</h3>\n<p>Finns ingen evidens för vilken som är bäst. Läs följande för jämförelse: http://www.partone.lifeinthefastlane.com/tiva-and-tci.html</p>", "category": "Praktiskt"}, {"title": "TEE-protokoll / TEE / Transesofagealt EKO", "html": "<h3>INSTÄLLNIGNAR</h3>\n<p>Börja alltid med 12 cm djup. Ändra så att du sparar sekvenser bakåt i tiden.</p>\n<h3>MIDESOFAGEAL ca 30 cm</h3>\n<p><strong>4-kammarvy: 0</strong>°**</p>\n<p>- VK och HK-funktion. + färgdoppler för segelklaffar.</p>\n<p><strong>Bicomisural</strong> <strong>vy</strong>: 60<strong>°</strong></p>\n<p>- VK-funktion och mitralis.</p>\n<p><strong>2-kammarvy: 90</strong>°**</p>\n<p>- VK-funktion och mitralis.</p>\n<p><strong>Långaxelvy</strong>: 120<strong>°</strong></p>\n<p>- VK & HK-dimensioner, VK-funktion, mitralis, förutsättning för SAM?</p>\n<p><strong>Aortaklaff</strong>: <strong>Zooma</strong></p>\n<p>- Rörlighet, skleros, öppningsdiameter, insuficiens.</p>\n<p><strong>Aorta </strong>ascendens<strong>: Backa upp något</strong></p>\n<p>- Dissektionsmembran? Dilatation?</p>\n<p><strong>Förmaksöra</strong>: 90<strong>°</strong></p>\n<p>- Färgdopper samt pulsad dopplerhastighet.</p>\n<p><strong>Bicaval</strong> <strong>vy</strong>: <strong>Rotera</strong> <strong>proben</strong></p>\n<p>- CVK/slang/sladd-läge, PFO (zooma och sänkt färgdopplerhastighet till ca 30)</p>\n<p><strong>Kortaxel</strong>: 60<strong>°</strong></p>\n<p>- Aortaklaff, tricuspidalis, RVOT, pulmonalis.</p>\n<p><strong>RVOT: 80</strong>°**</p>\n<p>- TI, PI.</p>\n<p><strong>TRANSGASTRISK VY: 0° och å ned till ca 40 cm, ha VK i centrum av bild. använd </strong>ev<strong> stora ratten</strong></p>\n<p><strong>Midpapillär</strong> <strong>vy</strong>: 0°**</p>\n<p><strong>Hastighet</strong> <strong>över</strong> <strong>aortaklaffen</strong></p>\n<p>- Transgastisk på mitralklaffnivå, gå ill 120 grader. Om ej bra vinkel gå till djup transgastrisk för en apikal 4Ch. Bernouli’s förenklade ekvation: ∆p = (v2)*4. v=m/s. Så får man lägga till trycket på andra sidan ex CVP.</p>", "category": "Praktiskt"}, {"title": "TRACHEOSTOMI", "html": "<p><strong>- För fördjupning och akut handläggning, se Lina </strong>bromans<strong> PM. LÄS OCH LÄGG IN INFO.</strong> <strong>Rapport av pat. med </strong>trach<strong> – Vad är viktigt att veta?</strong> - Hur ligger kanylen? Nära stomahålet eller långt ned nära carina? - Hur gammalt är stomat? - Hur ser övre luftvägarna ut? - Storleken på trach kan vara intressant om man ska börja använda talventil, stora trachar kan vara svårt för pat att andas bredvid.</p>", "category": "Praktiskt"}, {"title": "TRANSPLANTERADE PATIENTER – BLANDAT", "html": "<p><strong>INFEKTION</strong> - Klassiska infektioner hos transplanterade patienter: EBV CMV PTLD Pneumocystis Jierovici. - Tänk CMV på låggradigt febrig patient. Kan sätta sig på alla organ även på hjärnan = godnatt. <strong>IMMUNOSUPPRESSION</strong> - Om ej kan ta tabletter/fastar: Ge aldrig tacrolimus intravenöst. Är jättesvårt med koncar. Bättre att ge i sond isf. Även om det bara får vara inne 1/2 h vid ex op..  - Glöm aldrig immunosuppressionen hos pat som är transplanterade.</p>", "category": "Praktiskt"}, {"title": "TRIUCUSPIDALISINSUFICIENS / TRICUSPIDALISINSUF", "html": "<p>Källor: Faust’s Anesthesiology Review 5th ed, Sid 380. <strong>Etiologi: </strong>Vanligast är annulusdilatation med normala segel ”funktionell”. Andra orsaker är reumatisk hjärtsjukdom, carcinoid syndorm, strålning, endokardit, läkemedel (fenfluramine(phentermine, methysergide), skada från pacemakertrådar, högerkammarsvikt, myxom, mfl. <strong>Symtom: </strong>Perifera ödem, minskad aptit, asciters, förmaksflimmer. <strong>Komplikationer: </strong>Kan påverka organ pga stas. <strong>Anestesiologiska betänkligheter (</strong>renonerat<strong> mig fram):</strong> - Unvika att öka PVR: Ej höga PEEP, ej stora tidaler eller luftvägstryck. Undvika hypoxi, hyper/hypokarbi, lågt pH. Tuba snabbt, undvik atelektaser. - Undvika negativ inotropi; inte söva för hårt. - Artär och goal directed fluid therapy. - Vid problem kanske milrinonebolus kan hjälpa: Minskar PVR och ökar inotropi (Se Milrinon-kortet om dosering). - Ev undvika Fenylefrin? (Fenylefrin har kraftigast effekt på PVR (pulmonary vask resistance), noradrenalin har viss effekt på PVR, vasopressin har minimal effekt på PVR. Noradrenalin är dock inotrop vilket göra att EF inte förändras). - Ska man sikta på högre MAP pga stas vilket påverkar perfusionstrycket? - CVK med CVP-mätning?</p>\n<p>- Vid kris; Adrenalin kan öka EF kraftigt, samt öka frekvens, samt har liten effekt på PVR. B1-agonism vasodilaterar lungkapillärer, samt ökar kontraktilitet.</p>\n<p>Från Faust’s Anesthesiology Review 5th ed. sida 380.</p>", "category": "Praktiskt"}, {"title": "TROMBOCYTHÄMNING AKUT STENTNING PÅ NIVA #kengrexal #kangrelor #integrilin", "html": "<p><em>Version 2023-04-04. PM Trombocythämning vid akut <strong>stentninvg</strong>... Utgåva 1 2021-04-23. </em> - Normalt behövs Integrilin eller Kengrexal efter akut stentning eller flödesavledare för att skydda mot clottning. - Vid både Integrilin eller Kengrexal ges en bolus på angiolab. Därpå infusion mellan 16-32 h följt av radiologi (DECT & CTA) för att utesluta blödning eller ocklusion. Därpå går man normalt sett över till peroral behandling, men längre behandling förekommer. - Integrelin (eptifibatid) är en GPIIb/IIIa-hämmare, halveringstid 2,5 h. - Kangrexal (kangrelor) har en halveringstid på ca 3 min och används vid bla. risk för blödning eller när det finns risk för behov av snabb intervention. - Flödesavledare har högre ocksluionsrisk än stent och det är därför extra viktigt att man befinner sig i behandlingsintervallet och tar Multiplate tätt. - Vid dosjustering Kangrexal bör man ta ny multiplate efter 20-30 min. - Under första dygnet kan man i vissa fall kan man behöva ta Multiplate 4-6 ggr och därefter glesas ut. <strong>Övergång till tablettbehandling</strong> - Vid övergång till tablettbehandling används T. Efient laddningsdos 40 mg följt nästa dag av 10 mg x 1 i 3-6 månader. T. Efient kan krossas och ges i sond eller PEG (ej om spets i jejunum). Samtdigt ges T. Trombyl laddningsdos 300 mg följt nästa dag av 75 mg x1 tills vidare. Vid 6 h efter laddningsdos T. Efient och T. Trombyl tas multiplate ADP, ASPI och TRAP för utesluta bristfälligt svar på Efient (ADP) samt kontroll ASA-effekt (ASPI) och effekten av tidigare Integrelin försvunnit (TRAP). - Vid bristfälligt svar på Efient ges laddningsdos T. Brilique 180 mg följt av 90 mgx2 startat 12 h senare (3-6 h), <em>och <strong>Efient</strong> avslutas?!</em>) Brilique kan också krossas och ges i v-sond eller PEG (ej om spets i jejunum). - Integrelininfusionen kan stoppas och den orala dosen kan ges samtidigt på avdelningen. - Vid Kangrexalinfusion kan den orala bolusdosen ges 30 min före infusionen stoppas men inte senare än samtidigt som infusionen stoppas! <strong>Integrelin</strong> (<strong>Eptifibatid</strong>)<strong> </strong>Kengrexal<strong> (</strong>Kangrelor<strong>)</strong> <strong>Startdos</strong> 180 mikrog/kg 30 mikrog/kg <strong>Infusionsdos</strong> 2 mikrog/kg/min 4 mikrog/kg/min <strong>Multiplate</strong> TRAP<strong> Målvärde 10-30 U Responder <30U Low Responder 30-80 U Non responder >80 U </strong>Multiplate<strong> ADP</strong> Målvärde 10-30 U Responder <30 U Low responder 30-45 U Non responder >45U <strong>Dosjustering</strong> Dosjustering 5-10% steg Dosjustering 5-10% steg <strong>Halveringstid</strong> 2,5 h Ca 3 minuter. <strong>Ny </strong>multiplate<strong> efter </strong>doshustering<strong> om</strong> 20-30 min <strong>Verkningsmekanism</strong> Intravenös trombocythämmare. Hämmar aggregation reversibelt genom förhindra bindning av fibrinogen och vWF till GPIIb/IIIa-receptor. <strong>Övrigt</strong> <strong>Doser</strong>ig<strong>gslathund</strong> <strong>Integrelin</strong> för infusion av <strong>startdos</strong> 2 mikrogram/kg/min** Vikt Mikrog/min Infusionshastighet av 0,75 mg/ml Total mängd 24 h 50 100 8,0 ml/h 192 55 110 8,8 ml/h 211 60 120 9,6 ml/h 230 65 130 10,4 ml/h 250 70 140 11,2 ml/h 267 75 150 12,0 ml/h 288 80 160 12,8 ml/h 307 85 170 13,6 ml/h 326 90 180 14,4 ml/h 346 95 190 15,2 ml/h 365 100 200 16,0 ml/h 384</p>", "category": "Praktiskt"}, {"title": "NEUROANESTESI - TRIGEMINUSNEURALGI", "html": "<p><strong>BAKGRUND</strong> - N. Trigeminus har 3 grenar som försörjer sensorik i ansiktet samt motorik i m. masseter. - Karaktäriseras av sekundkorta attacker av svår skarp smärta. - Vanligen 2a och 3e grenen. Kan triggas av tuggning, tal, vind, tandborstning etc. - Brukar gå i skov under veckor till månader. - Oftast okänd etiologi, drabbar vanligen äldre, är oftast ensidigt (bilat endast hos MS-patienter). - Beh. i 1a hand farmakologisk: Karbamazepin vilket ger mkt god effekt hos 70%. - Kirurgisk behandling om Karbamazepin inte räcker. - I Swe: Mikrovaskulär dekompression (yngre pat), eller ballongkompression. - Ballongkompression: Via kanyl förs kateter in genom foramen ovale till trigeminusgangliet. Ballong fylls och komprimerar rottrådarna. Smärtsamt. Risk för bradykardi. Öka Remi och ge Robinul innan. Ballong uppspänd i ca 90-120 sek.  Vanlig biverkan är domning i halva ansiktet och övergående m. masseterpares. <strong>PREOP BEDÖMNING</strong> - Sedvanlig preop bedömning. - Ska alltid ta morgondosen medicin för sin trigeminussmärta (oftast Karbamazepin). - Premedicinering ges endast vb. och i så fall bensodiazepiner ex. T. Oxascand 5-15 mg. <strong>ANESTESI</strong> - Generell anestesi. - Sedvanlig standardmonitorering. - Risk för bradykardi pga. start smärta perioperativt. Tillse god Remifentanildos. Ge Glycoyrron (Robinul) 0,2 mg i.v. innan start. Atroin redo. <strong>KÄLLA</strong> PM PMI ”Trigeminusneuralgi”, giltig t.o.m. 2022-07-08.</p>", "category": "Praktiskt"}, {"title": "TROMBOSPROFYLAX", "html": "<p><strong>Anti faktor </strong>Xa<strong> / </strong>aFXa<strong> / antifaktor 10a</strong></p>\n<p>- Ska generellt vara över 0,3 för att pat. ska ha en trombosprofylaktisk effekt (muntlig källa från specialist). <strong>Klinkem</strong> Skåne:** Maximal läkemedelseffekt  av Fragmin uppnås 2-4 timmar efter given dos och prov skall därför tas inom detta intervall. - För LMH är uppskattade riktvärden för anti Xa-aktivitet under terapeutisk behandling: 0,2 - 1,2 kIE/L. - Huvuddelen av den antikoagulerande effekten av Heparin/Fragmin beror antagligen på inhibering av trombin och faktor Xa. Vid jämförelse är ofraktionerat heparin mer effektivt för trombinhämning medan lågmolekylärt heparin har sämre förmåga att hämma trombin men är kraftfullare för faktor Xa inhibering. För ofraktionerat heparin är den vanligast förekommande aktiverad partiell tromboplastintid (APTT). LMH påverkar oftast inte APTT. Anti-faktor Xa aktivitet kan istället användas för att mäta effekt av LMH och terapeutiskt intervall finns framtaget.</p>", "category": "Praktiskt"}, {"title": "SÖVNING", "html": "<p>SÖVNING CHECKLISTA</p>\n<p><strong>C</strong>hecklista inför akut sövning**</p>\n<p>Etc</p>\n<p>Kolla efter kardiella ingrepp: Stenum, underben.</p>\n<p>Kolla svikttecken och tecken på hjärtvvitier.</p>\n<p>Finns misstanke om hjärttamponad?</p>", "category": "Praktiskt"}, {"title": "V-drän på NIVA", "html": "<p>Trombosprofylax och dragning av V-drän: Man tar ingen hänsyn till detta utan kör på som vanligt. <strong>STOPP I V-DRÄN vid </strong>intraventrikulär<strong> </strong>blödnig<strong> <em>Se PM: Intrathekal </strong>trombolys<strong> vid stopp i v-dränage vid </strong>Intraventrikulär<strong> blödning (IVH)</strong>. <strong>Dokumentnr</strong>: K66737.</em></p>", "category": "Praktiskt"}, {"title": "VENTRIKELDRÄNAGE / V-DRÄN / VDRÄN", "html": "<p><strong>PRAKTISKT</strong> - Nollpunkten för tryckmätning är hörselgångens mynning. Egentligen är den korrekta referenspunkten - Foramen Monori som finns ca 1 cm ovan örats övre kant. Dock lite svårt att använda klinikt. - Droppkammaren får inte läggas horizontellt ex vid transport, filtret kan bli blött. - Samtal med Nelson om stänga v-drän för mätning: Tryckfallet över v-dränet/slangen är försumbar. Samtal med Dr Nelson). Att stänga V-dränet ger snarare info om andra saker. Ex hur stora marginaler du har. Typ om trycket skulle öka snabbt. <strong>KONTROLLERING AV V-DRÄN</strong> - Att orginalpropparna är utbytta till nya. - Nivå, tryckgräns. - Filtret ej är förorenat. - Vid mätning av ICP: Kontrollera att det finns en kurva på skåpet, annars risk för falska värden. <strong>DAGENS MÅL I CLINISOFT</strong> - Mottrycksnivå i mmHg och om dränet ska vara öppet eller stängt. - Önskat CCP/ICP. - Ordinera dräneringsmängd av likvor. <strong>AVVIKELSER / FELSÖKNING</strong> <strong>Pulsationer</strong> saknas:<strong> Ska synas vid öppet dränage. Vid låga tryck kan pulsationerna vara mkt svaga. Svaga pulsationer kan orsakas av bla felställda kranar, knick på slangen, koagel, luftbubblor. </strong>Högre tryck på skärmen än inställt <strong>mottstånd</strong>: <strong>Nollningsproblem. Nolla domen. </strong>Likvorläckage<strong>: </strong>Sänk motståndet på dränaget. Spolning av dränet kan bli nödvändigt. Man kan även sätta ytterligare sutur vid insticksstället. Om läckage ej kunnats stoppas på 1 dygn så bör man överväga nytt v-drän. Kolla upp. <strong>Provtagning</strong> Likvorprover får inte skickas via rörposten och måste till kemlab för analys inom 30 min. <strong>KOMPLIKATIONER</strong> <strong>Slitsventriklar </strong>– Tecken är avsaknad av pulsationer. Lågt ICP. Även att man ev. har dränerat mkt. <strong>Dåligt flöde trots </strong>pulsationer<strong> och det kommer någon droppe när man sänker</strong> – Kan vara klot, eller septering. Bland annat?</p>", "category": "Praktiskt"}, {"title": "VITALPARAMETRAR", "html": "<p>Normalvärden: <strong>NYFÖDDA </strong>v37<strong>+ </strong>: 120-160 slag/min. Men 100-180 kan även anses normalt. <strong>PREMATURA</strong>: ca 130-170. Normal variabilitet är 5-25 slag/min.</p>", "category": "Praktiskt"}, {"title": "WILSONS SJUKDOM", "html": "<p>Wilsons sjukdom är en kopparinlagringssjukdom. - Lä mer om Wilsons sjusdom och anestesi i studien: ”Challenges in Anesthesia in Wilson’s Disease: A Systematic Review of the Existing Litterature, Aravindan et al. 2023”. Sammantaget: Läkemedel som är OK: Propofol, Remifentanil, Rocuronium, Fentanyl. Unvdik Celocurin vid polyneuropati och myopati pga risk för hyperkalemi (har dock använts). Om svår leverdysfunktion undvid Rocuronium och Vecuronium pga förlängd duration. Undvik Primperan pga risk för extrapyramidala biverkningar. Postop: Eventuell dystoni kan förvärras postop med risk för bekymmer gällande luftväg och respiration. Förvärrade neuropsykiatriska symtom och delirium på postop har rapporterats.</p>", "category": "Praktiskt"}, {"title": "ÖNH / HEAD and NECK – Anestesiologiska betänkligheter – olika patologier", "html": "<p><em>Senast uppdaterad 2024-09-05</em> <strong>TYP-ANESTESIER PÅ ÖNH</strong> TIVA till BES, FESS, öppna luftvägar. Sedan i regel Sevo på resten. Käkkirugi är rätt smärtsamt därför kör man sevo, det blir annars höra doser propofol. <strong>EPIFARYNXTUMÖRER</strong> <strong> - Sitter ju i epifarynx och bör således inte försvåra laryngoskopi. - Kan dock trycka ned mjuka gommen och orsaka hinder. - Men finns det plats när pat. gapar eller att man kan trycka ned tungan från mjuka gommen utan problem så kommer du kunna laryngoskopera. </strong>MUNNBOTTENCANCER<strong> - Vid reoperation av patienter som ex har lambå och varit strålade: Dessa ska man ha respekt för. Vävnaderna flyttar inte på sig som de brukar. Kan vara stelt, mm. Vakenlarygoskopera. Bedöm om det är rimligt att söva innan fri luftväg eller om man ska vakenfibra. </strong>TONSILLTUMÖRER<strong> - Kan se läskigt ut då det kan se trång ut, men måste inte vara ett hinder för god vy vid laryngoskopi. Som riktmärke kan man ha att när tumören passerar meddellinjen så kan det bli svårt. </strong>VAKENLARYNGOSKOPI** - Bedöva med Lidocain 20 mg/ml, spruta med Magic?-munstycke.</p>", "category": "Praktiskt"}, {"title": "TELEFONNUMMER", "html": "<table class=\"card-table\">\n<tr><td>Anestesimottagningen</td><td>71500</td></tr>\n<tr><td>CIVA ÖL</td><td>71404 Dygnet runt.</td></tr>\n<tr><td>EDA-sökaren</td><td>91392/71392</td></tr>\n<tr><td>Erfaren ssk</td><td>71407</td></tr>\n<tr><td>Gyn. spec läk.</td><td>71433</td></tr>\n<tr><td>Kir. spec. läk.</td><td>71429</td></tr>\n<tr><td>Kirurgjour</td><td>98600 - Prioriterar operationerna.</td></tr>\n<tr><td>Neurojour/Neuro ssk jour</td><td>71494/71490</td></tr>\n<tr><td>Akut/trauma. spec. läk. Även jour.</td><td>71400</td></tr>\n<tr><td>Receptionen / Kattis</td><td>74163 Dygnet runt för opanmälan.</td></tr>\n<tr><td>Op-ssk.</td><td>71411</td></tr>\n<tr><td>Ortopedjour</td><td>71371</td></tr>\n<tr><td>ST-läk - Akut Trauma.</td><td>71499</td></tr>\n<tr><td>Uro spec. läk.</td><td>71357</td></tr>\n<tr><td>Salarna</td><td>769XX (Salsnummer)</td></tr>\n<tr><td>Ane. ssk jourtid. Får narkoslarmet.</td><td>71405</td></tr>\n<tr><td>Erfaren ane. ssk jourtid</td><td>71407</td></tr>\n<tr><td>Ane. ssk jourtid</td><td>71406</td></tr>\n<tr><td>Postop</td><td>74441</td></tr>\n<tr><td>Hyperbar jour</td><td>08-123 925 05</td></tr>\n<tr><td>Blodcentralen</td><td>75910</td></tr>\n<tr><td>Kardiologkonsult</td><td>76001</td></tr>\n<tr><td>Kirurg/traumajour</td><td>78600/98600</td></tr>\n<tr><td>Hybridsalen</td><td>78714</td></tr>\n<tr><td>E14</td><td>73721</td></tr>\n<tr><td>Kvällsdoktor plan 7</td><td>71413</td></tr>\n</table>", "category": "Praktiskt"}, {"title": "EKG", "html": "<p>OLIKA EKG-FYND (Ej känd källa)</p>\n<p><strong>Hyperkalemi</strong> **</p>\n<p>Toppiga T-vågor. Uppträder ofta vid S-kalium mellan 5,5 och 7,5 mmol/l. Vid höga nivåer kan även en avflackning av P-vågen ses. Risk för arytmier.</p>\n<h3>Hypokalemi</h3>\n<p>Avflackade T-vågor & accentuering U-vågor. U>T. ST-sänkningar kan uppstå, ibland övergår ST-sträckan i en inverterad T-våg. P-vågsamplituden ökar. Risk för arytmier särskilt med Digitalis.</p>\n<h3>Hypocalcemi</h3>\n<p>Förlängd QT-tid genom förlängning av ST-sträckan. Risk för fler extraslag men arytmier är mkt ovanligt.</p>\n<h3>Hypercalcemi</h3>\n<p>Förkortad QT-tid typsikt. Ibland AV-block I & intraventrikulära ledningshinder. Ibland även Osborn-våg såsom vid hypotermi. Rytmrubbningar är relativt sett mer ovanlig än vid hyperkalemi, men risken ökar vid digitalisintag.</p>\n<h3>Hypomagnesemi</h3>\n<h3>TCA-intoxikation</h3>\n<h3>Digoxinintox</h3>\n<p>Överdosering kan ge alla arytmityper. Däremot är de ST-T-förändringar som ofta ses vid digitalisbehandling inte uttryck för överdosering. ST-sänkningen har oftast en typisk hängmatteform. Ses oftast i vä. bröstavl. & extremitetsavl. Kan maskera eller feltolkas som ischemiska ST-T-förändringar. OBS digitalisinducerade ST-sänkningar accentueras regelmässigt under arbete.</p>\n<h3>Hypothyreos</h3>\n<p>Förlängd QT-tid med avflackade T-vågor, ibland med en lätt T-vågsinversion utan ST-sänkning</p>", "category": "Praktiskt"}, {"title": "MINNESRAMSOR & SCORES", "html": "<p>SOAP</p>\n<p>Suction, Oxygen, Airway, Pharmacology.</p>\n<p><strong>4S</strong>: Sug, syrgas, sänkt huvudende, svalgtub. ???</p>\n<h3>GLASCOW COMA SCALE</h3>\n<table class=\"card-table\">\n<tr><th></th><th><strong>Eyes</strong></th><th><strong>Verbal</strong></th><th><strong>Motor</strong></th></tr>\n<tr><td><strong>6 p.</strong></td><td>-</td><td>-</td><td>Följer uppmaning.</td></tr>\n<tr><td><strong>5 p.</strong></td><td>-</td><td>Orienterad.</td><td>Lokarliserar smärta</td></tr>\n<tr><td><strong>4 p.</strong></td><td>Spontant öppna</td><td>Konfusorisk.</td><td>Drar sig undan.</td></tr>\n<tr><td><strong>3 p.</strong></td><td>På uppmaning</td><td>Orimliga ord.</td><td>Flexion.</td></tr>\n<tr><td><strong>2 p.</strong></td><td>Vid smärtstimulering</td><td>Ljud.</td><td>Extenderar.</td></tr>\n<tr><td><strong>1 p.</strong></td><td>Ingen reaktion</td><td>Inget.</td><td>Ingen.</td></tr>\n</table>\n<p>PEDIATRIC GLASCOW COMA SCALE</p>\n<table class=\"card-table\">\n<tr><th></th><th><strong>Eyes</strong></th><th><strong>Verbal</strong></th><th><strong>Motor</strong></th></tr>\n<tr><td><strong>6 p.</strong></td><td>-</td><td>-</td><td>Normala spontana rörelser</td></tr>\n<tr><td><strong>5 p.</strong></td><td>-</td><td>Jollrar</td><td>Avvärjer vid beröring</td></tr>\n<tr><td><strong>4 p.</strong></td><td>Spontant öppna</td><td>Irritabel gråt</td><td>Avvärjer vid smärta</td></tr>\n<tr><td><strong>3 p.</strong></td><td>På uppmaning</td><td>Skriker vid smärtstimuli</td><td>Patologiskt böjmönster</td></tr>\n<tr><td><strong>2 p.</strong></td><td>Vid smärtstimulering</td><td>Gnyr vid smärtstiumli</td><td>Patologiskt sträckmönster</td></tr>\n<tr><td><strong>1 p.</strong></td><td>Ingen reaktion</td><td>Ingen</td><td>Inget</td></tr>\n</table>\n<p>Ultraljud: Referensvärde bukaorta: <3 cm.</p>\n<p>1846</p>\n<p>2611</p>\n<p>2341</p>\n<p>2972</p>", "category": "Praktiskt"}, {"title": "MINNESRAMSOR, SCORES, FLOWCHARTS", "html": "<h3>THE RUSH PROTOCOL</h3>\n<p>The Pump</p>\n<p>1: Perikardvätska</p>\n<p>a) Finns perikardvätska?</p>\n<p>b) Tecken på hjärttamponad? Diasolisk kolaps av RV +/- RA?</p>\n<p>2: Vänsterkammarkontraktilitet</p>\n<p>a) Hyperdynamisk?</p>\n<p>b) Normal?</p>\n<p>c) Minskad</p>\n<p>Utvärdera fractional shortening:</p>\n<p>PLAX, M-mode precis bakom mitralvalven,  (EDD-ESD/EDD)x100, ref 30-45%.</p>\n<p>3: Högerkammarbelastning</p>\n<p>a) Storlek på höger kammare? (Normal Vä höger kammarratio 1:0,6)</p>\n<p>b) Septumförskjutning mot vä kammare?</p>\n<p>The Tank (Obs, gäller ej intuberade). Undersök kort och långaxel.</p>\n<p>1: Tank volume</p>\n<p>a) Vena cava inferior <2,1 cm & minskar >50% vid sniffning --> CVP 0-5 mmgHg</p>\n<p>b) Vena cava inferior > 2,1 cm % minskar <50% vid sniffning --> 10-20 mmHg.</p>\n<p>c) Jugularisvenerna Små eller stora?</p>\n<p>2: Tank leakyness</p>\n<p>A) E-FAST: Fri vätska i buk, bäcken eller thorax=</p>\n<p>3: Tank compromise</p>\n<p>a) Ventilpneumothorax? Lung slinging, finns kometsvansar?</p>\n<p>The Pipes</p>\n<p>1: Bukaortaaneurysm? Bukaorta > 3cm? Fokusera på aorta nedom njurartärerna.</p>\n<p>2: Thorakal aortaaneurysm/dissektion?</p>\n<p>a) Aortarot > 3,8 cm? Intinal flap? Thoracal aorta > 5 cm?</p>\n<p>3: DVT? 3-punktsundersökning.</p>", "category": "Praktiskt"}, {"title": "MINNESRAMSOR, SCORES, FLOWCHARTS", "html": "<h3>SVÅR INTUBATION - FLOWCHART</h3>", "category": "Praktiskt"}, {"title": "REFERENSVÄRDEN & ENHETER", "html": "<h3>IDEALVIKT</h3>\n<p>Män: Längd-100.</p>\n<p>Kvinnor: Längd - 105.</p>\n<p>Kan användas vid ex. ställer in tidalvolym (ca 7 ml/kg kv).</p>\n<p>Vid TCI: Ställ in vikt om BMI < 30.</p>\n<p>Ställ in ideal om BMI > 30: Ställ in idealvikten och lägg till halva</p>\n<p>mellanskillnaden till aktuell vikt.</p>\n<p><strong>The Devine formula:</strong> Orginalstudie: Devine BJ. Gentamicin therapy. Drug Intell Clin Pharm. 1974;8:650–655. Används typ medcalc.</p>\n<p>Om man räknar Längd -100 – ytterligare 5 kg så hamnar man nära Divine hos normallånga. Referens: Se mina uträkningar i Stata.</p>\n<h3>INFUSION</h3>\n<p>1 ml = 20 droppar kristalloid vätska.</p>\n<p>En 1%-ig lösning innehåller 10 mg/ml</p>\n<p>En 1:1000 lösning innehåller 1 mg / ml</p>\n<p><strong>Cerebralt </strong>perfusionstryck**</p>\n<p>CPP = MAP - ICP</p>\n<p>Artärnål och intrakraniell tryckmätning nödvändig.</p>\n<p><strong>KONCENTRATION</strong> <strong>mg/ml </strong> <strong>     </strong>PROOCENT** 1:1,000                       1mg/mL      0.1% 1:10,000                     0.1mg/mL      0.01% 1:100,000                   0.01mg/mL      0.001% 1:200,000                   0.005mg/mL      0.0005%</p>\n<h3>ASA-KLASS</h3>\n<p>ASA 1 – En för övrigt frisk patient.</p>\n<p>ASA 2 – En patient med lindrig systemsjukdom.</p>\n<p>ASA 3 – En patient med allvarlig systemsjukdom.</p>\n<p>ASA 4 – En patient med allvarlig och ständigt livshotande systemsjukdom.</p>\n<p>ASA 5 – En moribund patient, som inte förväntas överleva utan operationen.</p>\n<p>ASA 6 – En avliden patient där hjärnanas funktioner totalt och oåterkallegligt fallit bort och som ska genomgå en donationsoperation.</p>\n<h3>O2-koncentration beroende på typ av tillförsel</h3>\n<p>Syrgasfraktion i luft = 21%.</p>\n<p>Grimma: För varje liter i grimman så ökar fraktionen med 4%</p>\n<p>Så maximalt kommer man upp till cirka 40% (21% + 5L * 4%).</p>\n<p>Oxymask kommer maximalt upp till 60%.</p>\n<p>Reservoirmask kommer upp till cirka 80%.</p>\n<p>Tättsittande mask kommer upp till 100%.</p>", "category": "Praktiskt"}, {"title": "KLINISKA TECKEN", "html": "<p><strong>KUSSMAULS SIGN</strong> Paradoxal utfyllnad av jugularis vid inadning. Vid högersidig hjärtinfarkt, restriktiv kardiomyopati, konstriktiv perikardit,tricuspidalisstenos. <strong>JARISCH HEXHEIMER REACTION</strong> <strong>Herring</strong>-Breuer <strong>refelxen</strong>. ** Stretchreflex i lungan så att man inte drar så djupa andtag. Slås ut när man söver.</p>", "category": "Praktiskt"}, {"title": "ADDISONKRIS", "html": "<p><strong>KORTISOL</strong> -<strong>Cirkadiansk frisättning. Peak på morgonen. 25 mg/d. 5-10% fritt. Reglerar fett-, glukos- och proteinmetabolism. Främjar hjärtkontraktiliter och kärltonus. Potentierar katekolaminer. Kontrollerar kärlpermeabilitet. Mineralkortikoid effekt. Hämmar ADH-frisättning. HPA-AXELN: Hypotalamus (CRH) -> Främre hypofysen (ACTH) -> Zona fasciculata i binjuren (kortisol). </strong>ALDOSTERON - <strong>Regleras via RAAS. Na+ och H2O resporption i distala tubuli (utbyte mot kalium som förloras). Hyperkalemi stimulerar aldosteronfrisättning. Frisätts från zona glomerulosa. </strong>ORSAKER TILL SVIKT <strong>”</strong>5 <strong>i”</strong> <strong>Primär (binjurebark)</strong> <strong>Sekundär (lågt ACTH)</strong> Immunologisk Addisons sjukdom Lymfocytär hypofysit Invasion Metastas, lymfom Hypofystumör Infektion TBC, HIV, CMV, svamp TBC, histoplasmos Infiltration Sarkoidos, amyloidos, hematokromatos Sarkoidos, amyloidos, hematokromatos Infarkt/blödning Waterhouse-Frierichsen syndrom (ex. meningokocksepsis - blödning), antifosfolipidsyndrom (infarkt) Sheehans syndrom (postpartum nekros i hypofys) Iatrogen Adrenalektomi Hypofysektomi, snabb utsättning av långvarig steroidbehandling. Infant Kongenitalt Mutationer Injury Traumatisk hjärnskada  <strong>KRONISK SVIKT - KLINISK BILD</strong>  - Ospecifik bild. - Trötthet, viktnedgång. - GI-symtom. - Neurologi (sekundär). - Hypotension. -Hypoglykemi. -Normocytär anemi. -Eosiofili. -Hyponatremi (primär - ökat ADH + aldosteronbrist; sekundär - ökat ADH). -Hyperkalemi (endast primär - aldosteronbrist). - Pigmentering (endast primär - ACTH förhöjt, vinder melanocortin-receptorer). - Mb addison associerat med andra autoimmuna sjd (hypothyreos 50%, DM typ 1 15%). <strong>AKUT SVIKT - KLINISK BILD</strong> - Livshotande. - Hypotension, svarar dåligt på vasopressorer. - Feber. - Akut svikt i binjurebarken (vanligast): a) Oftast blödning eller trombos (buksmärta). B) Akut brist i samband med stress. - Akut svikt i HPA-axeln (mindre vanligt): a) Traumatisk hjärnskada b) Blödning i hypofysen c) Sheehans syndrom (postpartum nekros i hypofysen pga hypotension). <strong>UTREDNING</strong> - S-kortisol före behandling: <100 nmol/L talar för kortisolsvikt. >400 nmol/L talar emot kortisolsvikt. - Antikroppar mot 21-hydroxylas i binjurebarken. - Synachtentest? - CT binjurar. - Fosfolipidantikroppar om binjureblödning/infarkt. - Thyroideastatus. <strong>BEHANDLING ADDISONKRIS</strong> - Inj hydrokortison (Solu-Cortef) 100 mg x 4 iv första dygnet. - Vätskeresuscitering med 0,9% NaCl. - Glukosinfusion. <strong>- </strong>Om. oförklarig hyponatremi och hyperkalemi och refreaktär hypotension ska ges 100 mg Solu-Cortef iv. <strong>Källor: </strong>Föreläsning m. J Mårtensson.</p>", "category": "Sjukdomstillstånd"}, {"title": "AKALKULÖS KOLECYSTIT", "html": "<h3>Epidemiologi</h3>\n<p>- 5-15% av kolecystiterna, men vanligare hos kritiskt sjuka. - Mortalitet ca 45%.</p>\n<h3>Patogenes</h3>\n<p>- Associerade tillstånd: Post kirurgi ffa post hjärtkirurgi, trauma, chock, multiorgansvikt. - Lång tarmvila (under TPN) ökar risken pga gallstas, men det kan behövas upp till 4 v för att risken ska vara föhöjd. - Möjliga underliggande orsaker är hypoperfusion, gallblåseuttänjning pga minskade kontraktioner, och förändring i gallsammansättningen. Gall-sludge på ultraljud är associerat med akalkulös kolecystit.</p>\n<h3>Kliniska fynd</h3>\n<p>- De flesta upptäcks inte förrän komplikationerna kommer; gangränös gallblåsa, gallblåseperforation, så fynden vid akalkulös kolecystit motsvarar allvarlig komplicerad kolecystit. - Smärta och ömhet under hö arcus kan saknas hos 1/3. - Feber (100%), ökat bilirubin (90%), hypotension (90%), multiorgansvikt (65-80%), positiva blododlingar (90%) varav nästan alla påvisar gramnegativa baciller.</p>\n<h3>Diagnos</h3>\n<p>- 1a-handsval är ultraljud; Förtjockad gallblåsa, ömsad mukosa i gallblåselumen (tecken på gangränös gallblåsa). Gallblåsedistension och sludge talar för, men är ospecifika fynd. Det rapporteras olika hur bra ultraljud är för att hitta sjukdomen. Om man är osäker så är hepatobiliary scan gold standard (men kräver en fungerande lever).</p>\n<h3>Behandling</h3>\n<p>- Omedelbar handläggning. - Kolecystektomi hos de som är tillräckligt stabila, annars transkutan dränering. - Empirisk antibiotikabehandling (Piptazo eller Meronem).</p>\n<p><strong>Källor: </strong>Marinos ICU book. 4th ed.</p>", "category": "Sjukdomstillstånd"}, {"title": "ALKALOS METABOL – Ej klar", "html": "<p>”Det är klassiskt att man driftar mot en metabol alkalos på IVA.” Beror på Furixbeh enl kollega. Kan ge Diamox.</p>", "category": "Sjukdomstillstånd"}, {"title": "ANAFYLAXI UNDER ANESTESI", "html": "<p><strong>1.</strong> <strong>Avbryt infusionen</strong> med misstänkt utlösande agens.</p>\n<p><strong>2.</strong> <strong>Sänk huvudändan.</strong></p>\n<p><strong>3.</strong> <strong>Säkerhetsställ fri luftväg och ge 100% syrgas.</strong></p>\n<p><strong>4.</strong> <strong>Adrenalin</strong>: Blanda 9 ml NaCl med 1 ml adrenalin av koncentrationen 1:10 000 = 0,01% = 0,1 mg/ml. Detta blir en lösning med 0,01 mg/ml = 10 μg/ml.</p>\n<h3>Vuxna</h3>\n<p>Mild till moderat reaktion: 0,01 – 0,05 mg i.v. (1 till 5 ml av den dubbelspädda lösningen)</p>\n<p>Cirkulationskollaps: 0,1 – 1,0 mg iv. (Här kan man behöva den ej utspädda lösningen 0,1 mg/ml).</p>\n<p>Titrera dos tills önskat svar. Om stora doser krävs, ge det som infusion: 0,05 – 0,1 μg/kg/min. <strong>Blandning:</strong> Adrenalin 1 mg/ml, 2 ml blandas med NaCl 48 ml, blir 40 mikrog/ml. Pumpprogrammet är på μg/kg/min. Överväg Noradrenalininfusion eller Vasopressininfusion vid hög puls. (Obs Noradrenalin och Vasopressin stabiliserar ej mastceller). Om fri venväg saknas ge intramuskulär injektion Adrenalin 0,5-0,8 mg i.m.</p>\n<h3>Barn</h3>\n<p>Mild till moderat reaktion: 0,001–0,005 mg/kg i.v.</p>\n<p>Circulationskollaps: 0.01 mg/kg i.v.</p>\n<p>Saknas fri venväg: 0.005–0.01 mg/kg i.m.</p>\n<p><strong>5.</strong> <strong>Vätsketerapi</strong></p>\n<p>Vuxna: Kristalloid vätska 20 ml/kg, mer kan behövas.</p>\n<p>Barn: Kristalloid vätska 20 ml/kg, mer kan behövas.</p>\n<p><strong>6</strong>. Kortikosteroider**</p>\n<p>Vuxna: Hydrokortison (Solucortef®) 250 mg iv. eller metylprednisolon (Solumedrol®) 80 mg iv.</p>\n<p>Barn:  Hydrokortison (Solucortef®) 50 - 100 mg iv. eller metylprednisolon (Solumedrol®) 2 mg/kg iv.</p>\n<p><strong>7</strong>. Antihistaminer**</p>\n<p>Vuxna: H1 antagonist. T.ex. Klemastin (Tavegyl®) 2 mg iv (0,0125 – 0,025 mg/kg). (Desloratadin går säker också bra). Överväg även H2 antagonist ranitidin (Zantac®) 50 mg iv (1 mg/kg).</p>\n<p>Barn:  T.ex. klemastin (Tavegyl®) 0,0125-0,025 mg/kg eller prometazin (Lergigan®) 0,3-1,0 mg/kg iv eller im.</p>\n<p><strong>Nebuliserade beta2 stimulerare</strong> kan användas vid bronkospasm men är inte första linjens behandling.</p>\n<h3>Om pat. inte svarar på adrenalin:</h3>\n<p>Glukagon: Till pat. som är betablockerade: Glukagon (Glucagon®): Ge 1-2mg iv åt gången tills patientens symptom förbättras. Noradrenalin: iv infusion starta med: 0,05-0,1 μg/kg/min Vasopressin (Pitressin®).</p>\n<p><strong>Glöm ej ta serumtryptas efter 1 – 4 h. från debut. </strong> Därpå 24 h efter reaktionen. Allergiutredning om 1 mån.** Version 2022-08-26. Källa: SFAI. Samt Kroigaard et al. Scandinavian Clinical Practise Guidelines on the diagnosis, management …2007</p>", "category": "Sjukdomstillstånd"}, {"title": "AORTADISSEKTION", "html": "<p><strong>KLINISK BILD</strong> - Debuterar ofta akut med svår sjukdom, med svår skärande smärta i bröstet eller ryggen med - Risk för hjärttamponad eller hemothorax. Även risk för aortainsuficiens pga dissektion i annulus samt risk för obstruktion av koronarostierna. - Även risk för ischemier till organ som försörjs där dissektionen far fram.</p>", "category": "Sjukdomstillstånd"}, {"title": "ARDS", "html": "<p><strong>Källa: </strong>Respiratorisk insufficiens, PM, Alfresco, 2017-11-08. ADRS review NEJM 2017.</p>\n<h3>DEFINITION</h3>\n<p>- Akut (inom 1 v från utlösande orsak) insättande respiratorisk svikt. - Nytillkomna bilaterala infiltrat (slätrtg el. CT). - Respiratorisk svikt kan ej till fullo förklaras av hjärtsvikt eller vätskeöverskott.</p>\n<h3>VANLIGASTE ORSAKER</h3>\n<p>Sepsis, aspiration (Hamman Rich Syndrome), pneumoni, trauma, massiv transfusion, TRALI, överdos (ASA, opioider, kokain, )</p>\n<h3>GRADERING</h3>\n<p>Mild ARDS: PFI 26-39 med PEEP/CPAP > 5 cmH2O.</p>\n<p>Moderat ARDS: PFI 13-26 med PEEP > 5 cmH2O.</p>\n<p>Svår ARDS: PFI <13 med PEEP > 5 cmH2O.</p>\n<p><strong>BEHANDLING</strong> (se även <strong>http://ardsnet.org</strong>)<strong> (Sammantaget: Dra vätska, ställ in resp, bukläge)</strong></p>\n<p>Låga tidalolymer: 6 (ned till minimum på 4) ml/ kg predicted weight.</p>\n<p>Låga platåtryck (sänkt tidalvolymen om trycket mer än 30 cmH2O). Om tidalvolym <6 ml/kg och topptrycket <25, höj tidalen med 1 ml/kg.</p>\n<p>Några studier föreslår även låga AF är bra, men adekvat CO2 är även nödvändig. Pco 8-9 verkar acceptabelt. Men följ ffa pH där man anser att pH 7,2-7,35 är ok för de flesta. Mål är dock 7,3-7,45.</p>\n<p>Steroider: Metaanalyser anger ev. reducerat antal ventilatordagar, och mortalitet.</p>\n<p>Muskelrelax: Ej entydigt svar. Ev initialt 24-48 h kan minska mortaliteten. Även vid besvär att ställa in respen. Djup sedering kan dock ha andra bi-effekter.</p>\n<p>Bukläge: Rekommenderat vid FiO2>60%. Starta tidigt. Ska helst pågå 16 h/dygn.  Bättre ventilation i dorsala delar av lungorna, perfusionen blir mer homogen, förbättrad ventilations/perfusionsratio.</p>\n<h3>UNGEFÄRLIGA PEEP-NIVÅER VID ARDS</h3>\n<p>Mild ARDS: 5-10 cmH2O</p>\n<p>Moderat ARDS: 10-15 cmH2O</p>\n<p>Svår ARDS: 15-20 (-25) cmH2O</p>\n<h3>RISKFAKTORER</h3>\n<table class=\"card-table\">\n<tr><th><strong>Direct lung-injury risk factors</strong></th><th><strong>Indirect lung-injury risk factors</strong></th></tr>\n<tr><td>Pneumoni</td><td>Sepsis, Pankreatit, Stor brännskada</td></tr>\n<tr><td>Lungkontusion</td><td>Blödningschock, Blodtransfusion</td></tr>\n<tr><td>Aspiration</td><td>Intoxikation</td></tr>\n<tr><td>Inhalationsskada</td><td>Hjärt-lung-maskin</td></tr>\n<tr><td>Drunkning</td><td>Reperfusionsskada efter lungtransplantation eller lobektomi.</td></tr>\n</table>\n<h3>Tillstånd som kan likna ARDS</h3>\n<p>Hjärtsvikt</p>\n<p>Interstitiell lungsjukdom (ex interstitiell pneumoni, interstitiell pneumonit, mm)</p>\n<p>Bindvävssjukdom ex polymyosit.</p>\n<p>Diffus alveolär blödning från vaskulit eller Goodpasture’s syndrom.</p>\n<p>Läkemedelsorsakad lungsjukdom ex från bleomycin, eller amiodarone, immunoterapi.</p>\n<p>Cancer (T-cell eller B-cell lymfom eller metastaserande carcinom)</p>\n<p>Endobronkial tuberculos.</p>\n<h3>Patofysiologi</h3>\n<p>Vid ARDS präglas lungvävnaden av interstitiella ödem och inflammation, vilket orsakar atelektasbildning och ger upphov till shunt. Ibland kan det i början (oftast inom de 2 första dygnen) finnas ett behov att rekrytera lungan. Gällande intubation eller ej så har man sett en ökad mortalitet vid NIV innan intubation. Man kan prova det i utvalda tillfällen. Provas max 1 h.</p>", "category": "Sjukdomstillstånd"}, {"title": "ARYTMI PÅ IVA / POSTOP – Ej klar", "html": "<p>- Cordarone (Amidarone) är i princip förstahandsprep. Har en mycket bred effekt och har effekt motsvarande samtliga antiarytmikaklasser inkl. betablockad. Undvik därför kombination av Cordarone och betablockad om pat. inte har pacemaker! Risk för allvarlig bradyarymi. - Försiktig med betablockad då pat. kan behöva den adrenerga effekten för att bibehålla kontraktilitet. - Xylokain kan man lägga till om pat. har ventrikulära arytmier och inte svarar på Cordarone. Har använt det en gång med god effekt. Förslagsvis bolus 1 mg/kg under 2-4 min och sedan infusion 2-4 mg/min (PM Alfresco). Om man inte svarar på bolusdosen är det osannolikt att man svarar på infusionen.</p>", "category": "Sjukdomstillstånd"}, {"title": "COVID-19 / CORONAVIRUS", "html": "<p>GAMMALT KORT. BEHÖVER UPDATERAS.</p>\n<h3>INSJUKNANDE</h3>\n<p>- Inkubationstiden för covid-19 är vanligen 2–14 dagar. Medelinkubationstiden är 5–6 dagar. - Mediantid debut till IVA 9 - 10 dgr. - Typsikt är att de får pneumoni, ARDS, dekompenserad hjärtsvikt, eller exacerbation av kronisk lungsjukdom vilket leder till hypoxisk, och ej lika vanligt hypercapnisk andningssvikt.- Riskfaktorer för IVA: Hög ålder, hypertoni, komorbiditet. - Behov på IVA - Ffa andningsstöd. 2/3 uppfyller ARDS-kriterierna. - Mortaliteten hos IVA-pat. rapporterats 20-60%. - Dödsorsak: Tros vara hypoxi och multiorgansvikt. - Riskfaktorer för död: Hög ålder, hjärt- /lungsjukdom, CKD, immunosuppression, diabetes, hypertension.</p>\n<h3>SYMTOM</h3>\n<p>- Feber (vanligt, ca 50% vid inläggning, 85% under förloppet), hosta, dyspné, ÖLI-symtom. - Annan studie: feber (98%), hosta (77%), dyspne, trötthet myalgi, rinorré, huvudvärk, kräkningar, artralgi, och bröstsmärta (frekvens i fallande skala).</p>\n<h3>INDIKATIONER FÖR INTENSIVVÅRD</h3>\n<p>- PaO2/FIO2 <20 kPa (≈ behov av 50% O2 för att nå SpO2 95% eller 40% för SpO2 90%), eller försämring med behov av ökande FIO2 (O2%). - Stigande PCO2 (>6.0 kPa), särskilt om pH < 7.30. - Större andningsarbete än patienten orkar med, andningsfrekvens (AF) >30/min är ett mått på detta liksom att patienten själv säger ”jag orkar inte”. Fråga patienten om det blir bättre eller sämre med andningen. - Om NIV används: Fortsatt försämring eller att patienten inte förbättrats inom 1-2 h efter behandlingsstart. - Påverkad medvetandegrad. - Hypotension, oligouri, förhöjt och stigande P-Laktat, hjärteko med uttalad höger och/eller vänstersvikt. - Innan IVA-kontakt tas ska i normalfallet ev. behandlingsbegränsningar ha diskuterats på vårdande enhet redan innan dessa indikationer föreligger, se ovan. Om patienten uppfyller någon IVA-indikation ska IVA-kontakt tas parallellt med att denna diskussion genomförs. Ansvaret för detta ligger hos ansvarig läkare på den avdelning där patienten vårdas.</p>\n<h3>LAB</h3>\n<p>Vid intag, fanns lymfocytopeni hos 83%, trombocytopeni hos 36%, och leukopeni hos 34%. Ökad D-dimer, CRP, LDH. CPT ned (kan vara högt vid bakteriell infektion).</p>\n<h3>RADIOLOGI</h3>\n<p>CT vid inläggning: patologiska fynd hos 86% - ¨ground-glass opacity¨ (56%) och ¨bilateral patchy shadowing¨ (52%).</p>\n<p><strong>Komplikation</strong>er**</p>\n<p>3.4% ARDS, 1.1% septisk chock, 0.5% akut njursvikt, 0.2% rabdomyolys, 0.1% disseminerad intravasal koagulation (DIC).  Bakteriell pneumoni: Co-infektion med S. aureus är vanligt vid Influenza och kan vara mkt virulent. (ATS/IDSA 2019-rekommendationen  för patienter som kommer in med samhällsförvärvad pneumoni och testar positivt för Influenza är att man får antibiotika direkt). Aspergillus-pneumoni: Förekommer vid influenza, ffa hos pat. med steroidbehandling eller vid underliggande sjd, men 30% av pat. med aspergillus har ingen underliggande sjd. Hjärtsvikt.</p>\n<h3>BEHANDLING</h3>\n<p><strong>- Trombosprofylax</strong>. <strong>SFAI: Mycket talar för att COVID-19 är ett protrombotiskt tillstånd. Överväg trombosprofylax i något högre doser än vad som är sedvanlig rutin. Förslag Fragmin 5000IE X 2. Kontrollera p-heparinaktivtet en gång i veckan eller oftare vid låg/hög kroppsvikt och nedsatt njurfunktion. </strong>- Magprofylax?<strong> </strong>- Klorokinfosfat:<strong> Dos: Tablett 250 mg, laddningsdos 1000 mg följt av 500 mg x 2 i 5 dagar. Reduceras vid njursvikt. Om eGFR(Krea ) 10-50 ml/min ges halva dosen, om eGFR(Krea) < 10 ml/min en fjärdedels dos. Alternativt kan tablett hydroxiklorikin (Plaquenil®) ges. Hydroxiklorokin har visat bättre antiviral effekt in vitro än klorokin1 varför detta kan vara ett bra alternativ. Dos: laddnings dos 400mg x 2 sedan 200 mg x 2 i 5 dagar. Biverkningar: kan ge QT förlängning och då interagera men andra substanser som ger QT-förlängning. </strong>Dagligt EKG<strong>, dosreducera vb</strong>, QTc upp till 500 acceptabelt<strong>.</strong> Hypoglykemi. Nausea. <strong>- Remdesivir:</strong> Studieläkemedel/Compassionate use. Ej klart om det ska användas. Fortsätt om pat. redan är insatt? Dos: 200 mg iv dag 1 sedan 100 mg x 1, totalt 10 dagar. Biverkningar: Nausea, leverpåverkan. <strong>Tocilizumab:</strong> Fortsätt om pat. redan är insatt. <strong>Antibiotika: </strong>Ges på sedvanliga indikationer. Covid-19 ger ofta CRP stegring men sällan PCT förhöjning varför PCT kan underlätta bedömningen av sekundärinfektioner. <strong>Statiner: </strong>Sätt ej ut om pat. står på statiner. <strong>Steroider: </strong>Använd ej, evidens saknas. Använd dock hydrokortison vid terapiresistent septisk chock enl. sedvanlig rutin. <strong>Övrigt: </strong>SFAI: Vid svår ARDS och hypoxi, rekommenderas försök med ventilation i bukläge och om hypoxi trots detta kvarstår kan inhalationsbehandling övervägas med vasodilatator t.ex, NO, eller nebuliserad prostacyklin alternativt milrinon. <strong>Blodtrycksbehandling enl SFAI: </strong>Vid volymsresusciterad kvarstående chock, använd i första hand noradrenalin. Om mål-blodtryck (MAP 60-65 mmHg) ej kan uppnås md höga doser noradrenalin, lägg till vasopressin. Om chock kvarstår med laktat > 2 mmol/L eller tecken på organdysfunktion, trots ovanstående behandling och om evidens för hjärtsvikt föreligger, rekommenderas dobutamin i första hand. Vid refraktär chock rekommenderas låg-dos hydrokortison.<strong> </strong> Särskilj om pat. har en COVID-19 pneumoni typ L (L för low elastance vilket är synonymt med hög compliance, jo vi vet att det är förvirrande) eller typ H (H för high elastance) Skiljer sig ej från de flesta virala pneumonier samt ARDS-behandling: <strong>Lungprotektiv ventilation</strong> • Tidalvolym ≤6 ml/kg PBW (predicted body weight), kan avläsas på ventilatorn • Topptryck <30 cmH2O8 och drivtryck ≤15 cmH2O9 (drivtryck = tryck över PEEP, det ventilerande trycket). • FiO2 med mål SpO2 88-94%. • Drivtryck väljs så att man får önskad tidalvolym, sedan justeras AF tills man får önskad minutventilation och ett acceptabelt PaCO2 kPa (se t.ex. behandlingskort ARDS) men undviker autoPEEP. • PEEP väljs individuellt men som regel högre PEEP vid sämre PaO2/FIO2. o T.ex. lindrig ARDS 8-10, måttlig ARDS 8-14, svår ARDS 12-18 cmH2O. Överväg tidig lungrekrytering med ökat PEEP och ökade luftvägstryck, men med ökad försiktighet vid hypovolemi/hemodynamisk instabilitet. Upprepa inte rekryteringsförsök om de tidigare inte gett effekt. En rekryteringsmanöver beskrivs i vårt ordinarie PM för invasiv ventilation. Patient-Ventilator dyssynkroni. När patienten är svårventilerad och inte följer ventilatorn (”andas emot”) hanteras det med ökad sedering (inkl. ökad opiatdos). Om inte detta är tillräckligt kan muskelrelaxation i upp till 24-48 h prövas. Vid mycket svår gasutbytesstörning rekommenderas försiktighet vid skifte från understödd till kontrollerad, risken är att detta skifte kan orsaka respiratorisk kollaps. Lösningen kan då vara snabb återgång till spontanandning med understödd ventilation t.ex. med reversering av läkemedel. Detta är om möjligt en situation där intensivist bör involveras. Buklägesbehandling minst 16 h/dag om kvarstående PaO2/FIO2 < 20 kPa. Enteral nutrition pågår enl. rutin trots bukläge. Rapporter från centra med erfarenhet av COVID-19 föreslår att man inte ska ha bråttom med att skifta till tryckunderstöd då patienter med relativt bra gasutbyte kan försämras dramatiskt i detta skede. Föreslaget är att vänta till PaO2/FIO2 ≤0.33 kPa (motsvarar ungefär motsvarar SpO2 95% vid FIO2 0.3) och att patienten vid understödd ventilation inte andas med alltför stora tidalvolymer (t.ex. >10 ml/kg PBW). Av samma skäl bör PEEP inte reduceras till <10-12 cmH2O förrän i ett relativt sent skede i förloppet. - Lungprotektiv behandling: Tidalvolym 6 ml/kg predikterad kropssvikt. Kräver ofta permissiv hyperkapni. AF kan ofta börja på 20 och styrs av pH som bör vara mellan 7,3 – 7,45, ej under 7,2 då man får kardiella effekter. Platåtryck under 30 till 35 cmH2O. Överdriven rekrytering associerad med ökad mortalitet. PEEP-titrering för att nå optimal saturation ev, utan aggressiva rekryteringar är möjligen bäst. Bukläge. Ev muskelblockad, motsägande evidens. Målsaturation 88-94%. pO2 på 8 är OK. Om det kostar mkt i ventilatorinställningar så får man hålla sig i de lägre intervallen. Det KAN hända någon gång att man får gå under pO2 8. Vid uppstart: Börja med PEEP på 8 (Ej under 8), kan behöva gå upp snabbt under första timmarna. Tryck över PEEP vid uppstart tumregel: 12-14 vid frisk lunga, 14-16 halsvjuk lungar, 18-20 vid jättesjuk lunga (detta gäller alla vikter alla åldrar). Topptryck <30, absolut under 35. Fokusera inte bara på tidalvolym 6 ml/kg; glöm inte topptrycket! Starta på AF 20. IE 1:1,5.  - Muskelblock är helt OK i en stökig/desperat situation. - Konservativ vätskebehandling hos pat. utan chock. - Empirisk tidig antibiotikabehandling vid misstänkt bakterieinfektion. - Lungprotektiv ventilering. - Bukläge. - ECMO vb. - NIV vb, men kan riskera att smitta andra. Om NIV, prova max i 60 min, om ej god effekt; intubera. Risk för intubation är mkt stor. KOL-patienter skulle ev till större utsträckning kunna ha nytta av NIV. - Annan organskada/multiorgansvikt är vanligt ex septisk chock och AKI, bakteriella infektioner. - Kortikosteroidbehandling – Saknas evedens för att det skulle hjälpa. Russel Lancet 2010. Skall ejanvändas som rutin. Man tror att det kan finnas risk för ökad virusreplikering. Antiviraler – Studier pågår. Kloroquine – Studie pågår.</p>\n<h3>PRAKTISKT</h3>\n<p>- Provtagning endast vid luftvägssymtom och aktuell för slutenvård. Lokala undantag finns. - Vid påvisad smittad patient: Personer som vistas >6 h eller kan ha utsatts för aerosol ska meddelas vara uppmärksamma på luftvägssymtom närmast 14 dagarna. Om möjligt flytta ev exponerad medpatienter till enskilt rum. Provtagning endast vid symtom. - Ej aktiv befuktning i respslingan för att minska aerosolbildning. - RSI vid intubation, unvdik hosta etc. - Slutet sugsystem. - ingen särkoppling av respiartor/tub utanför isolersal - inga inhalationer ska användas (ökar bildning av aerosol) - Covid-19 ska enligt smittskyddslagen (2004:168) anmälas utan dröjsmål av behandlande läkare i SmiNet till den regionala smittskyddsläkaren och Folkhälsomyndigheten. Formulär: Klinisk anmälan: Coronavirussjukdom (covid-19). - Diagnoskod: U07.1 <strong>Påklädning i ordning:</strong> Andningsskydd FFP2/3 Mössa med dok /operationshjälm Plastförkläde som täcker arbetsdräkten. Visir om FFP2, skyddsglasögon kan användas vid FFP3 Undersökningshandskar</p>", "category": "Sjukdomstillstånd"}, {"title": "ASPIRATION UNDER ANESTESI", "html": "<h3>(Kap 25 i Ottawa .. läs på.) </h3>\n<h3>Källa: The ACM</h3>\n<h3>Handläggning:</h3>\n<p>1. Larma/kalla på hjälp. Kommunicera med oplaget.</p>\n<p>2. Sänk huvudändan, överväg vänster lateral position.</p>\n<p>3. Avlägsna luftvägen och sug i pharynx.</p>\n<p>4. Intubera och sug i bronkialträdet.</p>\n<p>5. Ventilera med 100% O2 och titrera nedan ned. <strong>Om möjligt ventilera efter steg 1-4.</strong></p>\n<p>6. Töm magsäcken.</p>\n<p>7. Färdigställ endast nödvändig kirugi om svårare fall. Överväg CIVA.</p>\n<h3>Övrigt</h3>\n<p>Säkerhetsställ att muskelrelaxationen är fullsändigt reverserad.</p>\n<p>Mild aspiration löser sig oftast utan specifik beandling.</p>\n<p>Steroider och antibiotika är inte indicerat i den initiala behandlingen.</p>\n<p>Aspiration har beskrivits som orsak till ca 50% av all luftvägsrelaterad död vid anestesi.</p>", "category": "Sjukdomstillstånd"}, {"title": "ASTMA / STATUS ASTHMATICUS", "html": "<h3>ALARMERANDE TECKEN</h3>\n<p><strong><em> </strong>Hyperkapni (även lindrig) är<strong> </strong>absolut </em><em>indikation för respiratorbehandling. Stigande PaCO2 talar för utmattning och förestående andningsstillestånd.  </em>Sjunkande PEF-värden trots optimal behandling el. PEF <40% av predikterad. <em> Stigande andningsfrekvens trots optimal behandling. </em> Grav hypoxi. <em> ”Silent chest” d.v.s. inga hörbara ronki hos en obstruktiv pat. </em> Bradykardi, hypotension, uttröttning, sänkt medvetande.</p>\n<h3>BEHANDLING</h3>\n<p><strong>Beta-2-stimulerare</strong>: <strong>- Inhalation Ventoline</strong> (Salbutamol) <strong>5 mg/ml</strong>, 10 mg = 2 ml). Upprepa kontinuerligt tills förloppet vänt eller till biverkningar. Enl. ICU book (mildare fall?): 5 mg var 20e min, i 3 doser, sedan 2,5-10 mg var 1-4 h vb. <strong>- </strong>Injektion <strong>Bricanyl</strong> (Terbutalin) 0,5 mg/ml, 0,5 mg = 1 ml, spädes med 9 ml koksalt, ges iv under 5 min. Inhalation måste kompletteras med i.v. tillförsel när ventilationen är svårt nedsatt. ICU-book: rek 0,25 mg var 20 min under 3 tillfällen. - Adrenalin bör undvikas pga biverkningar, men kan prövas vid uteblivet svar på beta-2-stimulerare. Vid behov enl. ICU book: Subkutant 0,3 – 0,5 mg var 20 min vid 3 tillfällen. <strong>Antikolinergika</strong> Enl. ICU-book: 0,5 mg var 20 min under 3 doser, sedan vb. Används endast i akutskedet. Enl. Alfresco: Inhalation Atrovent 0,5 mg/ml, 1 mg = 2 ml. Ej klar evidens. Kan provas. <strong>Steroider</strong> - Solu-Cortef 200 mg iv. <strong>Magnesium</strong> Kontroversiell evidens. Ev. av värde vid mkt svår astma. Infusion Magnesium 10 mmol i 100 ml NaCl iv. Ges under 20 minuter. OBS: ges ej i samma slang som teofyllin eller ventoline! <strong>Theofyllin (metylxantiner)</strong> – ges aldrig i CVK.<strong> (SE ÄVEN NARKOSKORT TEOFYLLAMIN)</strong> Ev. som tillägg om inhalationer ej hjälper. ENLIGT ANESTESIBOKEN: Om pat. står på underhållsbehandling med teofyllin så ges 2-3 mg/kg Teofyllamin 23 mg/ml. Om pat inte såtår på underhållsbehandling av teofyllin ges 5-6 mg/kg av Teofyllamin 3 mg/ml. Vid fortsatt behandling måste S-teofyllin följas. ENLIGT GBG PM:Teofyllamin 23 mg/ml, 2-3 mg/kg = ca 0,1 ml/kg. Spädning: Ordinerad mängd späds i 100 ml NaCl 9 mg/ml, ges i perifer ven under 20-30 min. Överdosering kan ge upphov till BT-fall, arytmier). Kolla upp om pat. står på kontinuerlig behandling av Theofyllin, isf. får man kolla S-theofyllin först. Ges aldrig i CVK pga risk för höga koncentrationer i hjärtat. <strong>Övrigt</strong> Sekretstagnation: Ej rekommenderat att ge acetylcystein då det kan förvärra bronkospasm. Kan överväga antibiotika vid misstänkt bakteriell infektion.</p>\n<p><strong>SÖVNING OCH </strong>INTUBATION**</p>\n<p>- NIV funkar sällan då att höga luftvägstryck krävs. Ej rekommenderat. - Söv med Ketalar och ha adrenalin redo, unvik sympatikolytiska läkemedel. - Höga intrathorakala tryck kan påverka venöst återflöde, ordna artärnål och koppla noradrenalininfusion. - De är ofta dehydrerade och ordna möjlighet för snabb infusion.</p>\n<h3>RESPIRATORINSTÄLLNINGAR</h3>\n<p>- Efter intubation: Risk för auto-PEEP med efterföljande pneumothorax, pneumomediastinum, funktionell hjärttamponad. - FiO2 100% - PEEP 5. - Tid för utandning måste finnas: tidalvolymer på 6-8 ml/kg, AF <10/min, I:E lågt 1:2-1:3. - Permissive hyperkapni är att föredra framför höga luftvägstryck. - Neuromuskulär blockad skall undvikas så långt som möjligt men ges vid dyssynkroni med respiratorn. - ECMO vid behov. ECLA vb.</p>\n<h3>KÄLLOR</h3>\n<p>Alfresco, Rutin Astma; svår astma eller status astmaticus. The ICU book.</p>", "category": "Sjukdomstillstånd"}, {"title": "POSTPARTUMBLÖDNING / ATONI / 4T", "html": "<p>Källa: O-boken, samt lite från obstetrikkursen DS, samt kollega. <strong>BAKGRUND</strong> - Ca 20% av cardiac output går till uterus. Postpartumblödning (PPH) kan därmed bli ett livshotande. - Vanligen definieras PPH som blödning > 500 ml vid vaginal förlossning och > 1000 ml vid sectio. <strong>ORSAK –</strong> <strong>Fyra T</strong> <strong>ATONI (TONE)</strong>.<strong> - Om uterus ej kontraheras bibehålls ett högt blodflöde och en katastrofal blödning kan snabbt uppkomma. </strong>Behandling:<strong> uterusmassage och uterotonika (se längre ned i dokumentet). Obstetrikkursen: För uteruskontraktion behövs kalcium! Glöm ej kalcium vid atoniblödning! </strong>VÄVNAD (TISSUE)<strong> - Vävnadsorsaker som förhindrar kontraktion: Placentarester, koagel, invastivt växande placenta (som även i sig kan vara en blödningskälla). </strong>Behandling:<strong> placentalösning/tömning av uterus på koagel. </strong>BRISTNING (TRAUMA)<strong> -  Uterus, cervix, vagina och perineum kan vid skador blöda betydligt. </strong>Behandling:<strong> Kompression/tamponad och suturering. </strong>KOAGULATIONSRUBBNING (THROMBIN)<strong> - En koagulationsrubbning sekundär till blödning eller graviditetskomplikation kan i sig förstärka respektive generera PPH. </strong>Behandling:<strong> koagulationsfaktorer/optimering. </strong>GENER<strong>E</strong>LL <strong>BEHANDLING</strong> <strong>- OBS, pat. som kommer akut till op som blöder, se till att hinna ikapp något med resuciteringen</strong> innan du söver med Ketalar. Du vill inte söva ihjäl pat. - Aortakompression: effektiv och generell åtgärd som kan köpa värdefull tid. - Uterusmassage/kompression. - Få in uterus i värmen i magen hjälper. - Generell ”traumaomhändertagande”: förhindra hypotermi, acidos och koagulationsrubbning. Tidig transfusion med blod/plasma/trombocyter enligt 4:4:1 samt administrering fibrinogen samt tranexamsyra. - Noteras bör att den gravida kvinnan ofta har fibrinogen > 4 g/l och att fibrinogenkoncentrat är tidigt indicerat med behandlingsmål > 2.0 g/l. Plasma och dess faktorinnehåll kan faktiskt de facto späda kvinnan avseende fibrinogen! - Ca2+ > 1 mmol/l,  pH > 7.2 för att optimera koagulationen.  Ca2+ viktigt för uteruskonraktionen! (Källa obstetrikkursen). - Farmakologiskt ska först och främst tokolytiska preparat undvikas, seponeras, och/eller reverseras. - Terbutaline är verksamt i några timmar och kan vid behov reverseras med propranolol. - NSAID ska undvikas och sevofluran ersättas med propofol/TIVA. - Den tokolytiska effekten av nitroglycerin är snabbt och spontant övergående. - Atosiban (Tractocile, en oxytocinantagonist) halveringstid om minutrar i distributionsfas,  och 2 timmar i eliminationsfas. <strong>UTEROTONIKA</strong> STEG FÖR STEG<strong> (glöm inte att ev. gå över till propofolinfusion ist för sevo)</strong> <strong>Steg </strong>1. <strong>Oxytocin</strong> (Syntocinon) 8.3 μg/ml = 5 E/ml. - 1 ml ges sc eller <strong>långsamt (5 min</strong>) iv. Vid snabb iv-injektion risk för svår hypotoni som kan orsaka hjärtsymptom ffa vid GUCH/klaffvitier. Man kan även få kärlsammandragning kranskärl och bröstsmärta. - På KS så händer det att man upprepar dosen vid behov, men egentligen inte så effektivt (se nedan med ED90) och risk för biverkningar finns. - ”Förstärkt oxytocindropp” avser 6 ampuller oxytocin (= 49.8 μg = 30 E) blandat i 500 ml NaCl. Vanlig ordination är 100-200 ml första timmen som sedan minskas. Obs kvinnor som haft oxytocininfusion under förlossningen kan vara närmast refraktära mot oxytocin på grund av tachyfylaxi. Likaså skillander hos mammor som varit under förlossning (kroppsegen produktion) jmf med elektivt sectio. - <strong>Notera:</strong> ED90 är hos Oxytocin-naiva 0,3 IE. Vid akut snitt ED90 3 IE men spridningen större (de har ju haft kroppseget påslag). <strong>Steg 2: </strong>Metylergometrin<strong> 0,2 mg/ml. (Methergin) - 1 ml ges im eller långsamt (60 sek) iv. - Påverkar glatt muskulatur, ökar tonus i uterus, vasokonstrierande med en alfa-agonistliknande effekt. Orsakar blodtrycksstegring. Kontraindicerat vid PE, kan orsaka hjärnblödning. Kan vara kontraindikation vid hypertoni och GUCH, beror på vilket hjärtfel. Kontraherar glatt muskulatur i uterus. (Kan även kontrahera kranskärl enl. obstetrikkursen). - Besläktat med LSD och kan vid överdosering (eller i sällsynta fall vid normaldosering) ge psykiatriska biverkningar av psykoskaraktär. - Illamående är vanligt och profylaktisk dos ondasetron är att rekommendera. - Ökar blodtrycket och kan därmed vara falskt lugnande i blödningssituation. - Hos pat. som håller på att blöda ihjäl med atoni. </strong>OBS ej en utbredd rekommendation<strong>, men ensaka doktorer kan tänka sig att späd Methergin till 1/10 av koncentrationen och ge 1 ml åt gången och observera effekt. Blir på ditt ansvar. </strong>Steg 3: <strong>Karboprost</strong> 0,25 mg/ml. (Prostinfenem). Får INTE ges iv. - 1 ml ges im eller av obstetriker i myometrium. Obstetrikkursen: Dosering kan behöva upprepas efter 15 min. - Är en prostaglandinanalog till PGF2α, kan orsaka <strong>bronkokonstriktion</strong> och <strong>pulmonell vasokonstriktion</strong>. Kan aggravera astma betydligt (ha respekt för detta!) men även påverka blodtrycket (ffa hypertension). Illamående, kräkningar och diarre vanligt förekommande. Kan vara kontraindicerat vid vissa hjärtfel där man inte får öka resistensen i lungkretsloppet. - Obstetrikkursen: Är ej absolut kontraindicerat vid astma. Alla reagerar ej. Men risk finns. <strong>STEG 4. </strong>Misoprostol<strong> 0,2 mg tablett. (Ex. Cytotex) - 2-4 tabletter rektalt, sublingualt eller vaginalt. - Är en rätt ”snäll”/svag uterotonika som kan ges i princip till alla. - Vanlig ordination från obstetriker är sublingualt (vanligt vid tex medicinsk abort), men vi anestesiologer har sämre erfarenhet av detta vid intuberade patienter med ringa salivation – bör poängteras till obstetriker så administrationen blir optimal. - Liksom karboprost en prostaglandinanalog (PGE1), men associerade biverkningar inte lika uttalade då det enkom binder en prostaglandinreceptor; </strong>kan till exempel ges till astmatiker<strong>. </strong>UPPREPAD DOSERING:** Ovanstående uterotonika kan upprepas vid behov i doser enligt FASS, men vid behov av upprepade doser bör vårdnivån snabbt eskaleras och förberedelser (tex grova infarter och högflödessystem) för massiv transfusion initieras. Vid snabb och omfattande blödning kan hysterektomi vara en sista utväg – men frågan bör tidigt väckas innan koagulopati och massiv transfusion givit upphov till sekundära komplikationer.</p>", "category": "Sjukdomstillstånd"}, {"title": "AUTONOM DYSREFLEXI", "html": "<p>Ovanligt vid lesioner nedom T7.</p>\n<p>Ovanligare att uppstå senare än 9 månader efter skadan.</p>\n<h3>Symtom:</h3>\n<p>Hypertension - Vanligast</p>\n<p>Huvudvärk, flush, illamående, blekhet, ångest, svettning, bradykardi, erektion.</p>\n<p>Pupillförändringar och Honers syndrom - Ovanlgt.</p>\n<h3>Utlösande faktorer:</h3>\n<p>Urologiska orsaker: Blåsdilatation, UVI, kateterinsättning.</p>\n<p>Obsteriska: Förlossning, cervixdilatation.</p>\n<p>GI: Förstoppning, fecal impation.</p>\n<p>Akut buk, frakturer, hudtrauma, hudinfektioner.</p>\n<h3>Behandling:</h3>\n<p>Bort med stimuli.</p>\n<p>Nepresol om högt BT och ej takykard</p>\n<p>Trandate om högt BT och takykadi.</p>\n<p>Efedrin om hypotension.</p>\n<p>Atropin vid bradykardi.</p>\n<p>Clinidin 150-300 mikrog. om spastisitet och HT (Oxford Handbook)</p>\n<p>Betablockerare endast vid samtidig takykardi.</p>\n<h3>MEKANISM</h3>", "category": "Sjukdomstillstånd"}, {"title": "BAKTERIELL MENINGIT", "html": "<p>För guidelines från Svenska Infektionsläkarförningen på intektion.net Här finns vårdprogram för <em>Bakteriella CNS-infektioner</em>. <strong>GLÖM INTE KORTISON! AB UTAN KORTISON ÖKAR INFLAMMATIONEN.</strong> <strong>LUMBALPUNKTION</strong> - Om GCS <9, snabb försämring eller tecken på inklämnin: I första hand blododling & antibiotika och transport till IVA. <strong>Därefter </strong>LP när pat. är tillräckligt stabiliserad. - Glöm ej <strong>kontraindikationer</strong> såsom misstänkt fokal expansivitet, pågående inklämning, koagulationspåverkan, ryggmärtgskompression, pågående EP. Men LP med diagnostik är bra för pat! - Man kan ju ta proverna när man lägger V-drän istället om inklämningsrisk ex. - Normalt lumbaltryck är 6 -22 cmH2O. <strong>EMPIRISK ANTIBIOTIKABEHANDLING </strong>Se vårdprogram vid utlandsvistelse, allergi, gravid etc. Vid antibiotikabehandlingen ges samtidigt även: Betapred 0,12 mg/kg x 4 (max 8 mg per dos). 4 dagars behandling utan nedtrappning. <strong>Vid samhällsförvärvad ABM  (ej immunosupprimerad, ej utlandsresa)</strong> Cefotaxim 3 g x 4 + Ampicillin 3 g x 4. alternativt Meropenem 2g x 3. <strong>Vid ABM hos immunosupprimerad patient</strong> Meropenem 2g x 3. <strong>ETIOLOGI i SVERIGE</strong> Pneumokocker 52%, Meningokocker 10%, Hemofilus 5%, Listeria 5%, Step beta 5%, Strep alfa 4%, Staf 4%, Enterobacteriales 2%, Övriga 3%, Okänt 9%. <strong>INDIKATIONER FÖR MÄTNING OCH BEHANDLING AV HÖGT ICP BÖR ÖVERVÄGAS VID:</strong> GCS < 9. GCS 9-12 och klinisk försämring under de första timmarna. Lumbalt likvortryck > 40 cmH2O ökar indikationen. Upprepade kramper. Kliniska tecken på inklämning. Bilddiagnostik som typer på kraftigt förhöjt ICP. <strong>Lumbalpunktion – cerebrospinalvätska (csv; likvor)-analyser</strong> Visuell undersökning: grumlig eller klar likvor. Mät tryck med stigrör. Patienten i plant sidoläge. Tag minst 3 sterila provrör med cerebrospinalvätska (csv): • Rör 1 (1–2 mL): Bakteriologisk odling, direktmikroskopi, PCR och antigentest för bakterier. Om lång transporttid bör även 0,5 mL sprutas direkt i aerob blododl.-flaska (barn-blododlingsflaska). • Rör 2 (1–2 mL): Till kylskåp – eventuell senare analys (virus, tbc, borrelia, etc.) beroende på akuta analyser av rör 3. OBS om misstanke om tbc tag minst 5, helst 10 mL. • Rör 3 (> ½ mL): Celltal – poly/mononukleära celler, laktat, protein/albumin, glukos relaterat till plasma-glukos. • Blodprov – blodanalyser: CRP, Hb, LPK, poly/mono, TPK, Na, K, kreatinin, glukos, PK-INR, APTT, arteriell blodgas och laktat. <strong>BEHANDLING HÖGT ICP</strong> - Det vanliga. Hypertont koksalt rekommenderas vb. Ej Mannitol pga risk för senare problem. Djup sedering vb. Hemikraniektomi är ej uteslutet.</p>", "category": "Sjukdomstillstånd"}, {"title": "BLIXTOLYCKA / BLIXT", "html": "<p><em>Källa ”Blixtolyckor – mix av elektiskt, termiskt och multipelt trauma”, Huss et al. Läkartidningen 2008. Version 2025-09-18</em> <strong>Intro</strong> Verkningen av blixtnedslag avgörs av bla. Amplituden och durationen av strömimpulsen. Medelblixtens amplitud är ca 30 000 ampere och varar i ca 0,1 ms. Luften som blixten passerar genom expanderar kraftigt av värmen och det uppstår en tryckvåg (och åkmuller). Tryckvågen kan uppnå ett tryck i markplanet på ca 50 kPa vilket kan ge upphov till ansenligt trycktrauma för en person i närheten. Cirka 70% överlever efter att ha träffats av blixten. <strong>SKADEMEKANISMER PÅ MÄNNISKOR</strong> <strong>- </strong>I ett och samma ögonblick drabbas pat. av hög temperatur, elektriska och mekaniska krafter. - Vävnadsskadan avgörs av strömstyrka som passerar, vävnadens resistens och duration. Således är risken störst i smala kroppsdelar och vävnader med hög resistens såsom ben och muskulatur. - Strömimpulsen depolariserar excitabla vävnader. <strong>- </strong>Smältning av metall som orsakar brännskador. - Splitterverkan. När blixten passerar från en ledare till en annan t ex genom en vägg kan det uppstå en stark splitterverkan som skadar omgivningen. - Elektriska överspänningar. <strong>SKADOR</strong> <strong>Hudskador</strong> - Blixtmärken, aka. Julgransmärken, dendrieter, feathering etc. Är <strong>patognomona</strong> för blixtskada. Ormbunksliknande långa förgrenade ibland brunfärgade hudefflorescenser. Förekommer hos ca 20%. - Linjära delhudbrännskador över fuktiga områden särskilt hudveck. - Punktformiga brännskador, ingångs och utträdesmärken. - Termiska (flam) skador. Sedvanliga del- eller fullhudsbrännskador. Ses hos ca 20%. Oftast sekundärt till kläder som fattat eld. - Kontaktbrännskador av smälta metallföremål. - Ljusbågeskador; del- eller fullhudsbrännskador som uppstått efter efter jonisering av luftpartiklar vid patienten. <strong>Nervskador</strong> - Depolariseringen orsakar kraftig muskelkontraktion som kastar individen till marken med medföljande risker. - Blödningar i och kring hjärnans hinnor är vanliga dödsorsaker hos blixtskadade. - Hjärnan kan skadas (koaguleras) av värmen samt sekundärt hjärnödem kan uppstå av varierande orsak. - Dilaterade ljusstela pupiller är relativt vanligt initialt och indikerar inte nödvändigtvis dålig prognos utan tros vara kranialnervspåverkan. - Effekter på autonoma nervsystemet med labilt blodtryck, takykardi, bronkospasm. - Förekommer kramper, ataxi, apraxi, konfusion, afasi, hallucinationer, medvetslöshet, reflexpåverkan. Amnesi för tillfället. <strong>Vitala funktioner</strong> - Myokardiet depolariseras med asystoli som följd och andningscentra i hjärnstammen pausar. Hjärtat kommer i regel igång spontant men respiratioriska paralyser kan vara längre. Risk för hypoxi initialt. - Myokardskada och EKG-förändringar förekommer. - Spasm i perifera kärl kan ge symtom som övergående cyanos och perifer cirkulationsinsufficiens tros vara stimulering av autonma nervsystemet. <strong>Övrigt</strong> - Vestibulatispåvekran med hörselnedsättning. Sprängda trummhinnor av tryckvågen. - Pupillerna nomraliseras ofta snabbt. Men 50% får bestående men, med bla retinaskador, kornealskador. Övergående dubbelseende och blindhet förekommer. <strong>OMHÄNDERTAGANDE</strong> - ABCDE. Ska gås igenom ordentligt pga risk för trubbigt våld liksom andra multitraumapatienter. - Arymtimer behandlas enligt gängse principer. - Kramper behandlas med benzo. - CT hjärna vid sänkt medvetande. - Muskelskador mindre vanligt än vid högspänningsskador. Fasciotomier ovanligt men kan behövas. Hudgrafts kan behövas senare.</p>", "category": "Sjukdomstillstånd"}, {"title": "BLODTRANSFUSION ERYTROCYTER PLASMA TROMBOCYTER HELBLOD", "html": "<p><strong>HELBLOD</strong> **(källa PM: KS, Doknr PMI00384-1).</p>\n<p>- I samma påse finns erytrocyter, plasma, trombocyter. - Innehåller blodgrupp 0 RhD pos eller 0 rhD neg, samt innehålla låga titrar av anti-A & anti-B. - Kan ges till patienter med okänd blodgrupp. - Helblodet har högre hematocrit, högre tpk-konc, och högre konc. av koagulationsfaktorer. - Kalcium, fibrinogen och tranexamsyra ge som vanligt. - Samma indikationer som vid användande av akutblod. Kan användas vid trauma oavsett kön, ålder, inklusive kvinnor i fertil ålder. SE NEDAN GÄLLANDE OBSTETRISK BLÖDNING. - Det helblod som används i Sverige tas fram från givare med RhD-negativ blodgrupp 0 med låga titrar av anti-A och anti-B. Helblodet filtreras genom ett leukocyterducerande och trombocytsparande filter innan det lämnas ut. Nollnegativt helblod kan man ge till alla. <strong>Kontraindikationer:</strong> ** - Obstetrisk blödning med okänd blodgrupp – använd då om tillgängligt: Helblod 0 RhD neg. Alternativt ordinarie akutblod 0 RhD neg e-konc och AB-plasma. Om obstetriska patienten är blodgrupperad och känt RhD pos kan man ge 0 RhD pos helblod i väntan på grupplikt blod från blodcentralen. - På traumaenheten finns 2 påsar (ca 500 ml st). Tranfusion som vid vanlig komponentterapi. - På vuxen-PMI ger vi RhD pos helblod till fertila kvinnor vid trauma, det gör inte barn-PMI av rädsla för immunicering. (Risk för immunicering är ca 2%)</p>\n<h3>PRAKTISKT VID TRANSFUSION</h3>\n<p>Med blodpåsarna följer blodgruppssvar och bastest. Kolla ID-på armbandet och bastestet. På påsen sitter en transfusionsjournal. Kolla att blodgrupp stämmer med blodgruppssvaret. Kolla att följesedeln stämmer med påsen. Klistra på etikett på transfusionsjournalen. Rapportera i efterhand i TC på blodcentralens hemsida.</p>\n<h3>ÖVRIGT VID TRANSFUSION</h3>\n<p>Citrat omvandlas till bikarbonat vilket orsakar en metabol alkalos. Citrat binder calcium cilket orsakar hypoclacemi. Följ calcium med blodgaser. Sänkt leverfuktion --> Sänkt citratmetabolism. Dessa kan behöva mer calcium. En risk med att ge transfusioner är att man blir immuniserad vilket kan orsaka problem hos pat. som skall bli transplanterade i framtiden. - Grupplikt blod: Syftar då till förenlighet enligt ABO- och Rh systemen. - Förenlighetsprövning: Görs efter blodgrupperingen. BAS-test (Blodgruppering och Antikropps-Screen) MG-test (Mottagare-Givare test) - även benämnt korstest. Om BAS-testen är invändningsfri kan patienten få blod genom elektronisk matchning. På de flesta orter i Sverige är BAS-testen giltig i 5 dygn. <strong>BERÄKNA TRANSFUSIONSBEHOV</strong> <strong>Hur mycket ökar Hb? Ungefär:</strong> \"4 ml blod/kg ger +10 Hb\" Lite mer exakt... Transfusionsbehov [ml] = Blodvolym x (Mål Hb – Nuv. Hb) / Hb i E-konc. 1 ekonc har ett Hb på 230. Blodvolym 7% av kroppsvikten eller 60-70 ml/kg (vuxen) Ex 85 kg Pat med Hb 67 som skall till Hb 90 behöver 510-595 ml E-konc. <strong>CITRAT</strong> - En frisk person kan metabolisera 3 g Citrat på 10 min vilket mosvarar 1 ekonc. - Man kanske ska börja ge 30 ml Kalciumglykonat efter 4 enheter? - Kalciumklorid är vävnadstoxiskt så helst i central infart. Det är ej kalciumglukonat.</p>", "category": "Sjukdomstillstånd"}, {"title": "BLÖDNING / ROTEM", "html": "<table class=\"card-table\">\n<tr><td>BLÖDNING</td><td>Källa: PM KS, mfl.</td></tr>\n</table>\n<p><strong>OMEDELBARA ÅTGÄRDER VID TRAUMA</strong> <strong>&</strong> BLÖDNING**</p>\n<p>Transfusion 4:4:1, Riastap (Fibrinogen) 2-4 g, Cyklokapron (Tranexamsyra) 2 g, reversera antikoagulantia (se senare tabell).</p>\n<h3>PROVER</h3>\n<p>PK, APTT, TPK, Fibrinogen, blodgas, antitrombin III, citratrör till koagulation för TEG. Upprepad provtagning inom 2-4 h.</p>\n<table class=\"card-table\">\n<tr><th><strong>MÅLVÄRDEN VID PÅGÅENDE BLÖDNING</strong></th><th><strong>Åtgärd</strong></th></tr>\n<tr><td>Hb > 90 g/L (ej >100)</td><td>E-konc. Akutblod, grupplikt blod, bastestat blod.</td></tr>\n<tr><td>TPK > 100 x 10^9</td><td>Trombocyter.</td></tr>\n<tr><td>Fibrinogen >2-2,5 (4-6 vid hos gravida)</td><td>Riastap 2-4 g. Konsumeras snabbt hos gravida.</td></tr>\n<tr><td>PK(INR) < 1,5.</td><td>Vid Waran: 10 mg Konakion och Ocplex.</td></tr>\n</table>\n<p>APTT normalisering</p>\n<table class=\"card-table\">\n<tr><td>Fritt Calcium > 1 mmol/L</td><td>Calcium-Sandoz 10 ml</td></tr>\n<tr><td>pH > 7,2. Om lägre påverkas koag.</td><td>Optimera cirkulation. Buffra: Natriumbic/Tribonat</td></tr>\n</table>\n<p>Syst BT 80 -100. Vid skallskada >100. Ej för högt tryck pga pop-the-clot hypotesen.</p>\n<p>Initialt MAP 50, vid TBI MAP 80.</p>\n<p>Temp > 36,5</p>\n<h3>LÄKEMEDEL</h3>\n<p><strong>Cyklokapron</strong> (Tranexamsyra) 2g iv. Ges omedelbart. Ge ytterligare 1 dos inom 8 h. Kan ges tot 2-3 gånger/dygn. (Ej >40-60 mg/kg/d)</p>\n<p><strong>Fibrinogen</strong> 2-4g iv. Vid stort trauma ge 4 g. Ges omedelbart.</p>\n<p><strong>Calcium</strong>-<strong>Glukonat</strong> Braun 10 ml (2,25 mmol) iv var 5e min vb. Upprepa tills fritt Ca2+ >1 mmol. Obs använd ej kalciumklorid som är dubbelt så stark och kan ge svåra nekroser vid extravasal inj. 1 dos calciumglukonat är inte farligt och kan ges tidigt. NEJM 2017: Ge empiriskt efter 4 enheter blodprodukter. Kan påverka K+ något. Ca2+ behövs för koagulationen.</p>\n<p><strong>Buffring: </strong>Natriumbik<strong>.</strong> förutsätter god ventilation pga. risk för ökad mängd koldioxid. Vid högt CO2 använd ist. Tribonat.</p>\n<p><strong>TPK: </strong>Tpk aggregerar lätt och skall ej ges i samma aggregat som blod. Ej heller värmas (okänd källa). Det är i övrigt ofarligt att transfundera trombocyter.</p>\n<p><strong>Novoseven®:</strong> (Rekombinant Faktor VIIa) kan övervägas vid kritisk okontrollerad blödning som överstiger 1 e-konc per 10 kg kv / h trots ovanstående åtgärder och trots adekvat kirurgisk åtgärd. Överväg att först ge stötdos: Fibrinogen 4 g, Cyklokapron 2 g, 2st TPK-påsar. Dos Novoseven 0,1 mg/kg iv (avrundas till lämplig förpackningsstorlek). Ej vid pH <7,1. Upprepas max 1 gång. Ej klockren evidens.</p>\n<p><strong>Acceptable blood loss</strong> - Kanske kan vara till nytta någon gång?!** En formel för att beräkna acceptabel blodförlust. ABL = EBV x (Hbpreop - Hbtrigger)/ Hbpreop EBV: Estimerad blodvolym (ca 70ml/kg hos män, 60 ml/kg hos kvinnor. Hbtrigger: Det målHb som du vill att man ska transfundera på.</p>", "category": "Sjukdomstillstånd"}, {"title": "BRÖSTSMÄRTA", "html": "<p><strong>BRÖSTSMÄRTA HOS GRAVIDA</strong> Riskfaktorer för aortadissektion hos gravida: Marfan, Ehler Danlos, Loeys-Dietz, Turner, Bicuspid aortaklaff.</p>", "category": "Sjukdomstillstånd"}, {"title": "CEREBRAL SALT WASTING SYNDROME (CSWS)", "html": "<p>Ses hos pat. med traumatisk hjärnskada, SAH, hjärntumör, stroke, efter neurokirurgiska ingrepp. <strong>Patofysiologi</strong> Orsakas huvudsakligen av ökad Na+ -utsöndring genom ökad produktion av natriuretiska peptider.</p>", "category": "Sjukdomstillstånd"}, {"title": "DELIRIUM PÅ IVA #konfusion #förvirring", "html": "<p><strong>Uteslut</strong> • Ny infektion/sepsis? • Elektrolytrubbning? • Utsatta Bensodiazepiner eller opiater senaste 24 h? (abstinens): Om ja: Överväg återinsätande eller Klonidin om ej hypotensiv pat. • Agiterat delirium eller hallucinationer? Om jag: Haldol och/eller Klonidin. Undvik Bens / Opioider Om inget av ovan. Aktiv expektans. <strong>Läkemedel</strong> -Vanlig empirisk behandling: haldol eller a-2agonister (klonidin & dexmedetomidin) - Klonidin bolusdosser 50-150 mikrog. Kan upprepas var 15 min vb. Max 450 mikrog. Dosberoende biverkningar: successiv utveckling av bradykardi samt hypotension i enstaka fall. Kontraindikationer: bradykardi el. AV-block II-III. Catapressan är även bra då man kan minska på morfindoserna. Haldol Kan användas även om hemodynamiskt instabil: Haldol. 0,5 - 1 mg/dos. Kan upprepas eft
