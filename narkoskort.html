on föreligger: Catapressan 75 mikrog, Dynastat 40 mg, Paracetamol 1 g, Undvik opioid peroperativt om spinal kunnat läggas. - PONV-profylax till samtliga om inte kontraindikaiton föreligger. Skall ges tidigt efter sövning: Betapred 4 mg iv, Dridol 1,25 mg iv, Ondansetron 4 mg iv.</p>", "category": "Praktiskt"}, {"title": "FÖRLOSSNING PREHOSPITALT", "html": "<p>FÖRLOSSNING PREHOSPITALT</p>\n<p>1. Om mamman krystar och barnets huvud ses under pågående värk: förbered förlossning på plats. 2. Ta fram flertal rena handdukar eller liknande. 3. Då barnets huvud är framfött, känn vid barnets nacke efter navelsträngen. 4. Om navelsträngen palperas ett varv om barnets hals, lösgör försiktigt och för navelsträngen över barnets huvud. 5. Vid spänd navelsträng eller om den palperas virad flera varav om barnets hals, sätt två peanger på navelsträngen med några cm mellanrum. Klipp mellan peangerna och vira loss navelsträngen. Låt peangerna sitta kvar. 6. Låt huvudet rotera spontant så att barnet ”tittar åt sidan”. 7. Kroppen ska födas fram på nästa värk. 8. Om så inte sker: På nästkommande värk, fatta tag om barnets huvud över öronen och tryck stadigt mot mammans ryggsida för att lösgöra barnets axel under mammans symfys. 9. Om axeln sitter fast. Fatta huvudet över öronen. Vid nästa krystning. Tryck lätt nedåt. För in fingret i barnets armhåla och hjälp övre axeln ut. 10. Gör samma sak med andra axeln. 11. När axeln är framfödd – lyft ut barnet i riktning mot mammans mage. 12. Bedöm barnets status. Stimulera vb. 13. Dränageläge, och torka barnet torrt och byt till torr handduk. 14. Avnavla genom att 3-5 minuter efter födelsen sätta två peanger cirka 10 cm från barnets mage och klipp mellan peangerna. Sätt på klämma eller bomullsband och ta bort peang. Låt mammans peang sitta kvar. 15. Moderkakan förväntas lossna inom 30 minuter efter att barnet kommit ut. För att minimera risken för större blödning måste livmodern dra ihop sig. Tillräcklig sammandragning av livmodern är inte möjlig så länge moderkakan är kvar inuti livmodern. Kontakta obstetriker vb. Ev. kan man behöva ge Oxytocin för bättre sammandragning. Om moderkakan inte kommer ut spontant på fältet så satsa främst på transport till sjukhus. Spara ev. moderkaka så att obstetriker kan inspektera så att den är intakt. 16. Se till att mamman får en infart.</p>", "category": "Praktiskt"}, {"title": "FÖRSTOPPNING PÅ IVA", "html": "<p><strong>Primperan</strong> **</p>\n<p>Ges vid ventrikelretention. 5-10 mg x3. Vissa menar att det är ett rävgift. Obs på njurfunktion. Skall ej ges under lång period.</p>\n<h3>Naloxonhydroklorid</h3>\n<p>Ges vid ventrikelretentioni sond. Mixtur Naloxonhydroklorid i sond 1-8 mg x 4.</p>\n<h3>Movikol</h3>\n<p>Kan ges 1x2-3. Verkar på osmotisk väg genom att vatten hålls kvar i tarmen = bulkmedel. Effekt ses inom 1-4 dagar.</p>\n<h3>Laxoberal</h3>\n<p>Används vid svår förstoppning. Endast kortvarigt och i ett inledande skede. Lämplig dos är 5-7 droppar på kvällen. Risk för magsmärtor och magknip.</p>\n<h3>Neostigmin</h3>\n<p>Vid utebliven tarmtömning trots försök med andra LM, överväg Neostigmin iv infusion 0,4-0,8 mg/h under 24 h. Obs biverkningar som bradycardi, BT-fall, svettningar mm.</p>", "category": "Praktiskt"}, {"title": "GRAVIDA FYSIOLOGI SAMT FÖRLOSSNING EJ KLAR", "html": "<p><strong>FÖRÄNDRAD FYSIOLOGI HOS GRAVIDA</strong> - MAC 40% lägre (dock sällan att det förändrar så mkt under op). <strong>Respiration</strong> - De har minskat compliance pga magen, samt relaxin som gjort att bröstkorgen redan är vidgad. - Desaturerar snabbare. Preoxygeneras dock även snabbare (enl. vissa räcker det med 8 stora andetag). Apnoisk oxygenering bra, använd gärna tuss. <strong>Cirkulation</strong> - Försiktigehet med volym hos PE-mammor, de kan få lungödém. - PE kan utvecklas upp till 2 v postpartum. <strong>Koagulation</strong> - Gravida ska ha ett lägre PK. Så PK = 1,3 är inte normalt. Ska kanske ligga kring 0,9. - Gravida kan vid vissa sjukdomstillstånd snabbt konsumera fibrinogen, ex fostervattensemboli. Ex efter stor blödning, kolla koagulaitonen innan EDAn ska dras. § <strong>PÅ FÖRLOSSNINGEN</strong> - Decelerationer: Det är normal att decelerera under kontraktionen. Oftast beror det på kompression av navelsträngen (cirkulatinsorsakad deceleration). Sen deceleration: Kmr efter kontraktionen peakat, tecken på syrebrist (kemoreceptororsakad deceleration). <strong>BLANDAT OM OLIKA KOMPLIKATIONER VID FÖRLOSSNING</strong> - Bandl’s fåra: Förtecken till uterusruptur, ärret är på väg att spricka. - Misstänkt ablation, kan överväga aminiotomi för att se om det kmr blod. Koagel kan även störa uterus kontraktion mkt. - <strong>NERVPÅVERKAN EFTER FÖRLOSSNING</strong> - Nedsatt achillesrefelex, samt droppfot? kan bero på skada vid passade över stora till lilla bäckenet. - Nedsatt vibrationssinne och smärta på fotryggarna talar för skada på centrala banor: Varningsflagga. - Om droppfot och svaghet gluteus medius: Mkt sannolikt skada på rotnivå (L5). Glut. maximus är S1-nivå.</p>", "category": "Praktiskt"}, {"title": "GRAVIDITET & ICKEOBSTETRISK ANESTESI", "html": "<p><strong>Källor: </strong>Föreläsning A. Hein, SFAI, Alfresco, Anestesi vid icke obstetrisk kirurgi nr 394 (SÖSAB-S-2348401) <strong>Information</strong> att inhämta<strong> - Graviditetsvecka? -Hur angelägen är op? - Kan op skjutas upp till efter förlossning eller till 2a trimestern? - Val av anestesi; regionalanestesi möjlig? - Största risken för teratogen effekt är under organogenesis mellan v 3-8. Största risken är vid 31-71 dagar. Vid sista trimesterm finns risk för att förlossningen drar igång. - De flesta anestesimedel har i högdos under lång exponeringstid hos djurmodeller orsakat teratogena effekter. Därav rekommendationen att undvika anestesi i första trimestern. </strong>Utmaningar<strong> - Luftvägen: Svullnad av luftväg & större bröst leder till svårare intubation. - Mindre funktionell residualkapacitet och ökad syrgaskonsumtion orsakar kortare tid till desaturation. (Överväg högflödesgrimma under intubation). - Högre buktryck och lägre tonus i magmunn ökar aspirationsrisken. - Uterus trycker på blodkärl i buken, risk för cavakompression. </strong>FÖRBEREDELSER OCH UNDERHÅLL AV ANESTESI<strong> </strong>- <strong>Följande läkemedel är OK:</strong> Propofol, Pentothal Sevoflurane, opioider, Succinylkolin, alla icke-depolariserande muskelrelax, efedrin, fenylefrin, noradrenalin, paracetamol. <strong>- Läkemedel med risk</strong>: Bridion; oro för påverkad progesteronnivå, sannolikt utan klinisk relevans, men undvik om svag indikaiton. Antiemeteika ges endast på stark indikation, och i så fall ges Ondansetron kategori B1. Ge ej Betapred eller Dridol kategori C. Postagen och Primperan kan användas om indikation finns. (Enl. PM Region Sörmland: ”Ondansetron i enstaka doser bedöms medföra små risker”. <strong>- </strong>Ge ej följande läkemedel: <strong>NSAID- kan orsaka tidig slutning av ductus arteriosus. Robinul/Neostigmin Reversering: Reversering görs med Neostigmin 2,5 mg och Atropin 1 mg alt sugammadex. Inte med Robinul, då Robinul inte passerar placenta och barnet kan då drabbas av svår bradykardi. - Vä tilt/kilkudde från 2:a trimestern/från  v18. - RSI från v 18. Natriumcitrat, ordentlig preoxygenering, verväg optiflow. - Induktion: NatriumCitrat! RSI. Bibehåll pO2 14 samt pCO2 4 (mål 4-4.6 kPa). Fetal hyperkarbi och därmed resp. acidos är dåligt. Hypoxi och hyperkarbi påverkar placentablodflödet. Henrik: Ja egentligen är det en acidos (respiratorisk) man vill undvika, så följ pH och se till att pCO2 inte blir för högt. Ffa ska vi inte släppa upp och tillåta pCO2 upp mot 6 som vi kan göra med andra pat. ex. vid induktion. - Anestesimedel: MAC -40%, inhalation samt i.v. (Region Sörmland: Sevo bör undvikas under första trimestern). - Ökad duration av ickedepolariserande muskelrelax. Celocurin påverkas ej av graviditet. Operationen: Gärna låga pneumoopertionella tryck 1.1-1.6 kPa (allså lufttryck i buken vid laparaskopi). Försiktighet med Trendelenburg/rev Trendelnburg, tippa långsamt. Postop: Trombosprofylax? OBS: barnet blir sövt under anestesin. </strong>Monitorering<strong> Monitorera fetal heart rate och uterustonus. </strong>Extubation<strong> Sätt pat. upp och dra tuben. Vissa rek att man kuffar ur och ser så att det kommer luft vid sidan om så att den inte är larynxödem. </strong>Postop<strong> smärta</strong> Pat. måste vara tillräckligt smärtlindrad att kunna andas ordentligt. Viss evidens för att Paracetamol ökar risk för ADHD och astma.</p>", "category": "Praktiskt"}, {"title": "GRAVIDITET / GUCH / LÄKEMEDEL BETÄNKLIGHETER", "html": "<p>Läkemedel som ofta används kring förlossningen: <strong>Läkemedel</strong> <strong>Kardiovaskulär biverkan</strong> <strong>Hänsynstagande</strong> vid användning<strong> Betastimulerare (Bricanyl) Takykardi, arytmier. Stenos i vänstersidig klaff, arytmibenägenhet. Oxytocin antagonist (Atosiban) Inga Inga Misoprostol (Cytotec) Vasospasm, arytmier. Oxytocin (Syntocinon) Systemisk hypotension Kontinuerlig infusion låga doser, låg upprepade långsamma bolusdoser. Prostglandin F2-α (Protinfenem) Ökat arteriopulmonellt tryck Pulmonell hypertension Högerkammarsvikt, astma. Methylergometrin (Methergin) Koronarspasm, hypertoni, illamående Hjärtsjukdom, preeklampsi, hypertoni, aortopatier, anurysm <em> </strong>Källa: Föreläsning <strong>Halla </strong>Halldorsdottir<strong>?</em> Anteckningarna berör bla läkemedel som är relaterade till förlossning/sectio/postop vård. </strong>Diagnoser som riskerar ruptur av aorta:<strong> - Bikuspid aortaklaff särskilt om redan dilaterad arota. (Finns försvagning i aortaväggen). - Turner, Marfan, Loes Dietz, Ehler Danlos med vaskulär variant. </strong>Arytmiproblematik** - Bricanyl kan vara problematiskt vid arytmier. Istället kan man vid ex. värkstorm ge Atosiban (Tractocile) som är en oxytocinantagonist. Effekten är omedelbar och ???ökar även blodtrycket??? Dock är effektdurationen inte så förutsägbar, kan värka i 12 h, vilket kan bli problem för uteruskontraktionen vid secito). - Uterotonika ska ej vara problematiskt vid arytmier.</p>", "category": "Praktiskt"}, {"title": "GYNADAGVÅRD", "html": "<h3>GYNDAGVÅRD – Skrapning – MKT GAMMAL RUTIN</h3>\n<p>Propofol 2 mg/kg + 0.75 mg Rapifen (max).</p>\n<p>Kan börja med Rapifen 0.25 i doser.</p>\n<p>Vid cervixdilatation bör de ha hela dosen (0.75 mg) Rapifen.</p>\n<p>De är ofta stressade. Dutta inte utan låt dem somna hyfsat fort.</p>\n<p>Ha en extra 10 ml spruta Propofol som reserv.</p>\n<p>Inte sällan går det åt upp till 300 mg.</p>", "category": "Praktiskt"}, {"title": "HYPERNATREMI", "html": "<h3>Vatten i sonden</h3>\n<p>Man kan beräkna water deficit på bla medcalc och andra ställen.</p>\n<p>Man kan börja med att ge 100 ml vatten i sonden varje h i 10 h (=1L vatten) och sedan utvärdera. Man kan även överväga gå in med Soldaktone. En annan kollega brukar börja med 20 ml vatten/h. Men det verkade lite klent.Pat. gick ändå upp i natrium.</p>\n<h3>ORSAKER</h3>\n<p>Movikol innehåller massor av natrium. Man kan ge Laxoberal och Laktulor istället.</p>", "category": "Praktiskt"}, {"title": "HJÄRNDÖD HJÄRNDÖDSDIAGNOSTIK", "html": "<p><strong>För komplett stöd:</strong> Se nationella donationspärmen. Stödet nedan baseras på denna. <em>Jourhavande transplantationskoordinator: 020 224<strong> </strong>224</em> <em>Polisen: 114 14.<strong> Rättsmedicin Stockholm: 010 483 48 00</em> Sammanfattningsvis ingår följande delar: - Identifiera möjlig donator. - Brytpunktssamtal. - Hjärndödsdiagnostik 1 & 2. - Brytpunktsbeslut. Dokumentationen ska signeras innan kontakt med donationsteamet. - Ställningstagande till att kontakta polis (rättsmedicinsk obuktion kan förhindra donation). - Utredning av dontationsvilja:        - Kontakt med donationsteamet för sökning i Donationsregistret.        - Samtal med anhöriga. - Medicinsk utredning (leds av donationsteamet) – Får påbörjas först efter positiv donationsvilja konstaterad. - Formulär: Journalhandling för donationsingrepp på avliden donator – DBD/DCD. </strong>Brytpunktsbeslut<strong> - Ett ställningstagande att inte inleda eller fortsätta livsuppehållande behandling. - Ska vara gjort av </strong>en legitimerad läkare i samråd med en annan legitimerad läkare. <strong> - Ska dokumenteras och signeras i patientjournalen. Dokumentera tidpunkt för ställningstagande. Specificera i journalen vad brytspunksbeslutet innebär. </strong>Utredning donationsvilja<strong> - Om organdonations skulle kunna vara möjlig så är det vår </strong><em>skyldighet<strong></em> att utreda donationsvilja. - Ska påbörjas </strong><em>efter<strong></em> brytpunktsbeslut, skyndsamt, men med hänsyn till anhöriga. - I samband med utredningen så kontaktas transplantationskoordinatorn för sökning i Socialstyrelsens Donationsregister. - Känd vilja: Patientens sista viljeyttring gäller. Närstående har ingen laglig rätt att ändra denna. - Om viljan är okänd så kan närstående tolka viljan hos patienten. - De närstående måste ges ”skälig” betänketid. - Om okänd donationsvilja och närstående är oense så får donation inte genomföras. </strong>Organbevarande behandling<strong> - För att påbörja organbevarande vård måste ett dokumenterat brytpunktsbeslut finnas. - Får ges om den inte kan vänta till efter döden. Får inte medföra mer än ringa smärta eller skada. - Får inte hindra insatser för patientens egen skull, ex palliation. - Får genomföras för att utreda donationsvilja. Ska utföras syndsamt men men med hänsyn anhöriga samt dagtid. Om negativ donationsvilja ska organbevarande behandling avslutas skyndsamt. - Vid positiv donationsvilja kan man därpå påbörja medicinsk utredning. - Innefattar: Att intensivvårdsinsatser får fortsätta eller påbörjas. Mer omfattande insatser får inte påbörjas, ex: kirurgi pga ex blödning, ECMO, hjärtkompressioner, defibrillering vid en t-situtaion. </strong>Medicinska insatser efter döden<strong> - Medicinska insatser får fortsätta eller påbörjas för att möjliggöra transplantation. - Får inte pågå i >24 h om det inte finns synnerliga skäl. </strong>Behandlingsrekommendationer organbevarande behandling<strong> - Se donationspärmen. </strong>Fastställande av död med direkta kriterier** - Se checklista för detaljer. Ska genomföras 2 ggr med minst 2 timmar mellanrum. - Ska utföras av en specialistkompetent läkare och väld förtrogen med diagnostiken och intensivvård.</p>", "category": "Praktiskt"}, {"title": "HJÄRTKIRUGI - ANESTESI", "html": "<p>Fentanylbolus ca 500 mikrog när kir. kommer till salen.</p>\n<p>Koldioxid i såret: 10 L/min.</p>\n<p>Heparin innan kanylering.</p>\n<p>Propofol istället för gas: Ungefär vid kanyleringen, är även bra att sänka BT med under kanyleringen.</p>\n<p>Halv ventilation vid fulla ECC-flöden. Sedan ingen ventilation.</p>\n<p>Nitropress om högt BT och ej sjunker efter ökat propofol.</p>\n<p>Cyklokaproninfusion 3-4 ml/h (100 mg/ml).</p>\n<h3>MASKINAVGÅNG</h3>\n<p>Pat. behöver en vettig puls vid maskinavgång, pace;a vb. Corotrop bolus vb: 1 mg/20 kg. När man tömmer CPB-kretsen så höjer man huvudändan så att BT inte stiger så mkt av volymstillförseln, plus att man även undviker onödig snabb volymsbelastning.</p>\n<h3>DEKANYLERING</h3>\n<p>För att avlufta hjärtat: Blås upp lungorna och stasa. Låt hjärtat komma igång, kan börja ventilera efter frågat kirurg. Protamin ges när slangarna är borta, dosen räknas ut av perfusionisten. Sista 50 mg av totaldosen ges efter att man infuderat blodet från påsen som perfusionisten kommer med. Man kan saxa över till gas igen då det är lätt att styra gasen med. Sedan får man åter höja propofolet när man ska ta pat. till THIVA.</p>", "category": "Praktiskt"}, {"title": "HJÄRTKIRUGI POSTOP VÅRD", "html": "<h3>SMÄRTLINDRING</h3>\n<p>NSAID: Minskar morfinbehovet. Lämpligt är Naproxen 500 mg x 2, alt. 250 mg x2 f.o.m. postop dag 1 till pat som <strong>inte</strong>: är allergiskta, har diabetes, har hjärtsvikt NYHA III-IV, tid. NSAID-utlöst ulcus. De bör även ha ett normalt postop. förlopp och ett CystC eGFR >60. OBS! Man ger <strong>INTE COX-2-hämmare</strong> efter hjärtkirurgi!</p>\n<h3>EXTUBATION EFTER HJÄRTKIR PÅ THIVA</h3>\n<p>- Pat. skall normalt extuberas inom 2h efter ankomst på THIVA.</p>\n<p>- På THIVA extuberar vidareutbildade IVA-sköterskor, följande kriterier skall då vara uppfyllda: 1: Höjd huvudända >30 grader. 2: Tryckunderstöd, FiO2 <40%, TU över PEEP ≤8, PEEP ≤5 (adipösa pat. m. BMI >27 ofta PEEP 8), AF 10-25, pCO2 >10 kPa, Vt/PBW 6-8 ml/kg. 3: Blödning < 2 ml/min från thoraxdrän. 4: Normoterm >36 grader, varm perifert, ej shivering. 5: God muskelkraft, kan lyfta på huvudet från kudden, och böja benen. 6: Stabil cirkulation med parametrar inom ordinerade gränser. Om något avviker skall läkare tillfrågas.</p>\n<p><strong>KONTROLL AV PACEMAKER</strong> <strong>(</strong>Pacesetter<strong> modell 3076, </strong>St<strong> Jude Medical modell 3875</strong></p>\n<p>BÖRJA PÅ VENTRIKELNIVÅ (VVI) 1. Ställ in pace-frekvens 10-20 slag över pats. nativa hjärtfrekvens. 2. Ställ in energimängd (amplitud/output) initialt på 10 V. 3. Ställ triggerkänslighet/sensing initialt på 1 mV. 4. Kontrollera pacetröskeln på kammarnivå VVI genom att sänka energimängden (V) till loss of capture = pacetröskeln. Pacetröskeln bör ligga under 3V. Ställ sedan in output på minst 5 V över tröskelvärdet. 5. Sensing-tröskeln kan endast göras om pat. har en acceptabel egen hjärtfrekvens. Man minskar känsligheten tills pacemakern tror att det inte finns någon rytm hos pat. Sänk pacemakerfrekvensen till 10-20 slag under pats nativa hjärtfrekvens. Höj därefter sensingtröskeln successivt från inställda 1 mV (höjning av sensingtröskeln innebär sänkt känslighet hos pacemakern). När sensingtröskeln nås ses pacade QRS-komplex mellan/på patientens egna komplex. Sensingtröskeln är där det första pacemakerkomplexet uppkommer. Ställ sensing på 1-1,5 mV så att VES kan registreras (kan ha lägre amplitud än kammarkomplex). Detta för att man inte ska pace:a i en T-våg efter ett VES. NÄSTA STEG ÄR KONTROLL PÅ FÖRMAKSNIVÅ (ENKLAST MED AAI, MEN GÅR ÄVEN MED DDD) 1. Förvissa dig först att pat. har en kammaröverledning från förmaket innan du går över till AAI. 2. Förmakströsklar kan inte kontrolleras vid förmaksflimmer/fladder. Ställ in output på minst 5 V över tröskelvärdet. Förmakssensing ställs på 0,2 mV. 3. Efter kontroll ställs pacemakern in på DDD, VVI, eller AAI. Man bör prioritera att kammaraktiveringen är går via AV-knutan än från kammarelektroden vid DDD. Om pat. har en fördröjd överledning såsom AVbI så kan man förlänga AV-delay så att AV-knutan hinner med. (Normalt är AV-delay 200-250 ms). Exempel är sinusbrady med AVb1. <strong>EMERGENCY PACE: </strong> Vid osäkerhet om korrekt pacemakerinställning kan man tycka på rödmärkt kanpp ”emerg pace” vilket ger freq 80/min, output 12 V, V00. Om du fortsatt inte får capture så kan man prova att byta polaritet, alltså koppla om sladdarna.</p>\n<p><strong>ÖVRIGT</strong> Extern pacemaker: Det kan bara smart att gå in i V00 mode så att störningarna från MR-kameran inte tolkas som rytmen.</p>", "category": "Praktiskt"}, {"title": "HÖGFLÖDESGRIMMA / HFNO / THRIVE / NASALT HÖGFLÖDE", "html": "<p><strong>Användning vid </strong>preoxygenering<strong> eller under apné – Några punkter att komma ihåg:</strong> - Befuktarens bottenplatta ska för preoxygenering fyllas upp ca 0,5 cm  40-60 STERILT VATTEN. Sätt värmenivån på hög. - Låt maskinen stå på under ca 5 min med 5-10 L per minut innan applicering. - Grimmorna finns storlekar S, M, L. Sikta på en som täcker ca halva näsborren. - Pat ska andas med stängd mun för gott resultat. - Titrera snabbt upp från 30 till 50 L/min. Om pat. inte tål 50, sänkt till 40. - Preoxygenera minst 3 min. - Vid apné: Öka till 70L/min. Öppna upp luftvägen m. Käklyft, lätt laryngoskopi, el. svalgtub. - Om HFNOapparat inte finns tillgänglig kan man använda grimma på 15L/min eller nästuss 5-10 L/min för att förlänga tiden till desaturation under apné. - OBS! Aldrig tätslutande mask ovan HFNO, risk för barotrauma. - Om stängd mun får man PEEP på ca 1 cmH2O per 10 L/min. - Vid preoxygenering, sikta på 3 min, då är man safe. Många har rätt bra även vid 2 min.</p>", "category": "Praktiskt"}, {"title": "INSULINPUMP", "html": "<p>Det finns insulinpumpar som kommunicerar med glukosmätare och doserar själv: Tandem-Tslim insulinpump closed loop – Denna sköter insuliner själv under fastan och behöver inte justeras enligt endokrinkonsulten. Kan ju dubbelkolla detta.</p>", "category": "Praktiskt"}, {"title": "INTRAOSSEÖS NÅL / INFART", "html": "<p><strong>KONTRAINDIKATIONER:</strong> <strong>Fraktur</strong> **i benet som skall borras. Tidigare borrat ben eller redan 1 intraosseös infart på plats. Det kommer då bara att läcka ut.</p>\n<p><strong>NÅLSTORLEKAR:</strong> **Alla nålar har lika tjocka lumen. Längden är utefter hull.</p>\n<p><strong>INFUSIONSHASTIGHETER: </strong> <strong>Proximala </strong>humerus<strong>:</strong> 6 L/h. Ca 100 ml/min. Ungefär som en grön PVK.</p>\n<p><strong>LOKALISATION: </strong> <strong>Proximala </strong>tibia<strong>:</strong> Blå nål på vuxen. Borra på mediala sidan. På Lateralsidan går många nerver. <strong>Humerus</strong>: **Gul nål till vuxen.</p>\n<p><strong>INSTRUKTIONER: </strong> - När man kört in nålen mot benet så måste man se sista svarta strecket (minst). Tryck nålen genom huden. Borra ej. - Flusha med NaCl 10 st 10ml sprutor, spola ordentligt för att få en fin kanal. På barn spola 5-10 ml. Om man behöver ge xylocain så spolar man jättelångsamt (2 min) annars tas det upp direkt. - Övertryck behövs, men pumpa inte > än ca 250 mmHg, då nålen riskerar att tryckas ut. - Humerus: Obs du får inte dra armarna över huvudet, alltså böja mer än 90 grader i axelleden.</p>\n<h3>EJ KLAR</h3>", "category": "Praktiskt"}, {"title": "ICP / INTRAKRANIELL TRYCKMÄTNING", "html": "<p>ICP: Normalt 7 - 15 mmHg. CPP = MAP - ICP. Normalt 55-80 mmHg. Man ska ha CPP minst 55 mmHg. <strong>Anestesimedel</strong> Samtliga intravenösa anestesimedel förutom ketamin sänker metabolismen och därmed cerebrala blodflödet (CBF). Relax: Förstahandsmedel ickedepolariserande medel; Rocuronium. <strong>Koldioxid</strong> - Orsakar vasodilatation och ökar ICP. pCO2 4,0-4,5 ger omedelbar kärlkonstriktion och minskning av CBF. Vanligaste åtgärden för att akut sänka ICP. <strong>Hypoxi</strong> - Leder till anaerob metabolism, laktatbildning. Laktat är osmotiskt aktivt, vilket leder till ödembildning om produceras i hjärnan. Sker även vid kortvarig hypoxi. pO2 aldrig under 10 kPa (helst mellan 12 och 18), saturation ≥95%. <strong>Höjd huvudända</strong> - På neurooperation: Sövning, väckning och postop, lätt höjd huvudända 15-30 grader för att minska venös stas. Tänk även på huvudets rotation ffa >45 grader kan orsaka stas. <strong>PEEP - </strong>Generellt ej högre PEEP än 5 pga stasrisk och blödningsrisk. Ska diskuteras med neurokir om önskan att gå högre.  <strong>Hyperglykemi - </strong>Laktat<strong> </strong>är osmoBorde vara en</p>\n<h3>PLATÅVÅGOR</h3>\n<p>Vid ex. vårdåtgärder så stiger ICP tillfälligt. Men om det tar lång tid innan ICP sjunker (=platåvågor) så är det mindre plats innanför skallen. Man kan säga att bufferten är borta. Meddela med neurokir!</p>", "category": "Praktiskt"}, {"title": "IVREG / IVRA", "html": "<p><strong>Källa: </strong>PM VG-region: IVRA ID 21045, samt dokument med ID 19278. Anteckning uppdaterad maj 2018.</p>\n<p><strong>Indikation:</strong> Ingrepp < 60 min upp till armbågsregion/knäregion.</p>\n<p><strong>Kontraindikation: </strong>Sickelcellanemi, svår perifer kärlsjukdom, andra tillstånd där avstängning av extremiteten är olämplig. Porfyri. AVb II-III då lokalbedövningen kan sänka myokardiets överledningsförmåga. Ej optimalt beh. EP. Grav Reynaud’s sjd. Infektion i arm/ben. Hypertoni >180. Risken för methemoglobinemi av Citanest bör beaktas vid grav anemi eller uttalad hjärtsvikt.</p>\n<p><strong>Info till </strong>pat<strong>: </strong>Får ej köra bil fram till nästa morgon. Ska vara fastande för att vb. kunna konvertera.</p>\n<h3>Förberedelser:</h3>\n<p>PVK på armen som ej opereras samt en PVK så distalt som möjligt på armen/benet som skall åtgärdas. EKG-övervak, puloxymeter, BT-övervakning. Möjlighet till behandling vid toxisk reaktion på lokalbedövningen: Revivator, syrgas, intubationsmöjlighet, läkemedel för intubation samt intralipid.</p>\n<h3>Läkemedelsdosering</h3>\n<p>Citanest (Prilocain) 5 mg/ml</p>\n<p>Arm: 20-40 ml. Förslag på dosering är mindre eller lika med 3 mg/kg. (30 ml har funkat bra tidigare)</p>\n<p>Ben: 60-80 ml. Förslag på dosering är mindre eller lika med 4 mg/kg.</p>\n<p>Maxdos är 400 mg, försiktighet hos allmänpåverkade.</p>\n<h3>Procedur</h3>\n<p>- Manchettryck bör vara 50-100 mmHg över uppmätta systoliska blodtrycket. Ev. upp till 150 på benet.</p>\n<p>- Manschettrycket <strong>får inte släppas tidigare än 20 minuter</strong> efter bedövningen är lagd.</p>\n<p>- Manschetten bör ej vara uppblåst längre än 90 minuter.</p>\n<p>- Bolstra armen under manschetten.</p>\n<p>- Justera ej manschetten på armen genom vridning, risk för veckbildning och mekanisk skada på huden vid trycksättning! Ta loss och återsätt.</p>\n<p>- Kontakta operatör som så att det inte blir fördröjning mellan bedövning och op.</p>\n<p>- Håll upp extremiteten i cirka 5 minuter innan trycksättning.</p>\n<p>- Testa den distala kuffen.</p>\n<p>- Blås upp den proximala kuffen. Kontrollera att manschetten håller trycket.</p>\n<p>- Släpp ut luften i den distala kuffen.</p>\n<p>- Injicera Citanest och ta bort PVKn. Pat. upplever en stark värmekänsla lokalt när bedövningen verkar.</p>\n<p>- Operationen kan tidigast påbörjas efter 10-20 minuter. Under tiden tvättning och sterilklädning.</p>\n<p>- Obs, sprit får ej komma under manschetten, måste vara torrt. Annars risk för brännskada.</p>\n<p>- Om pat. efter ca 30 min besväras av manschettrycket, blås upp den proximala manschetten och släpp därpå ut luften i den proximala manschetten.</p>\n<p>- Manschett-trycket får inte släppas ut tidigare än 20-30 minuter! Risk för toxiska biverkningar.</p>\n<p>- Informera operatören när 30, 60, 105 och 120 minuter har gått.</p>\n<p>- När trycket släpps på manschetten så släpper bedövningen inom ca 10-20 minuter.</p>\n<p><strong>Symtom på toxisk reaktion: </strong>Oro, berusningskänsla, hörselförändringar, dubbelseende, yrsel, tryck över pannan och bröstet, medvetslöshet, muskelfasiculationer, beödninv i läppar och tunga, myocarddepression, bradykardi, arytmier, asystli, sympaticusblockad med BT-fall.</p>\n<p><strong>Behandling toxisk reaktion: </strong>Se separat anteckning: ”Lokalanestetika – Intox”</p>", "category": "Praktiskt"}, {"title": "JETVENTILATION / JETVENTILATORN / TWINSTREAM", "html": "<p><em>Källa: Muntlig, specialist på ÖNH-sektionen.<strong> Version 2023-01-19</em> </strong>TWINSTREAM<strong> </strong>Inställningar<strong> - Ställ in 100% syrgas. - Sänk nedre gräns till 0. - Den snabba jeten ”HF unit” kan ökas något ex från 600 -> 800 (upp till 1500) om man får saturationsproblem, det kan vara på bekostnad av CO2-utbytet. - Den långsamma jeten ”andetagen” kan justeras vid koldioxidbekymmer. - Det är fördelaktivt med aktiv befuktning, kir. tycker annars att det blir torrt och crustor. </strong>Övrigt/obs<strong> - Om det blir obstruktion av twinstream ex om man riktar jet-laryngoskopet snett så stänger den av sig. Likaså om pat. ex skulle hosta. Så då måste man vara bered att sätta på den igen. - Befuktning: Vid befuktning så minska O2-tensionen. Men det blir torrt utan så gärna om det går. - Vid laser så rek Twinstream att man minskar på FiO2, men hos oss kör vi oftast 100% förutom om det är större op. med bråsk osv. Och vi har aldrig brännbara saker i luftvägen, därav lasertuben. </strong>ANESTESI** - TIVA. Esmeron. - Ventilera, laryngoskopera så att du känner till pat. inför eventuell akut intubation. - ÖNH-läk tar över och för ned laryngoskopet. - Koppla på Twinstreamslangarna, de kan bara kopplas på 1 sätt. - Starta båda ventilationsmoderna, den snabba pulsen och de långsamma ”andetagen”. - Observera/känn så att bröstet lyfter sig under proceduren. - TOF ska vara på och mäta under hela proceduren. Se till att pat. är helt relaxerad, ingen stapel. Pat. kommer att behöva reverseras. - Lång jetventilationstid anses vara 1 h. Alla tålererar inte detta. Beror på patient och på hur det går. - Vid behov har pat. artärkateter för att följa CO2. - OBS! Vid avslut, reversera ej relax och väck ej förrän du har tagit bort jeten och märkt att det går bra att ventilera. OBS det finns risk att det hänger slem nedom larynx som väller upp när jeten avvecklas, så sug innan jetlaryngoskopet tas bort. Ha larynogkop redo. Man kan väcka på mask eller intubera och därpå väcka.</p>", "category": "Praktiskt"}, {"title": "KOLDIOXID / KAPNOGRAF / CAPNOGRAF", "html": "<p>- Högre koldioxid på blodgasen beror på Vq mismatch. Kan antingen vara shunt eller alveolärt deadspace. Det kan inte vara högre i utandningen än på gasen. Då tillför man isf koldioxid. (Källa: Specialistkollega) - Hos en lungfrisk individ så är andningsdriven maximalt stimulerad vid pCO2 8 kPa.</p>\n<p><strong>Läckage</strong> <strong>på</strong> inspiratory valve**</p>\n<p>Fel på ventil före patienten (inspiratory valve)  Backflöde av utandningsluft  Rebreathing. Åtgärd: Öka flöder till typ 10 L/min.</p>\n<p><strong>Läckage på </strong>expiratory<strong> </strong>valve<strong>:</strong> Luft backar tillbaka till pat. vid inandning.</p>", "category": "Praktiskt"}, {"title": "KÄRLSEKTIONEN – BLANDAT", "html": "<p>Artärkateter: Nästan alla pat. på kärlsektionen får artär då man oftast vill mäta ACT. Så det är inte att fundera så mycket över. Man kan skippa artär om det endast är en heparindos utan mätning ex på fistlar. - Spinaler: Spinalerna med Marcain Spinal 15 mg + Sufenta 5 mikrog räcker ca 3-4 h tills man får starta upp edan.  Johan lägger ibland 18 mg då räcker den jättelänge. Spruta mkt långsamt. <strong>Preanestesibedömning</strong> - Trombyl ska INTE sättas ut hos någon patient.</p>", "category": "Praktiskt"}, {"title": "LABVÄRDEN LABPROVER LABB BIOMARKÖRER", "html": "<p><strong>S100</strong> - S100 är inte helt specifik. Finns även i fett, lungor och benvävnad. Vid trauma så blir det en tidig peak från övriga vävnader och hjärnans peak kommer lite senare. Även skada på skallbasen kan släppa ut S100. - Falskt höga värden kan man få från AKI (filtreras av njurarna), samt melanom (det var från början en melanom-markör). - Area under S100-kruvan efter 12 h har jättestark koppling till utfall. Är bättre än GCS och ålder. - Normalvärde <0,11. Alla värden under 0,11 kan man strunta i (erfaren kollega). - Förändring på ≥0,05 när man ligger över 0,11 ska man reagera på/tänka till på. Vid en sådan stigning hos TBI-patienter har man i efterhand hittat avvikande fynd i CT hos 90%. (=Sensitivitet 90%) - Peakar vid TBI efter 27 h från skadetillfället. Om det fortsätter att stiga efter denna tidpunkt bör man fundera på om det är någon mer som spökar. <strong>NSE</strong> - Blir falskt förhöjd vid hemolys. - Är dem mest studerade hjärnskademarkören vid hjärtstopp. För bedömning av prognos får man utvärdera värden efter 48 h. (På IVA tar man NSE för prognos vid 24h, 48h, och 72h). <strong>ASAT / ALAT</strong> - ALAT är mer leverspecifikt än ASAT som även finns i skelettmusk och hjärtmusk. - ASAT har dock kortare halveringstid än ALAT och sjunker därför snabbare. Följ därför även ASAT då man snabbare får kvitto när det går åt rätt håll. - ASAT och ALAT stiger vanligtvis parallellt. - ASAT högre än ALAT är ofta tecken på allvarligare leverskada eftersom det finns mer ASAT i mitokondrierna och det är dåligt att skada sina mitokondrier. <strong>PCT</strong> Halveringstid 12 -25 h. Produceras av organ vid SIRS och stiger inom 3-6 h. <strong>Troponin</strong> T<strong> Troponiner är inte så njurfunktionsberoende utan det verkar vara relaterat till sekundära effekter av njurskadan. </strong>Pro-BNP<strong> Är mycket mer njurfunktionsberoende och är relaterat dels till volume overload men också GFR. / Expertkollega. </strong>X-<strong>krea</strong>, X-pankreasamylas, X-<strong>bilirubin</strong> - Är svårtolkat, kan bero på volym, koncentration etc. Blanda in kirurgen. Har inte hittat någon bra referens.</p>", "category": "Praktiskt"}, {"title": "LEVERKIRURGI", "html": "<p>Källor: Främst PMI KS Huddinge, lokala rutiner. ”Anestesi vid leverkirurgi” MED00492-7, ÖAK 2015.</p>\n<p><strong>FÖRBEREDELSER</strong> - Stäm av med kirurg: Antal segment som ska reseceras, Future Liver Remnant. Blödningsrisk. CVP-önskemål. Teknik, Pringles manöver? (Clampning av v. hepatica och v porta).</p>\n<h3>ANESTESIN</h3>\n<p>ThEDA: Önskad nivå Th 7 – 10. Testas. - Två grova infarkteter ex orange, Belmont vid stor blödningsrisk. - CVK 2 lumen 7 Fr, alternativt Mahurkar 12 Fr om det ej går att få till grova infarter. - Basalbehov med Glukosinfusion 2,5% 1 ml/kg/h som bärare för noradrenalin i CVK. - Persiratiodropp med RingerAcetat ges efter individuell bedömning och utifrån CVP. Ex 0,5 ml/kg/h samt ersättning av förluster. - CVP-mätning i andra lumen (Hemosphere). CVP-mål < 5 mmHg (har visat sig minska perop blödning pga minskad venös backblödning). Om CVP är högre ges i princip ingen perspiratioersättning innan resektionen är avslutad. - Beställ blod: Pat med Hb >120 och normal koagulation, beställ 2 ekonc vid resektion upp till 2 segment. Vid större resektion 4 ekonc. Plasma beställs vb. Albumin på sal. Belmont eller liknande ska finnas förberedd. - Narkosläkare närvarar under resektionsfasen. - För att nå CVP-målen kan man prova: Öka EDA, MAC, minska PEEP, omvänt Trendelenburg, (för de 2 sistnämnda finns få belägg för effekten på intrahepatiskt tryck, däremot större risk för lungemboli) mm. - Efter avslutad resektion rehydreras patienten till lämplig vätskebalans. - Vid laparoskopisk leverresektion strävas inte efter låga CVP pga risk för luftembolier. CVP bör snarast vara >10 cmH2O pga ökar intreabdominellt tryck. - Följ blodgaser minst 1 gång per h. Risk för hypoglykemi. Pga lågt mål-CVP är dessa patienter känsliga för ytterligare snabb hypovolemi/blödning. En 20 ml spruta med CaCl2 ska vara uppdragen, samt beredskap för blandning av adrenalin 0.01 mg/ml. Gemensamt för all blod- och plasmabeställning är att erytrocytkoncentraten tas till operation direkt, plasma beställs när behov uppstår. Vid grav cirkulatorisk instabilitet och i väntan på att plasma anländer, kan Albumin 40 mg/ml ges, och ska finnas i beredskap på operationssalen Avslut: - Ge ej Paracetamol utan att fråga kir! - Ondansetron.</p>\n<p><strong>POSTOP </strong>VÅRD <strong>&</strong> <strong>SMÄRT</strong>LINDRING**</p>\n<p>- Om behov av lägga ny EDA, ta nya koagprover och ROTEM först. - Glukosinfusion byts till 5% när slut. - Paracetamol utefter kirurgens ordination. - Laktat kan vara förhöjt efter leverkirurgi pga påverkad metabolisering. - Postoptider: Stor kir 12-24 h, mindre 6-12 h, lapskop 3-6 h.</p>", "category": "Praktiskt"}, {"title": "LUFTVÄG / LUFTVÄGSBEDÖMNING / INTUBATION/ LUFTVÄGSUTRUSTNING", "html": "<p><strong>GAP</strong> - Litet gap i kombo med andra problem är dåligt. Typ stel nacke eller flyende haka. - Litet gap är inte bara svårt att laryngoskopera utan det kan vara svårt att få ned larynxmask eller en svalgtub. <15 mm: går typ inte att laryngoskopera. < 18 mm: Specialutrustning nödvändig. >20 mm: Går ofta bra med video. (Huddinge har 20 mm som gränst för vakenfiberintubation. De anger att även om man kan få in ett smalt blad så är man rökt om det ex börjar blöda). <strong>NÅGRA PATIENTGRUPPER ATT HA SÄRSKILD RESPEKT FÖR</strong> - Lambåpatienter (lambå i munnen). Få patienter, men farliga. Svårare än de ser ut, ofta stela, ej normal luftväg. - Strålade. - Särskild bedömning hos pat. med tumör i munnbotten, tungbas, hypofarynx, larynx, hos dessa kan det ofta bli svårt. - Tonillerna blir sällan ett problem, men om tonsillen passerar medellinjen kan man få problem. - Tungbasen kan man inte se på utanpåskriften. Tungbastonsillerna, även benigna, kan göra det svårt. Slemhinnan skuttar upp överallt, ffa om man hamnar mellan tunga och tungbastonsillen. Kan vara orsak till oväntat svår luftväg. Maligna förändringar kan vara nekrotiska och det kan lätt uppstå blödning. - Dra alltid åt dig öronen vid hypofarynxpatologi. Låg tröskel för vakenintubation. - Mediastinal mass och luftväg: Om >70% förträgning så är risken ökad. Men beror lite på vad det är för trängsel. Benign struma brukar gå bra, de är mjuka. Om trång brukar det gå bra att ge luft. Men ge tid att andas ut. Bedöm risk för kardiovaskulär påverkan. <strong>VAKENLARYNGOKOPI TIPS:</strong> Man kan använda xylokaingel på bladet och i munnen, det fastnar ju lite och fortsätter bedöva. <strong>LARYNGOSKOPERING</strong> - Det är ett rätt litet område där man träffar hyoidbenet i valevula. Får du inget bra lyft så glid upp och ned i valekula med samma lyft till du får ett lyft av epiglottis. - Lyftvägsbok: In general,no advantage of the sniffing position over simple neck extension could be demonstrated. However, in patients with limited extension at the occiput, the sniffing position was found to be benefitial. - 4ans blad har samma kurvatur och är bra om man ska gå intralaryngealt. - Om du använder kurverat blad så funkar inte vanlig magills tång. Då finns bodeck som hänger på olika vagnar. - Ullman: Kom inte för nära larynxingången men D-blade. Du får rakare väg om du är längre upp. Annars blir det en kraftig kurvatur när och du kommer nära svalgväggen med skopet. Det finns en bok som han som uppfann glideskope har skrivit som man kan läsa. <strong>NASAL INTUBATION</strong> - Kurverat blad är egentligen bättre för nasal intubation för man lyfter inte larynx. - Vid stor blödning lyft upp larynx från blodsjön. Prova få ner nasala tuben eller byt till oral tub. - Om nasaltuben hakar sig bak i nösan. Pressa inte och rotera inte. Utan byt näsborre. (Ibland kan man dock behöva skruva lite på den). - Om näsblödning. Backa nasaltuben lite och cuffa den och gå sedan oralt. - Om svårt att passera nasopharynx: Man kan använda en vsond via näsan. Dra ut ur munnen och sätt peang så att den finns stopp mot munnen. Sedan för ned tuben till oropharynx, lossa peangen och dra ut v-sonden. <strong>MILLERBLAD / VIDEOMILLER</strong> - Vid laryngoskopi med millerblad, tänk på att inte rikta för kraftigt diagonalt, det är lätta att hamna med spetsen i kontralaterala sidan om epiglottis. - Man lyfter alltid epiglottis med millerblad. Sedan använder man typ alltid en ledre ex boogie. <strong>MAGILLS TÅNG </strong> - Den kurverade ”magills tång” heter egentligen ”Boedeker’s forceps”.</p>", "category": "Praktiskt"}, {"title": "LUMBALDRÄN #spinaldrän", "html": "<p><strong>INDIKATIONER</strong> Bla. prevention eller behandling av likvorläckage, vid hydrocephalus eller vid subaraknoidalblödning. <strong>FÖRBEREDELSER</strong> - Kontrollera koagulationsparametrar och när eventuell antikoagulantia gavs senast. - Om patient ej har urinkateter, bör patient tömma urinblåsan precis innan inläggning av lumbaldränage.  - Positionering såsom vid vanlig EDA-läggning; sidoläge, dx sida upp. <strong>UPPDUKNING </strong> - Sterila handskar, munskydd, op-mössa, steril operationsrock. - Klorhexidinsprit, 1 st sterilt tvättset, 1 st steril självhäftande operationsduk 75x75cm. - 1 st Tegaderm HP 14x16,5cm - Lokalbedövningsmedel, Lidocain 10mg/ml 1 x 10ml. - 1 st 10ml spruta, 1 st rosa uppdragningskanyl, svart im-kanyl. - 1 st epiduralnålsset 16G (kasta filtret) - Häfta för fixering (Mefix) för att fixera slangen på ryggen - Medtronics® Beckersystem <strong>INLÄGGNING OCH TILLVÄGAGÅNGSSÄTT</strong> 1) Medtronics® Beckersystem fylls med NaCl enligt sterilt förfarande av anestesiolog el. opssk. 2) Samma teknik som vid inläggning av epidural/intrathekal-kateter. Dock 16G-set. Durasäcken är lite stunsig. Lägg in slangen cm 5 cm (neuroop-kollega). Koppla direkt på katetern till Medtronics® Beckersystem, utan att använda filtret (pga. att det hindrar flödet). 3) Fäst slangen upp på ryggen med självhäftande väv på rulle, tänk på att patienten kan vara rörlig och uppegående. 4) Märk kateterslangen för att förhindra förväxling. Märkningen ska skrivas med svart text på vit bakgrund. 5) Korrigera höjden på lumbaldränage så att det droppar sakta ner i kammaren (blir annars lätt stopp i katetern). Dränagehastigheten kan regleras genom att höja eller sänka kammaren alternativt hela Medtronics® Beckersystem. Lumbaldränaget bör aldrig stängas (endast vid transport). Neurokirurgen ska ordinera dränagetakt. <em>Kollega: </em> <strong>På </strong>op<strong>: </strong>Som start är 5 ml/h är standardtappningen på operation. Man får titta hur mkt som kommer i kammaren. Man kan börja på tryckgräns på typ 10-15 mmhg, så justerar man därefter. <strong>DRÄNERING</strong> Likvormängd/dygn ordineras av neurokirurg. Dräneringsmängden bör fördelas jämnt över dygnet, för att minska obehag såsom huvudvärk och neurologisk försämring för patienten. Dränagets höjd justeras efter behov. Nollnivån på lumbaldränaget kan hamna nedanför patienten för att uppnå ordinerad dräneringsmängd. <strong>SKÖTSEL</strong> – På avdelning** - Inspektera alltid lumbaldränaget när du går på ditt pass och sedan minst en gång i timmen. Kontrollera; - att lumbaldränaget är öppet och pulserar. Vid låga tryck kan pulsationer i slangen vara mycket små men oftast annan orsak ex. felställda kranar, koagel eller luftbubblor. Dränaget bör aldrig stängas eftersom katetern är tunn och lätt kan ockluderas. - inställd trycknivå (mmHg) på Medtronics® Beckersystemet med ordinationen. - likvorns färg och utseende. - att kateterslangen inte är knickad, samt att kopplingar inte läcker. Kopplingen mellan kateter och dränaget ska inte skruvas åt ytterligare då detta medför risk att epiduralkatetern skärs av. - Inspektera insticksstället och förbandet för att tidigt upptäcka infektion eller läckage. Om förbandet lossnat eller är blött ska det bytas. - om fortsatt läckage från operationssår eller näsa/svalg/öra kontakta neurokirurg. - att tryckdom inte är kopplad till lumbaldränage då ICP inte ska mätas. Korrigera nivån av lumbaldränage vid lägesändring och mobilisering för att bibehålla rätt dräneringstakt. Informera patienten om vikten av rätt nivå av lumbaldränaget och uppmana patienten att tillkalla vårdpersonal innan lägesförändringar utförs. Dränagepåsen byts endast när den är full. Observera att inget får injiceras eller aspireras in/ut i lumbaldränaget.</p>\n<p><strong>Källa:</strong> PM KS Inläggning lumbaldränage Neuro, utgåva 2, 2019-09-04.</p>", "category": "Praktiskt"}, {"title": "LUNGANESTESI", "html": "<p><strong>Källor: </strong>Främst <strong>PM</strong>I<strong> KS</strong> Thorax<strong>, samt narkosguiden.</strong></p>\n<p><strong>INGREPP: </strong>Kilexcision, lobektomi, pulmektomi, pleurektomi.</p>\n<p><strong>KIRURGISK TEKNIK: </strong>Uniport VATS, flerport VATS, thorakotomi anterolateral eller posterolateral.</p>\n<p><strong>FÖRBEREDELSER </strong>&<strong> LÄKEMEDEL</strong></p>\n<p>- Premedicinering ska i största möjliga mån undvikas, pat. brukar gå till opsalen. Sätt ut ACEh vid premning (kan påverka den hypoxiska vasokonstriktionen enl vissa källor). (Kalciumblockare borde även kunna påverka). - Minst 2 grova infarter. Artärnål. TOF. KAD. Blodgrupp, bastest, överväg beställa blod. CVK vid pulmektomi och TEE på indikation. - TIVA (då man inte vill ha gasläckage i rummet).</p>\n<h3>TUBER</h3>\n<p>- Vänstervriden dubbellumentub används i regel förutom vid vänstersidig pulmektomi eller avvikande anatomi i vänster huvudbronk. - Storlek: Normalt 35 till kvinnor & 37 till män (French size) på nya videotuber, annars 37&39. - <strong>Gela tuben</strong> för att den ska glida bra. Antifog på tubens kamera. - Undvik tänderna då kuffen lätt går sönder mot vassa tänder. - Backa ledaren 10 cm när står mot larynxingången, in mellan stämbanden, sedan ut med ledare. Rotera samtidigt motsols 90 grader vid nedförande. Ej till 180 grader, risk för perforation av tracheas baksida som är mjuk. För ned tuben så att bronk-kuffen precis nästan hernierar över carina som en lite blå månskärva. Hos en majoritet mäts 29 cm vid tandraden när tuben är på plats. - Kuffning: 3-5 ml luft i den distala (bronkiala) och 5-8 ml i den proximala (tracheala) kuffen.</p>\n<p><strong>ANESTESIN</strong> (OBS viktigt att pat. är <strong>djupt</strong> relaxerad under <strong>op</strong>, TOF <strong>1-2</strong>)**</p>\n<p><strong>INNAN INDUKTION</strong> Antibiotikaprofylax, enl. PM: 30 min före hudsnitt ges Bensylpc 3 g (löst i  100 ml sterilt vatten) i.v. Så länge såret är öppet ges Bensylpc 3 g i.v. var 4:e tim. Vid PC-allergi ges Dalacin 600 mg  (löst i 100 ml fys NaCl)  i.v. under 30 min. Två påfyllnadsdoser ges efter 6 och 12 timmar. <strong>INDUKTION</strong> - Robinul mot salivering 0,2-0,4 mg iv. Samt överväg PONV-profylax. - Remi-Propofol (TIVA). Rek: Ultiva 0,5 mikrog/kg/min, Propofolbolus (1-2-3 mg/kg). - Relax: Atracurium 0,5 – 0,6 mg/kg. alt. Rocuronium (Båda anslagstid 2 min). <strong>UNDERHÅLL</strong> - Ultiva 0,2 – 0,4 (-0,6). Vid välfungerande EDA 0,1-0,2. Propofol 4-8-(12) mg/kg/h. Atracrurium tilläggsdoser för underhåll på 0,1-0,2 mg/kg. - Rekrytering och PEEP 5 – 10 –(12) cmH2O som senare bibehålls vid 1-lunga-ventilation. - FiO2 100% för N2 ursköljning, om inte kontraindicerad (ex vid Bleomycin) - Ventilation på 1 lunga: FiO2 50-70%, högre vb. VKTS/TK 4-6 ml/kg. Frekvensökning för att bibehålla minutvolym. Permissive hypercapnea upp till pCO2 8-9 kPa om ej kontraindicerat (ex högersidig hjärtsvikt). Försök hålla topptryck <25-30 cmH2O, platåtryck <20. PEEP 5-10 -(12) på ventilerad lunga. <strong>VID HYPOXEMI</strong> 1. Kontrollera bronkialkuffen, dislocerad? 2. Öka FiO2. 3. Rekrytera nedre lungan. 4. Ventilera bägge lungor. 5. Koppla PEEP-ventil med ruben?blåsa, flöde 5 L/min. 6. Kardiell orsak? Efedrin 5-10 mg. <strong>OPSLUT</strong> - Stäng propofolinfusionen efter sista suturen (kontrollera TOF först). - Kuffa ur bronkialkuffen och vänd pat. till ryggläge. - Innan väckning, Perfalgan & Dynastat (om OK). Nakosguidens rekommendation: Sätt APL på 20 cmH20 och apne under 20-40 sek med FiO2 40%. Så blåser lungan upp sig. Sedan normoventilation med PEEP 5-10.</p>\n<p><strong>POSTOP </strong>VÅRD <strong>&</strong> <strong>SMÄRT</strong>LINDRING**</p>\n<p><strong>Generellt:</strong>      - Uniport VATS  Intercostalblockad + per oral behandling.      - Flerports VATS  Paravertebral blockad + peroral behandling.      - Pleurektomi/thoraxotomi  EDA. <strong>Intercostalblockad</strong> Anlägges av kirurg, 25 mg Chirocain bolus av kirurig???. Postop koppl. PainBuster-pump. <strong>Paravertebralblockad</strong> Anlägges av kirurgi som ger Bolus 75 mg Chirocain. Vid opslut ges ytterligare 100 mg Carbocain. Postop kopplas PainBuster. <strong>Postop</strong> ordinationer** Paracetamol. Reducerad dos vid vikt < 50 kg: 60 mg/kg/dygn. Naproxen 250-500mg 1 x 2. (alt. inj. Toradol 10(-15) mg i.v. vb max 60 (-90 mg/dygn) Oxycodon (Oxynorm) 5 mg vid behov Eventuellt oxocodon (Oxycontin) 5 mg x 2</p>\n<p><strong>Sövande narkosläkare ska:</strong> • skriva in patienten på UVA under fliken uppvakning i Birger. • registrera inga eller eventuella anestesi komplikationer i Birger. • ordinera läkemedel på ordinationsblad i Birger och skriva ut en papperskopia. • ordinera EDA, PVB eller ICB infusionen samt annan smärtlindring (alvedon, NSAID, oxynorm vid behov, ketanest etc) i Take Care.<strong> </strong>Ej NSAID vid pleurodes. • rapportera patienter som ligger på THUVA till jourerna <strong>Uppvakningspersonal ska:</strong> • Kontrollera utbredning av EDA på THUVA • Starta eventuella infusioner i Take Care • Överrapportera patienten till avdelningspersonal • Skriva ut patienten ur Birger och ange vårdtyngd Postop lungröntgen skall utföras före pat. åter till avd. Pat. ska ha thoraxdränage ex Thopaz 5-15 cmH2O undertryck. När luftläckage och ev. blödning upphört kan dränaget avlägsnas. Dränet får aldrig stängas av förutom vid planerad provavstäning eller avveckling. Efter pulmektomi används ett passivt dränage i form av en uribag (med ett litet tillklippt hål i övre delen av påsen) kopplat till dränageslangen. Vid misstänkt mediastinal överdragning (cirkulatoriskt instabilitet) skall dränaget kopplas ifrån uribagen i cirka 15 sekunder så att luft kan komma in i pleurahålan.</p>", "category": "Praktiskt"}, {"title": "LUNGFYSIOLOGI BLANDAT", "html": "<p>Låg saturation som inte svarar på syrgas är i princip bara shuntar. Vid diffusionsstörning, deadspace av LE eller alveolärt dead space så svarar man på ökat FiO2. VQ/mistmatch - Menar att vissa delar har hög perfusion och andra delar har låg perfusion? RÖrigt. Shunt - Låg V/Q mismatch - Atelektas, mfl - Svarar inte på ökat FiO2. - Har dålig saturation. Alveolärt dead space - Hög V/Q mismatch - Ex för högt PEEP, eller lungemboli. Fibros, astma, COPD, PHT, pneumoni. Får lägre EtCo2 än pCO2. - Svarar på ökat FiO2. - Eftersom andra delar som har för hög perfusion får mer O2 att ta till sig. - Har god saturation. - Men om väldigt mycket blod inte kan passera alveolerna så går blodet någon annan stans och gasutbytet hinner inte med där. —> Ökar pCO2 och minskat pO2.</p>", "category": "Praktiskt"}, {"title": "LUNGREKRYTERING", "html": "<p><strong>Mitt eget konsensu</strong>s-protokoll för lungrekrytering**</p>\n<h3>Åtgärdsschema:</h3>\n<p>Tryckkontroll    Sänk andningsfrekvensen till ca 7 /min för att minska drivtrycket.     Öka PEEP till 15 cmH2O.     Tryck över PEEP circa 15 – 17 cmH2O.     Observera volymen på första andetaget. (Med fördel har pat. tid gjort en maximal inandning före induktion).     Inspiratory hold på cirka 7-10 sek. Observera BT!     Upprepa 1-3 ggr.     Minska tidalvolymen till utgångsläget. Trappa ned PEEP med cirka 3 cmH2O per andetag.     UNDER TIDEN: Håll koll på BT och saturation (saturationen kan sjunka vid höga tryck dels pga alveolärt dead space och dels pga minskat CO).   <strong>Undvik rekrytering vid:</strong> Hypovlemi Luftläckade eller risk för luftläckage. Högt intrakraniellt tryck. Sen ARDS (sic). Det brukar vara lönlöst. Och ev dåligt: I slutet är ödemen/atelektaserna organiserade och fast och det finns risk för skador istället.</p>", "category": "Praktiskt"}, {"title": "MAGNETKAMERA / MR", "html": "", "category": "Praktiskt"}, {"title": "MARFANS SYNDROM & ANESTESI", "html": "<p>- Bindvävssjukdom - Autosomalt dominant. - Typiska stigmata med långa fingrar, trattbröst, linsluxation, etc. - Mkt sköra kärl. De första kärlmanifestationerna är aorta ascendens och aortaklaffen som ofta opereras tidigt i livet. Så småningom brukar hela aortan behöva bytas ut. <strong>Anestesiologiskt:</strong> - Vanligt med aorta- och mitralis-insuficiens. - Även känsliga klaffar och risk för infektiös endokardit. Enligt Smith & Aitkenhead så skall dessa erhålla <strong>antibiotikaprofylax</strong> oavsett typ av kirurgi. - Kan ha <strong>mycket sköra kärl</strong> och CVK och artär är riskabelt och kan leda till blödningar eller dissektioner. (Källa läkartidnignen). Friläggning kan vara aktuellt om svårstucken CVK. - Vanligt med skolios och kyfos. - Hög gom, utstickande tänder. Källor: Smith & Aitkenhead. Läkartidningen <em>Nedärvd kärlskörhet ger stor risk för komplikationer vid kirurgi.</em></p>", "category": "Praktiskt"}, {"title": "LASERTUB / METALL-ETT / METALLTUB", "html": "<p>Används på ÖNH vid laserkirurgi på ex stämbanden. - Storlek beroende vad som får plats. Finns från 6,0 och mindre. Så man kan man ex testa 5,5. - Cuffas med NaCl 5-10 ml. Cuffa bara lite åt gången och kolla av så att det är inte blir luftläckage. Sedan cuffa ur så att det blir läckage, sedan i med ca 1 ml. Går ej att mäta cufftryck. Obs cuffa inte mkt då man kan orsaka mkt höga tryck. - Lägg den övre cuffen precis nedom stämbandsplanet och för ned 5 cm till. Så att lasern inte träffar cuffen. Sedan har man den distala cuffen som reserv. Den cuffas ej. - Om risk att träffa cuff med laser så kan man tamponera nedom stämband och även dra ner syrgasen. - Gå ned i FiO2 innan laser startas pga brandrisk, kollega brukar ha FiO2 30% (blir mkt larm på resp om ned till 21%). - Lasertuben går bra att böja. Funkar även med Boogie. - Ev FFP3-mask. <strong>Anestesirutin vid l</strong>aserkirurgi** TIVA Remi 8-10. Prop 3-6.</p>", "category": "Praktiskt"}, {"title": "NET / CARCINOID - ANESTESI", "html": "<p><em>Källa: Rutin <strong>Carcionid</strong> anestesirutin, <strong>Alfresco</strong> <strong>17344</strong>, 2017.<strong> </strong>Anestesi vid <strong>carcinoidtumörer</strong> KS PM utgåva 4 21-04-29.</em> <strong>NET-tumörer</strong> - Bakgrund<strong> Neuroendokrina tumörer, är tumörer som bildats från celler som kan bilda och släppa ut hormonier i blodbanan i respons till ett neurogent stimuli. Exempel på neuroendokrina tumörer är Medullära thyroideatumörer, feokromocytom, endokrina pancreastumörer, och Carcinoider.Carcinoid är den vanligaste neuroendokrina tumören i GI-kanalen och utgår från enterochromaffina celler. Återfinns även som primärtumör i lungor, bronker, tymus, lever, pankreas, ovarier och mediastinum. NET i ileum (klassisk midgutcarcinoid) är vanligast och producerar ofta höga nivåer serotonin, histamin, 5HTP, kallikrein, substans P mm. Kan dock finnas längs hela GI-kanalen. Innan tunntarms-NET har metastaserat är det osannolikt att patienten har Carcinoidsyndrom. Obsereras att patienten kan ha en oupptäckt metastas, var observant på flushing/hypotension. När tumören har metastaserat, vanligtvis till levern, eller när det rör sig om en primär lungcarcinoid kan pat. ha ett carcinoidsyndrom. Vasoaktiva ämnen som tumören utsöndrar går igenom levern via vena porta innan de cirkulerar vidare. De bryts då ned och metaboliseras i levern innan de har systemiska effekter. Vid levermetastasering metaboliseras de vasoaktiva ämnena inte ner på samma sätt och patienten kan få ett carcinoidsyndrom. Syndromet är en sen masifestation av sjukdomen och påverkar ca 10% av alla pat. som har en carcinoid tumör. Klassisk symtombild: diarré, flush-attacker, högersidiga hjärklaffsvitier, HK-svikt, och bronkoobstruktion. Symtomen kan förvärras vid anestesi och kirurgi vilket kräver särskilt omhändertagande. </strong>Utredning<strong> Anamnes, lab, inkl. 5HIAA i urin, kromogranin-A i plasma, ev peptidscreening. Utreds med oktreotidscintigrafi, DT thorax/buk (levermetastaser?), och hjärt-EKO. </strong>Carcinoid<strong> klaffsjukdom</strong> – Ca 45% av alla med <strong>cardinoidsyndrom</strong> Serotonin och tillväxtfaktorer från carcinoiden stimulerar fibrosbildning vilket ger klassiska klaffvitier på höger sida, ffa tricuspidalisstenos med insufficiensinslag men även pulmonalis stenos/insuf. Fibros i endokardiet kan även ge en restriktiv kardiomyopati med diastolisk dysfunktion. <strong>Behandling</strong> Kirurgi: Av primärtumör och/eller metastaser för bot eller symtomlindring. Interferon: Symtomlindring och ibland tumörreduktion. Brukar sättas ut 1 v innan op (för återhämtning), ersätts med Somatostatin. Ocreotid (Sandostatin): Somatostatinanalog med T1/2 på 2 h (jmf Somatostatin T1/2 2 min): Hämmar utsöndringen av serotonin, mfl.</p>\n<p><strong>Rekommendationerna nedan är från vårat KS-PM.</strong> <strong>Preanesteibedömning</strong></p>\n<p>Anamnes: Tecken till carcinoid syndrom? – diarréer, flush, obstruktivitet. EKO. Levermetastaser? = Ökad risk för carcinoid kris och hjärsjukdom. Lab, se ovan. Elstatus (diarréer), leverstatus (metastaser), Hb, LPK (pat. som haft interferronbeh). Tumörlokalisation. - Premedicinering: Ja! Ex T. Stesolid 10 mg eller mer. Alternativt sedativ antihistamin (Tavegyl). Gärna tillägg Midazolam på sal. Viktigt med lugn pat. <strong>ANESTESI</strong> <strong> - Carcinoidcellerna uttrycker B-adrenoreceptorer och stimuleras av katekolaminer. Undvik: Stress (smärta, hyperkapné, hypotermi, hypotension) och betasimulerande LM (efedrin, adrenalin), som kan ge paradoxalt BT-fall och obstruktivitet. - För symtomatiska pat. undviks även noradrenalin pga svar betastimulerande effekt i höga doser. Till dessa används ist. Fenylefrininfusion. - Undvik histaminfrisättande LM (morfin, pentothal, celocurin, atracurium). - Tumörmanupulation och ökat buktryck kan orsaka serotoninutsöndring. - Försök eftersträva en cirkulatoriskt stabil patient. Obs på att anafylaxi kan vara svårt att skilja från carcinoid kris. - Artär före induktion. CVK vb, som regel vid levermetastaser. FloTrac vid öppen kir. TEE vid symtomgivande hjärtengagemang. - Hyperglykemi vanligt pga Sandostatin hämmar insulinfrisättning. Följ b-glukos. </strong>OCTREOTID SANDOSTATIN<strong> </strong>Bolus <strong>preop</strong>: <strong>50 – 200 mikrog iv. Dosering i samråd med ansvarig kirurg. </strong>Infusion <strong>perop</strong>: <strong>50-200 mikrog/h iv: Dosjustering uppåt vb. </strong>Spädning<strong> </strong>Sandostatin<strong>:</strong> Dropp 500 mikrog/50 ml (10 mikrog/ml, 5-10 ml/h). I 2a hand sprutpump: 500 mikrog/50 ml (10mikrog/ml, 5-10 ml/h) <strong>CARCINOID REAKTION</strong> - Ev meddela kirurgen att pausa kirurgiskt stimuli. <strong>Perop</strong> <strong>hypotension</strong> - Behandla rätt orsak: Carcinoid kris? För djup anestesi? Anafylaxi? Histaminutlöst? 1. Sandostatin: 50-200 mikrog bolusdos. 2. Kristalloid elelr kolloid vätskebolus. 3. Alfa-1 agonist (Fenylefrin), antihistamin, calcium sandoz. 4. Katekolaminer OK om pågående Sandostatin-infusion. <strong>Obstruktivitet</strong>/<strong>bronkospasm</strong> 1. Sandostatin: 50-200 mikrog bolusdos. 2. Antihistamin, Atrovent, steroider. Ej betastimulerare, alltså ej Ventoline etc). <strong>Hypertension</strong> 1. Sandostatin: 50-200 mikrog bolusdos. 2. Trandate, Adenosin. <strong>POSTOP</strong> - Nattispatient vb. - Fortsätt sandostatininfusionen med <strong>25-50</strong>-100 mikrog/h i 2-6 h även om pat. varit symtomfri, annars längre tid. Dosreduktion i samråd med kirurg. PONV: Ondansetron är föstahandsval som antiemetikum pga sin serotoninblockerande effekt på 5-Ht3rec. GÖTEBORGS PM - Övrigt <strong>Förberedelser</strong> - Ibland har pat. premedicinerat med Oktreotide i veckor/dagar innan op. - Eventuella carcinoidsymtom ska vara under kontroll med förbehandling. - Elektrolyrubbningar kan förekomma pga diarréer. - Artär innan induktion, ta blodgas. <strong>Anestesi som är OK: </strong>Sevo, O2, propofol, fentanyl, esmeron. <strong>Vid </strong>carcinoid<strong> kris: </strong>(<strong>bronkospasm</strong>, flushattacker, <strong>ödém</strong>, <strong>cirkulatorisk</strong> instabilitet)<strong> -Bolus Oktreotide 50-100-(250-500-1000) mikrog, kan upprepas var 5 minut, titrera till kontroll. - Alternativt bolus + infusion Oktreotide 50-200 mikrog/h. - Kommunicera med kirurgi: Kirurgiskt uppehåll till kontroll. - Använd vb: Fenylefrin, volym, kalciumklorid, ev. Vasopressin. </strong>Svår <strong>bronkospasm</strong>: **Fördjupa anestesin, bolus Oktreotide, ev. inhalation Atrovent, kortison. Extrem försiktigthet med beta-agonister och teofyllin.</p>", "category": "Praktiskt"}, {"title": "MITRALISKIRURGI – POSTOP VÅRD", "html": "<h3>KOMPLIKATIONER</h3>\n<p>- Accidentell ligering av circumflexa (som ligger i närheten av operationsområdet). - SAM. - Aortainsuf pga drag från nya klaffen/suturer. - Residiverande MI.</p>\n<h3>PERIOP EKO – VAD KIRURGEN VILL VETA</h3>\n<p>1. <em>Var sitter felet.</em> M1, M2, M3, P1, P2, P3? 2. <em>Mekanism.</em> Prolaps (buktar bakåt), flail (segel fladdrar tillbaka), restriction (seglet hindra från att täta), dilatation (seglen når inte ihop). 3<em>. Utseende.</em> Förtjockad, myxomatös (vidgad typ). 4. <em>Associerade förändringar och SAM-risk. </em>Vänsterkammarpåverkan. Mått på C-sept och M-sept (<2,5 cm).</p>", "category": "Praktiskt"}, {"title": "MONTGOMERY TRACH / T-STENT / T-TUB TRACHEALSTENT", "html": "<p>- Stentet/trachen ser ut som en T-koppling, en öppning kraniellt, en ut i stomat och en mot lungan. <strong>STOPP I TRACHEN</strong> Om ex koagel eller slemklump nedtill i trachen: 1:  Sug i kanalen vid stomat: Rikta öppningen uppåt så att katetern går ned mot lungan. 2: Sätt syrgas över munnen: Trachen har ingen kuff så den kan passera i alla fall viss mängd luft mellan trachen från munnen. 3: Sätt syrgas över öppningen vid stomat. 4: Om fortsatt svåra problem dra ut trachen. Dra ut med en peang som du för in lite i lumenet. Stoppa in en tub ex 6,0 eller 5,0. Det kan ev finnas fickor eller fistel mot esofagus. Stoppa initialt in tuben endast så att cuffen syns i stomaöppningen. Om du vill föra längre ned, överväg använd fiberskop.</p>", "category": "Praktiskt"}, {"title": "MULTIPLATE", "html": "<p><strong>BLANDADE ANTECKNINGAR</strong> Om avvikande multiplate och du inte har någon LMbehandling. Multiplate är ju egentligen till för att följa läkemedelsbehandling. Man kan följa upp med ROTEM och se om du bejöver behandla. Då ser du ju hur koagulationen fungerar.</p>", "category": "Praktiskt"}, {"title": "NEBUSILATOR VID RESPIRATORBEHANDLING – FLOWi.", "html": "<p>- Det går att ge läkemedelsinhalationer i Flow-i-respen på op. - Utrustning finns på plan 6 alt. plan 7. - Se nedan för vilken utrustning som används.</p>", "category": "Praktiskt"}, {"title": "NASAL BEHANDLING / LÄKEMEDEL NASALT", "html": "<p><strong>Fentanyl</strong> Kollega på trauma/prehosp: Man kan alltid ge Fentanyl 1 ml i varje näsborre. Dete tål alla. Alltså tot 100 mikrog.</p>", "category": "Praktiskt"}, {"title": "NEUROINTENSIVVÅRD NEUROIVA", "html": "<h3>TBI</h3>\n<p><strong>EPIDURALHEMATOM</strong> Blödning mellan dura mater och skallen. Källa oftast från en meningeal artery som skadats av en skallfraktur. Vanligaste källan är a. meningea media. Kan även orsakas av venös blödning oftast från en rupturerad sinus i den posteriora fossan eller en venös kanal i skallbenet. ”Walk and die”. Vanligare hos yngre individer. Hos äldre sitter duran hårdare fast mot skallen. <strong>SUBDURALHEMATOM</strong> Vid TBI: Har högst dödlighet av de intrakraniella lesionerna. Oftast venöst ursprung och då oftast bryggvener. Mellan dura och hjärna. Kan även vara arteriellt. Associerat med kontusioner och DAI. Högre risk för reblödning än epiduralblödning. Orsakar ofta ischemi och metabola störningar i underliggande hjärnvävna. Kan även trycka på vävnaden. Kan likna stroke. <strong>Traumatisk SAH</strong> Oftast lätt att särskilja från spontan aneurysmal SAH utifrån lokalisation. Risk för spasm. Påverkad CSF-flöde och risk för hydrocephalus. tSAH är ofta ett dålig prognostiskt tecken vid TBI. <strong>KONTUSION</strong> Vanligaste fyndet vid TBI. Kan orsakas av stöt, men även av acceleration eller deccelaration. Finns oftast frontalt, temporalt, ofta bilateralt. Ses inte alltid initalt, utan kan bli synliga efter 1-3 dagar. Vissa kontusioner normaliseras, andra expanderar med en ödemring med följande ischemi. <strong>DAI</strong> Orsakas av slitning i hjärnvävnad från rotationsrörelser. Kan orska förlängd medvetlöshet efter TBI trots avsaknad av fokala fynd. MR kan behövas för att upptäcka DAI i hjärnstammen. Mikroblödningarna som kan ses vid CT/MR är inte diagnostiskt för DAI, men kan tala för DAI. Associerat med dålig prognos. <strong>MASSEFFEKT / SKJUVNING AV HJÄRNVÄVNAD</strong> Har följande effekter på hjärnvävnaden: Kompression av vävnad (försämrad cirkulation), drag i axoner (mekanisk skada), herniering ex uncus (mekanisk skada, försämrad cirkulation, specifika symtom),  tryck/knickbildning på kärl. <strong>SVULLNADSGRAD / SVULLNADSGRADERING / HJÄRNSVULLNAD</strong> Marshall classification of traumatic brain injury is a CT scan derived metric using only a few features and has been shown to predict outcome in patients with traumatic brain injury.  The Marshal system places patients into one of six categories (I to VI) of increasing severity on the basis of findings on non-contrast CT scan of the brain. Higher categories have worse prognosis and survival. It is primarily concerned with two features:  degree of swelling, as determined by midline shift and/or compression of basal cisterns presence and size of contusions/hemorrhages referred to \"high or mixed density lesions\".</p>", "category": "Praktiskt"}, {"title": "NEUROOPERATION GENERELLT/ NEUROKIRURGI EJ KLAR", "html": "<p>Vanlig sövningsregim på neurooperation: <strong>Induktion</strong> Ringeracetat som bärare med 40-80 mmol Addex Natrium. Sockerfria infusionslösningar bör användas, då en hyperglykemi kan förvärra en global eller fokal ischemiskada. Remifentanil 0,3 mikrog/kg/min tills effekt upplevs. Noradrenalin gående Propofol Esmeron <strong>Vätskor</strong> Håll hämatokrit mellan 30-35 %. <strong>Uppläggning</strong> - ICP kan påverkas av hur du lägger huvudet då venösa återflödet kan påverkas. - Sidoläge och bukläge: Spiraltub. <strong>Sätta </strong>mayfieldstöd<strong> Gör ont. Höj Remi när kirurgen kommer in till 0,3. Ev bolus 20 mikrog. </strong>Öppna <strong>duran</strong> Om föreligger ogynnsam svullnad kan kirurgen ordinera följande innan duran öppnad: - Höjd huvudände ~30 grader. - Mannitol. - Hyperventilera. - Addex NaCl 80 mmol helst i central ven, annars i större perifer ven tillsammans med annan infusionsvätska (t.ex. 250 ml isoton NaCl + 80mmol addex NaCl) kan gå in på 15-20 minuter. - Pentothal 50 - 100 mg/ dos i upprepade doser. - Byt sevofluran till propofol. - Dränera CSV. Innan duran öppnas: Addex Natrim 40 mmol i 100 ml NaCl . <strong>Övrigt </strong> - Värm endast till 36 grader då de fr.a. vid långa op, ofta stiger mer i temperatur av sig själva. - Finns risk för luftemboli då huvudändan ofta är höjd. Vid plötsliga förändringar i end-tidal CO2 och SaO2 som bägge sjunker kraftigt - misstänk luftemboli <strong>Väckning</strong> - Opiatbehovet är ofta rätt lågt: 2-3 mg. (Större vid ryggkirurgi). - Undvik hosta. Storrökare alternativt lättblödande patienter kan man med fördel ge en i.v inj med xylocain 1mg/kg i samband med väckningen. Ev Ge Catapressan. Stäng av Remifentanil och gas samtidigt. Vänta 10 min innan försök att väcka. Om patienten inte vaknar på ett adekvat sätt skall man alltid kontakta ansvarig kirurg och diskutera fortsatt handläggning som ex CT, EEG etc. kan t.ex. vara blödning eller s.k. tyst epilepsi. - Om lång och komplicerad op med risk för ex hjärnsvullnad. Disk med kir om ev väckning senare på NIVA. <strong>Aneurysm</strong> Adenosin ges vid blödning för att få tid till att suga och åtgärda (ovanligt).</p>\n<h3>TUMÖRER</h3>\n<p><strong>Preop</strong>.<strong> bedömning</strong> <strong>&</strong> medicinering<strong> Alla intrakraniella tumörer har en masseffekt (dels pga själva tumören, dels pga peritumoralt ödem). Därför får i princip alla pat. betametason 8 mg x 2 preoperativt (god effekt på ödemet). Viktigt att de får betametason även på opdagen. Även ev. insatt antiepileptisk medicinering ska tas på opdagen. Symtom & tecken på ICP-ökning: Huvudvärk, papillödem, illamående, kräkning, påverkat medvetande. Följ upp elektrolyter och glukos (kan påverkas av kortisonbehandling). Premedicinering vb: Isf T Catapressant 75-150 mikrog el. benzodiazepin ex T. Oxazepam 5-20 mg. Obs, ej premedicinering om medvetandepåverkad. Alla får alvedon. </strong>Induktion<strong> Tillse fullgod ventilation, ej ökat pCO2 pga risk för ytterligare hjärnsvullnad. Autoregulationen är oftast påverkad. Tillse ett bra MAP. Perfusionstryck på ca 55 mmHg eftersträvas. </strong>Underhåll<strong> Eftersträva lätt hyperventilation med arteriellt pCO2 4-4,5. Remifentanil: 0,1 - 0,3 mikrog/kg/min. Något mer under ryggkirurgi. Sevo: Mac 0,7 - 0,8. Inhalationsmedel kan öka ICP. Isofluran och sevofluran har jmf med halotan relativt små effekter på CBF och CMRO2 och därmed mindre risk för ICP ökning, effekter som dock är dosberoende. Den ICP ökande effekten kan motverkas med hyperventilation och barbiturater. Inhalationsmedel som isofluran och sevofluran påverkar ej hjärncirkulationens svar på istoppen vanligaste aneurysmlokalisationen. - Morfologiskt är de ”säckformiga” aneurysmen belägna vid bifurkationer vanligast. De mindre vanliga ”fusiforma” och ”mykotiska” aneurysmen är orsakade av arteriosklerotisk kärlskada resp inflammation. <strong>SYMTOM / KLINISKA BETÄNKLIGHETER</strong> - Ca I/3 anges ha minskad blodvolym. - Hyponatremi vanligt, tros bero på frisättning av ANP från hypothalamus och förmak. - EKG-förändringar är mkt vanligt: QT-intervall, ST-sträcka, T-våg, olika arytmier anses var neurogen orsak pga kraftig central sympaticusstimulering. T.o.m. Takutsubotillstånd och lungödem kan ses. - Ledande morbiditets- och mortalitetsorsaken efter SAH är cerebral vasospasm. Ca ½ av SAH-pat har angiografiskt påvisbar vasospasm och är vanligen maximalt utvecklad 1v efter blödnignen. <strong>FÖRBEREDELSER</strong> - 2 ekonc. - Blodvärmare klar. - Se till att du ser operationssugarna. - Artärkateter innan sövning (ffa varma aneurysm). Dome i hjärthöjd. - EKG. ST-sänkningar samt troponinstegringar är vanligt. Viktigt utvärdera pats. hjärtfunktion. - Med tanke på risk för andra organeffekter: EKG, BT, vätske-elektrolytstatus, ev. EKO. - Pat. m. profylaktisk Ca2+ -blockare ska fortsätta m. behandlingen vilket kan leda till hypotension perioperativt. Därför halveras Nimodipin i.v. perioperativt. - Mg2+ är en potent cerebral vasodilator. Kontrollera p-Mg2+ och håll i högre referensnivån. - Överväg lugnande medicin till helt vakna pat. som är stressade (ex stesolid 5-10-15 mg p.o. / Oxazepam 10-25 mg p.o. Obs undvik att orsaka en hypoventilerad pat! <strong>INDUKTION</strong> - Minimera transmurala tryckförändringar. - Kan ge Xylocain 1 mg/kg i.v. ca 1 min före intubation för att förhindra hosta. Kan även användas i samband med vändning, eller avslutande av anestesin. <strong>ANESTESI</strong> - Upprepade doser muskelrelax. Monitorera effekten med NMT. <strong>Avstängning</strong> - Tiopental 50-100 mg. Minskar hjärnans metabolism. - FiO2 80%. - Eftersträva pCO2 på 4,0. - Blodgas ska tas om avstängning pågår mer än 20 minuter. Ev., kan syrgasen sänkas. - Var försiktig så att du inte skakar eller rör operationsbordet så att det stör kirurgen. - Ofta ordineras Indocyaningrön (ICG) efter ligering för att se så att aneurysmet är avstängt. Indocyaningrön (Verdye) 25 mg, blandas med 5 ml sterilt vatten, ge 4 ml = 20 mg. <strong>Vid b</strong>lödning ** Adenosin ges vid blödning för att stoppa pulsationerna så att man kan suga rent och åtgärda: Adenosin 0,3 mg /kg. Max 20 mg. Oblandad. Vissa ger 20 mg rakt av.</p>", "category": "Praktiskt"}, {"title": "NEUROOPERATION - HYPOFYSKIRURGI", "html": "<p><strong>ANESTESI</strong> - <strong>Spinaldrän</strong> kan behövas. Se separat anteckning för rutiner. Bör läggas före op och sövning då det kan bli skral likvorretur efter operation. - <strong>Luftväg:</strong> Vanlig tub, ibland i vä mungipa, och ev. inget bitblock eller iaf inte utstickande bitblock. Mayfield. Se ordination från kirurg. <strong>- Blödningsrisk </strong>finns pga kärlrikt område. Tillse grova infarter. Artärnål. - <strong>Korisontillförsel</strong> enl PM se nedan. - <strong>Timdiures</strong>, ev. minirinbehandling. <strong>KORTISONTILLFÖRSEL – PM </strong>Kortisonschema i samband med hypofysoperation <strong>Operationsdygnet: </strong><em>total dos första dygnet 150 mg.</em> - Vid opstart 50 mg Solu-Cortef iv injektion, följt av infusion. - Per-op infusion 50 mg Solu-Cortef i 1000 ml Ringer-Acetat ges under 12 h. - Därpå 50 mg Solu-Cortef i 500 ml NaCl 9 mg/ml ges under 12 h. <strong>Dygn 2:</strong> Om pat. kan tillgodogöra sig per os: T. Hydrokortison 20 mg x 3. Om pat inte kan tillgodogöra sig per os: 50 mg Solu-Cortef i 500 ml NaCl 9 mg/ml ges under 12 h. När infusionen har gått in ge 20 mg T Hydrokortison. Solucortef kan även spädas i andra lösningar än NaCl. <strong>Dygn 3:</strong> Behandlingen dygn 3 varierar. Se PM. <strong>MINIRIN</strong> - Följ timdiures. - Vid behov: Iv. inj. Minirin 0,25 mikrogram ges vid stor diures. Kan upprepas men det räcker oftast med en dos.</p>", "category": "Praktiskt"}, {"title": "NEUROANESTESI - AVM ENDOVASKULÄR BEHANDLING", "html": "<p>- AVM = arteriovenösa missbildningar i hjärnans kärl. Istället för att passera kapillärträdet förflyttas blodet från en eller flera artärer direkt in i vensystemet. Ett AVM består av ett centralt nidus med ett antal tillförande artärer (feeders) och dränerande vener. - Ökad risk för subarachnoidala blödningar (SAH) samt intracerebrala hematom (ICH) och intraventrikulära hematom (IVH). - Kan uppstå var som helst i CNS men oftast supratentoriellt belägna. - Behandlingsalternativ: kirurgisk exstirpation, endovaskulär embolisering, strålknivsbehandling, symtomatisk behandling (IVA-vård, utrymning av blödning, anti-epileptika mm) eller en kombination av ovanstående alternativ. - Vid endovaskulär behandling finns förhöjd risk för de närmaste 24 h efter åtgärd. ??? - Heparin ges ofta under och ofta efter beh. upp till 24 h.??? <strong>BLODTRYCK</strong> - Pre & postop BT-gränser ordineras av ansvarig interventionist. - Efter AVM-behandling är det viktigt att undvika högt blodtryck under den postoperativa fasen p.g.a. blödningsrisk. - Pat. får inte bli hög i tryck vid väckning och får INTE ovan sina BT-gränser. Trandate eller Nepresol. <strong>Vid SAH</strong> - Om pat. haft SAH så gäller samma rutiner som för andra SAH.</p>", "category": "Praktiskt"}, {"title": "NIVA / NIVAPATIENTER BLANDAT", "html": "<p><strong>STRESSAD PATIENT PÅ NIVA</strong> - Stressad pat. som ligger på NIVA. Vissa pat. har sympatisk hyperaktivering (PSH). Vanligt ffa hos unga män. Pat. ter sig mkt stressad. Kan kan sätta in Inderal 20 mg x 2 och sedan höja till 40 mg x 2 även upp till x 3. Om det inte funkar så kan man gå in med Gabapentin. Finns stöd av detta från Cochrane. (Vanligaste orsak till att patienter slutar med Keppra i öppenvården är ångest/oro. Så sätt ut Keppra om det inte behövs). <strong>MONITORERING AV PATIENT PÅ NIVA</strong> - I skallgropen kan förhöjt intrakraniellt tryck föreligga utan att detta forplantas ovanför tentorier. ICP från ex. V-drän kan därför vara normalt. Moitorering av skallgropen blir därmed kliniska tecken ex: - Plötslig hypertoni och takykardi (som svar på ischemi/hypoperfusion/inklämning), hjärnstamsherniering med pupilldilatation, Cushings triad (hypertension, bradykardi, oregelbunden andning).  HYPERVENTILATION HOS VAKEN PATIENT Är det dåligt? - Beror på typ av patient. Värre hos pat. med risk för spasm ex SAH. En TBI kan vara lite mera kall med. Kan även vara sekundär till nya prolem ex.  hydrocefalusutveckling då kan man börja hyperventilera för att minska hjärnans volym. Smärtgräns ligger i alla fall vid 4,0, men eventuellt högre upp, 4,2 har jag för mig Nelson har som smärtgräns. <strong>CEREBRAL TEMP</strong> - Cerebrala tempen brukar vara 0,5 grader högre än kroppstemperaturen.</p>", "category": "Praktiskt"}, {"title": "”PENTOKOMA” / TIOPENTALKOMA  / DJUP BARBITURATSEDERING - NIVA", "html": "<p>- Avser generikan Tiopental. (Från PM KAR2-19837, utgåva 2021-11-16). <strong>Behandling</strong> - Efter beslut om Pentokoma; koppla upp pat. för kontinuerligt EEG omgående. - Inled med upprapade doser Pentotal om 50 - 100 mg under för att utvärdera effekten av ICP. - Upprepa doserna under 10-30 min. Total dos upp till 10 mg/kg. Därefter infusion om 2-3 mg/kg/h, dosökningen sker ofta i intervall om 0,5 mg/kg/h. - För att få ICP att ligga på en nivå under 20 mm Hg krävs ofta behandling till burstsuppression, d v s att EEG visar aktivitet 3- 6 ggr per minut. Om antalet burstar är färre än 3 per minut avbrytes infusionen tillfälligt. Vid överdosering finns risk för isoelektriskt EEG och neuronal celldöd. <strong>Biverkningar</strong> - Hypokalemi pga intracellulärt skifte. Den totala kroppsmängden kalium är därför oförändrad och ska inte behandlas förrän K+ <2,5 mmol/L. Glöm därför inte att ända målvärden till 2,5-3,2mmol/L. Vid justering av s-K till normala serumvärden finns en stor risk för svårbehandlad hyperkalemi vid utsättningen av Pento. -  Lunginfektioner: Pga minksad ciliefunktion. Liberal med diagnostik. Tänk på att LPK-ökning och feber sällan ses. - Lever och njurpåverkan: Ses ofta, är sällan begränsande i behandlingen. - Pats neurologiska tillstånd inte kan följas med GCS vid djup sedering. Det är av stor vikt att följa pupillerna storlek/ljusreaktion då en plötslig pupilldilatation kan vara enda tecknet på nytillkommen expansiv process. - Mage/tarm: Tarmfunktionen ofta nedsatt. - Nutrition: Minskat behov. Minska kalorimålet till att ej överstiga 20 kcal/kg/dygn. Ventrikelretention vanligt. Det funkar ofta bra att halvera enterala nutritionen eller till 20 ml/h vid start av pentokoma och sedan sakta öka igen. <strong>Avslut av </strong>pentokoma** - Om ICP legat stabilt på < 20 mmHg i 24 h kan man börja minska på sederingen. För att behålla ICP-kontroll och undvika hyperkalemi är det viktigt att dosen minskas gradvis med cirka 0,5-1,5 mg/kg/timme varje dygn. Halveringstid ca 8-12 h. Tiopentalbehandlingen bör ej fortgå än absolut nödvändigt. RESCUEicp-studien stärkte bevisläget för att hemikraniektomi ökade överlevnaden och denna behandling övervägs därmed allt oftare och tidigare i ICP-behandlingstrappan. FFA vid fokala problem.</p>", "category": "Praktiskt"}, {"title": "NEUROPROTEKTIV VÅRD CIVA", "html": "<h3>OPTIMAL PERFUSION</h3>\n<p><strong>ICP</strong>: <20 mmHg. (ICP > 20 under >5 minuter är en negativ händelse).</p>\n<p><strong>CPP</strong>: Mål 50 (55) – 70 mmHg. (Risk hypoperfusion om lågt CPP, risk för ödem om för högt CPP). Internationellt nämns ofta CPP 60, men då används kardiell tryckdom. Kvicksilverpelaren mellan hjärta och huvud är cirka 10-13, vilket betyder att när vi har mål 50 så motsvarar det cirka 60 med kardiell dom.</p>\n<p><strong>Höjd huvudända</strong> 30 °C.</p>\n<p><strong>S-Natrium</strong>: >140. Skall vara stabilt. Är en möjlighet att använda för att sänka akut ICP. Man kan ge Addex natrium 40, 80 eller 120 mmol iv centralt eller perifert på ca 10 – 20 min.</p>\n<p><strong>V-drän: </strong>Dränering oftast ej mer än 300 ml/dygn. Tänk på att du tappar mark för en ev. senare tryckstegring. Så gör det inte i onödan och för fort.</p>\n<p><strong>pCO2</strong> 4,5 – 5. Hyperventilation påverkar cirkulationen, hypoventilation ökar ICP. Det händer att vakna patienter hyperventilerar ex vid urträning. Vi vet ej hur detta påverkar pat. men kollegorna på NIVA brukar bli obekväma vid pCO2 under 4,0 i stigande grad vilket man bör åtgärda med ex morfin.</p>\n<h3>SÄNKT METABOLISM</h3>\n<p><strong>Temp</strong> 36-37 grader (tempen påverkar även cirkulationen).</p>\n<p><strong>Sedering</strong>: **Propofol, Midazolam, Morfin. De brukar ofta tåla mkt. OBS. Undvik gas vid sedering och höjt ICP på IVA!</p>\n<h3>SKYDD MOT REBLÖDNING</h3>\n<p><strong>Systoliskt </strong>BT:** < 160 mmHg.</p>\n<p><strong>Lab:</strong> PK, APTT, Fibrinogen, Multiplate om LM som påv. trombocytfunktionen, ev. ROTEM.</p>\n<h3>KRAMPPROFYLAX</h3>\n<p>Om klinisk kram, ladda första dygnet med Keppra 1000 mg x 2, sedan 500 mg x 2. Blanda inte ihop sträckrörelse ex vid hjärnstamskada med kramp.</p>\n<p><strong>NEUROGEN DIABETES INCIPIDUS </strong>(kallas det så?)**</p>\n<p>Tecken: Hög urinproduktion, stigande S-natrium.</p>\n<p>Behandling: Minirin.</p>\n<p>EJ FÄRDIG.</p>\n<h3>ÖVRIG MONITORERING</h3>\n<p>Upptäcka komplikation eller ny händelse: Följ S100 x 3. Vid trauma är det 12h-värdet som är det intressanta. Tidigare än så kan det komma S100 från subcutant fett. Därpå följer man kurvan. Den kan fånga upp komplikationer och spasm.</p>\n<p>Kontinuerlig EEG.</p>", "category": "Praktiskt"}, {"title": "NJURCANCER", "html": "<p>Vid operation av njurcancer och dess metastaser: Dessa tumörer är ofta mkt kärlrika och kan blöda väldigt mkt. Man måste därmed ta höjd för detta med infarter, cell-saver etc.</p>", "category": "Praktiskt"}, {"title": "NJURTRANSPLANTERADE PATIENTER ANESTESI", "html": "<
