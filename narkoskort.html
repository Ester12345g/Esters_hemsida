rkningsmekanism:</h3>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "MANNITOL (OBS GLÖM EJ KAD)", "html": "<p><strong>Indikationer:</strong> Osmotiskt diuretikum för följande situationer: Sänkning av intrakraniellt tryck och cerebralt ödem (vid intakt BBB), sänkning av ökat intraockulärt tryck.</p>\n<p><strong>Kontraindikationer:</strong> Överkänslighet, svår hjärtsvikt, aktiv intrakraniell blödning (förutom under kraniotomi), hyperosmolärt syndrom, allvarlig uttorkning, postrenal obstruktion. Ge aldrig utan att pat har KAD!</p>\n<h3>Biverkan:</h3>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong></p>\n<p><strong>Dosering:</strong> <strong>Minska intrakraniellt tryck, hjärnvolym, intraockulärt tryck:</strong> <strong>FASS: </strong>Vanligaste dosen: 75 g mannitol eller 1g/kg kv som infunderas under 30-60 min. I svåra fall kan doseringen ökas till 2 g/kg kroppsvikt (13 ml/kg) vilket infunderas under 60 minuter. Vid preoperativ användning bör dosen ges 1-1,5 timmar före operation för att uppnå maximal effekt. I nödfall kan den maximala infusionshastigheten vara så hög som 200 mg/kg under 5 minuter.</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Blandbarhet:</strong> **Ges i central eller stor ven.</p>\n<h3>Verkningsmekanism:</h3>\n<p><strong>Metabolism: </strong>Elimineras till stor del ometaboliserat genom glomeruli. Halveringstiden är hos vuxna ca 2 h, längre vid njursvikt. 80% av i.v.-dosen utsöndras oförändrad inom 3 h.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<p><strong>Övrigt:</strong> Ska inte administreras samtidigt, före eller efter administreringen av blod genom samma infusionsutrustning på grund av risken för pseudoagglutination. Tillsätt inte andra elektrolyter, pga risk för utfällning av mannitol.</p>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "METYLENBLÅTT", "html": "<p><strong><em>Uppdaterad 2025-04-08</strong></em> <strong>Indikationer:</strong> - Septisk chock med refraktär vasoplegi. Rekommendation enligt vårat PM: Metylenblått kan övervägas vid septisk chock med vasoplegi som är refraktär för höga doser av noradrenalin kombinerat med vasopressin och kortikosteroider. Det ska vara klarlagt att låg systemvaskulär resistens föreligger och att hypotensionen inte beror på t.ex. pumpsvikt eller hypovolemi. Hemodynamisk monitorering med PiCCO eller PA-kateter rekommenderas. - Vasodilatorisk chock vid metformin­associerad laktacidos Se: <a href=\"https://lakartidningen.se/klinik-och-vetenskap-1/artiklar-1/fallbeskrivning/2013/10/metylenblatt-havde-metforminassocierad-laktacidos/\" target=\"_blank\">https://lakartidningen.se/klinik-och-vetenskap-1/artiklar-1/fallbeskrivning/2013/10/metylenblatt-havde-metforminassocierad-laktacidos/</a> - Antidot vid methemoglobinemi.</p>\n<p><strong>Kontraindikationer:</strong> Graviditet pga. risk fostermissbildning. Samtidig SSRI-behandling, man kan få serotonergt syndrom.</p>\n<p><strong>Biverkan:</strong> · Ökad lungkärlsresistens (framför allt vid höga doser, hämmar ju NO) · Tarmischemi (vid höga doser) · Methemoglobinemi (paradoxal effekt vid höga doser) · Serotonergt syndrom (metylenblått hämmar monoaminoxidas (MAO), pågående beh. med annan MAO-hämmare, t.ex. linezolid, eller SSRI-/SNRI-preparat, utgör relativ kontraindikation. · Hemolytisk anemi (vid glukos-6-fosfatdehydrogenasbrist [G6PD]) · Felaktiga SpO2-värden (kontrollera SaO2 på artärblodgas) · Blå(grön) missfärgning av hud/urin/avföring · Tromboflebit (vid perifervenös administrering) · Hudnekros/-blåmissfärgning vid extravasering · Ospecifika symptom: yrsel, huvudvärk, konfusion, bröstsmärta, dyspné, illamående/kräkningar · Anafylaxi</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> Ges outspätt. Får ej blandas eller gå i samma skänkel som NaCl. Bör ges i CVK pga risk för blåmissfärgning och nekros vid extravasering.</p>\n<p><strong>Dosering:</strong> ** Vid sepsis: Bolusdos: 1–2 mg/kg iv ges under 10–60 min (avstås i utvalda fall). Om önskad effekt uppnås, kan bolusdosen åtföljas av kontinuerlig infusion: 0,1–0,5 mg/kg/h iv. Effektduration vanligen 2–6 h, behandlingslängd oftast <12(–24) h. Maximal dygnsdos: 7 mg/kg (lägre vid svår lever-/njursvikt).</p>\n<p><strong>Tillslagshastighet: </strong>Vid bolusdos<strong> </strong>5–20 min</p>\n<p><strong>Duration:</strong> 2-6 h vanligen.</p>\n<p><strong>Blandbarhet:</strong> **Blandas ej med NaCl, lösligheten av läkemedlet minskar.</p>\n<p><strong>Verkningsmekanism:</strong> Vasodilationen vid septisk chock orsakas till stor del av ökad produktion av cykliskt guanosinmonofosfat (cGMP). Sker genom aktivering av det intracellulära enzymet lösligt guanylatcyklas (sGC) medierat av kväveoxid (NO). Metylenblått kliniskt använt bl.a. som antidot vid methemoglobinemi, kan öka kärltonus och MAP genom hämning av inducerbart NO-syntas och sGC i kärlväggens glatta muskulatur.  Är också en potent hämmare av monoamonooxidas-A (MAO-A) och risk finns att utlösa ett serotonergt syndrom vid samtidig medicinering med SSRI.</p>\n<p><strong>Metabolism: </strong>Elimineras via njurar och galla. Halveringstid 5-7 h.</p>\n<h3>Interaktioner:</h3>\n<p><strong>Graviditet/amning:</strong> Risk för fostermissbildning.</p>\n<p><strong>Källa:</strong> PM KS, Metylenblått vid septisk chock med refraktär vasopleg, PMI01718-1</p>", "category": "Läkemedel"}, {"title": "MIDAZOLAM", "html": "<h3>Indikationer:</h3>\n<h3>Kontraindikationer:</h3>\n<h3>Biverkan:</h3>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> Koncentration 1 mg/ml. På op dras det upp i en 5 ml-spruta.</p>\n<p><strong>Dosering:</strong> På op: 1-3 mg iv. Max 5 mg. <strong>MIDAZOLAMINFUSION PÅ IVA</strong> Kollega: Om man inte behövt ge en bolus på 4 timmar, så kan man många gånger prova att reducera infusionen med 25%, och om det sedan går ytterligare 4 timmar så kan man överväga att reducera dosen ytterligare osv, men däremot om man behöver ge enstaka bolusdoser så kanske man ligger rätt i infusionen, och om man ofta behöver ge bolusdoser så kan man överväga att öka infusionen i proportion till bolusdosbehovet. Tiden 4 timmar är nog rimlig.</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet:</h3>\n<h3>Duration:</h3>\n<h3>Blandbarhet:</h3>\n<h3>Verkningsmekanism:</h3>\n<p><strong>Metabolism: </strong>Har en kraftfull och snabb eliminering i levern. Så elimineringen är mkt känslig för leverns funktion samt även blodcirkulationen i levern, och kan påverkas av cardiac output.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "MINIRIN", "html": "<p><strong>Indikationer:</strong> Central diabetes incipidus.</p>\n<p><strong>Kontraindikationer:</strong> Olika tillstånd där man behöver bli av med vätska: Habituell eller psykogent betingad polydipsi (dygns­urinvolym över 40 ml/kg), hjärtsvikt, måttlig till svår njurinsufficiens. Syndrom med störd ADH-sekretion (SIADH), känd hyponatremi. Överkänslighet mot den aktiva substansen eller mot något hjälpämne (innehåller fiskgelatin).</p>\n<p><strong>Biverkan:</strong> Hyponatremi och symtom relaterade till detta.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> Injektionsvätska alternativt frystorkad tablett. Tabletten placeras under tungan där den löses upp utan vatten.</p>\n<p><strong>Dosering:</strong> Hypofyskirurgi: Iv. inj. Minirin 0,25 mikrogram ger man vid stor diures. Kan upprepas men det räcker oftast med en dos. Polyuri på NIVA: Brukar ge kring 0,1 - 0,25 mikrog i.v. Organdonation/hjärndöd: Vid polyuri ge Minirin i.v. 0,5 - 1 mikrog. Ang. tabletter: Rätt så varierande individuell biotillgänglighet. Samtidigt födointag kan påverka absorptionen. Finns därför munsönderfallande tablett. Plasmakonc ökar proportionellt mot given dos. Obs doser munsönderfallande och icke munsönderfallande tablett skiljer sig. Munsönderfallande tablett á 60 mg: Ge ½ (30 mikrog) till 1 tablett (60 mikrog). Normalt sett brukar pat. ta en totaldos på 90-120 mikrog uppdelat 3 ggr/d.</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet: </h3>\n<p><strong>Duration:</strong> T1/2 = 3 h.</p>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Passerar ej BBB.</p>\n<p><strong>Metabolism: </strong>Ca 50% eliminieras oförändrat i urinen.</p>\n<h3>Interaktioner:</h3>\n<p><strong>Graviditet/amning:</strong> Gravid: B1, försiktighet. Sparsamt med data men ej uppenbart farligt. Amning Grupp II, små mängder passerar modersmjölk och kan sannolikt inte påverka barnet.</p>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "METOLAZON", "html": "<p><strong>Indikationer:</strong> Diuretika.</p>\n<h3>Kontraindikationer:</h3>\n<p><strong>Biverkan:</strong> Hyponatremi eller hypokloremi kan inträffa. Kan öka s-urat.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong></p>\n<p><strong>Dosering:</strong> Thorax: Om ej tillräcklig diures med Furix så lägger man till Metolazon 5 mg x 3. FASS: Som riktlinje 2,5 – 10 mg / dag.</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<p><strong>Tillslagshastighet: </strong>Diuresen startar inom den första timmen efter administrering och fortsätter beroende på dos under 12-24 timmar. Maximal effekt uppnås efter cirka 2 timmar.</p>\n<p><strong>Duration:</strong> Halveringstid 8-10 timmar men längre vid sänkt GFR.</p>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Metolazon hindrar reabsorption av natrium i uppåtstigande förgreningen av Henles slynga och i proximala tubuli vilket leder till utsöndring av ungefärligt ekvivalenta mängder av natrium och klorid. Har ungefär samma egenskaper som Tiaziddiuretikum.</p>\n<p><strong>Metabolism: </strong>Metaboliseras så gott som inte alls. De bildade metaboliterna är icke-toxiska. Utsöndras ffa via njurarna.</p>\n<h3>Interaktioner:</h3>\n<p><strong>Graviditet/amning:</strong> Passerar placentabarriären och passerar även över i bröstmjölken.</p>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "MORFIN", "html": "<h3>Indikationer:</h3>\n<h3>Kontraindikationer:</h3>\n<p><strong>Biverkan:</strong> Adningsdepr., illamå./kräk, klåda, urinretention, nedsatt tarmmotilitet, hallucinationer. Samtliga biverkningar förutom obstipation kan behandlas med naloxon.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong></p>\n<p><strong>Dosering:</strong> <strong>MORFININFUSION PÅ IVA</strong> Kollega: om man inte behövt ge en bolus på 4 timmar, så kan man många gånger prova att reducera infusionen med 25%, och om det sedan går ytterligare 4 timmar så kan man överväga att reducera dosen ytterligare osv, men däremot om man behöver ge enstaka bolusdoser så kanske man ligger rätt i infusionen, och om man ofta behöver ge bolusdoser så kan man överväga att öka infusionen i proportion till bolusdosbehovet. Tiden 4 timmar är nog rimlig. <strong>MORFINPCA / PCA / PCA-pump</strong> Överläkarkollega på ÖAK brukar köra på: Bolus 1-2 mg med 10 min spärrtid. Alltså rätt små doser och intervall ungefär som när man står bedside och sprutar. Men man kan även fråga pat om de villa ha större doser med större spärrtid.</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet:</h3>\n<h3>Duration:</h3>\n<h3>Blandbarhet:</h3>\n<h3>Verkningsmekanism:</h3>\n<p><strong>Metabolism: </strong>Förlängd effekt vid sänkt njurfunktion.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "NEOSTIGMIN", "html": "<p><strong>Indikationer: </strong>Laxantia vid tarmatoni.</p>\n<p><strong>Kontraindikationer:</strong> Mekaniskt hinder eller ischemi, graviditet, okontrollerade arytmier, allvarlig bronkospasm, njursvikt.</p>\n<h3>Biverkan:</h3>\n<h3>Förpackning:</h3>\n<h3>Tillredning:</h3>\n<p><strong>Dosering:</strong> Mycket varierande doser av neostigmin har använts i litteraturen. <strong>I Jämtland har man använt</strong> Neostigmin-infusion i upptrappande doser se nedan: <strong>Spädning:</strong> Neostigmin 2,5 mg (1 ml) i 100 ml NaCl. Ger styrka 25 μg/ml. <strong>Dosering:</strong> Starta med 4 ml/t och trappa upp med 2 ml varje timme till effekt. Avsluta infusionen när magen är igång eller påsen är slut. Om ingen effekt när infusionen är slut överväg om diagnosen är rätt. Om rätt diagnos ta ställning till om patienten tål bolus neostigmin 2 mg. Dekomprimering koloskopiskt kan övervägas.</p>\n<h3>Förenklad dosering:</h3>\n<h3>Max infusionshastighet:</h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<h3>Blandbarhet:</h3>\n<h3>Verkningsmekanism:</h3>\n<h3>Metabolism: </h3>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> ANELÄK Neostigmin vid tarmatoni, Region Jämtland Härjedalen, 2015.</p>", "category": "Läkemedel"}, {"title": "NEPRESOL  (DIHYDRALAZIN)", "html": "<p><strong>Indikationer:</strong> Hypertoni. Ex. eklampsi, preeklampsi, autonom dysreflexi. Hypertension i samband med intrakraniell tryckstegring där venösa vasodilaterare är kontraindicerade och där Trandate ej ger tillräcklig effekt.</p>\n<p><strong>Kontraindikationer:</strong> Hypotension. Lupus erytematodus.</p>\n<p><strong>Biverkan:</strong> Takykardi, huvudvärk, illamående pga vasodilatation. Fler biv. Vid långtidsbehandling (>6 mån).</p>\n<p><strong>Förpackning:</strong> Kombinationsförpackning med 25 mg torrsubstans + 2 ml sterilt vatten  styrka av 12,5 mg/ml.</p>\n<p><strong>Tillredning:</strong> OBS! Finns olika förpackningar. Blandas med tillhörande lösningsmedel  12,5 mg/ml (25 mg/2ml). Används inom 12 h.</p>\n<p><strong>Dosering:</strong> OBS exempel. Thorax & NIVA: Långsam injektion, normaldos 3,12 mg (0,25 ml) till 6,25 mg (0,5 ml) i.v. Övrig källa: Upprepa inte för tidigt. Det tar 20 min innan full effekt. Börja med 3,12 mg. <strong>VG-region</strong>/SÄS<strong>: </strong> - För kontinuerlig injektion med hjälp av en sprutpump ska 4 ampuller (= 100mg/8ml) spädas med 42 ml NaCl 0,9 %.  Denna lösning kan ges med 0,25-2 ml/h. Startas med fördel efter en bolus. - Bolusdoser: 6,25 mg –12,5,0 mg iv (eller 12,5 mg-25 mg im). an upprepas efter c:a 20 min. Ska sprutas långsamt iv (c:a 2min). Maxdos/dygn 100mg (gäller bolus och kont)</p>\n<h3>Förenklad dosering:</h3>\n<p><strong>Tillslagshastighet: </strong>Maximal effekt efter 30 min.</p>\n<p><strong>Duration:</strong> T1/2 4-5 h. Försiktig vid grav lever-eller njursvikt.</p>\n<p><strong>Verkningsmekanism:</strong> Perifer kärlvidgare via påv. av glatt muskuatur. Blodtryckssänkande.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<p><strong>Övrigt:</strong> OBS! Glukoslösningar inaktiverar Nepresol. Vissa menar att man först ska börja med trandate så att man inte får ”reflektorisk taky”. Men resonemanget låter lite märkligt.</p>\n<p><strong>Källa:</strong> PM Thorax, VG Region. Godkänd av Helena Rexius.</p>", "category": "Läkemedel"}, {"title": "NIMOTOP (NIMODIPIN)", "html": "<p><strong>Indikationer:</strong> Kalciumantagonist som används som profylax emot och behandling av ischemiska symtom vid cerebral vasospasm efter subarachnoidalblödning.</p>\n<h3>Kontraindikationer:</h3>\n<p><strong>Biverkan:</strong> Störd hypoxisk vasokonstriktion / Kollega.</p>\n<p><strong>Förpackning:</strong> Infusionsvätska: 0,2 mg/ml, 50 ml. Tablett 30 mg.</p>\n<p><strong>Tillredning:</strong> Innehåller etanol vilket är kärlretande och bör ges i CVK. Infusion kan startas i PVK om det går parallellt med Ringeracetat, glukos 50 mg/ml eller NaCl 9 mg/ml.</p>\n<p><strong>Dosering:</strong> <strong>NIVA vid subarach</strong> <strong>(PM Kar2-17738; 2021) - Sätts in inom första 72 h, men så tidigt som möjligt. - Primärt som tablett om inte stora retentioner eller kräkningar förekommer. - Iv. infusion behöver ej startas nattetid, beslut tages på morgonen (orsakar behov av NA och CVK i ett resurssnålt läge, stor kostnad och ej påvisad förbättrad effekt). - Maxdos iv 30 mikrog/kg/h - motsvarar 2 mg/h = 10 ml /h hos 70 kg. Kan behöva dosjusteras beroende på kroppsvikt. </strong>Vid blodtrycksfall: <strong>- Volymsoptimering. - Dobutrex 80-90 slag/min, ev. robinul/atropin. - Acceptera noradrenalin till 0,1 mikrog/kg/min innan sänkning av Nimotop: Vid tablett övergång från 60 mg x 6 till 30 mg x 12, därefter 30 mg x 6. Vid kvarstående bieffekt diskuteras ev. utsättning, Vid iv Nimotop successivt minska dosen med 0,5 mg/g till högsta tolererade dos. </strong>Desaturation av Nimotop: <strong>- Inte helt ovanligt pga stört hypoxisk vasokonstriktion. - Justera FiO2 till max 50% och om otillräckligt så får man sänka Nimotopdosen som enligt BT-fall ovan. Infusion startas i sprutpump med 5 ml/h i 2 h. Om BT medger så ökas dosen till 10 ml/h efter 2 h. Pat. med instabilt BT kan behöva en lägre dos. Total behandlingstid med Nimotop är 3 veckor om inte annat ordineras. Vid övergång från infusion till tablett Nimotop, ska 3 doser tabletter intagits innan infusionen stängs av. </strong>Nedtrappningsschema av tablett Nimotop:** Normaldosering är 60 mg x 6 (2 tabl. á 30 mg x 6). I slutet av vecka 3 efter insättandet av Nimotop trappas medicineringen ut enligt följande: Dag 1: 60 mg x 3. Dag 2: 30 mg x 3. Dag 3: 30 mg x 1. Dag 4: Helt utsatt. Om pat. haft spasm så behandlar man 3 veckor framåt från senaste spasmen.</p>\n<h3>Max infusionshastighet:</h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Blandbarhet:</strong> Nimotop kan inte infunderas tillsammans med andra läkemedel eller TPN.</p>\n<h3>Verkningsmekanism:</h3>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<p><strong>Övrigt:</strong> Nimotop är ljuskänsligt och uppdragen spruta bör bytas efter 10 h. Endast PVC-fria aggregat får användas (funkar bra med våra sprutförlängningsslangar) och aggregatet ska bytas 1 gång/dygn.</p>\n<p><strong>Källa:</strong> PM från KS: <em>Nimotop (nimodipin) 0,2 mg/ml 50 ml)</em><em>, </em>Utgåva 2017-04-28.</p>", "category": "Läkemedel"}, {"title": "NITROPRESS (NATRIUMNITROPRUSSID)", "html": "<p><strong>Indikationer:</strong> Aortadissektion. Svår vänsterkammarsvikt. Terapiresistent hypertension/hypertensiv kris. (Hypertension hos thoraxkirurgisk pat, där man ofta undviker betablock pga risk för AV-block).</p>\n<p><strong>Kontraindikationer:</strong> Aortatenos (relativ). Försiktighet vi leverinsuf, njurinsuf. Risk för cyanidförgiftning vid mkt höga doser och ffa vid leverinsuf. Följ laktat. Kan motverkas med Natriumtiosulfat.</p>\n<p><strong>Biverkan:</strong> Sänkt pO2 pga Shunt i lungan, pga dilatation av mindre ventilerade delar av lungan (påverkar med andra ord hypoxisk vasokonstriktion). Bradykardi, takykardi, EKG-förändringar, hudutslag, hypothyreos, ileus, minskad trombocytaggregation, ökat intrakraniellt tryck, flush, irritation vid insticksstället, ökad venfyllnad.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> OBS använd ljusskyddad spruta och infusionsaggregat. <strong>Blandning enl. </strong>PMI<strong> allmän</strong>:<strong> 2 ml = 50 mg Nitropress tillsätts i 48 ml Glucos 5 %  1 mg/ml. OBS! Blandningen är ljuskänslig. Klä sprutan i medföljande påse och använd infusionsaggregat för ljuskänsliga läkemedel. </strong>Blandning enl. PMI Thorax: <strong>Nitropress 50 mg  2 ml + Natriumtiosulfat 150 mg/ml 2 ml + Natriumklorid 9 mg/ml 46 ml.  1 mg/ml (+ 150 mg Natriumtiosulfat per 25 mg Nitropress). </strong>Blandning enligt NIVA: **Nitropress 25mg/ml, 1 ml + glukos 5%, 47 ml + Tiosulfat 150 mg/ml, 2 ml.  0,5 mg/ml (+ 300 mg Natriumtiosulfat per 25 mg Nitropress).</p>\n<p><strong>Dosering:</strong> Starta med 0,5 mikrog/kg/min och öka med 0,5-1,0 mikrog/kg/min var 4-5 min tills önskad effekt är nådd eller det systoliska blodtrycket sjunkit till som lägst 90-95 mmHg systoliskt eller MAP 65 mmHg, kontrollera att urinproduktionen inte påverkas negativt. Maximal infusionshastighet: 5 (-10 = väldigt högt) mikrog/kg/min. Tillsätt Thiosulfat 500 mg var 50 mg Nitropress. PMI THORAX: 0,1 – 10 mikrog/kg/min. Kolla deras PM.</p>\n<h3>Max infusionshastighet:</h3>\n<p><strong>Tillslagshastighet: </strong>Mkt snabb effekt,<strong> </strong>1-2 min och klingar av efter ungefär samma tid vid utsättning.</p>\n<p><strong>Duration:</strong> Effekter försvinner efter 1 min.</p>\n<p><strong>Blandbarhet:</strong> **Inga andra LM får blandas i samma lösning.</p>\n<p><strong>Verkningsmekanism:</strong> Kärldilaterare vid NO med relaxation av glatt kärlmuskulatur med effekt både på artär- och vensidan, men med huvudsaklig verkan på vener (dock mindre uttalat än Nitroglycerin). Enligt Franscesca är det ffa dilatation på artärsidan om man jämför med Nitro ??? Resultatet blir ”venpooling” och därmed sänkta fyllnadstryck samt afterload-reduktion pga den sänkta systemvaskulära resistensen.</p>\n<h3>Metabolism: </h3>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<p><strong>Övrigt:</strong> Nitropress fastnar i plasten på PA-introducern. Använd ej för infusion! Kan leda till BT-fall senare.</p>\n<p><strong>Källa:</strong> Alfresco, Natriumnitroprussid (Nitropress) 2018, Niklas Bergh.</p>", "category": "Läkemedel"}, {"title": "NITROGLYCERIN", "html": "<p><strong>FÖR UTERUSRESLAXATION</strong> (PM KS)</p>\n<p><strong>Indikationer:</strong> Svårighet att extrahera fostret ex utro.</p>\n<p><strong>Kontraindikation:</strong> Hypovolemi hos modern är relativ kontra.</p>\n<p>Iv behandling:</p>\n<p>1 ml Nitroglycerin spädes  med 9ml NaCl till 0,1 mg/ml i 10 ml spruta.</p>\n<p>Dosering: 0,1 - 0,2 mg (1-2 ml spädd lösning).</p>\n<p>(Terapeutiskt dosintervall: 0,25-5 mikrogram/kg/min.)</p>\n<p>Sublingual behandling:</p>\n<p>Glytrin Sublingualspräy 0,4 mg/dos 1-2 doser.</p>\n<p>T1/2 Nitro = 4-5 min.</p>\n<p><strong>FÖR PERIOPERAITV BLODTRYCKSSÄNKNING</strong> **(Källa: Massachusets 9th ed.)</p>\n<p>Intravenös infusion: Börja med 30 – 50 mikrog/minut och titrera till önskad effekt.</p>\n<h3>PERIOP NITROGLYCERINBEHANDLING (Rek från Thorax)</h3>\n<p><strong>Indikationer: </strong>Hypertension, ökat PAP, akut ischemi (ST-förändringar >1 mm), nytillkommen V-våg (ischemisk MI mitralisinsuf?), ny RWMA, systolisk dysfunktion, koronarspasm.</p>\n<p><strong>Behandling: </strong>Bolus 25-50 mikrog, infusion 10-500 mikrog/min.</p>\n<p><strong>NITROGLYCERIN HOS VAKEN PATIENT</strong> (Källa: PM Alfresco VG-region, v5, 2016).</p>\n<p><strong>Indikationer:</strong> Bröstsmärta, mycardischemi, hjärtsvikt, akut högt blodtryck. Thorax KS: Post-hjärtkir: Tecken på ischemi med eller utan hypertension, eller vid höga fyllnadstryck</p>\n<p><strong>Kontraindikationer:</strong> Samtidig behandling med Viagra, Cialis, Levitra. Försiktighet vid: hypotension, cerebrovaskulär sjukdom, förhöjt ICP, aortastenos, mitralisstenos, hypertrof obstruktiv kardiomyopati, anemi, hypoxi, hypothyreos.</p>\n<p><strong>Biverkan:</strong> Sänkt pO2 pga ökad shunt i lungorna.</p>\n<h3>Förpackning:</h3>\n<h3>Tillredning:</h3>\n<p><strong>Dosering:</strong> <strong>Nitroinfusion enlig Thorax PM: </strong>0,1 – 10 mikrog/kg/min. <strong>ALTERNATIV 1 (svagare lösning):</strong> <strong>ALTERNATIV 2 (starkare lösning):</strong>  Infusion, outspädd i sprutpump med slang av nitroresistent plastmaterial. Nitroven/Nitroglycerin 1 mg/ml. Starta med 0,25 mikrog/kg/min. Öka med 0,25 mikrog/kg/min efter 15 min till önskad effekt (eller till systoliskt blodtryck sjunkit till 90 mmHg). Infusionsdoser över 2,5 mikrog/kg/min krävs sällan vid angina eller hjärtsvikt.</p>\n<h3>Förenklad dosering:</h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<p><strong>Verkningsmekanism:</strong> Thorax KS: Venös dilatation, sänker BT genom minskad preload. Ökar blodflöde i kranskärl. Risk för methhemoglobinemi vid höga doser dvs >10 mikrog/kg/min i flera dagar.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "NOVOSEVEN", "html": "<p>Novoseven kostar 100 000 kr? Stämmer det? Eller 50 000? Novoseven ges vid koagulopati. Det har ingen nytta vid kirurgisk blödning. Då finns det risk för proppar istället. Är mycket potent och aktiverar en koagulationskaskaden. Men det krävs fibrinogen och koagulationsfaktorer för att det ska funka så man måste ha fyllt på med detta först!</p>", "category": "Läkemedel"}, {"title": "OCTOSTIM (Desmopressin) # Ej klar", "html": "<p><strong>INDIKATIONER:</strong>  Förkortning eller normalisering av en förlängd blödningstid vid uremi, levercirros, medfödd eller läkemedelsinducerad trombocytdysfunktion samt hos patienter med förlängd blödningstid utan påvisbar etiologi, inför ett invasivt terapeutiskt eller diagnostiskt ingrepp där den förlängda blödnings­tiden kan leda till blödningskomplikation. Terapeutiskt för kontroll av blödning hos patienter med uremi. Blödningsprofylax i samband med mindre kirurgiska ingrepp hos patienter med mild hemofili A och mild von Willebrands sjukdom dock ej typ 2B. I undantagsfall vid medelsvåra former av respektive sjukdom.</p>\n<h3>KONTRAINDIKATIONER:</h3>\n<p><strong>BIVERKAN:</strong> Vätskeretention och/eller hyponatremi. (OBS motsvarar en hästdos Minirin! Mellan 20 – 5 gånger högre dos).</p>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong>  Lösning 15 mikrog/ml.</p>\n<p><strong>DOSERING:</strong> 0,3 μg/kg utspätt i fysiologisk koksaltlösning till 10 ml som intravenös injektion under 10 minuter eller 0,3 μg/kg som subkutan injektion. Om positiv effekt erhållits kan den initiala dosen Octostim upprepas 1-2 gånger med 6-12 timmars mellanrum. Ytterligare upprepning av dosen kan vara förenlig med sämre effekt.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<p><strong>VERKNINGSMEKANISM:</strong> Faktor VIII-frisättare och vWF-frisättare</p>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "OPIOIDER GENERELLT", "html": "<p><strong>Smärläkarna KS: </strong>Man har generellt gått ifrån att ha en redig bas av opioider och lutar sig mer mot att använda vid-behovsmedicinering. Detta då det är onödigt att ha opioider i blodet när man inte behöver det och tillvänjningen ökar. Ibland har man inte så ont ex när man ligger still i sängen. Så fundera på NÄR pat. har ont.</p>", "category": "Läkemedel"}, {"title": "OXYNORM", "html": "<h3>INDIKATIONER:</h3>\n<h3>KONTRAINDIKATIONER:</h3>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong>  Det finns även oral lösning som kan ges om ex mkt snabba passagetider och tabletter åker intakta ut i stomin.</p>\n<h3>DOSERING:</h3>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<p><strong>TILLSLAGSHASTIGHET:</strong> Peroral tablett: Tillsalgstid ca 30 min. Duration ca 3-5 h.</p>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "OPIOIDOMRÄKNING / MORFINEKVIVALENTER / MORFINOMRÄKNING", "html": "<p><strong>OPIATOMRÄKNING</strong> #konverteringsguide #morfinekvivalenter**</p>\n<p>Peroral morfin motsvarar ca 1/2 till 1/3 av iv-dosen.</p>\n<p>För vb. smärtlindring så brukar man ge ca 1/6 av ordinarie dygnsdos.</p>\n<p>Om pat. med långvarig smärta istället får en epiduralbedövning så bör du reducera ordinarie dos med 30-50% för att undrvika att det plötsligt blir en överdosering när det nociceptiva inflödet minskar.</p>\n<p>Hos opioidnaiv pat: (Ej samma vid långvarigt bruk!)</p>\n<p>10 mg morfin motsvarar ca 5-7,5 mg p.o oxikodon men vid iv-admin är relationen 1:1.</p>\n<p>10 mg morfin motsvarar ca 2 mg hydromorfon.</p>\n<p>10 mg morfin motsvarar ca 5-7,5 mg Ketogan.</p>\n<p>10 po metadon motsvarar ofta 30-100 mg po. morfin.</p>\n<p>Okänd källa: 100 mikrog fentanyl motsvarar ca 10 mg morfin.</p>\n<p>Nedan ovandling, källa internetmedicin: Konverteringsguide opioider.</p>\n<p>Källa: PM KS.</p>\n<table class=\"card-table\">\n<tr><th><strong>Morfin/ ketogan </strong></th><th><strong>Morfi/Ketogan </strong></th><th><strong>Oxikodon</strong></th><th><strong>Fentanyl </strong></th></tr>\n<tr><td>p.o. mg /dygn</td><td>i.v/s.c / dygn</td><td>p.o. mg/dygn</td><td>derm mikrog/h</td></tr>\n<tr><td>20</td><td>7-10</td><td>10</td><td>12</td></tr>\n<tr><td>40</td><td>15-20</td><td>20</td><td>12</td></tr>\n<tr><td>60</td><td>20-30</td><td>30</td><td>25</td></tr>\n<tr><td>80</td><td>30-40</td><td>40</td><td>25</td></tr>\n<tr><td>100</td><td>35-50</td><td>50</td><td>37</td></tr>\n<tr><td>120</td><td>45-60</td><td>60</td><td>50</td></tr>\n<tr><td>160</td><td>60-80</td><td>80</td><td>50</td></tr>\n<tr><td>220</td><td>80-110</td><td>110</td><td>75</td></tr>\n<tr><td>320</td><td>120-160</td><td>160</td><td>100</td></tr>\n<tr><td>400</td><td>150-200</td><td>200</td><td>125</td></tr>\n<tr><td>500</td><td>185-250</td><td>250</td><td>150</td></tr>\n<tr><td>580</td><td>215-290</td><td>290</td><td>175</td></tr>\n<tr><td>680</td><td>255-340</td><td>340</td><td>200</td></tr>\n</table>\n<h3>SE NÄSTA SIDA</h3>", "category": "Läkemedel"}, {"title": "PETIDIN® EJ FÄRDIG", "html": "<p><strong>INDIKATIONER:</strong>  Används mot postop shivering. <strong>KONTRAINDIKATIONER:</strong> Aktuell behandling med MAO-hämmare eller använt MAO-hämmare inom 2 veckors tid. Försiktighet vid epilepsi och vid supraventrikulär arytmi. I övrigt biverkningar såsom vid andra opioider. Ska ej användas tillsammans med andra serotonerga läkemedel (SNRI, SSRI) pga risk för serotonergt syndrom. Använd ej tillsammans med MAO-hämmare, Karbamazepin, Fenytoin, Ritonavir, Cimetidin. <strong>BIVERKAN:</strong> Ca 20 % av patienterna drabbas av illamående och kräkningar. De flesta biverkningarna är dosberoende. <strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong> Lösning 50 mg/ml. <strong>DOSERING:</strong> Thorax brukar ge 10-15 mg iv. FASS: 1-2 ml (50-100 mg) i.m. Ej s.c. pga risk för irritation. Vid svårare akuta tillstånd 50 till 100 mg i.v. som ges spätt med NaCl till 10 ml, ges under 2 min. Reducerad dos hos äldre, och nedsatt lever- och njurfunktion. <strong>FÖRENKLAD DOSERING:</strong> <strong>MAX INFUSIONSHASTIGHET:</strong> <strong>TILLSLAGSHASTIGHET:</strong> <strong>DURATION:</strong> <strong>BLANDBARHET:</strong> <strong>VERKNINGSMEKANISM:</strong> <strong>METABOLISM:</strong> <strong>INTERAKTIONER:</strong> <strong>GRAVIDITET:</strong> Risk för andningsdepression hos barnet vid användning i anslutning till förlossning/snitt. <strong>AMNING:</strong> Petidin passerar över i modersmjölk men risk för påverkan på barnet synes osannolik med terapeutiska doser vid enstaka administrering. Men risk för CNS-påverkan hos barnet vid upprepad dosering. <strong>KAN GES PERFIERT</strong> JA/NEJ<strong>: </strong> <strong>ÖVRIGT:</strong> <strong>DIALYSERAS BORT </strong>JA/NEJ<strong>: </strong> <strong>KÄLLA:</strong> **FASS.</p>", "category": "Läkemedel"}, {"title": "POSTAFEN (MEKLOZIN)", "html": "<p><strong>INDIKATIONER:</strong> Mot illamående ex vid kirurgi i bakre skallgropen och ponsvinkel.</p>\n<h3>KONTRAINDIKATIONER:</h3>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong></p>\n<p><strong>DOSERING:</strong> Neurooperaion, vid op i bakre skallgrop eller ponsvinkel: 1 tablett Postafen 25 mg ges på avdelningen på operationsdagens morgon.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "PRAXBIND®", "html": "<p>Dosering: 5 g = två ampuller.</p>\n<p>Affiniteten mellan Praxbind® (Idarucizumab) och Dagibatran är >300 starkare än vad Dabigatran binder till trombin. Därmed binds även trombinbundet dabigatran neutraliseras och Dabigatraneffekten elimineras nästan momentant. Praxbind tar endast bort Dabigatraneffekten annan ev. koagulationsrubbning kvarstår.</p>\n<p>Källa: Läkartidningen 2018 (NOAK vid venös tromboembolism samt hantering av blödningar)</p>\n<p>Praxbind: Glöm ej att Dabigatran har en längre halveringstid och att man ev kan behöva ge en ytterligare dos efter 24 h samt 48 h. Dabigatran funkar alltså i 24 h.</p>", "category": "Läkemedel"}, {"title": "Pro-Epanutin", "html": "<h3>INDIKATIONER:</h3>\n<h3>KONTRAINDIKATIONER:</h3>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong>  Koncentrationsangivelserna är märkliga. Följ dock mg FE som anges på flaskan. 1 Flaska 10 ml brukar innehålla 500 mg FE = 50 mg FE / ml.</p>\n<p><strong>DOSERING:</strong> <strong>Neurooperation:</strong> Man brukar ge 5 mg FE per kg. Om 70 kg = 350 mg FE = 7 ml. Blanda med 100 ml NaCl och ge på 20 minuter.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "PROTAMIN (PROTAMINSULFAT)", "html": "<p><strong>Indikationer:</strong> Allvarlig blödning hos pat. behandlad med heparin/LMH. Överdosering. Reversering inför akut kirurgi. Efter administrering av heparin vid operationer i hjärt-lungmaskin.</p>\n<p><strong>Kontraindikationer:</strong> Överkänslighet mot substansen. Riskfaktorer för anafylaktisk reaktion: Fiskallergi, tidigare behandling med ämnet, tid. vasektomi (sic), infertilitet (hos män).</p>\n<p><strong>Biverkan:</strong> Hypotension, anafylaxi, pulmonell hypertension.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong></p>\n<p><strong>Dosering:</strong> NEUTRALISERING AV HEPARIN 1. Stoppa infusionen. 2. Kontrollera APTT. 3. Reversera med Protaminsulfat 2,5 – 5 ml (25 – 50 mg) iv under 10 min. 4. Kontrollera med APTT som ska sjunka. 1 ml Protamin (10 mg protaminsulfat) neutraliserar cirka 1400 IE heparin. Ta hänsyn till när Heparininfusionen avslutades. Halveringstiden av Heparin är 30 min – 2 h. Om >15 min sedan Heparin avslutades så bör dosen reduceras. Om > 2-4 h sedan iv. infusion, behöver Protamin vanligen inte ges. NEUTRALISERING AV LÅGMOLEKYLÄRA HEPARINER 1. Gör uppehåll med LMWH. 2. Kontrollera krea, Hb, PK, APTT, TPK. 3. Notera tid och dos för senaste injektionen. 4. Ge Cyklokapron 1 g iv om allvarlig blödning (ej vid urinvägsblödning). 5. Vid normal LMWH-dos och blödning bör Protamin undvikas. Om LMWH dos > 100 IE/kg av Fragmin eller Innohep och mindre än 6 timmar från senaste injektion, ge 5 ml protaminsulfat intravenöst (50 mg). Ge EJ protaminsulfat vid Klexane-behandling (dålig effekt). Protaminsulfat neutraliserar de olika lågmolekylära heparinerna i varierande grad, man bör därför följa varje enskilt råd från tillverkaren av LMWH. KARDIOPULMONELL BYPASS Vanligtvis ges en dos på 0,1 ml till 0,2 ml (1–2 mg) av Protaminsulfat intravenöst för varje 100-tals enheter heparin som givits. Man brukar räkna att man ger 1/100 del av Heparindosen. Ex om 40000 IE Heparin givits såger man 400 mg Protamin. Doseringsvägledning genom: APTT, ACT, anti Xa eller bedside protaminneutralisationstest. Koagulationstester utförs vanligen 5–15 minuter efter administrering av protaminsulfat. Protamin är i sig en antikoagulant, men vanligtvis krävs ett förhållande Protamin:Heparin på 3:1 för att antikoagulerande effekt skall uppstå.</p>\n<p><strong>Max infusionshastighet:</strong> <strong>Rekommenderat är</strong> i**njektion/infusion under 10 minuter. Bolusdos bör ej överstiga 5 ml (7000 anti-heparin IE/50 mg protaminsulfat).</p>\n<h3>Tillslagshastighet: </h3>\n<p><strong>Duration:</strong> Upprepade doser kan ­behövas eftersom protaminsulfat försvinner ur blodet snabbare än heparin och LMWH. Den förlängda absorptionen efter subkutan till­försel av heparin eller LMWH kan också innebära att upprepade doser ­behöver ges.</p>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Protaminsulfat innehåller basiska peptidsulfater som bildar komplex med surt heparin (inkl. LMH) utan antikoagulerande effekt. För LMH neutraliseras trombinaktiviteten helt och anti-Xa-aktivitet delvis. Protaminsulfat har således god effekt mot Innohep och Fragmin, men <strong>dålig effekt på Klexane och försumbar effekt på Arixtra</strong>.</p>\n<h3>Metabolism: </h3>\n<h3>Interaktioner:</h3>\n<p><strong>Graviditet/amning:</strong> Risk kan inte uteslutas, används endast om absolut nödvändigt / Amning bör avbrytas.</p>\n<p><strong>Källa:</strong> FASS. Alfresco: Antikoagulantiabehandling – handläggning vid blödning... 2016.</p>", "category": "Läkemedel"}, {"title": "ROBINUL-NEOSTIGMIN®", "html": "<p><strong>INDIKATIONER:</strong> **Reversering av ickedepolariserande muskelrelax</p>\n<p><strong>KONTRAINDIKATIONER:</strong> : Undvik vid myastenia gravis: Man kommer in i ett träsk med halveringstider etc. Mekaniskt hinder i magtarmkanal eller urinvägar.</p>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong> Robinul 0,5 mg/ml+ Neostigmin 2,5 mg/ml.</p>\n<p><strong>DOSERING:</strong> Neostigmin: 0,03 till 0,07 mg/kg , maxdos 5 mg. Robinul: större doser än 2,5 mg är assoicerat med PONV.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<p><strong>KÄLLA:</strong> Kollega, Ottawa ane. Primer.</p>", "category": "Läkemedel"}, {"title": "SELOKEN® / SelokenZOC(Metoprolol)", "html": "<p><strong>Indikationer:</strong> Supraventrikulära arytmier. Profylax och behandling av myokardischemi, takyarytmier, och smärta vid misstänkt eller säkerhetsställd akut hjärtinfarkt. Hypertoni. Stabil hjärtsvikt med nedsatt LVEF. Mfl.</p>\n<p><strong>Kontraindikationer:</strong> Risk för svår bradykardi och asystoli vid kombination med Cordarone. AVb II och III. SSS. Instabil ickekompenserad hjärtsvikt. Bradykardi. PQ-tid >0,24 sek. Hypotension etc. Verapamil iv. ska inte kombineras med betablockad (BT-fall, bradykardi).</p>\n<p><strong>Biverkan:</strong> Bradykardi, hypotension, bronkokonstriktion. Kan dölja symtom vid hypoglykemi. Mardrömmar. Depression. Kyla i extremiteter. Förstoppning. Mfl.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong></p>\n<p><strong>Dosering:</strong> T. SelokenZOC: Ges 1 gång/dygn; 50-200 mg. Vid svår hjärsvikt, startdos 12,5 mg. <strong>Får ej krossas.</strong> OBS **Man kan lösa upp kapseln i en sårpruta och granulaten kommer då inte att lösa upp sig. Så kan man spola ner granulaten via v-sonden så blir det samma förlängda frisättning. T. Seloken: Ges 2 till 3 ggr/dygn; 25-50 mg. Dygnsdos upp till 200 mg. Ökad metabolism vid thyreotoxicos, kan behöva 50-100 mg x 3-4. Inj. Metorpolol i.v: 1-5 mg långsam injektion, kan upprepas var 5-10 min till en total dos om 10-15 mg. Sedan får man inom rätt kort tid börja med tabletter om man vil ha effekt över dygnet.</p>\n<p><strong>Tillslagshastighet: </strong>T. <strong>Seloken:</strong> **Maxeffekt efter 1-2 h.</p>\n<p><strong>Duration:</strong> T. SelokenZOC: Frisättning under 20 h och ger effekt över hela dygnet.</p>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Selektiv beta-1-receptorblockare. Ringa memebranstabiliserande effekt.</p>\n<p><strong>Metabolism: </strong>Metoprolol:<strong> </strong>Dosen behöver inte reduceras av lever eller njursvikt. Endast vid mkt grav leverskvikt såsom shunt-opererade bör dosen justeras. behöver ej dosreduceras hos äldre. Substrat till CYP2D6. Läkemedel som kan hämma CYP2D6 och därmed höja plasmakonc av metoprolol är: kinidin, terbinafin, paroxetin, fluoxetin, sertralin, celecoxib, propafenon och difenhydramin. Halveringstid seloken: 3-5 h. Utsöndras ffa via njurarna.</p>\n<h3>Interaktioner:</h3>\n<p><strong>Graviditet</strong>:<strong> Kategori C. Ges endast om det är absolut nödvändigt. Kan reducera placentablodflödet, risk för intrauterin död, missfall, förtidsbörd. </strong>Amning: <strong>Grupp II.</strong> **Metoprolol koncentreras i bröstmjölken till 3 ggr moderns plasma. Men risken för barnet anses vara låg vid terapeutiska doser, dock ska barnet observeras.</p>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> FASS 2021-01-12.</p>", "category": "Läkemedel"}, {"title": "SIMDAX® (LEVOSIMENDAN)", "html": "<h3>Indikationer:</h3>\n<p><strong>Kontraindikationer:</strong> Överkänslighet. Hypovolemi. Addisons sjukdom. Hyperkalemi. Försiktighet hos vasoplegiska pat. Ev. kan samtidig NA-infusion behövas.</p>\n<h3>Biverkan:</h3>\n<h3>Förpackning:</h3>\n<p><strong>Tillredning:</strong> 2,5 mg/ml 5 ml tillsätts i Glukos 5% 250 ml till en koncentration på ≈ 0,05 mg/ml.</p>\n<p><strong>Dosering:</strong> På THIVA: Ingen laddningsdos. Starta med 0,1 mikrog/kg/min, utvärdera efter ca 2 h. Måldos är 0,2 mikrog/kg/min. Behandling 24 h. <strong>Enligt Orion Pharma:</strong> Dosering och behandlingslängd är individuell. Bör starta med laddningsdos på 12-24 mikrog/kg under 10 min följt av en kontinuerligt infusion på 0,1 mikrog/kg/min. Utvärdera efter 30-60 in. Om för kraftig reaktion, sänk hastighet till 0,05 mikrog/kg/min eller avbryt. Om initiala dosen tolereras och en ökad hemodynamisk effekt är önskvärd kan infusionshastigheten ökas till 0,2 mikrog/kg/min. Rekommenderad infusionstid är ca 24 h.</p>\n<h3>Förenklad dosering:</h3>\n<h3>Max infusionshastighet:</h3>\n<h3>Tillslagshastighet: </h3>\n<p><strong>Duration:</strong> Lång halveringstid. Kvarstående effekter upp till 1 v, ev. längre.</p>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Ökar troponinets känslighet för Ca2+ i hjärtcellen  Ökad kontraktilitet, utan ”(enligt uppgift) ökad syrgaskonsumtion. Även kärlvidgande pga. påv. av K+-kanaler i glatt musk.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>\n<h3>Doseringtabell (Orion Pharma)</h3>\n<table class=\"card-table\">\n<tr><td>Vikt kg</td><td>Pumphastighet under 10 min i ml/h för dosen 12 mikrog/kg (laddningsdos)</td><td>Pumphastighet under 10 min i ml/h för dosen 24 mikrog/kg (laddningsdos)</td><td>Kontinuerlig infusionshastighet 0,05 mikrog/kg/min</td><td>Kontinuerlig infusionshastighet 0,1 mikrog/kg/min</td><td>Kontinuerlig infusionshastighet 0,2 mikrog/kg/min</td></tr>\n<tr><td>40</td><td>58</td><td>115</td><td>2</td><td>5</td><td>10</td></tr>\n<tr><td>50</td><td>72</td><td>144</td><td>3</td><td>6</td><td>12</td></tr>\n<tr><td>60</td><td>86</td><td>173</td><td>4</td><td>7</td><td>14</td></tr>\n<tr><td>70</td><td>101</td><td>202</td><td>4</td><td>8</td><td>17</td></tr>\n<tr><td>80</td><td>115</td><td>230</td><td>5</td><td>10</td><td>19</td></tr>\n<tr><td>90</td><td>130</td><td>259</td><td>5</td><td>11</td><td>22</td></tr>\n<tr><td>100</td><td>144</td><td>288</td><td>6</td><td>12</td><td>24</td></tr>\n<tr><td>110</td><td>158</td><td>317</td><td>7</td><td>13</td><td>26</td></tr>\n<tr><td>120</td><td>173</td><td>346</td><td>7</td><td>14</td><td>29</td></tr>\n</table>", "category": "Läkemedel"}, {"title": "SOLDACTONE® (Kanrensyra)", "html": "<p><strong>Indikationer:</strong> <em> Furosemidorsakad alkalos med hypokalemi och hypernatrmi. (Istället för Spironolakton om pat. inte kan ta tabletter). </em> Uttalad hypernatremi som inte kunnat korrigeras med vätsketerapi (ex vatten i sonden). * Hypernatremi där man inte vill ge mer vätska?</p>\n<p><strong>Kontraindikationer:</strong> Överkänslighet. Hypovolemi. Addisons sjukdom. Hyperkalemi.</p>\n<h3>Biverkan:</h3>\n<h3>Förpackning:</h3>\n<h3>Tillredning:</h3>\n<h3>Dosering:</h3>\n<h3>Förenklad dosering:</h3>\n<h3>Max infusionshastighet:</h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Aldosteronantagonist. Hämmar aldosteronets effekt på njurtubuli med kaliumsparande och natriumutsöndrande effekt.</p>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<h3>Källa:</h3>", "category": "Läkemedel"}, {"title": "SOLU-MEDROL® (Metylprednisolon) #solumedrol", "html": "<p><strong>INDIKATIONER:</strong>  Finns flera. Bla: Förhöjt ICP där andra åtgärder ej är tillräckliga.</p>\n<h3>KONTRAINDIKATIONER:</h3>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong></p>\n<p><strong>DOSERING:</strong> Mot högt ICP: På indikation ges 1 g i.v. Kan upprepas vb. ”några dagar senare” enl. kollega.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>", "category": "Läkemedel"}, {"title": "TARGINIQ", "html": "<h3>INDIKATIONER:</h3>\n<h3>KONTRAINDIKATIONER:</h3>\n<h3>BIVERKAN:</h3>\n<p><strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong></p>\n<p><strong>DOSERING:</strong> Enl. smärtenheten: Använd ej doser större än 80 mg/dygn. Detta då naloxonet som ska brytas ned av förstapassagemetabolism inte bryts ned tillräckligt och man får en systemisk naloxoneffekt. Man ska även undvika Targiniq vid sänkt leverfunktion.</p>\n<h3>FÖRENKLAD DOSERING:</h3>\n<h3>MAX INFUSIONSHASTIGHET:</h3>\n<h3>TILLSLAGSHASTIGHET:</h3>\n<h3>DURATION:</h3>\n<h3>BLANDBARHET:</h3>\n<h3>VERKNINGSMEKANISM:</h3>\n<h3>METABOLISM:</h3>\n<h3>INTERAKTIONER:</h3>\n<h3>GRAVIDITET:</h3>\n<h3>AMNING:</h3>\n<h3>ÖVRIGT:</h3>\n<h3>KÄLLA:</h3>", "category": "Läkemedel"}, {"title": "TEOFYLLAMIN", "html": "<p><strong>INDIKATIONER:</strong>  Svår terapiresistent astma. På barn använder man en mkt liten teofyllindos 1/8 av astmadosen (vilket är?). Och man är övertygad om att det förbättrar renala blodflödet. Dom ger det i hela åldersspannet. De har aldrig haft problem med takykardi etc. <strong>KONTRAINDIKATIONER:</strong> <strong>BIVERKAN:</strong> Arytmier och blodtrycksfall. <strong>FÖRPACKNING </strong>&<strong> TILLREDNING:</strong>  <strong>BLANDNING OCH DOSERING ENLIGT PM NU</strong>-<strong>SJUKVÅRDEN: </strong> VID SVÅR TERAPIRESISTENT ASTMA – BÖRJA MED INJEKTION OCH UTVÄRDERA BEHOV AV INFUION <strong>Injektion Teofyllamin:</strong> - GES I REGEL <strong>EJ I CENTRAL INFART</strong>.<strong> <em>Om patienten står på underhållsbehandling med teofyllamin:</em> Ge 2–3 mg/kg kroppsvikt av Teofyllamin 23 mg/mL långsamt i.v. (motsvarar ca 0,15 mL/kg kroppsvikt). Motsvarar ca 10 mL till 70 kg patient. <em>Om patienten ej står på underhållsbehandling med teofyllamin</em>: Ge 5–6 mg/kg kroppsvikt av Teofyllamin 23 mg/mL långsamt i.v. (motsvarar ca 0,3 mL/kg kroppsvikt). Motsvarar ca 20 mL till 70 kg patient. BLANDNING: Teofyllamin 23 mg/ml, </strong>2-3 mg/kg<strong> = ca 0,1 ml/kg. Spädning: Ordinerad mängd späds i 100 ml NaCl 9 mg/ml, ges i perifer ven under 20-30 min. Överdosering kan ge upphov till BT-fall, arytmier). </strong>Infusion Tefyllamin<strong> Teofyllamin 23 mg/ml, 20 ml (460 mg) blandas i 210 ml Glucos 5 % till en slutvolym på 230 ml. -> Koncentration 2 mg/ml. Startdos 8 μg/kg/min. Normalintervall 4 – 13 μg/kg/min. Följ S-Teofyllin (28-110 μmol/ml) </strong>TILLSLAGSHASTIGHET:<strong> </strong>DURATION:<strong> </strong>BLANDBARHET:<strong> Ges ej i samma slang som magnesium eller ventoline. </strong>VERKNINGSMEKANISM:<strong> </strong>METABOLISM:<strong> </strong>INTERAKTIONER:<strong> </strong>GRAVIDITET:<strong> </strong>AMNING:<strong> </strong>ÖVRIGT:<strong> </strong>KAN GES PERFIERT JA/NEJ: <strong>Ja. Vid bolus bör man inte ge i central ven pga risk för arrytmier och BT-fall. Endast i undantagsfall och i så fall under EKG-övervak! </strong>DIALYSERAS BORT JA/NEJ: <strong> </strong>KÄLLA:<strong> </strong>Barium-ID 13531 <strong>(giltig från 2021) & Dokument-ID: SV9761-782711715-458</strong>:**</p>", "category": "Läkemedel"}, {"title": "TPN (Total Parenteral Nutrition)", "html": "<p>- Enligt kollega finns fallbeskrivningar om att patienter kan bli illamående av TPN. Ej bekräftad info.</p>", "category": "Läkemedel"}, {"title": "TRIS / THAM / TROMETAMOL / ADDEX-THAM® – BUFFRING", "html": "<p><strong>Indikationer:</strong> Acidos och behov av buffring och samtidig sänkning av pCO2. Alternativt om man absolut inte vill höga Na+ ???</p>\n<p><strong>Kontraindikationer:</strong> Njursvikt? Utsöndras via njurarna. Ingen central infart.</p>\n<p><strong>Biverkan:</strong> Vid stora doser: hypoventilation och hypoglykemi. Under iakttagande av givna doseringsanvisningar har inga biverkningar av Addex-THAM rapporterats.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong> Addex-THAM i 50 ml-flaskor innehållande 150 mmol THAM. 1 flaska tillsätts i 500 ml glukoslösning eller NaCl, vilket ger 300 mmol/L. Denna spädning är blodisoton. Om mindre vätska önskas kan 4 gånger mer koncentrerad lösning användas. Oavsett blandning så skall lösningen ges i <strong>central infart</strong>.</p>\n<p><strong>Dosering:</strong> Maximal dygnsdos bör inte överstiga 1 till 5 mmol /kg kroppsvikt. Engångsdosen bör som regel ej överstiga 4-5 mmol THAM per kg kroppsvikt (ca 15 ml av ovannämnda lösning). Infusionstiden bör vara minst 1 timme. Buffertbehovet beräknas approximativt enligt formeln: mmol buffert = 0,3 x kg kroppsvikt x base deficit eller mmol buffert = 0,3 x kg kroppsvikt x (24-aktuellt standardbikarbonatvärde) Då en 0,3 molar lösning används blir dosering i ml = base deficit x kg kroppsvikt. Efter snabb infusion med hög dosering bör som regel förnyad tillförsel ej ske förrän efter 12 timmar. Efter normalisering av pH avbryts infusionen för att undvika alkalos, som kan inträda relativt snabbt.</p>\n<h3>Förenklad dosering:</h3>\n<h3>Max infusionshastighet:</h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Tris-hydoximetyl-aminometan (THAM) är en protonacceptor som inte samtidigt frisätter CO2 eller tillför Na+. Syrabindare. Utsöndras via njurarna.</p>\n<p><strong>Metabolism: </strong>Utsöndras via njurarna.</p>\n<h3>Interaktioner:</h3>\n<p><strong>Graviditet/amning:</strong> <strong>Graviditet & amning:</strong> **Inga kända risker vid användning av terapeutiska doser.</p>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> Intensivvård, Rupersson, 2016. FASS.</p>", "category": "Läkemedel"}, {"title": "ULTIVA® (REMIFENTANIL)", "html": "<h3>ANESTESI</h3>\n<p>Dosering intubation: 0,3 mikrog/kg/min vid preoxygenering.</p>\n<p>Dosering efter intubation: Sänk till 0,1 mikrog/kg/min.</p>\n<p>Inför knivstart: Höj till 0,3 mikrog/kg/min.</p>\n<p>När man fått kring 50 mikrogram Ultiva så bör pat. känna av effekt.</p>\n<p>Bolusdosera aldrig Ultiva. Är en mkt potent sympaticolytika. Har orsakat hjärstopp mm.</p>\n<p>Risk för bradykardi vid Ultiva. Förr gav man alltid 0,2 mg Atropin när man</p>\n<p>startade Ultiva.</p>\n<p><strong>RECEPT FÖR SEDERING</strong> MED ULTIVA**</p>\n<p>THORAX Vid TAVI-ingreppen kör dom ibland med Ultiva lågdos: Remifentanil 10 ug/ml (spädning: Remifentanil torrampull 2 mg späds i 200 ml NaCl); 1/3 av pts vikt i ml/tim, ex 90 kg = 30 ml/tim. NEUROOPERATION <strong>Sedering</strong> med Ultiva: 0,1  - 0,15 mikrog/kg/min. Börja lite försiktigare lägre från början. 0,05. TCI på 1. Plasmatarget är fördelaktigt. <strong>Sövning</strong>: Ex aneurysm innan laryngoskopi: Given mängd bör vara > 1,5μg/kg (idealvikt) alternativt plasma target koncentration (Cpt) > 4,5 ng/ml. <strong>Mayfieldsättning: </strong>Inför Mayfield-fixation ökas infusionen till 0,4 μg/kg/min under några minuter innan. <strong>Anestesiunderhåll: </strong>Anestesiunderhåll: Remifentanil 0,2 - 0,4 μg/kg/min.</p>\n<h3>REMIFENTANIL PÅ IVA</h3>\n<p>Dosering 0-0,4 (-0,75) mikrog/kg/min. Alltså lägre doser än op! <strong>Att tänka på:</strong> Långtidsanvändning (>5-10 dygn) är oklart om det är bra. På DS så roterar man till annan opioid efter 5 dagar. Biverkningar: Tarmparalys. Abstinens vid utsättning. Hyperalgesi vid höga doser och kir trauma? Undvik vid serotonergt syndrom (syntetiska opioider kan frisätta serotonin).</p>", "category": "Läkemedel"}, {"title": "VANCOMYCIN", "html": "<p>OBS LÄS VÅRAT PM! DET FINNS SAKER MAN MÅSTE HA KOLL PÅ! <strong>Bland annat:</strong> Standardsättet att administrera vankomycin på IVA är kontinuerlig infusion eftersom det ger större precision i dosering och plasmakoncentrationer. Förutsättningen är att vi följer vår riktlinje för vankomycininfusion och tyvärr är det vanligt med avvikelser från den. Några viktiga punkter:  1. Vankomycinkoncentration ska inkluderas i morgonproverna. Ansvaret vilar primärt på rondande/ordinerande läkare men för att uppnå högre säkerhet i behandlingen bör ansvarig ssk kontrollera att analysen är med bland ordinerade prover innan proverna tas.  2. Resultatet av plasmakoncentrationsbestämningen ska följas upp dagligen och fortsatt dosering väljs i relation till koncentration, tidigare dos och ev. förändringar avseende njurfunktion/CRRT.  3. Om patienten behandlas med CRRT ska infusionen pausas vid CRRT-uppehåll längre än 2 h och inte återupptas förrän CRRT åter startats. Detta är viktigt eftersom patienten annars snabbt får toxisk plasmakoncentration av vankomcyin vilket bl.a. ger hörselskador. Ansvaret för att pausa infusionen delas av läkare och ssk.  4. Vid avslut av CRRT pga. att patienten återfått sin njurfunktion är det särskilt viktigt att följa plasmakoncentrationerna. Ofta böra vankomycindosen reduceras något innan man fått koncentrationssvar som motsvarar situationen utan CRRT.  5. Vid övergång från CRRT till intermittent HD ska kontinuerlig vankomycininfusion avslutas och istället väljs intermittent infusion (se riktlinjen).</p>", "category": "Läkemedel"}, {"title": "XYLOCAIN", "html": "<p><strong>Indikationer:</strong> Symtomgivande ventrikulära arytmier.</p>\n<p><strong>Kontraindikationer:</strong> Överkänslighet mot lidokain och andra amider. AVb II & III utan pacemaker.</p>\n<p><strong>Biverkan:</strong> Yrsel, parestesier, dåsighet.</p>\n<p><strong>Förpackning</strong> <strong>&</strong> tillredning<strong>:</strong></p>\n<p><strong>Dosering:</strong> Indikation ventrikulära arytmier: Xylocain 20 mg/ml kan ges outsädd som bolus 50 – 100 mg. Därpå sprutpump (20 ml Xylocain 20 mg/ml = 400 mg sätts till 30 ml Glukos 5% -> 400 mg / 50 ml = 8 mg/ml. Infusion med 2-4 mg/min = 15-30 ml/h. Om dosen måste höjas under pågående infusion, ges först en långsam injektion 25-100 mg för att uppnå den erforderliga blodkoncentrationen. Därefter justeras infusionshastigheten. Ge ej > 200-300 mg under 1 h. Dosreducera väsentligt vid chock, hjärtsvikt, eller sänkt leverfunktion. Hypokalemi bör justeras innan behandlingen startas. Innan väckning för att förhindra hosta/hypertension/laryngospasm: Injektion 1 mg/kg ??? Maxdos 200 mg/dygn?</p>\n<h3>Förenklad dosering: </h3>\n<h3>Max infusionshastighet: </h3>\n<h3>Tillslagshastighet: </h3>\n<h3>Duration:</h3>\n<h3>Blandbarhet:</h3>\n<p><strong>Verkningsmekanism:</strong> Hjärta: Lidocainhydroklorid reducerar ledningshastigheten i främst his.purkinje-systemet, men även i förmaks- och kammarmuskulatur.</p>\n<h3>Metabolism: </h3>\n<h3>Interaktioner:</h3>\n<h3>Graviditet/amning:</h3>\n<h3>Övrigt:</h3>\n<p><strong>Källa:</strong> Rutin Lidokain (Xylocain)PM VG-region f.o.m 2016-03-15. Nr 10793.</p>", "category": "Läkemedel"}, {"title": "BARN – INTRODUKTION", "html": "<p>BARN</p>\n<p>Källor: Barnanestesikompendiet Kar1-3100, Kar1-1512, LISE9DF38A, Kar1-3976, mfl KS-PM.</p>", "category": "Barn"}, {"title": "PREOPERATIVT, FÖRBEREDELSER FÖRE OPERATION", "html": "<h3>Är barnet friskt?</h3>\n<ul><li>Fråga efter aktuellt hälsotillstånd och efter nyliga luftvägsinfektioner.</li></ul>\n<ul><li>Generell tumregel, man ska ha varit frisk innan sövning: 6 mån efter kikhosta, 6 v efter RS, 2 veckor efter förkylning. Sedan beror det på indikationen.</li></ul>\n<p><strong>Fasta</strong> **(PM Fasta inför ANE (BANE) Kar1-1512).</p>\n<ul><li>Klara vätskor 1h.</li></ul>\n<ul><li>Bröstmjölk och bröstersättning 4 h.</li></ul>\n<ul><li>Fast föda + allt annat 6 h.</li></ul>\n<p>Volym som får intas innan op: Barn 1-5 år får dricka upp till 55 ml /h. Barn 6-12 år får dricka upp till 140 ml/h. Barn äldre än 12 år får dricka upp till 250 ml/h.</p>\n<p><em>- </em><em>Klara drycker: vatten, kolsyrade drycker, klar saft/juice utan fruktkött, kaffe/te utan mjölk.</em></p>\n<p><em>- </em><em>Fast föda: utöver fast föda även välling, filmjölk, yoghurt och mjölk.</em></p>\n<p><em>- <strong>OBS: </strong>Pga<strong> </strong>risk för <strong>dehydrering</strong> och hypoglykemi ska intravenös tillförsel startas direkt</em></p>\n<p><em>efter att fastetiden är överskriden.</em></p>\n<ul><li>Ej tuggummi eller någon form av tobak inom 2 h före anestesi.</li></ul>\n<p><strong>YTANESTESI / </strong>EMLA<strong> </strong>(Generella ordinationer K 16967_1, PM: PM00676MED-1)</p>\n<ul><li>EMLA innehåller lidocain + prilocain. Prilocian kan bilda Met-Hb. Barn yngre än 3 månader har lägre nivåer av methemoglobinreduktas som normaliserar Met-Hb.</li></ul>\n<ul><li>Appliceras på intakt hud (försiktighet vid atopisk dermatit), bör sitta minst 1 h (2 h på färgade barn) och max 4 h.</li></ul>\n<ul><li>Orsakar kärlkonstriktion som efter borttagande kan gå över i kärldilatation.</li></ul>\n<ul><li>Analgetiska effekten ökar de första 15 min efter borttagande av krämen. Så man bör ta bort krämen en stund innan nålsättning.</li></ul>\n<ul><li>Verkar ej funka på häl på små barn eller på fingertopp, trol. pga. hög blodgenomströmning.</li></ul>\n<ul><li>EMLA kan användas på barn <1 månads ålder men > 30 gestationsveckor på läkarordination. Undvik dock att kombinera med sulfa pga ökad risk för Met-Hb.</li></ul>\n<table class=\"card-table\">\n<tr><td>ÅLDER</td><td>EMLA-dos - PM00676MED-1</td></tr>\n<tr><td>>30 gest. veckor – 1 månad</td><td>0,5g(0,5ml) per 5 cm2 högst 1 gång/dygn i högst 1 timme</td></tr>\n<tr><td>1-3 månader</td><td>1g(1ml) per 10 cm2 högst 1 gång/dygn i högst en timme</td></tr>\n<tr><td>3-12 månader</td><td>2g(2ml) i högst en timme (1g/10cm2)</td></tr>\n<tr><td>1-6 år</td><td>10g i högst 5 timmar (1g/10cm2)</td></tr>\n<tr><td>6-12 år</td><td>20g i högst 5 timmar (1g/10cm2)</td></tr>\n</table>\n<p>Fullgånga barn maximal dygnsdos: K 16967_1</p>\n<p>< 3 månader: 1 gram (10 cm2), eller 1 plåster, max 1 h applikationstid.</p>\n<p>3-12 månader: 2 gram (20 cm2) eller 2 plåster, max 1 h applikationstid. Appliceras ej på skalpen.</p>\n<h3>Premedicinering</h3>\n<ul><li>Premedicinering ges i regel ej till barn < 3 månaders ålder.</li></ul>\n<p>-För doser och detaljer kring specifika läkemedel se under rubriken ”läkemedel”</p>\n<ul><li>Generellt resonemang: Clonidin i sederingsdos är en mkt bra premedicinering inför ex PVK-sättning och inför anestesi. Dexdor används till procedurer som ex MR-undersökningar, är mer potent sederare (har även snabbare tillslag). Sufenta eller Stesolid kan används som tillägg hos mkt stressat barn där Clonifin inte är tillräckligt.</li></ul>\n<h3>Vätska Preoperativt</h3>\n<p>Traditionellt anses barn som skall opereras för akuta bukingrepp som lätt dehydrerade och ordineras av ansvarig operatör rehydrering med Ringeracetat i fyra timmar (= 5 % av kroppsvikt). Är generellt bra men kan i vissa fall vara skadligt (ex malrotation/volvulus med hotande tarmnekros, hotande app-perforation). Det är därför viktigt med tidig visit hos de akuta fallen för att bedöma behov av rehydrering, etc.</p>\n<p>Om fastetiden överskrids så ska pat. erhålla vätskeersättning direkt pga att de snabbt blir dehydrerade. Nedan är förslag för standardpatienter:</p>\n<p><strong>Barn under 3</strong> kg**</p>\n<p>Infusionsvätska: Glukos 100 mg/ml, med 20 mmol Natrium och 10 mmol Kalium per 1000ml. Infusionstakt: 5 ml/kg/h vilket blir per dygn 120 ml/kg.</p>\n<p><strong>Barn över 3 kg men under 10 kg och/eller under 1</strong> år**</p>\n<p>Infusionsvätska: Glukos 100mg/ml, med 40 mmol Natrium och 20 mmol Kalium per 1000ml.</p>\n<p>Infusionstakt: Med. lista, se separat PM.</p>\n<p><strong>Barn över 1 år eller över 10</strong> kg**</p>\n<p>Infusionsvätska: Buffrad glukos 2,5mg/ml.</p>\n<p>Infusionstakt: Med. lista, se separat PM.</p>\n<h3>Kärlaccess</h3>\n<ul><li>Alla barn ska Emlas. Barn kommer att vakna utan Emla trots Dex eller Catapressan.</li></ul>\n<ul><li>De vanligaste storlekarna är: 26G (0,6x19 mm) ”LILA”, 24G (0,7x19 mm) ”GUL”</li></ul>\n<p>22G (0,9x25 mm) ”BLÅ”.</p>\n<h3>Åldersrelaterat</h3>\n<ul><li>Anestesi av barn < 45 gestationsveckor bör undvikas pga omogen central andningsreglering med klart ökad risk för postoperativa apnéer. Undvik opioider och muskelrelax, överväg regionalanestesi för att minska opioidbehov. Preop ska man ordinera ekonc vid Hb < 120 pga association med apnéer hos dessa barn.</li></ul>", "category": "Barn"}, {"title": "FÖRBEREDELSER", "html": "<p><strong>Tubstorlekar</strong> <strong>(PM:</strong> **Kar1-2376)</p>\n<ul><li>Ändfalangen på patientens lillfinger är en grov indikator för tubstorlek.</li></ul>\n<ul><li>Formel: Tubstorlek = Patientålder (år) / 4 + 4.</li></ul>\n<ul><li>Vid längre ingrepp >45-60 min eller postop respirator ska alltid tub med microkuff övervägas. Den är har ett mildare tryck mot trachea.</li></ul>\n<ul><li>Vid nasal intubation gäller samma storlekar som oralt.</li></ul>\n<ul><li>Armerad tub vid bukläge.</li></ul>\n<table class=\"card-table\">\n<tr><th><strong>Kroppsvikt</strong> (kg) **</th><th><strong><em>Ålder</strong><strong> </strong></em></th><th><strong><em>Tubstorlek</strong><strong> </strong></em></th></tr>\n<tr><td><3,0</td><td>nyfödd</td><td>2,5</td></tr>\n<tr><td>3,0</td><td>nyfödd</td><td>3,0</td></tr>\n<tr><td>5,4</td><td>2–3 månader</td><td>3,5</td></tr>\n<tr><td>6,6</td><td>3–6 månader</td><td>4,0</td></tr>\n<tr><td>10,5</td><td>6 mån- 2 år</td><td>4,5</td></tr>\n<tr><td>14,5</td><td>2–4 år</td><td>5,0</td></tr>\n<tr><td>17</td><td>4–5 år</td><td>5,5</td></tr>\n<tr><td>20</td><td>5–7 år</td><td>6,0</td></tr>\n<tr><td>23</td><td>7–8 år</td><td>6,5</td></tr>\n<tr><td>30</td><td>8–12 år</td><td>7,0</td></tr>\n<tr><td>48</td><td>12–14 år</td><td>8,0</td></tr>\n</table>\n<p><strong>Tubdjup</strong> (<strong>></strong>1 år)**</p>\n<p>Tandraden till mitt i trachea, ålder år /2 + 12.</p>\n<p>Näsvingen till mitt i trachea, ålder år/2 + 15 cm.</p>\n<p>OBS! Tejpa en markering för rätt tubdjup på tuben under förberedelerna.</p>\n<ul><li>Överväg Celocurin uppdraget på sal.</li></ul>", "category": "Barn"}, {"title": "INDUKTION", "html": "<p><strong>- Generellt induktion och anestesiunderhåll: </strong>Hos nyfödda upp till 3 år är dosvariationen för att uppnå tillräckligt anestesidjup är relativt stor kan vara svår att förutsäga. Gas är mer förutsägbart.</p>\n<ul><li>Nedan ses en tabell för TIVA-infusionshastigheter där man uppnått en konc. på 3.0 mikrog/ml i blodet vilket de flesta barn >3 år sover vid. Observera att om man använder Remi-infusion så minskar dosbehovet, ca 25% enligt studier. (<em>PM </em><em>Kar1-3761</em>)</li></ul>\n<h3>Intravenös induktion - Ej RSI</h3>\n<ul><li>Intravenös induktion används i första hand.</li></ul>\n<ul><li><strong>Propofol</strong> 5 mg/ml. Propofol 2-5 mg/kg iv (eller mer). Ej Xylo rutinmässigt, hjälper ofta ej.</li></ul>\n<ul><li><strong>Remifentanil</strong>. Induktion: 0,5-1 mikrog/kg/min. Det lägre intervallet kan användas om Fentanyl givits innan. Underhåll 0,05-0,6 (0,9) mikrog/kg/min. Innan tubning så ska det gått in 2 mikrogram/kg inom någon minut.</li></ul>\n<ul><li><strong>Fentanyl</strong> 1-2 mikrog/kg, (1 mikrog/kg är för lite anser kollega), provat och barnet hostat.</li></ul>\n<ul><li><strong>Esmeron</strong> 0,6 mg/kg iv. Vid RSI: 1,2 mg/kg iv.</li></ul>\n<ul><li><strong>Tracrium</strong> (<strong>Atrakurium</strong>)** 0,5 mg/kg iv. för intubation.</li></ul>\n<p><strong>- Atropin:</strong> Barn har högre vagustonus och salivering och barn < 1 år ska erhålla Atropin eller Robinul innan induktion. Atropin 0,01 mg/kg iv. före anestesi, Upp till 5 kg, 0,05mg iv. (Alltid Atropin vid RSI med Celo).</p>\n<ul><li><strong>Efefrin</strong> **0,1-0,2 mg/kg iv.</li></ul>\n<ul><li>Töm magsäcken efter intubation med sugkateter. Dels för att bli av med vätska och dels få upp nedventilerad luft. Skyddar mot kräkning/aspiration men även mot postop illamående.</li></ul>\n<p><strong>INHALATIONS</strong>INDUKTION**</p>\n<p>Används i andra hand. Sevofluran används då. Alt sevo + lustgas. Bör användas liberalt om problem med infart.</p>\n<p><strong>Exempel </strong>sedering<strong> med lustgas inför PVK-sättning</strong> hos vaket barn:**</p>\n<ul><li>Pat. ofta redan sederad med ex clonidin.</li></ul>\n<p>Tyst och lugnt på salen, ljud kan upplevas starkare under N2O-ruset enl. kollega.</p>\n<ul><li>Lustgas blir som tilläggssedering, börja på tex 30% lustgas och trappa upp successivt till 50%. Vid det laget kan man lyckas få till infart. Risk för illamående om man titrerar upp för snabbt.</li></ul>\n<ul><li>Därpå går man vidare med intravenös induktion.</li></ul>\n<p><strong>Exempel </strong>sedering<strong> hos </strong>ex <strong>sovande barn med lustgas som brygga innan </strong>sevoflurane**</p>\n<ul><li>Pat. ofta redan sederad med ex clonidin.</li></ul>\n<ul><li>Lägg masken nära luftvägen på det sovande barnet med 50% lustgas/50% O2. Enligt PM MED00733-1 så kan man t.o.m. ge 70% lustgas, de beror på bla hur lite syre man vågar tillföra. Lustgas är tungt och kan ”rinna ned”. Successivt kan man lägga masken emot. När barnet är så sederat att det tolererar att man håller tät mask minska lustgasen från 70% till 50% eller 30% och starta sevo som antingen ökas successivt (0,3% 0,5% 0,7% 1,2% 8%) eller så då drar man på 8% Sevoflurane direkt och söver ned barnet. Gå över till ren O2 direkt så att du får upp FiO2.</li></ul>\n<ul><li>Sätt snabbt infart. Mac kan gå upp till MAC 2,5 utan problem. Men inte hur mycket etSevo som helst så man kan få sänka sevo något.</li></ul>\n<ul><li>För att underlätta styrning av MAC så kan man ha ett flöde som övergår minutventilationen och lägga på Sevo enligt den mål-koncentration som önskas.</li></ul>\n<p><strong>Exempel</strong> för snabb induktion vid ex fasthålln<strong>ing</strong> (kollega): **</p>\n<ul><li>Sevoflurane 8%, FGF högre än minutvolym, + lustgas 30% eller 40%. Mängd lustgas beror på hur lite O2 du kan tänka dig använda.</li></ul>\n<ul><li>Vissa menar att lustgasen inte tillför så mkt men viss effekt finns. Även second gas effect när lustgasen absorberas i alveolerna -> högre Sevokonc.</li></ul>\n<ul><li>OBS! Så länge barnet andas själv så blir inte Sevokonc farligt hög, men när du ventilerar så måste du ha striktare koll på vilket Mac du landar på. Tanken är att barnet ska andas ner sig själv till adekvat anestesidjup, det är när man börjar ventilera som man kan nå farligt djupa anestesidjup. Man måste ratta ned gasen om man ventilerar. Ställ gärna larmgräns.</li></ul>\n<ul><li>Obs försiktighet med blandning av anestesimedel ex om Propofolinfusion startas, mät blodtryck i så fall så att du inte råkar söva för djupt.</li></ul>\n<ul><li>Börja inte sticka förrän pupiller är centrerade och MAC är kring 2. Kanske lite tidigare om stick på emlat område.</li></ul>\n<p><strong>INDUKTION - </strong>RSI<strong> </strong>(PM Kar1-2879)</p>\n<ul><li>Ritklinjer anger modifierad RSI men försiktig maskventilation utan höga tryck (max 10 - 12 cmH20: Minskar risk för hypoxi utan ökad risk för regurgitation.</li></ul>\n<ul><li>Överväg preop sättning av v-sond. Om ej aspiration innan, evakuera magsäck efter intuabtion.</li></ul>\n<ul><li>Höjd huvudända 20 grader.</li></ul>\n<ul><li>Alltid atropin hos barn < 1 år.</li></ul>\n<p>Propofol 5 mg/ml, alt. Ketamin vb.</p>\n<p>Esmeron 1,2 mg/kg, alt Celo.</p>\n<ul><li>Barn vill generellt inte dricka Natriumcitrat och används därför inte.</li></ul>", "category": "Barn"}, {"title": "INDUKTION INFÖR PROCEDUR SEDERING EX MR", "html": "<ul><li>Preoperativ sedering vid behov ex Dex eller Clonidin.</li></ul>\n<p>Om procedur som kan göra ont, ex, gastroskopi så ges Fentanyl innan 1 mikrog/kg.</p>\n<ul><li>Induktion med propofol tills barnet somnar, ofta kring 3 mg/kg.</li></ul>\n<ul><li>Starta propofolpump på 10 mg/kg/h, ev 12 om mindre barn. Kan sänkas efter hand.</li></ul>\n<p>Om proceduren ej gör ont utan barnet bara ska sova så kan man sänka till 7 till 8.</p>", "category": "Barn"}, {"title": "ANESTESIUNDERHÅLL", "html": "<ul><li>Sevoflurane inhalationsanestesi är vanligast.</li></ul>\n<ul><li>Vid TIVA används oftast Propofol + Remi.</li></ul>\n<ul><li>Kontinuerlig tempmätning görs på alla barn. Pat. ska vara ≥36 grader innan väckning.</li></ul>\n<h3>Respiratorn</h3>\n<p>AGC används på barn >20 kg och äldre än 2 år eftersom tillverkaren Maquet rekommenderar tidalvolymer > 100 ml.</p>\n<p>Förslag på inställning: KOLLA UPP Typ FGF 0,5, Sevo 8%: Sätt larm på målsevo innan. Sedan sänk.</p>\n<p>Tidalvolym 6-10 ml/kg.</p>\n<p>Minutvolym = 1 L + 10% av kroppsvikten.</p>\n<p>Typisk inställning för fullgången lungfrisk: Frekvens 35-50 / min, topptryck 15 +- 2 till 4 cmH2O, MV 1 - 1,5 L/min.</p>\n<p><strong>Blodtryck </strong>(NARKOSGUIDEN)</p>\n<p>Prematur eller nyfödd: MAP ≥ antalet gestationsveckor.</p>\n<p>Upp til ett års ålder: MAP ≥ 45 mmHg.</p>\n<p>1-5 år: MAP ≥50 mmHg.</p>\n<p>5 år och uppåt: MAP ≥ 50-60 mmHg.</p>\n<h3>Blodglukos</h3>\n<p>B-glukoskontroll: Pat. <1 år med riskfaktor/er för hypoglykemi bör B-glukos kontrolleras 30–60 min efter anestesiinduktion. Vid anestesitid >2 h bör B-glukos om möjligt följas 1 gång/h.</p>\n<p>Riskfaktorer för hypoglykemi:</p>\n<ul><li>Prematura barn och nyfödda <1 mån korrigerad ålder.</li></ul>\n<ul><li>Barn som preoperativt fått TPN eller intravenösa glukoslösningar under >12 h.</li></ul>\n<ul><li>Barn som är undernärda eller tillväxthämmade >2 SD.</li></ul>\n<ul><li>Leversjukdom eller metabol sjukdom</li></ul>\n<ul><li>Behandling med betablockerare</li></ul>\n<h3>Peroperativ vätskeersättning</h3>\n<ul><li>Ersättningen ska inte endast baseras på op-områdets storlek och grad av</li></ul>\n<p>vätskedeficit.</p>\n<ul><li>Ta hänsyn till ålder och vikt då mindre barn har högre vätskeomsätning, perspiratio insensibilis och extracellulära förluster per kg kroppsvikt än större barn.</li></ul>\n<p><strong>Gäller barn </strong>><strong>1 år och/eller </strong>><strong>10 kg</strong></p>\n<h3>Volym</h3>\n<ul><li>Inget/lindrigt kirurgiskt trauma (basal ersättning): 2 ml/kg/h.</li></ul>\n<ul><li>Måttligt kirurgiskt trauma: 3-4 ml/kg/h.</li></ul>\n<ul><li>Stort kirurgiskt trauma: 5-7 ml/kg/h.</li></ul>\n<h3>Vätskeval</h3>\n<p>1. Benelyte, (balanserad lösning med Na+ 140 mmol/L) & 1% glukos.</p>\n<p>2. Vid riskfaktorer för hypoglykemi: Buffrad glukos 2,5% med addex Na+ 70 mmol/L ->  140 mmol/L.</p>\n<p>Volymer >5ml/kg/h ges som Ringeracetat eller Albumin 5%.</p>\n<p><strong>Gäller</strong> spädbarn 1 månad korrigerad ålder (och <strong>></strong>4 kg) tom 1 års ålder**</p>\n<h3>Volym</h3>\n<ul><li>Inget/lindrigt kirurgiskt trauma (basal ersättning): 4 ml/kg/h.</li></ul>\n<ul><li>Måttligt kirurgiskt trauma: 6 ml/kg/h.</li></ul>\n<ul><li>Stort kirurgiskt trauma: 8 ml/kg/h.</li></ul>\n<p>Obs! Ersätt fasterelaterad vätskedeficit (10-15 ml/kg/h 1-2 h eller bolus)</p>\n<h3>Val av vätska:</h3>\n<p>Buffrad glukos eller Benelyte:</p>\n<ul><li>Buffrad glukos 2,5% med tillsatt extra 70 mmol Na+ per 1000 ml (ger 140 mmol Na/L). Volymer > 5 ml/kg/h ges som Ringeracetat eller albumin 5%.</li></ul>\n<ul><li>Benelyte kan användas förutsatt att kontroll av b-glukos och blodgas sker enligt ovan. Första kontrollen inom 30 min och därefter 1 gång/h.</li></ul>\n<h3>Prematura barn och spädbarn upp till och med 1 månads ålder</h3>\n<p>Se separat pm. Kar1-3976.</p>\n<table class=\"card-table\">\n<tr><th><strong>mmol/L</strong></th><th><strong>Ringeracetat</strong></th><th><strong>Benelyte</strong></th><th><strong>Plasmalyte</strong> <strong>Glu</strong>c<strong>os</strong></th><th><strong>Buffrad glukos 2.5% (25 mg/ml)</strong></th><th><strong>Albumin 5%</strong></th></tr>\n<tr><td>Na+</td><td></td><td>140</td><td>140</td><td>70</td><td></td></tr>\n<tr><td>K+</td><td></td><td>4</td><td>5,0</td><td>-</td><td></td></tr>\n<tr><td>Ca2+</td><td></td><td>1</td><td></td><td>-</td><td></td></tr>\n<tr><td>Mg2+</td><td></td><td>1</td><td>1,5</td><td>-</td><td></td></tr>\n<tr><td>Cl-</td><td></td><td>118</td><td>98</td><td>45</td><td></td></tr>\n<tr><td>Acetatjoner</td><td></td><td>30</td><td>27</td><td>25</td><td></td></tr>\n<tr><td>Glukos</td><td></td><td>55,5 mmol/L (11 mg/L)</td><td>23 (glukonat) (5 g/L)</td><td>139 mmol/L (100 kcal)</td><td></td></tr>\n<tr><td>Hjälpämnen</td><td></td><td>Saltsyra (för pH-justering)</td><td>Saltsyra (för pH-justering)</td><td>?</td><td></td></tr>\n</table>\n<h3>Blödning</h3>\n<p>Total blodvolym < 7 kg 8-10 % av kroppsvikten.</p>\n<p>Total blodvolym > 7 kg 7-8 % av kroppsvikten</p>\n<p>Blödning < 10 % av blodvolymen - ersätts med kristalloid.</p>\n<p>Blödning 10-20 % av blodvolymen - ersätts med 10-15 ml/kg kolloid alt/samt kristalloid.</p>\n<p>Blödning > 20 % - ersätts 1/1 med E-konc, plasma vb.</p>\n<p>Det finns inga exakta transfusionsgränser på basen av Hb-värde/hematokrit. Nyfödda bör</p>\n<p>ligga över > 120 g/L medan barn över 1 år bör ligga > 80 g/L, men detta är endast ungefärliga</p>\n<p>transfusiongränser som måste bedömas från fall till fall.</p>\n<p><em>- Om <strong>jag</strong> räknar på det<strong>..</strong>: Pat. 10 kg -<strong>></strong> Total blodvolym <strong>7</strong>00 - <strong>8</strong>00 ml blodvolym. En bolus på 10 ml/kg = 100 ml. Alltså <strong>15 - 12.5</strong>% av tot. blodvol</em><em>ym.</em></p>\n<p><strong>Spädning albumin 200g/L för administrering till små barn</strong> <em>*</em>(PM MED00738-1)*</p>\n<ul><li>Den kolloidosmotiska effekten av humant albumin 200 g/l är ungefär fyra gånger</li></ul>\n<p>större än den av blodplasma. (hyperonkotisk)</p>\n<ul><li>Albumin 200 g/l administreras intravenöst efter spädning med isoton</li></ul>\n<p>infusionslösning. ( glukoslösning 50 mg/ml eller natriumkloridlösning 9 mg/ml)</p>\n<ul><li>Spädning; 1 del Albumin 200 g/l + 3 delar isoton infusionslösning.</li></ul>\n<ul><li>Ex. 5 ml Albumin 200 g/l + 15ml natriumklorid 9 mg/ml. Lösningen 50 g/l är svagt hypoonkotisk.</li></ul>\n<p>(”Man bolar inte in stark albumin på nyfödda hur som helst. Barn har så sköra kärl att man kan få hjärnblödning av en kraftig bolus.”)</p>\n<p><strong>HYPOTERMI</strong> (Kar1-2369)</p>\n<ul><li>Påverkar hemostas. Risk för förlängd postoperativ återhämtning och sårinfektion ökar. FFa det späda barnet kan få påverkad cirkulation av pulmonell vasokonstriktion samt få påverkad andning. Läkemedel kan brytas ned långsammare.</li></ul>\n<ul><li>Barn < 36 grader får inte väckas.</li></ul>\n<ul><li>Kontinuerlig mätning kan göras i esofagus, rektalt eller KAD.</li></ul>", "category": "Barn"}, {"title": "VÄCKNING", "html": "<ul><li>Planera; tidig (vanligast) eller sen extubation.</li></ul>\n<ul><li>Överväg extubation i sidoläge.</li></ul>\n<p><strong>- Resonemang kring </strong>tidig <strong>extubation</strong>:**</p>\n<ul><li>Extubera så fort andningen är stabil.</li></ul>\n<ul><li>De flesta utvärferar triggningens styrka och titrerar ned flödestriggern. Många är nöjda när man kommit ned kring 4 eller 2 med rimlig andningsfrekvens. Är man nere på 0 så tycker vissa att det börjar bli sent. Vidare så följs koldiaxiden så att den inte stiger vid låga triggningsvärden. Vissa ser så att bra tidaler skapas trots litet tryckunderstöd. Ibland slår man över för att utvärdera andningsdriven. Vissa barn störs av respen och det kan bli lite svårvärderat under TU.</li></ul>\n<ul><li>Om pupillerna fortsatt är centrerade och små så kan man kuffa ur försiktigt, om ingen reaktion kan man extubera. Obs vänta inte med extubationen, det är lätt att det blir för sent. Om hosta vid urkuffning eller att pupillerna pekar uppåt så ge en bolus propofol och leta efter ett nytt extubationsfönster.</li></ul>\n<ul><li>Ha samma försiktighet vid överflytt till sängen, flytta inte om barnet börjar excitera.</li></ul>\n<p><strong>PONVprofylax</strong>: **</p>\n<ul><li>Spädbarnen brukar inte ha PONV. Men ex en tvååring med åksjuka bör få.</li></ul>\n<p>Betapred 0,1 mg/kg iv.</p>\n<p>Ondansetron i.v. 0,1 mg/kg  i.v. (till barn >10 kg).</p>\n<h3>Smärtlindring</h3>\n<p>Paracetamol</p>\n<p>Catapressan</p>\n<p>Morfin 0,025-0,1(0,2) mg/kg iv</p>\n<p><strong>POSTOP</strong>ERATIVT**</p>\n<p>Ordinera innan barnet kommer till UVA: Postoperativ vätska, smärtlindring, ev. PONV-profylax.</p>\n<p>Postop smärtlindring: Grunden är intravenösa ordinationer av Paracetamol och Morfin och ofta även Catapresan och Toradol regelbundet eller vid behov.</p>\n<h3>Postoperativt </h3>\n<p><10 kg: Inf Glukos 10 % + 80-140 mmol Na/1000ml, enligt ”Minlista”/Vätskelistan sist i dokumentet. När barnet kissat tillsätt K 10-20 mmol/1000ml.</p>\n<p>>10 kg: Inf Buffrad Glukos 2,5 %, enligt ”Minlista”/Nedan.</p>", "category": "Barn"}, {"title": "LÄKEMEDEL", "html": "<ul><li>Dosering barn: Vid 25-30 kg börjar man komma upp i vuxendoser. Om man fortsätter att räkna per kg så kan man komma upp i orimligt höga doser.</li></ul>\n<ul><li>Barn har en större distributionsvolym (Vd) än vuxna vilket kan ge viss utspädningseffekt av vattenlösliga läkemedel. De har en lägre proteinbindningsgrad av läkemedel som kan ge en högre fri koncentration av aktiv substans vilket ökar risken för toxiska biverkningar. Särskilt lokalanestetika. Neonatala har ej fullt utvecklad lever- och  njurfunktion och en mer penetrabel BBB, är är därmed känsliga för opioider och LA. Prematurer har en omogen andningsreglering, omogen BBB och låg proteinbindingsgrad och är därmed extremt känsliga för opioider. Opioidinducerad apné kan vara svår att häva även med naloxon.</li></ul>\n<p><strong>DEXDOR</strong> **</p>\n<p><em>OBS<strong>, från kollega: </strong>Om bradykardi vid <strong>dexbehandling</strong>, ge ej atropin. Risk för <strong>hypertensiv</strong> kris om man drar igång <strong>cardiac</strong> output. Följ blodtrycket och om det skulle bli lågt överväga försiktig dos atropin.</em></p>\n<p><em>Premed<strong> inför </strong>ex <strong>MR </strong>(<strong>Källa PM Kar1-2916</strong>, PM MED00757-1</em><em>)</em></p>\n<ul><li>Effektiv dos är 1- 1,5 - 2 mikrog/kg. Tid till att barnet somnar ca 25 min. Duration ca 60 minuter. (Smärtkompendiet rek. 0,7 - 1,5 mikrog/kg nasalt).</li></ul>\n<ul><li>Ingen särskild övervakning krävs med pulsoximeter, men ska vara med sina anhöriga då barnet kan somna mitt i lek.</li></ul>\n<ul><li>Ger endast liten smärtlindring och kommer att vakna av smärtstimuli. Emla krävs därför inför PVK-sättning.</li></ul>\n<ul><li>Outspädd Dexdor 100 mikrog/ml används i 1 ml spruta försedd med MAD Nasal. Volymen per näsborre bör ej överstiga 0,2 ml. Hos större barn får man därför spruta flera gånger med 30 sek intervall. Större doser riskerar att sväljas ned och absorptionen blir ca 5%.</li></ul>\n<ul><li>Spruta snett uppåt i näsan, sikta mot ipsilaterala örat typ.</li></ul>\n<p><strong>- </strong>Har kortare halveringstid ca 2 h jmf Clonidin som har 5-10 h.</p>\n<ul><li>KOLLEGA / ÖL: Kan ge 2-3 mikrog/kg nasalt, upp till 4 mikrog. Små barn 1 mikrog/kg.</li></ul>\n<p>NARKOSGUIDEN ”Barn 1-3 år ges 1 µg/kg. Barn 3-10 år ges 1-2 µg/kg. Barn över 10 år ges 1-3 µg/kg. Dosen kan höjas med stigande ålder till m
