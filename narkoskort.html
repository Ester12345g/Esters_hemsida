ax 3 µg/kg. Enklast sker nasal administrering med MAD eller MADy. Ordinerad dos läkemedel spädes till önskad volym (oftast 0,3-0,5 ml) med fysiologisk koksaltlösning.”</p>\n<p><strong>CATAPRESSAN</strong> **</p>\n<h3>Generellt: </h3>\n<ul><li>Ges ej i regel till barn < 3 månaders ålder.</li></ul>\n<ul><li>”Små barn blir tröttare av clonidinet.”</li></ul>\n<ul><li>Kontraindikationer: Hypovolemi, hypotoni, bradykardi, AV-block II-III, långt P-R intervall.</li></ul>\n<p><strong>PREMEDICINERING CATAPRESSAN INTRAVENÖST </strong>(Kar1-1568, Giltig from 2021-12-06)</p>\n<ul><li>30 minuter innan anestesiinduktion eller nålsättning.</li></ul>\n<ul><li>Sprutas långsamt 10-15 min.</li></ul>\n<ul><li>Beredning: CAtapressan 150 mikrogram/ml späds med NaCl 9 mg/ml. Alternativt Apoteksberedningen 15 mikrog/ml.</li></ul>\n<ul><li>Intravenös dosering: 1 mikrog/kg.</li></ul>\n<p><strong>PREMEDICINERING CATAPRESSAN ORALT 3 </strong>mikrog<strong>/kg </strong>(Kar1-1655, PM00683MED-2</p>\n<ul><li>Ges 40–60 minuter före planerad anestesistart eller nålsättning.</li></ul>\n<h3>Oral dosering: </h3>\n<p>Vanlig dosering är 3 mikrogram/kg, men kan ökas till 5 mikrog/kg enligt gammalt PM).</p>\n<p>Oral beredning finns i två olika koncentrationer: 5 mikrogram/ml <strong>eller </strong></p>\n<p>20 mikrogram/ml (Den starkare lösningen verkar vanligast?).<strong> </strong></p>\n<p><strong>PREMEDICINERING CATAPRESSAN REKTALT </strong><em>(Kar1-156<strong>7</strong>, Giltig from 2022-08-23<strong>, </strong>MED00684_2</em><em>)</em></p>\n<ul><li>Rektal premedicinering endast om oral ej är möjlig.</li></ul>\n<ul><li>Ges 40 - 60 min före anestesistart.</li></ul>\n<p><strong>Rektal </strong>dosering<strong>: </strong> Klonidinhydroklorid 5 mikrogram/kg.</p>\n<p><strong>Beredning: </strong>Klonidinhydroklorid rektal gel 30 mikrog/ml, alternativt Klonidinhydroklorid oral lösning 20 mikrog/ml.</p>", "category": "Barn"}, {"title": "PARACETAMOL", "html": "<p><strong>MORFIN </strong>i.v<strong>.</strong></p>\n<p>Morfin 0,025-0,1(0,2) mg/kg iv. Ex efter tonsillektomi/abrasio är rutinen 0,1 mg/kg.</p>\n<p><strong>Pentotal</strong>:** Dosering barn 5-10 mg/kg. Ge hela tänkta dosen snabbt så att man får en hög serumkoncentration. Obs risk för nekros om subkutan injektion.</p>\n<p><strong>Celocurin</strong> (<strong>Suxametonium</strong>)**</p>\n<ul><li>Celo-arytmier är mkt vanligare hos barn (bradykardi/asystoli). Används därför bara vid RSI och då ger man alltid atropin innan. Dock är Esmeron förstahandspreparat.</li></ul>\n<h3>VASOPRESSORER (NARKOSGUIDEN)</h3>\n<ul><li>Calciumgluconat 10 ml = 2,25 mmol Ca2+ : 0,25-0,5 ml/kg iv</li></ul>\n<ul><li>Fenylefrin 100 μg/ml, 1-5 μg/kg iv</li></ul>\n<ul><li>Efedrin 5 mg/ml: 0,1 mg/kg iv</li></ul>\n<ul><li>Noradrenalin 20 μg/ml – bör ges i kontinuerlig infusion i CVK: 0,05-0,5 μg/kg/min iv</li></ul>\n<ul><li>Adrenalin 0,1 mg/ml: i bolusdoser: 0,1→1→10 μg/kg iv</li></ul>\n<ul><li>Adrenalin i kontinuerlig infusion 20 μg/ml – bör ges i CVK : 0,01-0,5 μg/kg/min iv</li></ul>\n<p><strong>BLODTRYCKHÖJANDE OCH INOTROPA LÄKEMEDEL </strong>(narkosguiden)</p>\n<ul><li>Går att använda samma som för vuxna.</li></ul>\n<ul><li>Noradrenalin 1a hand (startdos 25-200 ng/kg/min).</li></ul>\n<ul><li>Adrenalin kan ges som inotropi, 10-30 ng/kg/min</li></ul>\n<ul><li>Dopamin är ett alternativ, 5-20 ng/kg/min</li></ul>\n<ul><li>Milrinon för inotropi + afterload-reduktion, 0,3-0,7 μg/kg/min</li></ul>\n<ul><li>Ca2+ infusion kan användas om S-Ca ligger lågt</li></ul>\n<p><strong>Klonidin</strong> **(KÄLLA NARKOSGUIDEN).</p>\n<p>Dos: 2-5 mikrog/kg per os. God sedering. Nackdel: Lång anslagstid, måste ges 60-90 min i förväg. Mixtur Klonidinhydroklorid 20 μg/ml eller Tabl Klonidin 75 μg.</p>\n<p>Doseringsintervall: 2-4-(6) μg/kg. Dos: Vi rekommenderar 3 μg/kg. Barn < 3 år och alla ÖNH-barn 2-3 μg/kg. Ex; barnets vikt 15 kg x 3 μg/kg = 45 μg och 2,2 ml (20 μg/ml) klonidinhydroklorid.</p>\n<p><strong>ANESTESI VID OLIKA TILLSTÅN</strong>D / OLIKA TYPINGREPP**</p>\n<h3>Övre luftvägshinder</h3>\n<ul><li>TIVA med ytanestesi i larynx.</li></ul>", "category": "Barn"}, {"title": "DJUP SEDERING VID GASTROSKOPI", "html": "<ul><li>Fetanyl 1 mikrog/kg först, invänta till effekt och sedan kan man börja preoxygenerga.</li></ul>\n<ul><li>Söv med Propofol 5 mg/ml, tills barnet somnar men håller spontanandning, kring 3-5 ml/kg,</li></ul>\n<ul><li>Starta propofolinfusion kring 10 mg/kg/h. Kan sänkas under ingreppet.</li></ul>\n<ul><li>Sätt grimma med koldiaxidsampling.</li></ul>\n<ul><li>Vid hosta eller annan reaktion av gastroskopet, bolus propofol 0,5 - 1 mg/kg.</li></ul>\n<ul><li>Vissa får Paracetamol.</li></ul>\n<p><strong>SEDERING VID MR-UNDERSÖKNING </strong>(Huddinge-PM: MED00785-2)</p>\n<ul><li>Smärtfri procedur men mycket kraftigt buller. - Man blir varm av undersökningen så packa inte in för mycket, stäng av fläkten i MR-rummet.</li></ul>\n<p><strong>Kontraindikationer till </strong>sedering<strong> utan intubation: </strong></p>\n<ul><li>Ökad aspirationsrisk såsom grav reflux, inte fastande patient (undantag dexmedetomidin), grav obesitas, misstänkt enteral motorikstörning efter tarmresektioner eller under opioidbehandling. - Apnétendens (t.ex. CNS-påverkan, ökad/onormal känslighet för sedativa;</li></ul>\n<p>larynxmask kan räcka till som åtgärd) - Grav OSAS som inte går att häva med andra luftvägssäkrande åtgärder än intubation (t.ex. med larynxmask eller svalgtub)</p>\n<ul><li>Dexdor eller Propofol är förstahandsmedlen.</li></ul>\n<ul><li>Talar för Dexdor nasal: Barn under 20 kg, Barnet inte överviktigt, Ingen övre luftvägsinfektion, Ingen venös infart finns, Bara MR (inte t.ex. LP efteråt), Undersökningen inte över 2 timmar.</li></ul>\n<ul><li>Talar för propofolinfusion: Otillfredsställande dexdmedetomidineffekt, Luftvägssäkrande åtgärd behövs, Andningsuppehåll behövs.</li></ul>\n<ul><li>Om enbart dexmedetomidin ska användas behöver barn inte vara fastande men en minimal fasta på någon timme (t.ex. från att barnet lämnar hemmet) är att rekommendera.</li></ul>\n<ul><li>Ingen fasta vid Dexdossedering, det är bra om barnen är mätta och trötta tycker man, så timing är viktigt.</li></ul>\n<p><strong>Dosering </strong>dexmedetomidin<strong> nasalt:</strong></p>\n<p>1. Laddningsdos för barn> 6 månader 2–4 μg/kg (ofast ger dom 3 2–4 μg/kg såg jag), <6 månader 1–2 μg/kg nasalt</p>\n<p>2. Behovsdos> 6 månader 2 μg/kg, <6 månader 1 μg/kg nasalt. Oftast ges en</p>\n<p>behovsdos direkt innan start av undersökningen. Vid undersökning längre än</p>\n<p>en timme eller insufficient sedering kan det ges en andra behovsdos. Maxdos</p>\n<p>8 μg/kg> 6 mån, 4 μg/kg <6 mån nasalt. Barnet somnar vanligtvis ~15–25</p>\n<p>minuter efter första dosen6.</p>\n<p>3. Sömnen kan vid behov induceras med ett tillägg av Propofol i.v. (0,5–1</p>\n<p>mg/kg).</p>\n<p>4. Vid otillräcklig effekt är ett tillägg av Propofol-infusion ett alternativ.</p>\n<p>Starta med 2 mg/kg/h och anpassa dosen tills lämplig sederingsnivå uppnåtts.</p>\n<p>Eventuell intravenös tillförsel måste ske långsamt och med reducerad dos på grund</p>\n<p>av högre biotillgänglighet och risk för (övergående) bradykardi/hypertoni. Lämplig är</p>\n<p>titrering 0,25 μg/kg tills god effekt inträffat, max 2 μg/kg som laddningsdos, 1 μg/kg</p>\n<p>som behovsdos> 6 månader, halverade doser <6 månader, maximalt 4 respektive 2</p>\n<p>μg/kg per undersökning.</p>\n<p>1. Starta med små bolusdoser om cirka 0,5 mg/kg (med tillsats av 1 ml lidokain 1</p>\n<p>% till 10 ml propofol)) tills barnet har somnat</p>\n<p>2. Alternativt starta med infusion 20 mg/kg/h och sänk till 15 mg/kg/h när barnet</p>\n<p>somnar, efter omkring 10 minuter till måldos som kan vara något över 10</p>\n<p>mg/kg/h för småbarn och under 10 mg/kg/h för äldre skolbarn.</p>\n<p>3. Överväg ”premedicinering” med 1 μg/kg fentanyl i.v. för lugnare och snabbare</p>\n<p>insomning</p>\n<p>Dosering av läkemedlen för intubation enligt rutin. Sederingsunderhåll sedan enligt</p>\n<p>ovan. Spontanandning med tryckunderstöd eftersträvas.</p>\n<p><strong>TONSILLEKTOMI</strong> **(Hudddinge-PM: ALLM1310-1, från 2018-04-06)</p>\n<ul><li>Ingen preoperativ sedering som standard. EMLA i hemmet.</li></ul>\n<ul><li>Sedering med Sufentanil 1 - 1,5 μg/kg nasalt kan bli aktuell vid stor stickrädsla.</li></ul>\n<ul><li>TIVA (pga anses ha minskad risk för PONV, luftvägsincidenter, postop agitation).</li></ul>\n<ul><li>Uppdragna läkemedel: Atropin, Celokurin, Fentanyl, Propofol 10 - 20 ml med 1</li></ul>\n<p>ml lidokain, propofol i sprutpump, remifentanil i sprutpump (mängd beroende</p>\n<p>på vikt och operationslängd), Glukos buffrad 2,5 %, morfin, ondansetron,</p>\n<p>betapred, paracetamol.</p>\n<ul><li>Tuber i 2 - 3 storlekar för barnet läggs fram, 1 öppnas och kuffen testas så fort barnet har somnat. Laryngoskop med alternativblad läggs fram och testas.</li></ul>\n<p><strong>Induktion: </strong>1 μg/kg fentanyl i.v. så fort patienten kommer in om inte Sufentanil har givits och dess effekt är kvar. Iaktta fentanyleffekten för att bedöma opioidkänsligheten. Propofol 1 mg/kg ges när fentanyleffekten är framme, eventuell upprepning efter 1 minut så att barnet somnar med bibehållen spontanandning. Under tiden har infusionspumparna för propofol, remifentanil och glukos startats men kopplas först efter insomnandet när föräldern lämnat</p>\n<p>salen. När andningsdepression genom remifentanil inträffar ges omedelbart propofol 2 - 4 mg/kg i.v. och intubation genomförs.</p>\n<h3>Underhåll</h3>\n<ul><li>Remifentanil och propofol i lägsta möjliga dos med en övervikt på remifentanil: Oftast 0,2 - 0,3 μg/kg/min remifentanil och 6 mg/kg/h propofol även hos mindre barn, glukosinfusion 2 ml/kg/h, högre hos spädbarn.</li></ul>\n<ul><li>Ondansetron (och Betapred) ges direkt, morfin 100 μg/kg (eventuellt lägre vid</li></ul>\n<p>konstaterad hög opioidkänslighet) och paracetamol 20 mg/kg följer.</p>\n<ul><li>Överväg klonidin 1 - 3 μg/kg i.v. vid insufficient narkos och ifall postoperativa</li></ul>\n<p>smärtproblem förväntas, främst för slutenvårdspatienter</p>\n<h3>Väckning</h3>\n<ul><li>Prop och Remi stängs samtidig. Koppla gärna bort så att kvarvarande läkemedel ej finns i slangar/kranar.</li></ul>\n<ul><li>Sidoläge vid extubation för att förhindra aspiration av blod.</li></ul>\n<ul><li>Extubation vid sufficient spontanandning efter rensugning, gärna i något djupare narkos.</li></ul>\n<ul><li>Morfin 50 μg/kg kan ges vid tecken på smärta såsom hög andningsfrekvens</li></ul>\n<p>och/eller agitation.</p>\n<ul><li>Propofol 0,25 - 1 mg/kg i.v. används vid hosta/bronkospasm som hindrar</li></ul>\n<p>spontanandningen innan extubation eller vid bronko-/laryngospasm efter</p>\n<p>extubation, ev. upprepning av dosen.</p>\n<p><strong>Rekommendationer för barn vid stor blödning</strong> <strong>(</strong>Narkosguien<strong>)</strong></p>\n<ul><li>Erytrocytkoncentrat 10 ml/kg i upprepade doser</li></ul>\n<ul><li>Plasma 10–20 ml/kg</li></ul>\n<ul><li>Trombocytkoncentrat 5–10 ml/kg</li></ul>\n<ul><li>Kryoprecipitat 5 ml/kg</li></ul>\n<ul><li>Fibrinogenkoncentrat 30 mg/kg</li></ul>\n<ul><li>Tranexamsyra 10–15 mg/kg</li></ul>\n<ul><li>Rekombinant faktor VIIa 90 μg/kg</li></ul>", "category": "Barn"}, {"title": "PREMATURA", "html": "<p>Efter 60 gestationsveckor minksar risken för apneer så man säger då att det ej behövs förlängt postoperativt övervak från och med då.</p>", "category": "Barn"}, {"title": "BLODTRYCKSGRÄNSER UNDER OPERATION", "html": "<p>KOLLA UPP PM. Se ägen Uppsalas ingående PM om BT (de är mer frikostiga med låga blodtryck än ALB och andra).</p>", "category": "Barn"}, {"title": "LARYNXMASK", "html": "<ul><li>Larynxmask är ett bra alternativ till mask eller intubation.</li></ul>", "category": "Barn"}, {"title": "ARTÄRKATETRAR", "html": "<p>Artär: I första hand a radialis. Även a dorsalis pedis, a tibialis posterior kan användas. A femoralis kan i undantagsfall användas (men betänk att detta är en ändartär med potentiellt allvarliga komplikationer). Om man lägger i a radialis kan man ha dessa ungefärliga riktlinjer avseende barnets vikt vid</p>\n<p>val av nål:</p>\n<p>< 8 kg gul venflon 24G (0,7x19 mm)</p>\n<p>8-20 kg blå venflon 22G (0,9x25 mm) (kan användas uppemot 40 kg)</p>\n<p>> 20 kg standard röd artärnål 20G (1,1x45 mm) med ON/OFF-Floswitch</p>\n<p><strong>Enl</strong> kollega på Astrid har de mindre nålar: Röd tonåring, blå små barn, lila på dom minsta.**</p>\n<p><strong>Urinkateterisering barn</strong> (Källa <strong>barntraumakompendie</strong>).**</p>\n<h3>Riktlinjer inför val av kateterstorlek </h3>\n<p>Pojkar\t\tstorlek</p>\n<p>Prematur (<2,5 kg) \tCh 3-5</p>\n<p>Fullgången-6månader\tCh 6-8</p>\n<p>6 månader-4 år\tCh 8-10</p>\n<p>5-15 år\t\tCh 10-12</p>\n<p>Flickor\t\tstorlek</p>\n<p>Prematur (<2,5 kg)\tCh 3-5</p>\n<p>Fullgången-6 månader\tCh 6-8</p>\n<p>6 månader-4 år\tCh 10-12</p>\n<p>5-15 år\t\tCh 12-14</p>\n<h3>Blåstömning</h3>\n<p>Barnens urinblåsa har en större förmåga att tolerera en måttlig övertänjning (1,5 x uppskattad blåsvolym ger oftast inga bestående men).  Urintappning utförs därför regelmässigt inte om scannade volymen ligger under uppskattad max volym.</p>\n<p>Urinblåsans maxvolym:</p>\n<p>Barn upp till 20 kg: 10 ml/kg kroppsvikt</p>\n<p>Barn>20 kg och upp till 12 år: 100 ml + (ålder i år x 20 ml)</p>\n<p>Kateterisering av urinblåsan</p>\n<p>Utförs med stor försiktighet.  Kateter med ledare får endast föras in 1-2 cm i urinröret hos pojkar, sedan tas ledaren ut och katetern förs in i urinblåsan. Hos flickor kan ledaren föras in i urinblåsan.</p>\n<p>Kateterstorlek:</p>\n<p>1-4 år: pojkar 8-10 Ch, flickor 10-12 Ch</p>\n<p>5-15 år: pojkar 12 Ch, flickor 12-14 Ch.</p>\n<p>Spolas vid behov med max 5 ml NaCl 0,9% upp till 5 år, 10 ml NaCl 0,9% 5-15 år.</p>\n<p><strong>LATHUND LÄKEMEDEL I SAMBAND MED ANESTESI</strong> (Barnanestesikompendiet Astrid).**</p>\n<p>Atropin 0,01 mg/kg iv. före anestesi, Upp till 5 kg, 0,05mg iv.</p>\n<p>Betapred (Betametason) 0,1mg/kg iv. antiemetika.</p>\n<p>Catapresan (Klonidin) 1 (-2) mikrog/kg iv/blockad/EDA.</p>\n<p>Celocurin (Succinylcholin) 1-2 mg/kg iv. vid intubation.</p>\n<p>Chirocaine (Levobupivakain) 2 mg/kg, engångsdos (maxdos). Kontinuerlig infusion i sårkateter/EDA/perifer blockad 0,2-0,5 mg/kg/h, Nb! ålder. Se smärtkompendiet.</p>\n<p>Propofol 2-5 (eller mer) mg/kg iv. vid induktion. 8-20 (eller mer) mg/kg/h vid iv-anestesi.</p>\n<p>Midazolam 0,05 mg/kg iv. Nb ålder! Som inf (enl FASS) 0,03- 0,12 (+) mg/kg/h som sedering.</p>\n<p>Efedrin 0,1-0,2 mg/kg iv.</p>\n<p>Esmeron (Rokuronbromid) 0,6 mg/kg iv. 1,2 mg/kg iv. vid RSI.</p>\n<p>Fenylefrin 1-2(5) mikrogram/kg vid hypotension (högre doser vid chock).</p>\n<p>Furix (Furosemid) 0,2-1 mg/kg iv.</p>\n<p>Ketalar (Ketamin) 2 mg/kg iv. Induktion.</p>\n<p>Ketanest (S-ketamine) 0,1-0,25 mg/kg/h iv. Kan ges som bolus innan opstart då smärtsamt ingrepp, 0,25-0,5 mg/kg.</p>\n<p>Ketogan (Ketobemidon) 0,025-0,1 mg/kg iv.</p>\n<p>Lanexat (Flumazenil) 3-5 mikrog/kg iv. Som inf 2-10 mikrog/kg/h.</p>\n<p>Fentanyl 1-2 mikrog/kg iv.</p>\n<p>Morfin 0,025-0,1(0,2) mg/kg iv, som infusion 10-20 (60) mikrog/kg/h. Riktlinjer för intermittent tillförsel vid kraftig smärta enl smärtkompendiet.</p>\n<p>Narcanti (Naloxon) 1-2 mikrog/kg iv. vid förlängd sedering 10 mikrog/kg iv. opiatöverdos.</p>\n<p>Octostim (Desmopressin) 0,3 mikrog/kg iv.</p>\n<p>Pentothal (Tiopental) 5-7(10) mg/kg iv.</p>\n<p>Paracetamol iv >2 mån: 15-20 mg/kg x 4</p>\n<p>0-2 mån: 10-15 mg/kg x 4</p>\n<p>Prematur v 33-36: 7,5 mg/kg x 4</p>\n<p>Prematur v 28-32: 7, mg/kg x 3</p>\n<p>Efter 3 dygn reduceras dygnsdosen med 25%</p>\n<p>Rapifen (Alfentanil) 5-15 mikrog/kg iv.</p>\n<p>Robinul (Glycopyrron) 5 mikrog/kg iv. Upp till 4 kg 0,02mg iv.</p>\n<p>Robinul-Neostigmin 0,01-0,02 ml/kg iv. det motsvarar glycopyrron 5-10 mikrog/kg + neostigmin 25-50 mikrog/kg.</p>\n<p>Solu-Cortef (Hydrocortison) 2,5 mg/kg iv, minst 25mg.</p>\n<p>Ondansetron 0,1-0,15 mg/kg iv.</p>\n<p>Stesolid (Diazepam) 0,1-0,2 mg/kg iv.</p>\n<p>Tavegyl (Clemastin) 20-30 mikrog/kg iv. långsamt 2-3 min.</p>\n<p>Teofyllamin (Teofyllin) 6 mg/kg bolus iv. Långsamt (Neonatala apneér och astma). Underhåll 2 mg/kg x 2.</p>\n<p>Tracrium (Atrakurium) 0,5 mg/kg iv. för intubation. Upprepad dos: 0,1-0,2 mg/kg iv. Infusion: 0,3-0,6 mg/kg/h.</p>\n<p>Toradol (Ketorolak) 0,3 mg/kg x 2-3 iv. Under 6 månader används inte NSAID-preparat rutinmässigt.</p>\n<p>Ultiva (Remifentanyl) 0,5-1 mikrog/kg iv. 0,05-0,6 (0,9) mikrog/kg/min inf.</p>\n<p>Ventoline (Salbutamol) 0,10-0,15 mg/kg som inhalation.</p>\n<p>Xylokain (Lidokain) 1 mg/kg iv. Mot hosta.</p>\n<p><strong>NORMALBEHOV AV INTRAVENÖST VÄTSKA HOS BARN </strong>(<strong>PM</strong> **Kar1-3977)</p>\n<p>100% = Uppegående frisk patient</p>\n<p>80% = Sjuk eller sängligande patient</p>\n<p>67% = Postoperativt eller annan vätskekarens.</p>\n<table class=\"card-table\">\n<tr><th><strong>VIKT </strong></th><th><strong>67% </strong></th><th><strong>80% </strong></th><th><strong>100% </strong></th><th><strong>100% </strong></th></tr>\n<tr><td></td><td>ml/dygn</td><td>ml/dygn</td><td>ml/dygn</td><td>ml/<strong>kg</strong>/dygn</td></tr>\n<tr><td>2</td><td>170</td><td>210</td><td>260</td><td>130</td></tr>\n<tr><td>3</td><td>260</td><td>312</td><td>390</td><td>130</td></tr>\n<tr><td>4</td><td>340</td><td>400</td><td>500</td><td>125</td></tr>\n<tr><td>5</td><td>420</td><td>500</td><td>625</td><td>125</td></tr>\n<tr><td>6</td><td>480</td><td>576</td><td>720</td><td>120</td></tr>\n<tr><td>7</td><td>560</td><td>672</td><td>840</td><td>120</td></tr>\n<tr><td>8</td><td>590</td><td>704</td><td>880</td><td>110</td></tr>\n<tr><td>9</td><td>633</td><td>756</td><td>945</td><td>105</td></tr>\n<tr><td>10</td><td>670</td><td>800</td><td>1000</td><td>100</td></tr>\n<tr><td>11</td><td>700</td><td>840</td><td>1050</td><td>95</td></tr>\n<tr><td>12</td><td>740</td><td>880</td><td>1100</td><td>92</td></tr>\n<tr><td>13</td><td>770</td><td>920</td><td>1150</td><td>88</td></tr>\n<tr><td>14</td><td>800</td><td>960</td><td>1200</td><td>86</td></tr>\n<tr><td>15</td><td>840</td><td>1000</td><td>1250</td><td>83</td></tr>\n<tr><td>16</td><td>870</td><td>1040</td><td>1300</td><td>81</td></tr>\n<tr><td>17</td><td>900</td><td>1080</td><td>1350</td><td>79</td></tr>\n<tr><td>18</td><td>930</td><td>1120</td><td>1400</td><td>78</td></tr>\n<tr><td>19</td><td>970</td><td>1160</td><td>1450</td><td>76</td></tr>\n<tr><td>20</td><td>1000</td><td>1200</td><td>1500</td><td>75</td></tr>\n<tr><td>22</td><td>1040</td><td>1240</td><td>1550</td><td>70</td></tr>\n<tr><td>24</td><td>1070</td><td>1280</td><td>1600</td><td>67</td></tr>\n<tr><td>26</td><td>1100</td><td>1320</td><td>1650</td><td>63</td></tr>\n<tr><td>28</td><td>1140</td><td>1360</td><td>1700</td><td>61</td></tr>\n<tr><td>30</td><td>1170</td><td>1400</td><td>1750</td><td>58</td></tr>\n<tr><td>35</td><td>1260</td><td>1500</td><td>1875</td><td>54</td></tr>\n<tr><td>40</td><td>1340</td><td>1600</td><td>2000</td><td>50</td></tr>\n<tr><td>45</td><td>1420</td><td>1700</td><td>2125</td><td>47</td></tr>\n<tr><td>50</td><td>1500</td><td>1800</td><td>2250</td><td>45</td></tr>\n<tr><td>55</td><td>1590</td><td>1900</td><td>2375</td><td>43</td></tr>\n<tr><td>60</td><td>1670</td><td>2000</td><td>2500</td><td>42</td></tr>\n<tr><td>65</td><td>1760</td><td>2100</td><td>2625</td><td>40</td></tr>\n<tr><td>70</td><td>1840</td><td>2200</td><td>2750</td><td>39</td></tr>\n</table>\n<p>NARKOSGUIDENS TABELLER</p>\n<p><strong>BEDÖMNING AV VÄTSKESTATUS </strong>(narkosguiden)</p>\n<table class=\"card-table\">\n<tr><th><strong>Symtom/ tecken </strong></th><th><strong>Mild </strong></th><th><strong>Måttlig </strong></th><th><strong>Svår</strong></th></tr>\n<tr><td>Viktminskning</td><td>< 5 %</td><td>5–10 %</td><td>> 10 %</td></tr>\n<tr><td>Deficit (ml/kg)</td><td>< 50</td><td>50–100</td><td>> 100</td></tr>\n<tr><td>Allmäntillstånd</td><td>Törstig och orolig</td><td>Törstig, orolig eller slö, halonerad</td><td>Mycket slö till komatös, kall, grå, cyanotisk</td></tr>\n<tr><td>Slemhinnor</ let filter='all', active=null, filtered=[];

function renderList(cards){
  const sb=document.getElementById('sidebar');
  sb.querySelectorAll('.ci').forEach(e=>e.remove());
  document.getElementById('no-res').style.display=cards.length?'none':'block';
  document.getElementById('badge').textContent=cards.length+' kort';
  filtered=cards;
  const frag=document.createDocumentFragment();
  cards.forEach((card,i)=>{
    const el=document.createElement('div');
    el.className='ci'+(i===active?' active':'');
    el.dataset.cat=card.category;
    el.dataset.i=i;
    el.innerHTML=`<span class="dot ${card.category}"></span><span class="ct">${esc(card.title)}</span>`;
    el.addEventListener('click',()=>select(i));
    frag.appendChild(el);
  });
  sb.appendChild(frag);
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function select(i){
  active=i;
  const card=filtered[i];
  document.querySelectorAll('.ci').forEach((el,j)=>el.classList.toggle('active',j===i));
  document.getElementById('placeholder').style.display='none';
  const cv=document.getElementById('card-view');
  cv.style.display='block';
  const cb=document.getElementById('card-cat');
  cb.textContent=card.category;
  cb.className='cat-badge '+card.category;
  document.getElementById('card-title').textContent=card.title;
  document.getElementById('card-body').innerHTML=card.html;
  document.getElementById('content').scrollTop=0;
  if(window.innerWidth<=600){
    document.getElementById('sidebar').style.display='none';
    document.getElementById('content').style.display='block';
  }
}

function showSidebar(){
  if(window.innerWidth<=600){
    document.getElementById('sidebar').style.display='block';
    document.getElementById('content').style.display='none';
  }
}

function getFiltered(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  let c=CARDS;
  if(filter!=='all') c=c.filter(x=>x.category===filter);
  if(q) c=c.filter(x=>x.title.toLowerCase().includes(q)||x.html.toLowerCase().includes(q));
  return c;
}

let timer;
document.getElementById('search').addEventListener('input',()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{
    active=null;
    document.getElementById('placeholder').style.display='flex';
    document.getElementById('card-view').style.display='none';
    renderList(getFiltered());
  },200);
});

document.querySelectorAll('.fb').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filter=btn.dataset.cat;
    active=null;
    document.getElementById('placeholder').style.display='flex';
    document.getElementById('card-view').style.display='none';
    renderList(getFiltered());
  });
});

renderList(CARDS);
</script>
</body>
</html>
