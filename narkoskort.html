er 20 min. Haldol är förstahandsprep. vid hallucinationer. Hemineurin: Kan vara bra att sova på. Olanzapine: Kan vara bra att sova på.</p>", "category": "Sjukdomstillstånd"}, {"title": "Diabetes ketoacidos", "html": "<p><strong>SYMTOM</strong> Utvecklas under kort tid: timmar – dagar. Törst, polyuri, illamående, kräkning, buksmärta, hyperventilation (Kussmail-andning), medvetandepåverkan, acetondoft. <strong>UTLÖSANDE FAKTORER</strong> Nyinsjuknande diabetes, dålig behandlingskontroll, insulinpumpsvikt, infektioner/gastrienteriter, annan stress ex pankreatit, trauma, läkemedel tex SGLT2-hämmare. <strong>Diabetisk ketoacidos vs HNKS</strong> <strong>Diabetisk ketoacidos</strong> <strong>HNKS</strong> Mild Måttlig Svår Plasma glukos, mmol/L >14 >14 >14 >33 pH 7,25-7,30 7,00-7,24 <7,00 >7,30 Bikarbonat 15-18 10-14 <10 >15 Blodketoner (betahydroxysmörsyra) >3 >3 >3 <3 Effektiv plasma osmolalitet, mmol/kg<em> Varierar Varierar Varierar >320 Anjon gap, mmol/L<strong> >10 >12 >12 <12 Vakenhet Vaken Påverkat Koma Koma </em> 2x[Na+] + Glukos </strong> [Na+] – ([Cl-] + [HCO3-]) Normoglykemisk ketoacidos förekommer vid samtidig svält, lågt kolydratintag, kräkningar, leversvikt, SGLT-2-hämmare, alkoholmissbruk.</p>\n<p><strong>BEHANLING</strong> <strong>Timme</strong> <strong>Behandling</strong> <strong>1</strong> <strong>2-5</strong> <strong>6-13</strong> <strong>Därefter</strong> Kristalloid vätska 1 L 0,9% NaCl 1000 ml/h 2 L Ringer-Acetat 500 ml/h 2 L Ringer-Acetat 250 ml/h NaCl eller Ringer-Acetat Insulin Insulin 0,1 E/kg/h iv (om kalium >3,3 mmol/L) Kalium > 5,2 mmol/l: Ingen kaliumsubstitution. 4,0 – 5,2 mmol/l: Kaliuminfusion 10 mmol/h. 3,0 – 4,0 mmol/l: Kaliuminfusion 20 mmol/h. Glukos Starta 5% Glukos 75-125 ml/h när blodglukos < 15 mmol/l eller vid alltför snabb sänkning av blodglukos (> 3 mmol/h). Buffert Överväg 100 ml Tribonat på 1 h om pH < 7,0. Fosfat Överväg vid P-fosfat <0,3 och muskelsvaghet, hjärtpåverkan, andningsdepression. Övrigt Tiamin, antibiotika, trombosprofylax, ulcusprofylax, magnesium. Rekommendationer: - Sänk p-glukos max 3 mmol/h. - Sänkt P-osmolalitet max 3 mmol/kg/h. - Sänk blod-ketoner med minst 0,5 mmol/l/h. - Håll plasma-kalium mellan 4 och 5 mmol/l.</p>\n<p>KÄLLA: Föreläsning med Mårtensson. <strong>Vidare läsning</strong> – finns på internetmedicin</p>\n<p><strong>FOSFAT</strong> Ketoacidos -> osmotisk diures pga högt glukos. Man kissar även ut fosfat. Fosfat finns främst intracellulärt. När man ger insulin så följer fosfatet med in i cellerna och hypofosfatemin avslöjas. Vanligaste orsaken till hypofosfatemi på sjukhus är glukosbehandling.</p>\n<p><strong>INTUBERA/SÖV </strong>ALDRIG<strong> EN KETOACIDOS. </strong>DU KOMMER INTE KUNNA MATCHA EN MINUTVOLYM HOS EN PATIENT SOM ANDAS FÖR FULLT MED 40 ANDETAG PER MINUT!</p>\n<p>NaCl-lösning vid ketoacidos är associerat med högre kalium, sämre njurfunktion, och långsammare regress av acidos. Ringeracetat är ett rimligare val. / Oklar källa.</p>", "category": "Sjukdomstillstånd"}, {"title": "EKLAMPSI", "html": "<p><strong>AKUT BEHANDLING EKLAMPSI</strong> eller svår preeklampsi<strong>:</strong> Bolusdos magnesium: Ta 2 ampuller Addex-Magnesium (=20 ml = 20 mmol = 4,92 g) dra upp, lägg till 20 ml 0,9% NaCl så att du får volym på tot 40 ml, och spruta 35 ml långsamt under 5-10 min. - <strong>Ge ej stesolid eller propofol</strong>. Det bryter ej kramp och skapar en tröttare mamma efteråt. Infusion magnesium: - Ska följa bolusdosen till 24 h efter den senaste krampen. Om profylax, infusion till 24 h efter partus. - Blandning infusion: 5 Ampuller Addex-Magnesium (=50 ml = 50 mmol = 12,3 g)) tillsätts 450 ml 0,9% NaCl. Detta ger totalvolym på 500 ml med MgSO4-koncentration av 0,1 mmol/ml (=24,6 mg/ml). Infusionshastighet 40 ml/h (=4 mmol/h = 984 mg/h) Källa: O-boken.</p>", "category": "Sjukdomstillstånd"}, {"title": "EPIPELPSI / STATUS EPILEPTIKUS", "html": "<p>EPILEPSI (Källa Janusinfo)</p>\n<p>Ca 30% av förstagångsanfallen är provocerade & ca 50% vid status EP; Hypoglykemi, hyponatremi, infektion, stroke, trauma, intoxikation mm. Om misstanke om hypoglykemi ge 50 ml 30% glukos iv. Ca 50% av status EP är triggade av; stroke, trauma, hypoxi, intox, meningit, abstinens, hypoglykemi. Ffa om ej tid EP. Dessa anses ej provocerade: Sömnbrist, alkohol, stress, feber, vätskebrist.</p>\n<p><strong>KONVULSIVT STATUS EPILEPTICUS </strong> KÄLLA <strong>Region Sthlm läkemedelsexpertkommite</strong> neuros<strong>jukdomar</strong></p>\n<p><strong>Diagnos</strong> Om generaliserade tonisk-kloniska kramper >30 minuter el. upprepade generaliserade tonisk-kloniska anfall utan återställt medvetande mellan anfallen. Långvariga toniska-kloniska anfall riskerar neuronskada och möjligheten att bryta anfallsaktiviteten korrelerar med tiden till insatt behandling. <strong>Behandlingsindikation</strong> Ur praktisk klinisk synvinkel: varje patient som införs akut med pågående krampanfall eller är postiktalt påverkad och får ett nytt anfall skall ha omedelbar farmakologisk behandling. Ett anfall som varar >5 minuter bör också föranleda behandling.</p>\n<h3>BEHANDLING</h3>\n<p><strong>STEG 1</strong>: Tidig behandling<strong> Diazepam(Stesolid) 10 mg i.v. Om > 75 år; 5 mg. Vänta högst 2 min på effekt. Om ambulansen redan givit stesolid, gå direkt till steg 2. </strong>STEG 2:<strong> Fulldos stesolid: </strong>Diazepam (Stesolid)<strong> </strong>i fulldos: 0,2 mg/kg i.v. Om >75 år ge 0,1 mg/kg i.v. <strong>Samt: </strong> - I första hand: <strong>Natriumvalproat</strong> (Ergenyl): 400 mg/ampull löses med 4 ml sterilt vatten -> 100 mg/ml.  Ge 30 mg/kg i.v. Halvera dosen om pat. har valproatbehandling sedan tidigare. Ge ej till: Kvinnor i fertil ålder, patient med leversvikt, känd koagulationsrubbning, eller mitokondriell sjukdom. - <strong>Eller i andra</strong> hand om ej Natriumvalproat: <strong>Levetiracetam (Keppra</strong> 2 000–4 000 mg koncentrat späds med 100 ml ringer eller 0,9 % NaCl och ges som intravenös infusion under 15 minuter). I normalfall ges 3 000 mg. Lägre doser ges till äldre multisjuka patienter, vikt <60 kg, känd njursvikt, och patienter som står på levetiracetam sedan tidigare. <strong>Steg 3: Refraktärt status EP</strong> Sövs med Propofol. Infundera propofol 5-10 mg/kg/h tills anfallsaktiviteten upphört. Sedan 1-5 mg/kg/h. Dosering styrs av kliniskt svar och cEEG. Därpå 24 h behandling med dos där anfallsaktivitet ej ses. Om underhållsdos propofol >5 mg/kg/tim behövs så överväg att byta till tiopentalnarkos pga risk för propofolinfusionssyndrom. - Efter 24 timmars anfallsfrihet kan uttrappning ske successivt under 6–12 timmar med samtidig EEG övervakning. - Inför planerad uttrappning av propofol bör antiepileptisk underhållsbehandling i adekvata serumkoncentrationer etableras. - Vid recidivanfall under nedtitrering sker återgång till närmaste effektiva dosnivå i ytterligare 12–24 timmar samtidigt med nytt ställningstagande till antiepileptisk underhållsmedicinering. Vid >1 uttrappningsförsök med anfallsrecidiv bör propofol ersättas successivt med tiopental enligt nedan. <strong>Steg 3b: Tiopentalbehandling</strong> hos pat som redan är sövd<strong> m. propofol</strong> 1. Laddningsdos i form av upprepade doser om 50-100 mg upp till 5-7 mg/kg beroende på cirkulation och anfallsfrihet. 2. Därpå infusion 3-5 mg/kg/h. Propofol kan oftast också trappas ut i detta skede. Dosering styrs av kliniskt och cEEG-svar. Behandlingsmål är anfallsfrihet på cEEG, inte burst supression. 3-5 burstar/min är den maximala behandlingsnivån av behandlingen. 3. 24 h anfallsfrihet krävs. Inför planerad utsättning bör antiepileptisk underhållsbehandling etableras. 4. Tiopental har efter infusion lång halveringstid (10 h, stor individuell variation) och infusionen kan i regel avbrytas helt utan nedtrappning. Observera risk för hyperkalemi. 5. Vid anfallsrevcidiv efter avslutat infusion återinsätts Tiopental i doser som ger klinisk och EEG-mässig anfallsfrihet. <strong>Biverkningar av tiopentalsedering:</strong> Minskad tarmmotilitet, begränsa därför enteral nutrition till 20 ml/h. Cirkulatorisk påverkan, ciliedysfunktion och risk för lunginflammation. Intracellulärt skifte av kalium: hypokalemi under behandling och hyperkalemi vid väckning. Nedre referensvärde för s-kalium är 2,6 vid pentosövning och substituera med stor försiktighet, upp till max 3,2 mmol/L.</p>\n<h3>ÖVRIGT</h3>\n<p><strong>Todds pares</strong>: <strong> Tidigare pares efter ex stroke blir övergående mer uttalad efter upp till 2 dygn efter krampanfall. </strong>Icke konvulsivt status ep:** Relativt ovanligt, EEG krävs för diagnos, ibland ensata ryckningar preifert eller i ansiktet.</p>", "category": "Sjukdomstillstånd"}, {"title": "ETYLENGLYKOL - FÖRGIFTNING", "html": "<p>OBS! Om beslut att dialysera bort Etylenglykol. TÄNK PÅ ATT etylenglykol är <strong>osmolärt aktiv</strong> och att man riskerar att skada pat. om man dialyserar för snabbt! Stäm av med folk! Risk för <strong>hjärnödem</strong>.**</p>", "category": "Sjukdomstillstånd"}, {"title": "FÖRMAKSFLIMMER PÅ IVA / POSTOP", "html": "<p><strong>FÖRSLAG HANDLÄGGNING PÅ IVA</strong> a) Kolla vätskestatus. b) Substituera magnesium (> 1), kalium (>4). c) Därpå ev defibrillering, amiodarone eller digitalis. (På NIVA är det ok att deffa typ alla pat förutom instabila halsryggar och aneurysm.) <strong>CORDARONE, DIGITALIS</strong> <strong>- Cordarone och Digitalis fungerar jättebra tillsammans. </strong>Digitalis<strong> är både frekvensreglerande och inotropt. - Diskussion på kliniken i plenum: <em>Man behöver inte vara rädd för digitalis på IVA! Vissa kör det ofta. Kolla kalium innan. Vi vill ju inte ha den negativa inotropa effekten på IVA med betablockad. Likaså har cordarone en sån effekt.</em> <em>Kardiologerna fnyser nog åt vårt liberala cordaroneanvåndande.</em> </strong>- För akut digitaliering. Se narkoskort om Digitalis.<strong> </strong>Cordarone<strong>- Man kan ge en Cordaronebolus 150 - 300 mg på ca 30 min. Är pat. akut dålig så kan man ge 150 mg-bolus på någon minut. Biv: BT-fall. Sedan kan man starta cordaroneinfusion som normalt brukar vara 1200 mg/dygn. Se separat anteckning<em> ”Cordarone” </em>för doseringsförslag. Efter en totaldos på 8 g så är effekten i regel marginell. Pausa infusionen vid puls <70, men är det viktigt med sinus ex hos hypertrofa pat., så halverar man dosen istället. - Lidocain är negativt inotropt. Cordarone är därför 1a-handsmedel av dessa 2. - </strong>Kombinera ej Cordarone och Betablockad<strong>. Risk för allvarlig bradykardi eller asystoli. Endast om pat. har pacemaker. </strong>ÖVRIGA ANTECKNINGAR<strong> - Lågt kalium ökar HF. Reglera K+ om svårt att frekvensreglera pat. - Långsamma förmaksflimmer behöver pacemaker, INTE elkonverteras. - Elkonvertera ej pat. Med långsamt ff < 80. Risk för svår bradykardi. </strong>FÖRMAKSFLIMMER UNDER ANESTESI<strong> </strong>- <strong>Deffa om instabil hemodynamik. </strong>- <strong>Om väs stabil hemodynamik kan man prova Amiodarone 150 mg iv för att slå tillbaka till SR (Massachusets). </strong>- **Frekvensreglering med ex metoprolol i doser om 2,5-5 mg. Eller Esmolol i doser om 5 -10 mg (Massachusets)</p>\n<p>Källor: Blandad. Massachusets. Kolelgor på Thorax, IVA, NIVA.</p>", "category": "Sjukdomstillstånd"}, {"title": "FÖRSTOPPNING PÅ IVA", "html": "<p>* Mobilisering och tillmatning.</p>\n<p>* Naloxonmixtur: Maxdos? Har väldgit hög förstapassagemetabolism så det är mkt små systemiska effekter. Man måste inte vara morfinbehandlad för att få naloxonmixtur. man har en del endogena opioider anser man.</p>\n<p>* Movikol</p>\n<p>* Primperan vid ventrikelretention: Interagerar med många LM. Så det blir i andra hand.</p>\n<p>* Neostigmin: Vid extrem paralys. Iv eller subcutant? Biv: Kan bal dregla och bli bradykard.</p>\n<p>* Relistor: Används mkt sällan. Är jättedyrt och tunn vetenskap. Passerar ej CNS.</p>", "category": "Sjukdomstillstånd"}, {"title": "GI-blödning (akut) / Gastrointestinal blödning", "html": "<p><strong>ÖVRE GI-BLÖDNING</strong> <strong>B</strong>akgrund<strong>/orsaker</strong> - Lig. Treitz är skiljelinjen mellan övre och nedre GI-blödning. - Ca 6% av pat. med blödande ulcus avlider under vårdtiden, flertalet är äldre med komorbiditeter. - Varicier, ulcus, aortoduodenal fistel, angiodysplaci/Oslers sjukdom, Mallory-Weiss. - Obs: Om tid op för AAA - Aortodudenal fistel till motsatsen bevisad! Orsakas av infektion i graftet. <strong>Klinisk bild</strong> - Oftast hematemes eller melena. Färskt blod per rectum (hematochezi) kan vara tecken på större övre GI-blödning. Buskmärta av blod som passerar tarmkanalen. - Riskfaktorer: Bla tid. känt ulcus, antikoagulantia, SSRI-preparat och kortison, leversjukdom, cirros, etylanamnes. - Fråga även om: NSAID-intag, antikoagulantia, tid sjukdomar. <strong>Handläggning av påverka</strong>d<strong> patient</strong> - Värdera cirkulatorisk påverkan. Monitorera. Grova infarter. Blodstatus/elstatus/koagstatus (glöm ej följa upp TPK som kan vara lågt hos leversjuka) - Skyndsam stabilisering med transfusion. Inläggning CIVA eller direkt till op för åtgärd. - Överväg gå till opsal med möjlighet till coiling. - Sätt grov V-sond ex Ch-18. - Vid möjligt ulcus: Esomeprazol eller Pantoprazol 80 mg bolusdos i.v. och därpå infusion 8 mg /h i 72 h. - Vid möjligt varicielödning (för reduktion av portatryck): <strong>Terlipressin (Glypressin)</strong> 2 mg i.v. Kan sättas in x6 i.v. i 2-3 dgr. Alternativt eller i kombination så kan infusion <strong>Ok</strong>t<strong>reotid (Sandostatin)</strong> 25 mikrog/h ges. - Vid. Waranbehandling och/eller PK >1,5: <strong>Ocplex</strong> initialdos 1500 IE (10-30 IE/kg). Vid mycket högt PK kan ytterligare dos vara aktuell. PK kontrolleras 5-10 min efter avslutad infusion och vid kvarstående PK > 1,5 kan ytterligare 500 (till 1000) IE ges. <strong>Konakion</strong> ges också: 10 mg i.v. Effekten av Ocplex avtar efter 6-8 h. - Vid fortsatt blödning trots Ocplex: Ge <strong>desmopressin (Octostim)</strong> 0,3 mikrog/kg i.v. Kan upprepas 1-2 ggr m. 6-12 h intervall. - Vid NOAK: Ring koagulation alt. kolla Svenska Sällskapet för Trombos och Hemostas (SSTH). - Vid trombocythämning ex Trombyl, Plavix, Brilique: Cyklokapron 1 g i.v. Överväg Octostim 0,3 mikrog/kg i.v (kontraindicerat vid ischemisk hjärtsjd./svikt, ökat intrakraniellt tryck). Överväg trombocyttransfusion. VID WARANBEHANDLING FÖLJ NEDAN: PK kontrolleras 5-10 min efter första Ocplex injektion och sedan 6-8 tim senare. Vid behov kompletteras med ytterligare inj. Ocplex enligt tabell för att vidmakthålla målvärde PK > 1,5. <strong>Källa: Internetmedicin.</strong> <strong>NEDRE GI-BLÖDNING</strong></p>\n<p>Vanligaste orsakerna: Blödande divertikel (ca 40 %), Ischemisk kolit (ca 19 %), Kolorektala tumörer (cancer/polyper, ca 17 %), Anorektala åkommor (fr a hemorrojder, ca 5-10 %), Upp till ca 15 % av de patienter som uppvisar hematochezi (färskt blod per rektum) har massiv akut övre GI-blödning. Behandling: Vid antikoagulantia, se ovan.</p>", "category": "Sjukdomstillstånd"}, {"title": "GUILLAIN – BARRÈ SYNDROM EJ KLAR!", "html": "<p><strong>Intro.</strong> - Akut inflammatorisk polyneuropati. Är den vanligaste slappa paresen i västvärdlen sedan polio eradikerades. - Ca 1/3 behöver mekanisk ventilation. - Presentation: Ett spektrum av akuta neuropatier med olika varianter. Vanligaste formen i Euorpa och USA är AIDP (acute inflammatory demyelinating polyradiculoneuropathy). Hos de övriga varianterna så är det nervaxonet snarare än myelinskidan som påverkas. Här finns subvarianterna: Ren motorpåverkan; acute motor axonal neuropathy AMAN (vanligare i Kina): ren sensorisk påverkan acute sensory neuropathy: eller både och, acute motor and sensory axonal neuropathy AMSAN. I sin renaste form så är Fischer syndrome en variatnt med en triad av akut opthalmoplegi, ataxi och areflexi. Om överlapp med respiratorisk svaghet så kallas den Fisher overlap syndrome. - Neurofyiologisk testning särskiljer varianterna. - 1,5 ggr vanligare hos män. - Ca 2/3 av fallen föregås av en influenzaliknande infektion eller gastroenterit inom 6 v. Bla Campylobakter, cytomegalovirus, EBV, Mycoplasma pneu., HIV. <strong>SYMTOM</strong> <strong> - Klassisk presentation är symetrisk uppåtgående motorisk paraly som sprider sig från timmar till veckor. - Svaghet involverar både distala och proximala muskeögrupper. 90% når maximala symtom inom 3 v och återhämtning tar ca 2-4 v efter att progressionen avstannat. - Om symtomutveckling fortsätter längre än 4 v bör man överväga diffdiagnosen kronisk inflammatorisk demyeliniserande polyneuropati CIDP (viktigt att särskilja dessa då behandlingen skiljer sig). - I enstaka fall kan GBS presenteras med explosivt insjuknande med total motorisk och autonom paralys liknande hjärnstamskada. - Djupa senreflexer försvinner nästan alltid inom första veckan. - Distal avdomning och parestesi är vanligt. - Smärta är vanligt, ofta i rygg och ben. - Ca 75% får kranialnervsengagemang. - Autonom nervpåverkan förkommer och är vanligare hos de med uttalad svaghet med symtom såsom taky- bradykardi, instabilt blodtryck, svettningar, ileus, urinretention. </strong>DIAGNOS<strong> - Amanes, likvorprov, neurofysiologisk undersökning. </strong>BEHANDLING<strong> - Immunmodulerande behandling (plasmaferes, IvIG). - Understödsbehandling inkl. intensivvård.   </strong>Källa:** Oxford textbook of Critical care, sec. ed. Webb.</p>", "category": "Sjukdomstillstånd"}, {"title": "HEMIKRANIEKTOMI / HEMIKRANIEKTOMERADE", "html": "<p><strong>GENERELLT OM HEMIKRANIEKTOMERADE PÅ NIVA</strong> - Trots hemikraniektomi så kan man ha ett högt tryck på andra sidan falx cerebri då hjärnan inte kan bukta hur mycket som helst. Samma sak gäller ju för skallgropen där man kan ha högt tryck utan att det fortplantas upp supratentoriellt till ex. V-dränet.</p>", "category": "Sjukdomstillstånd"}, {"title": "HJÄRTSTOPP (Ej klar)", "html": "<p><strong>REVERSIBLA ORSAKER TILL HJÄRTSTOPP</strong> <strong>Hjärttamponad</strong> <strong>Hjärtinfarkt</strong>   <strong>Vid STEMI/nytt LBBB på EKG efter ROSC har >80% akut coronar skada och skall därför genomgå akut CorAi & vid behov PCI. </strong>Hyperkalemi<strong>     - Spruta Calciumglukonat 1000 mg (10 ml?) eller Calciumklorid 5-10 ml), 10 IE Humalog + 25 g glukos = 50 ml 50% glukos eller 80 ml 30% glukos under 5 min. (Källa: Uptodate). Vi hypovolemi: NaCl-infusion. </strong>Hypovolemi<strong> </strong>Hypoxi<strong> </strong>Hypotermi<strong> </strong>Lungemboli<strong> </strong>- ECMO eller Actilyse (alteplase) 0,6 mg/kg max 50 mg i.v. på 2 min, följt av 50 mg på 60 minuter. <strong>Toxiner</strong> <strong>Torsades de pointes:</strong> Deffa, Ge ej Cordarone, ge Magnesiumsulfat 1-2 gram = 40 mmol på 15 min, ev påföljande infusion. Eftersträva kalium på 4-5. <strong>Digoxinförgiftning: </strong>Bla Magnesium <strong>Hyperkalemi: </strong>Kalcium, Humalog, Buffring, ex Tribonat 50 mmol (100 ml). <strong>Intox TCA:</strong> Buffring, ex Tribonat 50 mmol (100 ml). <strong>ECMO-kriterier:</strong> Bevittnat, pågående HLR, defibrillerbar rytm, ålder <75, gärna laktat <15. Något mer? <strong>HJÄRTSTOPP HOS GRAVID – VANLIGASTE ORSAKER</strong> – EJ LUKAS<strong> Blödning Lungemboli Fostervattenemboli Peripartumkardiomyopati Preeklampsi/eklampsi Genital sepsis Anestesikomplikationer (Även saker som kvinnor i fertil ålder kan drabbas av: hjärtinfarkt, aortadissektion, sepsis) </strong>RESPIRATORINSTÄLLNINGAR<strong> FiO2 100%, TK, AF 10, PEEP = 0, I:E 1:3, inspirationstryck ca 10 cmH2O, justera för tidaler ca 6-7 ml/kg, ändra inte larmgränserna, man vill ju inte bygga upp höga tryck i thorax. </strong>PÅ AKUTRUMMET<strong> Flytta över först, sedan rapport. Analys så fort det går, det har typ alltid gått 2 min från ambulans till akutrum. Glöm inte spela in när du gör ultraljudet i pausen. iGEL är OK om svårt att få ned tub, du får max använda 5 sek uppehåll för att föra ned tuben. Meddela så fort du fått på koldioxiden till akutläk. Meddela koldioxid efter varje def. Koldioxiden kopplas upp på X2an. Känn efter carotispuls när du står vid huvudändan. Man ska känna puls under pågående kompressioner. Ljumskarna är sämre då man kan råka könna venösa pulsationer från kompressionerna. </strong>LUCAS:** Sätt på en sida i taget. Om man försöker trycka på båda fästena ovanifrån på en gång så blir det strul. Kontraindukationer: Ålder <18 år, gravida, för stor eller för liten patient.</p>", "category": "Sjukdomstillstånd"}, {"title": "HJÄRTSTOPP avsluta HLR", "html": "<p><strong>Källa: Läkartidningen, ABC om Hjärtstopp på akuten, med bla Therese Djärv.</strong>             <strong>BESLUT ATT AVBRYTA ÅTERUPPLIVNINGSFÖRSÖK</strong>                         <strong>FAKTORER ASSOCIERADE MED SÄMRE PROGNOS VID HJÄRTSTOPP</strong>             HLR > 40 minuter vid initialt defibrillerbar rytm             HLR > 20 minuter vid asystoli/PEA             Initial rytm asystoli/PEA (i stället för VF/pVT)             Obevittnat hjärtstopp             Frånvaro av bystander-HLR             Avsaknad av hjärtaktivitet vid upprepad ultraljudsundersökning             Lågt och sjunkande endtidalt CO2             PEA = Pulslös elektrisk aktivitet             VF/pVT = ventrikelflimmer/pulslös ventrikeltakykardi                         Det finns inga etablerade kriterier för när HLR bedöms utsiktslös och ska avbrytas. Det finns heller ingen enskild parameter, såsom pupillreaktion, ålder, laktatvärde eller myokardkontraktilitet, att luta sig mot. Teamet får sammanväga patientens hälsotillstånd och livskvalitet före hjärtstoppet samt patientens svar på A-HLR.             Observationella studier visar att 99 procent av överlevarna fångas inom 25–45 minuters HLR [2, 61-64]. Enligt en studie var stillastående hjärta vid ultraljudsun-dersökning associerat med 0,6 procents överlevnad till utskrivning från sjukhuset [65]. Det finns dock ingen samsyn om hur ett stillastående hjärta ser ut vid ultraljudsundersökning [66]. Slutsatsen från en översiktsartikel är att det inte finns något ultraljudsfynd med etablerad prognostisk valör [67, 68]. Trender i endtidalt CO2 kan upplysa om hjärt–lungräddningens kvalitet, hjälpa till att upptäcka ROSC             och bidra med prognostisk information [5].</p>", "category": "Sjukdomstillstånd"}, {"title": "HJÄRTSTOPP HANDLÄGGNING PÅ IVA", "html": "<p><strong>TEXT NEDAN </strong>MESTADELS <strong>BASERAD PÅ ALFRESCOS: Hjärtstopp behandling efter ROSC på IVA.</strong> <strong>SEDERING</strong> Bör sederias de första 24 h för att undvika kardiell stress med risk för arytmier. Kortverkande läkemedel förespråkas. Adekvat sedation reducerar O₂ konsumtionen. Sederingsmålet är RASS -4 till -5. <strong>TEMPERATURKONTROLL</strong>. PM KS KAR2-1978.<strong> ESICIM: Undvik feber (≤37,7°C) i minst 72 timmar för patienter som är medvetslösa efter hjärtstopp. Vid initial temp <33°C tillämpas aktiv uppvärmning till 33°C. Vid temperatur 33-36°C tillämpas passiv uppvärmning (filtar). Vid blödningskomplikation övervägs aktiv uppvärmning till normotermi (>36,5°C). Temperatur >37,7°C ska i första hand undvikas med antipyretika, ta bort filtar från patienten etc. Om feber inte kan undvikas trots dessa åtgärder startas aktiv temperaturkontroll med kyldräkt med måltemp 37,5°C. För att behandla shivering används sedativa, opioider (Petidin), paracetamol, magnesiumsubstitution, strumpor/vantar och i sista hand muskelrelaxantia. För handhavande av Artic Sun se pm nämnt ovan. </strong>SHIVERING<strong> PM ALFRESCO</strong> Muskelaktiviteten leder till ökad energiförbrukning och kardiell belastning vilket är negativt efter hjärtstopp. 1. Ökad sedering/bolusdoser av sederingen. 2. Mg 10 mmol iv (spädes i 100ml NaCl och ges på 10min) 3. Minskad perifer kyla i händer och fötter, tex mha filt, vantar el strumpor. 4. Paracetamol iv sedvanlig dos. 5. Catapressan 1 - 2 μg/kg iv om pat ej är hypotensiv. 6. Muskelrelaxantia om ovanstående ej hjälper (risk att maskera kramper): Rocuronium 0,6mg/kg i bolus samt infusion (spädning 5ml 10 mg/ml Rocuronium + 45ml NaCl-> 1mg/ml) 10ml/timme ges. Obs på nacke och extremiteter vid vändning och lägesändring. <strong>KRAMP</strong> Vanligt efter hjärtstopp, förekommer hos ca 1/3  av de som är fortsatt medvetslösa efter ROSC. Myoklonier vanligast, men generaliserade kramper förekommer. <strong>EEG</strong> används för att diagnostisera eventuell epileptiform aktivitet. Kramper ökar cerebral metabola aktiviteten och kan därmed förvärra hjärnskadan. Profylaktisk behandling är ej rekommenderat pga risken för biverkningar. Status myoklonus och status EP är relaterat till sämre prognos, men god outcome förekommer. Keppra vb. <strong>PROGNOS</strong> - Viktigaste faktorn är deffbar rytm som första rytm. Dom som läggs in på IVA och hade deffbar rytm har en överlevnad på cirka 50%, om annan rytm cirka 10%. NSE: Proteinbiomarkör som frisätts efter skada på neuron och gliaceller. Om nivåerna är låga <20 μg/L- positivt tecken. På icke ECMO patienter är nivåer >60μg/L 48h och 72h efter ROSC och ökning med >6μg/L mellan 2 mätningar ett dåligt prognostiskt tecken. Kan ej användas säkert på ECMO-patienter pga stiger vid hemolys. - 94% av de som vaknar, vaknar inom 4,5 dagar, resterande 6% av de som vaknar gör det inom 10 dagar. Ibland behövs längre observationstid, även patienter som vaknar sent kan ha god neurologisk outcome! <strong>KLINISK BEDÖMNING</strong> <strong>Pupill </strong>&<strong> Cornealreflex:</strong> Bilateral frånvaro av pupillreflexer eller cornealreflex 72 h efter ROSC förutspår dålig outcome. Reflexerna kan vara försvunna tidigt men återkomma när hjärnstammen hämtar sig efter några dygn. <strong>Smärtstimulering: </strong>Frånvaro av motoriskt svar på smärta 72h efter ROSC har en hög sensitivitet för dålig outcome, men även många falskt positiva: 27%. <strong>Myoclonus: </strong>Myoclonus ej förenat med sämre prognos men status myoclonus (>30min) inom 48t efter ROSC är förenat med sämre prognos. Pat med status myoclonus skall evalueras med EEG. För korrekt bedömning skall sederingen ha satts ut i tid. <strong>EEG: </strong>1:<strong> Frånvaro av EEG bakgrundsaktivitets reaktivitet ett dåligt prognostiskt tecken 48-72t efter ROSC. </strong>2:<strong> Status EP är nästan alltid associerat med dålig prognos.</strong>3:<strong> Burst suppression: När >50% av EEG vågorna är <10μV. Hos medvetslösa patienter är det ofta ett övergående mönster. Förekommer det på EEG 24 - 48 t efter ROSC kan det vara associerat även med god neurologisk prognos. På EEG taget >72 timmar efter ROSC är det associerat med dålig prognos. </strong>SSEP: <strong>(Short -latency somatosensory evoked potentials). Skickar signaler via medianusnerven och ser om N20 signalen i hjärnan påverkas. Bilateral frånvaro av N20 SSEP vågor dåligt prognostiskt tecken 24t efter ROSC. SSEP kan användas som stöd i beslutandet att avsluta livsuppehållande behandling. Felkällor är störning i signalen. </strong>STRATEGI FÖR BEDÖMNING<strong> Noggrann klinisk undersökning. Kan ej lita på klinisk bedömning om sedativa används <12 h sedan. Utvärdera de säkraste prediktorerna först. Bilateral frånvaro av pupill/cornealreflexer >72t efter ROSC och bilateral frånvaro av SSEP N20. Om inga av ovanstående tecken finns för att förutsäga dålig prognos skall man gå vidare med nästa grupp prediktorer som är lite mindre säkra: Förekomst av status myoclonus <48t från ROSC. Höga NSE/NFL värden vid 48-72t efter ROSC. Högmalignt utseende på EEG (burst suppression el status epilepticus) efter återkomst till normaltemperatur. Nedsatt GW-ratio eller en CT-hjärna inom 24-48t efter ROSC med tecken på utbredda ischemiska skador. MR inom 2 - 5 dagar med tecken på utbredda ischemiska skador. Man bör vänta minst 24 timmar efter bedömningen med de första prediktorerna tills man går vidare med dessa. Man bör också kombinera minst 2 olika prediktorer. Inga specifika NSE, S-100 värden kan i nuläget rekommenderas men man skall följa trenden och ta prover efter 24, 48 och 72t </strong>MÅLVÄRDEN<strong> </strong>Parameter <strong> </strong>Mål <strong> </strong>Kommentar ** Saturation 94 - 98 % Undvik hypoxi/hyperoxi PCO2 4,6 – 6,0 kPa Tidalvolym 6 - 8 ml/kg Topptryck <30 , PEEP 5 – 10. Vätska Titreras upp till 30 ml/kg RingerAcetat 1:a hand MAP 60 - 70 mmHg Beroende på patient (På Ecmo 60 – 65mmHg) Diures 0,5 - 1 ml/kg/timma Kalium 4 - 4,5 mmol/l Temperatur Se ovan. Sederingsmål Rass -4 - -5 P-glukos 6-10</p>", "category": "Sjukdomstillstånd"}, {"title": "PEA – PULSLÖS ELEKTRISK AKTIVITET", "html": "<h3>A-HLR pågående under hela förloppet</h3>\n<table class=\"card-table\">\n<tr><th><strong>Diffdiagnoser</strong></th><th><strong>Indentifiering</strong></th><th><strong>Åtgärd</strong></th></tr>\n<tr><td>Lungemboli</td><td>Ta EKG, leta efter DVT-tecken, ultraljud på benen.</td><td>Trombolys (50 mg Actilyse i.v./i.o. som bolus, därefter 50 mg som infusion på minst 60 min.</td></tr>\n<tr><td>Hypokalemi</td><td>Blodgas</td><td>Om <3 mmol/L ge 10 mmol KCl + 5 mmol Mgsulfat, återupprepa vb.</td></tr>\n<tr><td>Hyperkalemi</td><td>Blodgas</td><td>Om > 5 mmol/L – ge Kalciumglukonat 9 mg/ml, 30 ml. Ge 10 E humalog iv/io.</td></tr>\n<tr><td>Hypoglykemi</td><td></td><td>Ge 50 ml 30% glukos.</td></tr>\n<tr><td>Hypo-/hyperkalemi, hypoglykemi</td><td>Ta blodgas.</td><td></td></tr>\n<tr><td>Hypovolemi</td><td>Anamnes, tecken på blödning,</td><td>Infundera vätska.</td></tr>\n<tr><td>Hjärttamponad - Perikardiocentes</td><td>Ultraljud, halsvenstas.</td><td>Infundera vätska, perikardiocentes.</td></tr>\n<tr><td>Ventilpneumothorax</td><td>Perkutera lungor, ultraljud, halsvenstas,</td><td></td></tr>\n<tr><td>Nedkyld</td><td>Ta tempen (borde vara uppenvart)</td><td>Ge inga LM vid temp <30. Temp 30-35, dubbla tidsintervall.</td></tr>\n<tr><td>Hypoxi</td><td>Saturationsmätare</td><td>Syrgas.</td></tr>\n<tr><td>Intoxikation</td><td></td><td>Ring Giftis 010 45 66 719.</td></tr>\n</table>\n<p>Perikardiocentes-spruta, hemmabygge: Grov nål med 5 ml-spruta med lite koksalt (cekalon?), gå igenom huden, spruta bort pluggen, avancera, aspirera blod, koppla på lång trevägskran med stora sprutor att aspirera med.</p>", "category": "Sjukdomstillstånd"}, {"title": "HJÄRTINFARKT", "html": "<p>Övergående STEMI: Skall också till PCI! God prognos men behöver lika många</p>\n<p>stent sompersisterande STEMI.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPERKAPNI / KOLDIOXID", "html": "<p>(Ondines syndrom: Superovanlig sjd. där man måste komma ihåg att andas. Apéer under sömning. Varierande svårighetsgrad)</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPOGLYKEMI", "html": "<p>Ge iv. glukos 30% (300 mg/ml) tills pat. vaknar/normaliserar glukos. (ca 10-80 ml)</p>\n<p>Om fri infart saknas överväg Glukagon 1 mg (engångsspruta).</p>\n<p>Överväg fortsatt glukosinfusion när pat. vaknat.</p>\n<p>Finns även 20% glukos.</p>", "category": "Sjukdomstillstånd"}, {"title": "HÖGERKAMMARSVIKT – Ej klar", "html": "<h3>ANESTESI OCH HÖGERSVIKT</h3>\n<p>- Farligt of course.</p>\n<h3>Preop optimering</h3>\n<p>- Fundera på vad du vill behandla. Om det är PAH så är de basala sakerna som är viktigast såsom koldioxid och pH. Gällande inhalation så är Ilomedininhalation mer effektivt. Å andra sidan påverkar Ilomedin trombocyterna. Då är det med safe att inhalera Corotrop. - (Thorax: Efter op TEA pulmonalis under uppvärmningen ger man Revatio (Sildenafil) 10 mg i.v. samt 3-4 mg Corotrop.)</p>\n<p>Både Levo och Milrinon är inotroper och minskar PVR. Dock är ju milrinone mer styrbart. Levo o milrinone är sannolikt bättre än dobutamin om vänstersvikt är en bidragande orsak. Vill man åt ökad frekvens aå är kanske dobutamin ett alternativ. För att få upp frekvensen kan man använda Dobutamin, Isoprenalin eller pace. Ökad risk för arytmier förståss vid isopreb eller dobutamin behandling. <strong>Vid pulmonell hypertention</strong> För att vidare minska HK afterload så kan man ge iv prostacyklinanaloger. De som inte tål iv behandling pga hypotension kan inhalera NO eller prostacyklin (eller corotrop?). Efter hkir: Vid höga PAtryck så kan det vara dåligt med högre frekvens då cirkulationen HK-myokardiet kan liksom VK vara beroende av diastole.. Nummer 1 är att minska den pulmonella hypertebsionen så rår man coronarperfusion i bpde syst och diast. Inhalation ilomedin är mer kortverkande än corotrop. Ilomedin minskar äveb tpk ej kul efter op. ”Du måste alltid mäta vad du gör”. Högersviktare ska inte vara bradykarda. Är de dåliga så ska man hålla en hjärtfrekvens kring 100. Kollega: Man ökar frekvensen för att minska väggtensionen på HK genom att förkorta diastole. Man får även ett bättre blodflöde till VK. Blodflödet i högerkoronaren finns även under diastole så näringstillförseln påverkas ej. Man pacear i regel upp pat. efter ECC då högerkammaren inte  mår så bra av ECC. <strong>Vid infarkt</strong> Var mkt försiktig med nitro och furix då venöst återflöde minskar vilket kan vara delitärt.</p>", "category": "Sjukdomstillstånd"}, {"title": "HJÄRTHYPERTROFI / HYPERTROFI", "html": "<p><em> Välfylld </em> Corotrop har utöver inotropi och perifer vasodilatation en lucitrop effekt vilket hjälper hjärtats relaxation. Kan vara bra mot en hypertrof kammare med förutsättning för utflödesobstruktion</p>", "category": "Sjukdomstillstånd"}, {"title": "HJÄRTTAMPONAD / TAMPONAD", "html": "<p><strong>FULL</strong> – Välfylld med bra preload.</p>\n<p><strong>FAST</strong> – Undvik bradykardi.</p>\n<p><strong>TIGHT</strong> – Undvik perifer vasodilatation då pat. inte kan kompensera med ökat CO. Använd inotroper.</p>\n<p><strong>Ej höga PEEP eller höga intrathorakala tryck</strong>. Håll gärna pat. spontanandandes med Ketalar eller Sevo.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPERKALEMISK PERIODISK PARALYS", "html": "<p>Obs detta gäller <strong>hyper</strong>kalemisk periodisk paralys, inte <strong>hypo</strong>kalemisk periodisk paralys. <strong>BAKGRUND</strong>  - Neuromuskulär sjukdom, tillhör gruppen periodiska förlamningar/kanalopatier tillsammans med hypokalemisk periodisk paralys och myotonia congenita. - Natriumkanalrubbning. - Symtom: Milda attacker av muskelsvaghet/paralys som inte drabbar andningsmuskulaturen. Under en attack stiger serumkalium vanligen till över 6 mmol/l, ofta kombinerat med hemokoncentration. Provoceras av vila efter ansträngning och kalium. Ex barn på gympan som inte kan resa sig upp efter vila. Vanligt att symtomen kommer på morgonen dagen efter fysiska aktiviteter. Svagheten kan också utlösas av kyla, måltider med mycket kolhydrater, hormonsvängningar eller sömnbrist. - K+-restriktion ex. ej äta bananer etc. - <strong>Ej</strong> associerat med hjärtpåverkan eller engagemang övriga organ. <strong>KOMPLIKATIONER</strong> - Risk för hyperkalemi. - Risk för malign hypertermi (associerat med detta). <strong>CAVE</strong> - <strong>Anestesigas</strong> - Tillståndet är associerat med malign hypertermi. Anestesimaskinen ska rengöras såsom vid malign hypertermi. Se separat anteckning. Anestesigas anges som ”går sannolikt att använda”. Dock är man rädd för MH och därmed ska man inte ge detta!. - Ge ej <strong>Celo</strong>, ej <strong>Neostigmin</strong>. <strong>ANESTESI</strong> - Propofol OK. Remifentanil OK. Esmeron OK. - Följ kalium med täta blogaser. Uppmärksamhet på EKG. - Skydda mot nedkylning. Shivering och hypotermi kan orsaka hyperkalemi. - Behandla ev. hyperkalemi med Humalog iv med 30% eller 50% glukos. - Uppmärksam på tecken till malign hypertermi. <strong>KÄLLOR</strong> Socialstyrelsen - Hypokalemisk periodisk paralys.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPOKALEMI EJ KLAR", "html": "<p><strong>Definition: </strong>P-Kalium <3,5 mmol/L. Mild: 3-3,5. Måttlig: 2,5-3,0. Svår: >2,5.</p>\n<p><strong>Anestesi </strong>&<strong> hypokalmi: </strong>I regel; kronisk mild hypokalemi (3-3,5 mmol/L) och normalt EKG är ej förenat med ökad risk vid anestesi. Obs! Detta gäler ej digoxinbehandlade som skall ha högre Kalium (gärna 4 mmol/L). / Morgan and Mikhails 5th ed.</p>\n<p>En minskning från P-kalium från 4 till 3 mmol/L motsvarar en förlust på cirka 100 – 200 mmol K totalt. Ett P-kalium under 3 mmol/L motsvara en brist på cirka 200 – 400 mmol Normalintag vuxna ≈ 80 mmol/dag i snitt (från 40-140). Ca 70 mmol utsöndras via urinen och resterande 10 mmol utsöndras via GI.</p>\n<h3>ORSAKER</h3>\n<p><strong> </strong>1) Intercompartmental shift. 2) Ökade förluster. 3) Undermåligt intag. Läkemedel är vanligaste orsaken (ffa diuretika, sedan glukokortikoider, penicillin, cytostatika, betastimulerare). - Njurförluster: Furix, mineralkortikoider, glukokortikoider, några typer av renal tubular acidosis, polyurisk fas, (Läkemedelsbehandling bör alltid misstänkas vid hypokalemi). - GI-orsaker till hypokalemI i är oftast uppenbara utifrån klinisk bild (kräkning, diarre, tunntarmsobstruktion, malnutrition, kort-tarm syndr, ureterosigmoidostomi, ). - Insulinbehandling. - Alkalos (H+ går utanför cellen och K+ går in i cellen). - Samtidig förekomst av hypertoni: överväg hyperaldosteronism eller njurärtärstenos. - Hypomagnesemi: Kan ge hypokalemi då det påv. transport och intracellulär retention av K+. Hypokalemi sekundär till brist på mg2+ kan inte korrigeras förrän mg2+ är substituterad.</p>\n<h3>ANESTESI OCH HYPOKALEMI</h3>\n<p>Kronisk hypokalemi som är ≥2,5 mmol/L behöver man inte korrigera före sövning (Massachusets).</p>\n<p><strong>KOMPLIKATIONER </strong>&<strong> SYMTOM</strong></p>\n<p>- Hypokalemi ökar arytmibenägenheten hos patienter med digitalisbeh, ischemisk hjärtsjukdom samt nedsatt VK-funktion. - Svaghet, förstärkt neuromusk. blockad, ileus, påv. hjärtkontraktilitet. - Arytmier. - EKG kan visa tillplattade T-vågor, U-vågor, ökad PR-tid, och QT-tid, ST-sänkning, arytmier. - K+ under 2 mmol/L, är associerat med vasokonstriktion och rhabdomyolys. De flesta är asymtomatisk till K+ går under 3 mmol/L. EKG-förändringar (utplanade T-vågor, T-vågsnegativitet, prominent U-våg, ST-sänkningar, ökad P-vågsamplitud förlängt PR-interval), arytmier, minskad kontraktilitet, ostadigt blodtryck pga autonom dysfunktion, andra organeffekter. <strong>Behandling:  </strong>Sprutpump, mer än 20 mmol/h bör helst inte ges.</p>\n<p><strong>BEHANDLING</strong> <strong> - Upp till 40 mmol/L Kaliumklorid kan ges i perifer ven. Starkare lösningar bör ges i CVK (narkosguiden). - Generellt brukar man säga att det du tillsätter i droppet höjer blodkoncenctrationen med 1/100-del. Ex 40 mmol K+ i glukosdroppet ger 0,4 mmol högre konc. i blodbanan (Källa: Överläkarkollega). - Max infusionshastighet kalium = 20 mmol/h. Använd infusionspump. Undvik att blanda i glukoslösning då man får insulinpåslag vilket gör att kalium går intracellulärt. (Källa: Artikel hypokalemi läkartidn.). Även Massachusetsboken anger 20 mmol/h som högsta infusionshastighet. ”Använd helst kaliumklorid då hypokloremi ger skifte av kalium intracellulärt”. </strong>Olika exempel på behandlingar som folk använt på PMI:<strong> CENTRAL INFART: 2,5% buffrad glukos med extra 60 mmol K+, infusionstakt på 70 ml/h. Ringer-Acetat med extra 40 mmol K+, infusionstakt 500 ml/h. PERIFER INFART: 2,5% buffrad glukos med extra 20 mmol K+, infusionstakt på 70 ml/h. PERORALT: På postop kan man dricka kaliumcitratlösning (</strong>Kajos**, Oral lösning 33 mg (0,85 mmol) K+/ml)</p>\n<p><strong>Övrigt:</strong> - 98% av kroppens kalium finns intracellulärt. Därav måste man ha en rätt stor brist på K+ för att sänkt serumkonc. - En 70 kg man som sjunker från 4 mmol/L till 3 mmol/L i  K+ har en decifit på ca 100 till 200 mmol. Under 3 mmol/L så motsvarar varje 1 mmol/L kalium-sänkning en brist på 200 till 400 mmol. - Vid diuretika- eller diarréinducerad svår hypokalemi förmodas det föreligga samtidig magnesiumbrist som kan öka arytmibenägenheten samt försvåra korrigering av hypokalemin. En daglig dos av 20 mmol Mg2+ (500 mg) kan användas vid behandling av mild magnesiumbrist</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPOTERMI ACCIDENTELL", "html": "<p>HYPOTERMI ACCIDENTELL</p>\n<p><strong>(Källa PM KS Huddinge) STYR UPP DENNA SIDA </strong>OBS FINNS NYTT PM<strong> UPPDATERA</strong> Nytt: <strong>HOPE score </strong>Ålder kön kalium mm. Ingen överlevt kalium >12. Om > 10 % överlevnadschans så lägger man på ECMO. Värmningen på ECMO finns många olika hypoteser vad som är bäst. Ibland startar man på samma kärntemp och cirkulerar, sedan värmer successivt. Lindrig hypotermi 35-32°C. Måttlig hypotermi 32-28°C. Grav hypotermi < 28°C. Akut hypotermi: Snabbt nedkyld, ex kallt vatten. Kronisk hypotermi: Ex gått vilse, under dagar kämpat för sitt liv. Vid akut hypotermi hinner färre patofysiologiska omställningar ske. Mild kyla --> Vasokonstriktion --> Ökad central blodvolym --> Kölddiures. Vid vävnadstemp <12 grader upphör arteriella sfinktrarna fungera --> vasodilatation. vilket värmer vävnaden --> vasokonstriktion (Lewis-Hunting-reaktion). Myokardiets kontraktion förlängs och kontraktiliteten är på 40% vid 32°C. Bradykardi och arytmier kan ses vi sänkt temp.</p>\n<p><strong>EKG</strong> kan visa: J-våg (Osborn-våg) inferiort vid  33°C. Även grenblock, förlängd QT-tid och ST-sänkningar.</p>\n<p>Atropin ej effektivt då orsak är intrakardiella/intraventrikulära ledningshinder.</p>\n<p>Myokardiet är extremt irritabelt vid hypotermi, vid 30°C är risk för VF 50%..</p>\n<p>I uppvärmingsfasen, risk för uppvärmingschock pga flera orsaker: relativ hypo volemi pga. kölddiures, köldinducerat kapillärt läckage. Uppvärmning --> vasodilatation.</p>\n<h3>SYMTOM</h3>\n<p>Medvetslöshet inträder normalt vid ca 30°C.</p>\n<p>Pupillera reagerar ej på ljus under 27°C.</p>\n<h3>KOMPLIKATIONER</h3>\n<p>Risk för rhabdomyolys vid mkt låga temperaturer.</p>\n<p>Metabolismen minskar vid kyla: Vid 30°C är O2 förbrukningen 50%.</p>\n<p>Kylan kan --> bronkospasm och köldinducerad luftvägssekretion.</p>\n<p>Köldinducerad lungskada + cikulationskollaps kan --> lungödem.</p>\n<p>Blodgasapparaten värmer blodet till 37 grader. Räknar ej om för pat.s temp.</p>\n<p>Värden för pO2 och pCO2 blir falsk höga när B-gas-apparaten värmen till 37°C.</p>\n<p>Lösligheten av gaser i vätska stiger med lägre temp (Henry-Dalton-lag).</p>\n<p>Enklast är om man matar in pats' temp i B-gasapparaten.</p>\n<h3>BEHANDLING</h3>\n<p>Alla ska ha glukos (ex 500 ml varm Glukos 5% Bolus på 15 min.)</p>\n<p>Därefter infusion (1ml/Kg/h). Kroppen förbrukar energi för att öka tempen.</p>\n<p>(Barn ska ha 10 ml/kg på 1 h). B-glukos styrs med insulin.</p>\n<p>Antingen ger man värmda vätskor eller inga alls! Level 1 kan användas!</p>\n<p>Alla med temp. <32°C och medvetandesänkt skall övervägas ECMO!</p>\n<p>Undvid Celokurin pga. risk för hyperkalemi, och oklar duration. Intubationsutlöst VF är mkt ovanligt.</p>\n<h3>HLR får inte inledas innan hjärtstopp är bekräftat!</h3>\n<p>Risk för VF tid thoraxkompressioner är extremt stor.</p>\n<p>Noradrenalin har ingen effekt på cirkulationen under 30°C pga redan</p>\n<p>maximal vasokonstriktion.</p>\n<p>Dobutamin, Isoprenalin, och Adrenalin ökar kontraktilitetn utan</p>\n<p>påvisad risk för arytmier. Tänk på att CO är fysiologiskt sänkt</p>\n<p>och man kan därmed acceptera lägre BT och puls så länge pat är</p>\n<p>väckbar/ har adekvat spontanandning.</p>\n<h3>HLR</h3>\n<p>Startad HLR skall pågå tills pat. har minst 34°C eller har effektiv puls.</p>\n<p>Läkemedel har ingen effekt under 30°C.</p>\n<p>Vid VF gör ETT defibrilationsförsök om pat. har <30°C. (Max 3 deffar).</p>\n<p>Värm därefter till 30°C under pågående kompression/ECC, innan fortsatta deffar.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPOFOSFATEMI", "html": "<p><strong>BEHANDLING</strong> **</p>\n<p>På IVA och mkt låga värden ex 0,5 så kan man ge 20 mmol Glycophos i 100 ml NaCl under några timmar, ta om forsfatprovet och överväga ge 10 eller 20 mmol till.</p>\n<h3>ORSAKER</h3>\n<h3>DIAGNOSTIK</h3>", "category": "Sjukdomstillstånd"}, {"title": "HYPONATREMI EJ KLAR", "html": "<p><strong>BEHANDLING</strong> **</p>\n<p>Källa kollega: Man kan ge 80 mmol/L i 5% glukos om Na på väg ner, kan gå kring 80 ml/h. Källa kollega: PÅ IVA när pat. är hyponatrem så kan man ordinera Addex Natriumklori 4 mmol/ml infusion 0-20 ml/h som rikmärke. <strong>Beräkning av NaCl-behandling</strong> (från SFAI)** 1. Beräkna totalmängden kroppsvatten = 50% av kroppsvikten hos kvinnor, 60% hos män. 2. Bestäm hur mkt s-Na ska höjas. 3. Beräkna den totala mängden Na+ som behöver tillsättas = totalvatten x höjning av Na+. 4. Räkna ut hur mycket vätska som behövs = totalt natriumbehov / natriumkoncentration i infusionsvätskan. 5. Räkna ut infusionshastigheten = volym vätska / antal timmar.</p>\n<h3>ORSAKER</h3>\n<p>3 vanligaste orsakerna: Tiaziddiuretika, SIADH (läkemedelsutlöst), alkohol.</p>\n<p>Indelas främst i : Hypovolem, Euvolem, Hypervolem hyponatremi.</p>\n<p>Indelas även i: Akut <48h, kronisk >48 h.</p>\n<p>Hyperglykemiorsakad: Hyperglykemi --> förflyttning av H2O till extracellulär-</p>\n<p>vätskan. I dessa fall är hyponatremin normosomolär.</p>\n<p>Moderna elektrolytspecifika analysmetoder har lett till att pseudohyponatremi</p>\n<p>som orsakas av hög konc. av andra osmotiskt verksamma substanser</p>\n<p>(M-komponent, triglycerider) ses alltmer sällan. Dessa pat. har hyponatremi</p>\n<p>med normal P/S-Osm. ??? Hyperglykemiorsaka är väl en pseudo?</p>\n<h3>DIAGNOSTIK</h3>\n<p>1. Tidsförlopp.</p>\n<p>2. Vätskebalans; törst, viktnedgång, ortostatis,, takykardi, hudturgor, diures, mm.</p>\n<p>Hypervolemi; ascites, ödem, central venstas.</p>\n<p>3. P/S-osm, U-Na, U-Osm.</p>\n<p>Provtagning: P-glukos, P/S-osmolalitet, U-osmolalitet, U-Na samt U-K+.</p>\n<p>S-kortisol (helst morgonvärde), S-TSH, fritt T4, P/S-Na och P/S-Kalium,</p>\n<p>S-kreatnin, blodstatus, leverstatus.</p>\n<p>Vid stark klnisk misstanke om Addisons/akut kortisolsvikt ge omedelbart</p>\n<p>Solu-Cortef samt 0,9% NaCl iv.</p>\n<p>FORTSÄTT</p>\n<p>Källa svenskt vårdprog. hyponatremi.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPOMAGNESEMI", "html": "<p>Källa: PM ANOPIVA Sahlgrenka, ”Rutin Magnesium”, version 4.</p>\n<p><strong>Indikaitoner:</strong> Magnesiumbrist, antiarytmisk behandling, alternativt profylax för förmaks- eller kammararytmier, cerebral vasospasm.</p>\n<p><strong>Kontraindikationer: </strong>Kan vid överdosering ge muskelsvaghet med andningsdepression samt retledningsrubbningar. Tidigt tecken på överdosering är reflexnedsättning (kring 2,5 mmol/L)</p>\n<p><strong>Basalbehov magnesium:</strong> Ca 10 mmol/dygn. Vid måttlig brist ca 20 mmol/d, vid symtomgivande hypomagnesemi ca 30-40 mmol/d.</p>\n<h3>Administrering (måste spädas)</h3>\n<p>- Underhållsbehandling samt vid brist: Addex Magnesium(sulfat) 1 mmol/L till 1000 ml kristalloid- eller total parenteral nutritionslösning.</p>\n<p>- Som arytmibehandling: Blanda 20 mmol Addex Magnesium(sulfat) med 100 ml NaCl 9 mg/ml och ge som bolusdos under 20-30 minuter.</p>\n<p>Tid. råd från kollega inför op: Lägg till 20 mmol magnesium i 100 ml NaCl och låt gå in på 6 h.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPERFOSFATEMI", "html": "<h3>Vanligaste orsakerna på IVA</h3>\n<p>- Minskad utsöndring vid njurinsuficiens. - Fosfatfrisättning vid cellsönderfall ex rhabdomyolys eller tumör lys.</p>\n<h3>Kliniska manifestationer</h3>\n<p>- Bildning av ickelösliga kalcium-fosfat-komplex med deposition i mjukvävnad. - Akut hypokalcemi (med tetanus). - Det finns inte mycket evidens för betydelse eller förekomst av hyperfosfatemi på IVA.</p>\n<h3>Behandling</h3>\n<p>2 approacher: - Dialys. Reserverat för de med dialysbehov och är sällan nödvändigt enskilt för hyperfosfatemi. - Öka fosfatbidning i övre GI vilket sänker serumfosfat även vid frånvaro av peroralt fosfatintag (=GI dialys). Suctalfat eller aluminium-innehållande antacida kan användas. Vid signifikant hypokalcemi kan calcium-acetat-tabletter användas för att öka s-kalcium och sänka s-fosfat).  <strong>JANUSINFO</strong> om njursvikt<strong> Fosfat kan bindas med kalciumkarbonat till maten, 1–1,5 g/dygn, vid normalt/lågt kalciumvärde. (Calcitugg/Kalcidon tuggtablett, Kalcipos tablett). Om uttalad hyperfosfatemi (>2,5 mmol/l) kan fosfatbindare (kalciumkarbonat eller sevelamer) övervägas efter individuell bedömning. </strong>Internetmedicin<strong> om njursvikt</strong> Medicinering med fosfatbindare som tas till maten och binder fosfat i tarmen, exv kalciumkarbonat (Calcitugg, Kalcipos, Kalcidon), kalciumacetat (Osavren), sevelamer, lantan (Fosrenol), järn, trevärt (Velphoro). Vid uttalad hyperfosfatemi kan aluminiuminnehållande antacida användas som fosfatbindare under en kortare period. <strong>Prata med en njurmedicinare?</strong></p>\n<p><strong>Källa: </strong>Marino, ICU book, 4th ed.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPERGLYKEMI", "html": "<p><em>Källor: PM Insulinbehandling på IVA.</em> <strong>UPPSTART INSULININFUSION PÅ IVA</strong> (målintervall 6-10, alltid samtidig tillförsel glukos/nutrition).<strong> Glukos >12 mmol/L: Starta på 2 till 4 IE / h. Glukos 10-12 mmol/L: Starta på 1 till 2 IE / h. Kontroll p-glukos inom 1 h. Ingen ändring om P-glukos sjunkit 2 (1-3) mmol/L. Om sjunkit >3 mmol/L sank hastigheten med 1-2 IE/h. Om glukos ökat eller är oförändrat, öka hastigheten med 1-2 IE/h. Om p-glukos < 6 mmol/L: Stoppa infusionen, se nedan: P-glukos 4-6: Stoppa infusionen, kontrollera att nutrition/glukos tillförs. Ny kontroll om 30 min. P-glukos <4: Stoppa infusionen, ge 30-60 ml 30% glukos iv. Kontrollera att glukos eller nutrition ges. </strong>UNDVIK IV BOLUSDOS<strong> PGA HYPOGLYKEMIRISK/SVÄNGNINGAR</strong>, GE SUBCUTANT<strong> ISTÄLLET</strong>: Glukos > 15: 8 IE. Glukos 12-15: 6 IE. Glukos 10-12: 4 IE. <strong>Försök avveckla insulin infusioneninnan avd</strong> Om stabil patient: Övergå till sc isulin-regim 50% av dygnsbehovet som långverkande insulin x 1. 50% av dygnsbehovet som snabbverkande insulin vb. P-glukos x 6 på avdelning. Viktigt med läkemedelsavstämningen.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPERTERMI - PERIOPERATIV", "html": "<p><strong>Definition: </strong>Ökning i temp mer än 2 grader/h, eller 0,5 grader per 15 min. Alternativt kan det definieras som temp >37.5 grader.</p>\n<h3>ORSAKER</h3>\n<p>- Malign hypertermi.</p>\n<p>- Transfusionsreaktion.</p>\n<p>- Anafylaxi.</p>\n<p>- Inflammation, infektion, sepsis.</p>\n<p>- Hypermetabola tillstånd; thyreotoxikos, feochromocytom.</p>\n<p>- Skada på termoregulerande centra i hypothalamus pga anoxi, trauma, tumör, eller ödém.</p>\n<p>- Malignt neuroleptikasyndrom (ex haldol).</p>\n<p>- Sympaticomimetika; MAO-hämmare, amfetamin, kokain, TCA.</p>\n<p>- Antikolinergika; Kan hämma svettning.</p>\n<p><strong>Åtgärder/</strong>Behandling**</p>\n<p>- Uteslut malign hypertermi.</p>\n<p>- Extern kylning, kalla handdukar, kylpåsar, fläktar, exponera huduta, etc.</p>\n<p>- Intern kylning; ex kall vätska i KAD, buken, peritoneum, infusion av sval RingerAcetat.</p>\n<p>- Paracetamol, NSAID.</p>\n<p>- Avbryt nedkylning när pat. nått 38 grader C.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPERKALCEMI", "html": "<p><strong>DEFINITION</strong> -Definieras som P-kalcium över det övre referensvärdet för mätmetoden, kan variera. -Oftast definierat som totalcalcium >2,50 mmol/L (S-ca 2,6 mmol/L). -Joniserat kalcium >1,35 mmol/L (Enl Oxford textbook of crit care). - Finns ingen fastlagd kalciumnivå för att kallas hyperkalcemisk kris. Ofta används P-Cakorr > 3,4–3,7 mmol /l (motsvarande Ca2+ > 1,75–1,80) eftersom patienten oftast är påverkad och dehydrerad vid dessa nivåer. Symtomen korrelerar ej direkt med P-Ca nivån. - Albuminkorrigerat kalcium beräknas olika beroende på laboratorium: Karolinska Universitetssjukhuset: P-kalcium (korr) = P-kalcium + 0,01 x (39 - P-albumin). -Om ej justerat för albumin finns risk för underskattning av p-kalcium om lågt albumin (eller hur?, hittade ingen källa). <strong>BIOLOGI</strong> -I blodet: Ca 50% i fri joniserad form, 40-45% proteinbundet främst albumin, 5-15% komplexbunden form med fosfat och citrat.  -Utgör vital funktion för bla transmission av nervimpulser, muskelkontraktion, koagulationsprocess och hormonsekretion mm. -Intracellulära kalciumkoncentration hålls 1000 gånger lägre än i extracellulär vätskan. 99 % av kroppens totala mängd kalcium (1000–1200 g) finns i skelettet och runt 1 % i ECF. -PTH och 1,25-dihydroxivitamin D3 (kalcitriol) styr blodets kalciumkonc. För vidare info se ex. internetmedicin hyperkalcemi. <strong>VANLIGA ORSAKER</strong> -På IVA är det vanligast hos pat. med AKI. Korrelerar även väl med sviktande organsystem, alltså som ett ospecifikt symtom vid kritisk sjukdom. -Vanligast genrellt är malignitet och primär hyperparathyreoidism. Hyperkalcemi vid malignitet kan förklaras av följande mekanismer: Ökad prod. av kalcitriol, prod & frisättning av PTH-relaterad peptid, samt prod. av proinflammatoriska cytokiner. Exempel är skivepitelcancer i lunga, renal cell carcinoma, multipelt myelom (lokalt aktiverade osteoklaster). - Andra orsaker är immoilisering, TPN, medicinering såsom tiazieddiuretika och svår thyreotoxikos mm. Se internetmedicin. <strong>KOMPLIKATIONER / </strong>SYMTOM<strong> - Symtom från hela kroppens organsystem och blir mer uttalade ju snabbare hyperkalcemin utvecklas. - Symtomen orsakas dels av calciumets effekter på kroppen celler och singallering, följder av dehydrering, utfällning av kalcium i vävnader speciellt i njurar och pancreas. - Kardiella: hypotension, takykardi, AV-block I, kort QT-tid, arytmi, asystoli, ökad känslighet för digitalis. Moderat hyperkalcemi har positiv iotrop effekt på hjärtat vilket kan orsaka hypertension. - Neuromuskulära symtom brukar dominera: Trötthet, proximal muskelsvaghet, depression, psykos, konfusion, koma. - Gastointesinala: Illamående, anorexi, obstipation (inhiberad glatt muskelfunktion), pankreatit (kalcium aktiverar fosfolipas). </strong>Försenad gastric emptying.<strong> </strong>Ulcus (kalcium stimulerar gastrin vilket ökar magsyraproduktionen). - Negrologiska: Polyuri, dehydrering, törst, njursten, nefrokalcinos, njursvikt. <strong>EKG:</strong> Förlängt PR-intervall, breda QRS-komplex, förkortad QT-tid. <strong>UTREDNING</strong> Malignitetsutredning och provtaning för primär hyperpara. Initialt: Joniserat kalcium, fosfat, albumin, krea, PTH, 25-hydoxivitamin D. Joniserat calcium påverkas av pH och kan vara falskt högt vid acidos och lågt vid alkalos. <strong>HYPERKALCEMISK KRIS</strong> - Stigande kalcium leder till ökad kalciumutsöndring i urinen och osmotisk diures. Därvid ökar dehydreringen som i sig medför stigande serumkalcium och en ond cirkel kan uppstå. Med hyperkalcemisk diures förloras även natrium genom urinen. Symtom vid kris är i regel en kraftig dehydrerad patient med olika grad av cerebral påverkan, anorexi, konfusion, eventuellt koma samt nedsatt njurfunktion. Tillståndet är livshotande och fordrar akut handläggning. <strong>AKUTA </strong>ÅTGÄRDER<strong> </strong>Rehydrering<strong> Isoton NaCl 3-6 liter vid svår hyperkalcemi under första dygnet (eventuellt Ringer-Acetat). Vätskemäng enl. grad av intorkning, njur och hjärtfunktion och kroppsstorlek.  Rehydrering brukar sänka P-Ca med 0,5–1 mmol/l. Ökad diures ökar kalciumutsöndringen. - Furix ökar även utsöndringen av kalcium. </strong>pH:<strong> Undvik respiratorisk alkalos som då sänker plasma-kalium vilket kan förvärra retlednings-störningar på hjärtat. </strong>Dialys: <strong>Kan användas vid mkt svår eller livshotande hyperkalcemi och är effektivt. </strong>RÅDGÖR MED ENDOKRIN ANGÅENDE BEHANDLING. SE ÄVEN INTERNETMEDICIN.<strong> </strong>Alternativ som finns är: <strong>Kalcitonin</strong>, <strong>Bisfosfonater</strong>, <strong>Denosumab (Xgeva)</strong>, <strong>Glukokortikoider</strong>, <strong>Furosemid</strong> <strong>Läkemedelsgenomgång: </strong>Seponering av kalciumhöjande läkemedel. -Hydrokortison (200 mg iv.) ingår i arsenalen då  den hämmar bildning av kalcitriol. <strong>ANESTESTESI VID HYPERKALCEMI EX HYPER</strong>PARA: <strong> - På ÖNH brukar man inte göra så så mkt åt hyperkalcemin mer än att söva som vanligt, tillse god hydreringsgrad. Kirurgin är ju lösnignen! </strong>REFERENSER<strong>: </strong>Faust’s Anesthesiology review fifth ed. Rubertsson Intensivvård 2a upplagan. Oxford Textbook of intensive care sec. ed. Internetmedicin Hyperkalcemi.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPERKALEMI", "html": "<p><strong>LIVSHOTANDE HYPERKALEMI (</strong>Källa: Internetmedicin)</p>\n<p><strong>Akut</strong>/omedelbar<strong> behandling om S-kalium </strong>><strong>7 mmol/L och/eller förekomst av EKG-förändringar.</strong></p>\n<p>- I.v. 10 ml <strong>Calcium-Sando</strong>z<strong> 9 mg/ml (kalciumglukonat) under 3 minuter. Effekt på EKG eller arytmi bör ses efter några minuter och vara i ca 30-60 min. (Obs Kalciumklorid är dubbelt så stark). - Vid tecken/misstanke om hypovolemi; infusion </strong>isoton NaCl 0,9 mg/ml.<strong> - </strong>Insulin-glukos-infusion;<strong> ex Humalog 20 E i 1000 ml 5% glukoslösning, hastighet 500 ml under 15-30 min, om ej arytmi eller EKG-förändring infundera istället med cirka ca 100-200 ml/h, alternativt infusion snabbinsulin 5E/h samtidigt som infusion glukos 100 mg/ml, 1000 ml, infusionstakt 200 ml/h. - </strong>Bikarbonatinfusion<strong> vid acidos, Natriumbic 50 mg/ml eller 60 mmol/100 ml enligt formeln Minskning i standard HCO3- (mmol/L) <em> 0,3 </em> vikt i kg = deficit i mmol. Ge halva uppskattad decifit och kontrollera om blodgasen. (Försiktighet vid hyperkarbi). - </strong>Salbutamol<strong> 5-10 mg i nebusilator. - </strong>Furix <strong>(=loopdiuretika). Överväg samtidig ersättning med infusion av isoton NaCl. - </strong>Resonium<strong> oralt eller rektalt: Vanlig dos är 15 gram x 3-4 . Avbryt när kalium <= 5 mmol/L. </strong>- Dialys: **Det går att köra hemosol på samtliga påsar om man vill sänka mkt snabbt. / Kollega (funkade bra).</p>\n<h3>HYPERKALEMI – PREOPERATIV BEHANDLING</h3>\n<p>Version: 20181030. Källa: PM KS. - Om enstaka högt kalium; ta nytt prov. - Om pat. brukar ligga högt och har Kalium >= 5 mmol/L: Ge 1 struket mått (15g) resonium peroralt. - Om Kalium >=6 mmol/L, kontakta läkare för ordination av infusion glukos+insulin. - Nytt kalium på opdagens morgon.</p>\n<p><strong>HYPERKALEMI HOS PATIENT SOM SKA OPERERAS</strong> EX PÅ OPDAGEN**</p>\n<p>- Lite svårt att hitta bra källor... Men det verkar som att: - Det finns ingen universell definition för hyperkalemi, men över 5,5 mmol/L verkar litteraturen vara ense om att det är högt. Mild hyperkalemi mellan 5,5 till 6,0. - Är patienten asymtomatisk? Är det en kroniskt hyperkalemi? - Kalium ≥6,0 verkar vara ett klart cutoff för att sjkuta på krirugi. - Under operation kan man påbörja Humaloginfusion ex 2 IE / h + 10% glukos-infusion.</p>\n<h3>PERI- OCH POSTOPERATIV HANDLÄGGNING</h3>\n<h3>Orsaker:</h3>\n<h3>Falsk hyperkalemi</h3>\n<p>- Stas vid provtagning.</p>\n<p>- Leukemi med uttalad leukocytos eller trombocytos.</p>\n<h3>Redistribution</h3>\n<p>- Acidos: För varje minskning av pH-värdet med 0,1 ökar P-kalium med ca 0,4 mmol/L.</p>\n<p>- Digitalisintox.</p>\n<h3>Minskad renal utsöndring</h3>\n<p>- Njurinsuf.</p>\n<p>- Binjurebarkssvikt: Addisons, isolerad aldoseteronbrist.</p>\n<p>- Läkemedel: Kaliumsparande diuretika (=spironolakton, eplerenon), amilorid, ACEh, NSAID, trimetoprim, heparin.</p>\n<p>- Interstitiell nefrit.</p>\n<h3>Ökat kaliumutsläpp i serum</h3>\n<p>- Hemolys eller muskelnekros.</p>\n<h3>Behandling: </h3>\n<p>Praktisk erfarenhet: Om önskar sänka K+ snabbt så kan man ge Kan börja med att ge 4IE insulin iv om pat ej är låg i socker. Följ upp efter ca 20 min. I övrigt, se ovan under Livshotande hyperkalemi.</p>\n<p><strong>SE NÄSTA SIDA FÖR EKGFÖRÄNDRINGAR</strong> / SE 2 SIDOR FRAM FÖR ALGORITM FRÅN LÄKARTIDNINGEN**</p>\n<p>Kan se ut som VT, men med låg frekvens. Toppiga T-vågor kan vara hyperakuta T-vågor men kan även vara hyperkalemi.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPERKLOREMI EJ KLAR", "html": "<h3>HYPERKLOREMI OCH METABOL ACIDOS</h3>\n<p>- Vid förlust av HCO3- t.ex. vid massiva diarréer. - Vid tubulusdefekter (renal tubulär acidos). Här ses en nedsatt förmåga att utsöndra klorider? - Hyperklorem acidos pga infusion av NaCl. - Ses även vid hypoalbuminemi?</p>\n<h3>KLOR</h3>\n<p>- Anjon som till störtsta del finns i extracellulärvätskan. Koncentrationen regleras av njurarna. Det mesta av Cl- som filtreras resorberas i proximala (ffa) och distala tubuli. Både aktiv och passiv transport. - Referensvärde 98-106 mmol/L.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPERNATREMI", "html": "<h3>HYPERNATREMI PÅ IVA</h3>\n<p><strong>Bakgrund</strong> - Drabbar ca 25% av pat. på IVA. - Alla vätskeförluster har en lägre Na-konc än plasma (<135 mmol/L). Ex svett 65 mmol/L. Normal urin <10 mmol/L (beroende på natriumintag. Diuretikastimulerad diures 80 mmol/L. Ileostomi 125 mmol/L. Diarré kring 80 mmol/L. - Är vanligt på IVA då man ofta har stora vätskeförluster och ersätts med normoosmolär vätska. Alla typer av vätskeförluster har lägre natriumkonc än plasma. - Är alltid associerat med hyperosmolalitet och uppträder sällan hos vakna personer med tillgång till vatten. - Är dåligt. S-Na >160mmol/l är hos vuxna förenat med mortalitet på upp till 60%. - Akut <48 h, kronisk >48h. <strong>3 etiologier: </strong> a) Förlust av Na+ och vatten med övervikt på vattenförlust (alltså förlust av hypoton vätska). Låg ECV. Vanligast i samhället men ej på IVA. Ex från svett, osmotisk diures, LM-inducerad diurés, diarréer. Även vid sjukdom och sepsis, vilket för med sig stört törst. Normalt dricker man ju vatten om man blir hyperosmolär. b) Förlust av fritt vatten. Normal ECV. Ex diabetes incipidus (central; hjärnskada. Nefrogen; ev polyurisk fas vid AKI, hypokalemi, några läkemedel). Eller volymsförlust som ersätts med Na+. c) Tillskott av Na+ och vatten med övervikt på Na+ (alltså tillskott av hyperton vätska). Stor ECV. Hypervolem hypernatremi är ovanligt. Orsakas ffa av NaBic-infusion vid behandling av acidos, eller hyperton koksalt-behandling vid högt ICP. Överskott av mineralkortikoider: Cushings syndrom. - Central eller nefrogen diabetes insipidus: Vid normal ADH-utsöndring och normal njurfunktion ska urinmängderna vara minimala och urinen maximalt koncentrerad (U-Osm ca 1200 mOsm/kg) hos en patient med hypernatremi. Vid hypernatremi utlöst av central eller nefrogen diabetes insipidus är urinmängderna större och urinen utspädd. Se längst ned för diagnostik.</p>\n<p><strong>Symtom</strong> - Akut uppkommen hypernatremi ger oftast mer uttalade symtom. - Skifte av fritt vatten från intracellulära till extracellulära rummet  främst neurologiska symtom ex medvetandesänkning, kramper och konfusion pga att hjärncellerna krymper. - Muskelsvaghet, takypné, påverkad hjärtfunktion, försämrad glukosreglering. - Risk för kärlskada med intracerebral- och subarachnoidalblödning.</p>\n<p><strong>BEHANDLING</strong> - Korrigera ej snabbare än 0,5 mmol/L/h, och max 8-10 mmol/L/dygn. Målvärde 145 mmol/L. - Vid hypernatremi kan kroppens totala natriummängd vara låg, normal eller hög, S-Na ger inte i sig någon information om den totala natriumbalansen som måste bedömas utifrån volymstatus. - Generellt så resusciterar man med NaCl vid symtomgivande hypovolemi. Men på IVA är man dock mycket sällan så pass hypovolem så att man behöver det före vatten/glukosdropp. - Korrigera hyperglykemi, hypokalemi och hyperkalcemi. - I första hand ges hypoton vätska i form av vatten per os/i sond eller 5% glukos intravenöst. P-glukos följs regelbundet och korrigeras vid tecken till hyperglykemi. - Minirin (desmopressin) – vid central diabetes incipidus.</p>\n<p><strong>FORMEL FÖR VÄTSKEBERÄKNING</strong> Vid hypovolem hypernatremi som skall korrigeras långsamt intravenöst med natriumfri lösning kan preliminär infusionstakt planeras enligt följande: 1. Använd målvärdet 145 mmol/L för S-Na. 2. Ta ett aktuellt S-Na (mmol/L) och uppskatta patientens vikt V (kg) före vattenförlust. 3. Bestäm aktuellt kroppsvatten KV (L); V x 0,5 för kvinnor, V x 0,6 hos män. 4. Beräkna vattenbristen VB (L) enligt följande: VB = KV x (1 – 145 / S-Na) 5. Bestäm nettosänkning av S-Na (mmol/L); S-Na minus 145. OBS välj sedan punkt 6 eller 7 nedan. 6. Om planerad nettosänkning är större än 10 mmol/L: Beräkna totala tiden (tim) för att nå målet (145 mmol/L) med 0,4 mmol/L/tim; planerad nettosänkning av S-Na (mmol/L) / 0,4 (mmol/L/tim). 7. Om planerad nettosänkning är mindre än 8 mmol/L: Beräkna totala tiden (tim) för att nå målet (145 mmol/L) med 0,5 mmol/L/tim; planerad nettosänkning av S-Na (mmol/L) / 0,5 (mmol/L/tim). 8. Beräkna infusionshastighet (ml/tim); planerad volym vätska (ml) / planerade antal timmar. (enlig beräkning från punkt 4 respektive 6 eller 7)</p>\n<p><strong>Natrium-mängd i diverse läkemedel:</strong> - Albumin 200 g/L: 100 mmol/L. = 10 mmol i 1 flaska. - Ringeracetat: Natrium 130 mmol/l (277 mOsm/l). - Buffrad glukos: 70 mmol/L. - Movicol: 8 mmol per påse. - Isosource Protein: Na+ 40 mmol/L, K+ 40 mmol/L.</p>\n<h3>AKUT UPPKOMMEN HYPERNATREMI</h3>\n<p>Akut uppkommen (<1 dygn)  - Kan och bör korrigeras snabbt. Vid akut hypernatremi med allvarliga symtom kan sänkningen initialt vara 1 mmol/L/tim tills symtomen minskat och därefter reduceras till 0.5 mmol/L/tim. Infusion av Glukosdropp utan elektrolyttillsats på 6-8 h kan vara ett bra alternativ. Varje liter given vätska sänker P-Na ca 4 mmol/L. Dessa pat. har ofta en expanderad blodvolym och furix 20 mg kan potentiera effekten.</p>\n<h3>DIFFERENTIALDIAGNOSTIK HYPERNAREMI (Från PM Alfresco hypernatremi)</h3>\n<table class=\"card-table\">\n<tr><th><strong>Volymstatus</strong></th><th><strong>Möjlig mekanism</strong></th><th><strong>Möjlig primär etiologi</strong></th></tr>\n<tr><td><strong>Hypovolem</strong></td><td>Vatten- och natriumförlust från tarm</td><td>Kräkningar, diarréer utan vätskekompensation</td></tr>\n<tr><td></td><td>Vatten- och natriumförlust via hud</td><td>Massiv svettning, brännskador utan vätskekompensation</td></tr>\n<tr><td></td><td>Vatten- och natriumförlust via njure</td><td>Interstitiell njursjukdom, loopdiuretika, osmotisk diures (glukos, urea, mannitol)</td></tr>\n<tr><td><strong>Normovolem</strong></td><td>Ren vattenavdunstning från luftvägar</td><td>Tachypné</td></tr>\n<tr><td></td><td>Vatten- och natriumförlust via hud</td><td>Excessiv svettning, brännskador med viss vätskekompensation</td></tr>\n<tr><td></td><td>Vattenförlust via njure</td><td>Central diabetes insipidus (tumör, läkemedel) Nefrogen diabetes insipidus (njurskada, hyperkalcemi, hypokalemi, litium mfl läkemedel)</td></tr>\n<tr><td></td><td>Annat</td><td>Vattenbrist, osmotisk obalans</td></tr>\n<tr><td><strong>Hypervoelm</strong></td><td>Iatrogen tillförsel av vätska och natrium</td><td>Hyperton koksalt, natriumtillsats till glukos, bikarbonat, TPN</td></tr>\n<tr><td></td><td>Mineralocorticoid dominans</td><td>Binjurebarkstumör Kongenital binjure hyperplasi</td></tr>\n</table>\n<p>Vid central diabetes incipidus är urinosmolariteten oftast under 200 mosm/L. Men vid nephrogen DI är urinosmolariteten oftast mellan 200 – 500 mosm/L. Om särskilja mellan central och perifer så kan man ge vasopressin 5 IE iv. Vid central DI så ska urinosmolaliteten öka minst 50% nästan omedelbart, men vid nephrogen så blir det ingen skillnad.</p>\n<p><strong>Källor: </strong>PM Alfresco, IVA, Hypernatremi. Marino’s ICU book. Internetmedicin.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPEROSMOLÄRT NON-KETOTISKT SYNDROM (HNKS)", "html": "<p><strong>Bakgrund: </strong>Tidigare kallat ”hyperglykemiskt hyperosmolärt syndrom (HHS)”. - Relativt ovanligt, möjligen underdiagnosticerat, potentiellt livshotande, hög mortalitet i gruppen (30-60%). - Drabbar ffa äldre med DM typ 2. - Orsakas av lätt dehydrering ex. i samband med akut sjukdom verkar utlösa. Om därpå otillräckligt vätskeintag uppkommer ett hyperosmolärt syndrom. Även om mängen cirkulerande insulin är låg, så räcker denna för att förebygga lipolys och därmef ingern ketoacidos. - Utvecklas långsamt (dagar-veckor). Utlösande faktorer: Första manifestation av DM typ 2 (30%), akut infektion (40%), andra orsaker ex hjärtinfarkt, ulcus, akut kirurgi eller trauma (30%). Betablockad, kortison, diuretika anses öka risken. - Karaktäriseras av uttalad hyperglykemi, uttorkning med förhöjd osolalitet sekundärt till osotisk diures, men med tillräcligt (egenproducerat) insulin för att förhindra ketoacidos. <strong>Kliniska fynd / Symtom</strong> Obligat: Uttalad hyperglykemi (>30 mmol/L, dehydrering, hyperosmolaritet ≥320 mosm/L, avsaknad av svår ketoscidos (B-ketoner <3 mmol/L), (ofta hos äldre pat. 60-75 år med känd eller nydebudetad DM2. Symtom (vanligast först): Trötthet 90%, polydipsi 70%, polyuri 70%, illamående 65%, feber 50%, konfusion/koma 30%, kräkning 25%, yrsel 20%, kramper 15%. <strong>Diagnostisk: </strong>Definitiva kriterier saknas, men följande talar för HNKS: P-glukos >33 mmol/L. - S-osmolalitet >320 mosmol/L. - Frånvaro av ketoacidos. Talar för svår HNKS; S-osmolalitet >350, P-Na >160 mmol/L, K+ <3,5 el. >6,0, GCS <12, spO2 >92%, cirk instabilitet, oliguri, AKI. <strong>Ankomstprover</strong> B-ketoner, blodgas, elstatus, p-fosfat, p-Mg, S-osmolalitet, urea, blodstatus, CRP, pankreasamylas, ASAT, ALAT, HbA1c. EKG, hsTnT. Screena för akut sjukdom (infektion, hjärtinfarkt, (laktat om metformin). Lungröntgen & odlingar på vid indikation, ev. DT hjärna om medverandepåverkan. Varje timme i 6 h, därpå varannan h: blodgas, beräkna osmolalitet (2 x P-Na + P-glukos (+ P-urea när tillgängligt) <strong>BEHANDLING</strong> <strong>Rehydrering – Är grundstenen</strong>. Pga hyperton dehydrering så kan vätskeförelusten ofta vara så mkt som 25%. Försiktighet vid hjärtvikt/njursvikt). Sikta på 1 L NaCl första timmen. Fortsätt 250-500 ml/h, om s-osmolalitet sjunker ≤3 /h, öka infusionen, om s-osm sjunker ≥8/h, ev.minska infusionstakten. NaCl används initialt då pat. ofta är sant hypernatrema. Målsättning att återställa vätskebalansen på 1 dygn, sikta på ca 2-3 L plusbalans första 6 h. Lägg till addex Na+ i infusionen vb.  <strong>Insulin</strong> Insulinbehandling har skral evidens gällande fördelar. Initialt sänks p-glukos genom vätsketerapi. När P-glukos ej längre sjunker skall insulininfusion i dos 0,05 E/kg/h startas (alltså försiktig start!). Vid för tidig och för aggressiv insulinterapi finns risk för snabba skiften i osmolalitet och cirkulatorisk kollaps. Målvärde för p-glukos första dygnet kan vara 10-15 mmol/L.  Om B-ketoner >1 mmol/L, ställningstagande till tidigare start av insulininfusion (0,05 E/kg/h). Om p-glukos sjunker >5 mmol/h, överväg i första hand minska takten vätskeinfusion och/eller insulininfusion. När p-glukos <14 startas 5% glukosinfusion 125 ml/h, lägg till kring 80 mmol Na+. Om p-glukos sjunker fort ev 10%ig. <strong>Kalium </strong> Stor kaliumbrist föreligger ofta. P-kalium sjunker dessutom vid insulininfusion. Ge addex-K som innehåller fosfat (0,4 mmol/ml). Påbörja kaliumtillsats när P-kalium < 5,5 mmol/L, riktvärde 40 mmol per liter vätska. Vid p-kalium < 3,5 mmol/L individuell bedömning, minst 20 mmol K+/h. <strong>Tiamin</strong> Friskostigt vid misstanke om malnutrition. 4 ml Tiamin, 50 mg/ml vid ankomst. Därefter ex Tiamin 100 mg x 2 i 5 dgr. <strong>Trombosprofylax</strong> 5000 IE Fragmin x 1 om ej kontraindicerat. <strong>Avslutande av behadnling</strong> Kan vara svårt att bedöma när tillståndet är hävt. Återställning av osmolalitet och elektrolytbalans kan ta upp till 72 h. Insulininfusionen kan oftast avslutas när pat. kan äta och dricka, medan vätsketerapin kan behöva fortgå längre. Men mål kan vara: Återhämtat allmäntillstånd och kognition, S-osmolalitet ≤300, p-glukos ≤15, vätskebalans återställd, normal diures. I efterförloppet behövs oftast en tids insulinbehandling, kontakt med endokrinolog. <strong>Behandlingsmål</strong> S-Osmolalitet ska sjunka med 3-8 enheter /h. P-glukos ska sjunka med ≤5 mmol/h, undvik hypokalemi och hypoglykemi. P-Na ska ej sjunka ≥10 mmol/L per dygn. Snabba skiften i osmolalitet kan orsaka hjärnödem. Notera att P-Na förväntas stiga med ca 4 mmol/L per 10 mmol/L sänknig av P-glukos (osmotisk utjämning).Glukos-korrigerat p-natrium kan beräknas med: Korr-Na = P-Na + 2,4 x ((P-glukos-5,6)/5,6) <em>Version 2026-03-21. <strong>Käll</strong>or<strong>: Internetmedicin</strong>, PM KS<strong>.</strong> </em></p>\n<p>HYPOKALCEMI (JONISERAD HYPOKALCEMI)</p>\n<p><strong>KALCIUM – </strong>NÖDVÄNDIG FÖR FÖLJANDE**</p>\n<p>- Skelettstrukturen. - Kofaktor i koagulationen. - Neuromuskulär transmission. - Kontraktion av glatt muskulatur.</p>\n<h3>FÖREKOMST</h3>\n<p>- 99% i skelettet. - 10 000 ggr högre koncentration i mjukdelar jmf med extracellulära vätskor. - I plasma förekommer 3 former: Joniserat och därmed biologiskt aktivt (1/2), återstoden är bunden i komplex och biologiskt inaktivt. Av den bundna delen är 80% bundet till albumin och 20% i komplex med plasmaanjoner såsom proteiner och sulfater.</p>\n<h3>LAB</h3>\n<p>- De flesta lab mäter totalkalcium vilket kan underskatta aktiva mängden kalcium vid bla hypoalbuminemi. Det finns flera sätt att räkna om totalkalcium till fritt kalcium, men alla dessa är pålitliga och det enda pålitliga sättet är att <strong>mäta</strong> fritt kalcium. - Referensvärde fritt kalcium: 1,15 – 1,25 mmol/L. <strong>Felkällor</strong>: - Luftbubblor i provtagningsrör (minskat koldioxid kan sänka joniserat kalcium genom kalcium binder till albumin). - Antikoagulantia ex, citrat, heparin och EDTA kan binda kalcium.</p>\n<h3>GRADERING</h3>\n<p><strong>Mild</strong>: 0,9 – 1,14 mmol/L.  <strong>Svår</strong>: <0,8 mmol/L.</p>\n<p><strong>ORSAKER </strong>(procent inom parenteserna anger hur förekomsten inom varje tillstånd).</p>\n<p>- <strong>Alkalos</strong>. Ökar bindning av kalcium till albumin. Natriumbikarbonat kan sänka kalcium då det binder direkt till bikarbonat. - <strong>Blodtransfusion</strong> (15%). Citrat binder kalcium. Normaliseras när levern bryter ner citrat. - <strong>Läkemedel</strong>: Aminoglykosider (40%), Heparin (10%). - <strong>Fettembolism</strong>. - <strong>Magnesiumbrist</strong> (70%). Hämmar utsöndring av parathormon och minskar end-organ svar på parathormon. Hypokalcemi pga magnesiumbrist är refraktär till kalciumsubstitution och magnesiumbehandling korrigerar ofta kalciumkoncentrationen. - <strong>Pankreatit</strong>. Flera mekanismer, oklart. Sämre prognos vid fynd. - <strong>Njurinsuffuciens</strong> (50%). Pga fosfatretention och otillräcklig aktivering av vitamin D. Behandling är att blocka fosfatupptaget med antacida. Ej bevisat om detta är till nytta. Acidos vid njursvikt minskar bindning av kalcium till albumin. - <strong>Sepsis</strong> (30%). Oklar mekanism. Är ej kopplat till vasodilatation.</p>\n<h3>KLINISKA MANIFESTATIONER</h3>\n<p>- Hypokalcemi tolereras förvånansvärt väl och sällan ser man några uppenbara konsekvenser på IVA. - Orsakar ökad kardiell, neuromuskulär retbarhet, samt minskad hjärtkontraktilitet och kontraktilitet i blodkärl. Förlängd QT-tid. - Tetanus och laryngospasm, hyperreflexi, parestesier och kramper. Positivt Chvostek’s (dålig specificitet) och Trousseau’s tecken (dålig sensitivitet). - Hypotension och minskat CO (rapporterat vid kalcium <0,65 mmol/L.</p>\n<h3>BEHANDLING</h3>\n<p>OBS Kalciumbehandling kan vara farlig hos pat. som redan har en kraftig vasokonstriktion och kan orska ischemi i vitala organ. Risken för kalciuminducerad ischemi är särskilt hög hos pat. med lågt CO som redan är vasokonstierade. Det finns även risk för intracelluär kalciumöverbelastning vid aggressiv substitution. Så man bör undvika kalciumbehandling om det inte finns risk för en komplikation av lågt kalcium. / Marino - Det finns inget idag som talar för en allmän kalciumsubstitution hos IVA-patienter. / Intensivvårdsboken, Rubertsson. - Behandla bakomliggande orsak. - Kalciumsubstitution: Kalciumglukonat är att föredra och är det vi använder på KS. Kalciumklorid är har mycket högre osmolaritet och är 3? ggr starkare. - Marino föreslår att man blandar 2 ampuller 10% kalciumglukonat (9 mg/mL) = 180 mg i 100 mL koksalt och ger på 5-10 min. Detta höjer serum kalcium med 0,125 mmol/L, men börjar sjunka igen efter ca 30 min. Man bör därför fortsätta med infusion på 1-2 mg/kg/h under minst 6 h. Det individuella svaret varierar dock och man får följa med blodgaser <strong>Internetmedicin</strong> vid hypokalcemi och kramper<strong>:</strong> Kalciumglukonat (Calciumgluconat B. Braun) 10 % injektionslösning (0,226 mmol/ml kalcium) motsvarar 9,04 mg/ml. 10 ml ges intravenöst outspätt över 5 minuter eller 10–20 ml spätt i 90–80 ml 0,9 % NaCl eller 5 % glukos långsamt intravenöst (under 5 minuter). Kan upprepas om joniserat Ca < 0,8 mmol/l (under kontroll av hjärtfrekvensen, ev EKG-övervakning) till symtomfrihet.</p>\n<p><strong>KÄLLA: </strong>Marino ICU-book. Internetmedicin: Hypokalcemi. Intensivvård, Rubertsson 2016. <strong>Version</strong> 2020-04.</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPOMAGNESEMI", "html": "<h3>ORSAKER</h3>\n<p>- Fosfatbrist: Orsakar ökad njurarnas utsöndring av magnesium. <strong>EFFEKTER / KONSEKVENSER</strong> - Magnesiumbrist kan orsaka hypokalcemi som en följd av en störd frisättning av parathormon i kombination med störd endorgan-svar på parathormon. Liksom vid hypokalemi är hypokalcemi svår att korrigera om magnesiumbristen inte åtgärdas. - Hypokalemi kan vara mycket svår att behandla vid hypomagnesemi och magnesiumersättning är nödvändig för att kunna åtgärda hypokalemin. <strong>Förmaksflimmer på IVA.</strong> Vissa lyfter upp Magnesium ända till 1,4 mmol/L. ”Det är helt ofarligt att lyfta upp magnesium. Iaf om man inte får jättehöga värden. Det får man nästan bara om man har njursvikt.” /ÖL</p>", "category": "Sjukdomstillstånd"}, {"title": "HYPOTERMI ACCIDENTELL HLR", "html": "<p>LÄS ARTIKEL Accidental hypothermia - an update Paal et al. Finns även A-HLR-guidelines vid accidentell hypotermi. HLR-rådet.</p>", "category": "Sjukdomstillstånd"}, {"title": "ICH – Intrakraniellt hematom", "html": "<p>- Intracerebralt hematom utgör ca 10% av alla stroke. - Hematomet ökar ofta i storlek under första dygnet. Noggrann övervakning motiverad. <strong>SYMTOM</strong> - Kan vara svårt att särskilja från ischemisk stroke. - Huvudvärk, kräkning, kramper, sänkt medvetande, pares. <strong>PROGNOS</strong> - Blödningens storlek. Substansiell expansion anses vid >33% ökning eller >12,5 ml ökning inom 24 h. - Volym >30 ml vid debut är jättedåligt. - Högt blodtryck är förenat med sämre prognos. <strong>ORSAK</strong> - Vanligast är blödning från <3mm penetrerande artärer sekundärt till hypertension gäller ffa djupa hjärnstrukturer (putamen, thalamus, pons, cerebellum). - Andra orsaker är amyloid angiopati (vanligare vid ytligare blödningar) - Även AVM, angiom, cavernom, aneurysm. <strong>PATOFYSIOLOGI</strong> - Blödningar > 100 ml kan orsaka kraftig ICP-stegring. - Hematomet ökar ofta under första dygnet, vidare så blir det ödembildningbla hjärnvävnad runt hematomet pga flera mekanismer bla inflammatoriska mediatorer, cytotoxiskt ödem, fria radikaler, vävnad och kärlkompression vilket orsakar hypoperfusion. - Autoregulationen påverkas och pat är känslig för sänkt är extra känslig för BT-fall. - Vid ventrikelgenombrott finns risk för hydrocephalusutveckling.  <strong>BEHANDLING</strong> - SAP < 140 inom 1 h (INTERACT2-studien). Kollega på NIVA: Brukar sikta på SAP < 160. Ang. att jag brukar sikta på < 150 är inte heller fel. (I fall där pat. ger tecken på högt ICP får man tänka till lite.) (Alfresco skriver följande : Antihypertensiva ges vid systoliskt BT > 185 mm Hg under första dygnet [lite högt kanske!?]. Rimlig blodtrycksnivå är 140−160 mm Hg. Blodtrycket ska inte sänkas under 140 mm Hg) - Dekomprimerande kirurgi är debaterad (STICH-stuierna fann ingen skilln
